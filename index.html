s. Identification of all BIN2 kinase substrates is crucial for understanding the cellular functions regulated by this signaling hub that integrates diverse regulatory pathways in plants."}, {"passage_id": "Introduction.p0009", "text": "Identification of in vivo kinase substrates is technically challenging because the interactions between a kinase, or any posttranslational modifying enzyme, and its substrate proteins need to be transient and dynamic in order to rapidly modify many substrate molecules. Traditional methods for identifying protein–protein interactions (PPI), such as co-immunoprecipitation (co-IP), tend to capture only stable interactors that remain associated throughout the incubation and washing procedures. The recent development of a highly active biotin ligase named TurboID has made it possible to effectively biotinylate and thus identify in vivo transient interactors. TurboID has been used for proximity labeling (PL) of subcellular proteomes and interactomes of transcription factors and immune receptors in plants. TurboID has also been shown to detect various PPI in several plant model systems. Here, we test the idea that TurboID fused to a kinase or phosphatase can biotinylate their substrate proteins while they are phosphorylated or dephosphorylated. We demonstrate that TurboID fused with BIN2 and PP2A specifically and effectively biotinylates their substrates. Mass spectrometry identified 482 proteins that are biotinylated by a BIN2-TurboID fusion protein; over one-third of these BIN2-proximal proteins showed dephosphorylation upon inhibition of BIN2 and thus are considered BIN2 substrates. Protein–protein interaction and protein function analyses assembled the BIN2-proximal proteins into signaling networks and illustrated BIN2 regulation of key cellular functions. Our study provides a powerful method for dissecting PTM networks and a large dataset of the BIN2 signaling network that reveals broad functions of this highly conserved signaling hub."}], "Discussion": [{"passage_id": "Discuss.p0002", "text": "GSK3 is a conserved signaling hub that regulates diverse cellular, developmental, and adaptive processes in all eukaryotes. GSK3s have been studied extensively for their important roles in human health and plant growth. However, the complete GSK3 signaling network has not been illustrated in any organism. Taking advantage of the highly sensitive TbPL-MS approach, we here provide the largest GSK3 signaling network based on in vivo data and demonstrate that combining TbPL-MS with phosphoproteomics is a powerful approach to mapping PTM signaling networks. Our study uncovers broad GSK3 functions in cellular regulation and reveals the convergence of the GSK3 and O-GlcNAc pathways as a conserved feature of eukaryotic cellular regulation."}, {"passage_id": "Discuss.p0003", "text": "PL-MS combined with quantitative PTM profiling is a powerful approach for mapping cellular regulatory pathways"}, {"passage_id": "Discuss.p0004", "text": "PTM is the fundamental mechanism of cellular regulation. The relationships between the posttranslational modifying enzymes and their substrate proteins shape the cellular regulation network. Unlike many stable protein complexes, the interactions between modifying enzymes and their substrates in PTM networks tend to be dynamic and transient in order to allow rapid modification of multiple substrate molecules within a short time. The dynamic/transient nature of the interactions between a PTM enzyme and its substrates makes it difficult to identify these interactions using traditional methods such as affinity purification and co-IP, which capture only stable interactors that remain associated after the long procedure of extraction, incubation, and washing. In contrast, in PL-MS, the interacting proteins are tagged by biotin during the time of association in vivo, and then purified by streptavidin beads. In fact, the dynamic nature of the interactions that facilitate PTM would increase the efficiency of TurboID labeling compared with stable interactions, due to the amplification of signal from cycling interactions. We believe that each kinase-TurboID fusion protein molecule can biotinylate, as well as phosphorylate, multiple copies of substrate proteins during the time of biotin treatment, allowing sensitive identification of the substrate proteins. Indeed, our direct comparison indicates that PL is about 10 times more sensitive than IP for detecting BZR1 as a BIN2 interactor, whereas similar IP-MS analyses identified only five putative BIN2-interactors (Supplemental Figure 5 and Supplemental Dataset 4), of which only one responded to bikinin or BR treatment."}, {"passage_id": "Discuss.p0005", "text": "The high sensitivity of detection raises the question of specificity. We provide several lines of evidence supporting the high specificity of the TbPL-MS approach for mapping kinase signaling pathways. First, we show that BZR1 is biotinylated much more strongly, if not exclusively, by the members of GSK3 and PP2A that are known to interact with BZR1 compared with their homologs that are known to not interact with BZR1. Second, TbPL-MS identified many known BIN2 substrates (e.g. BZR1, BES1, YDA, and CELLULOSE SYNTHASE 3 [CESA3]) and regulators (BSK3, BSL1, BSL2, BSL3, PP2A, and OCTOPUS LIKE 2 [OPL2]). Third, and most importantly, a large portion of the BIN2-proximal proteins identified by TbPL-MS showed dephosphorylation upon inhibition of BIN2. Of the 482 BIN2-proximal proteins, 169 (35%) showed bikinin-induced dephosphorylation in our phosphoproteomic analysis and 108 (43 additional) did so in a recent study, and 309 (64%) responded to BR treatment. Our in vitro kinase assays confirmed BIN2 phosphorylation of all twelve tested proteins. recently carried out in vitro BIN2 phosphorylation of total Arabidopsis protein extracts followed by phosphoproteomic analysis and showed BIN2 phosphorylation of 1,343 peptides from 767 proteins; these in vitro substrates include 104 BIN2-proximal proteins (Supplemental Dataset 1). Together, these studies provide evidence for BIN2-dependent phosphorylation of 344 (71%) of the BIN2-proximal proteins; 216 (45%) of these are supported by at least two of these studies and can be considered high-confidence BIN2 substrates (Supplemental Dataset 1)."}, {"passage_id": "Discuss.p0006", "text": "The enrichment of the GSK3 consensus phosphorylation site (S/TxxxS/T) in these BIN2 substrates identified by PL indicates that the substrate specificity of plant GSK3s involves both physical proximity and the local sequence of the substrate proteins, raising questions about substrate identification based on in vitro phosphorylation conditions that disrupt the in vivo protein spatial organization. Among the 767 in vitro BIN2 substrates identified by Montes, 27.5% (211) showed dephosphorylation upon bikinin treatment (Supplemental Dataset 2), in contrast to 46% (221) of the 482 BIN2-proximal proteins (Supplemental Figure 7). The evidence overall indicates that TbPL-MS has superior sensitivity and specificity for mapping kinase signaling networks. The overlaps among these datasets identify subsets of putative BIN2 substrates with different confidence levels and suggest different efficiency and specificity of these complementary methods (Supplemental Figure 7)."}, {"passage_id": "Discuss.p0007", "text": "The GSK3 signaling network in Arabidopsis"}, {"passage_id": "Discuss.p0008", "text": "Our PL-MS analysis establishes the largest experimental dataset of in vivo substrates of a GSK3 kinase in any organism and provides an expanded view of the GSK3 functions in plants. The BIN2 substrates reveal broad functions of GSK3 in regulating major cellular processes including transcription, RNA processing, translation, vesicle trafficking, cytoskeleton, cell wall synthesis/integrity, and auxin transport. Proximity to many signaling proteins such as receptors and kinases provides evidence for GSK3 functions in additional signaling pathways. Many proximal or substrate proteins are consistent with known functions of BR or GSK3. For example, 18 BIN2-proximal proteins, including seven BIN2 substrates, are components of clathrin-mediated endocytosis, and nine BIN2-proximal proteins, including two substrates (SYNTAXIN OF PLANTS 122 [SYP122] and MILDEW RESISTANCE LOCUS O 2 [MLO2]), are involved in secretion. In addition, several proteins involved in autophagy (e.g. AUTOPHAGY-RELATED PROTEIN 1B [ATG1B], AUTOPHAGY 18 [ATG18] G [ATG18G)], and FYVE DOMAIN PROTEIN REQUIRED FOR ENDOSOMAL SORTING 1 [FREE1]) are targets of BIN2 signaling, consistent with the recent reports of BR effects on autophagy. The microtubule-associated protein CLASP was recently reported to act in a BR signaling negative feedback loop and mediate microtubule reorientation; our results suggest that BIN2 phosphorylation may mediate BR regulation of CLASP and microtubule orientation. BR and BIN2 have been shown to regulate auxin transport; our results show that BIN2 directly phosphorylates the auxin transporters (PIN3, 4, 7). BR has also been reported to modulate phototropic responsiveness; our data indicate that BIN2 phosphorylates and/or interacts with the photoreceptors phototropin 1 and 2 (PHOT1, PHOT2) and their downstream components that mediate phototropic growth (NPH3, PIN3, PIN4, and PIN7) and chloroplast movement (J-DOMAIN PROTEIN REQUIRED FOR CHLOROPLAST ACCUMULATION RESPONSE 1 [JAC1], KINESIN LIKE PROTEIN FOR ACTIN BASED CHLOROPLAST MOVEMENT 1 [KAC1], CHLOROPLAST UNUSUAL POSITIONING 1 [CHUP1]) (; Figure 6A). Genetic studies have placed the BR signaling module in a homeostatic feedback loop controlling cell wall extensibility and integrity that involve also the mechano- and integrity-sensing receptor kinases FER, HERK, ANXUR1 (ANX1), and ANX2; the identification of these receptor kinases as BIN2-proximal proteins suggests that BIN2 may play a direct role in the crosstalk between these wall- and BR-sensing RKs. A recent study shows that sugar increases BIN2 phosphorylation of BZR1, and this may involve BIN2 proximity with the mitogen-activated protein kinase kinase kinase named SUGAR INSENSITIVE 8 (SIS8) (Supplemental Dataset 1), which is required for sugar responses and interacts with a UDP-glucosyltransferase. Future studies of these BIN2-proximal and substrate proteins will advance our understanding of the functions of the GSK3 signaling network in cellular and developmental regulation in plants."}, {"passage_id": "Discuss.p0009", "text": "The ten members of the Arabidopsis GSK3 family appear to play overlapping and redundant roles. Considering that the BIN2-TurboID protein was expressed from the constitutive 35S promoter, some of the BIN2-proximal proteins identified in this study may associate with BIN2 homologs in wild-type plants. Our choice of BIN2-TurboID plants with a mild dwarf phenotype, compared with the dominant bin2-1 mutant, should have minimized artifacts. On the other hand, our BIN2 PL-MS experiments did not detect some of the previously reported BIN2 substrates. Apparently, the full BIN2 signaling network is yet to be uncovered, likely by combining PL-MS and phosphoproteomics with a cell-type specific analysis under various physiological conditions. Furthermore, future PL-MS analysis of all GSK3 family members, using the native promoter of each gene for expression in its loss-of-function mutant background, will be required to provide a more accurate picture of the overlapping sub-networks of all ten GSK3 kinases in Arabidopsis."}, {"passage_id": "Discuss.p0010", "text": "GSK3 and O-GlcNAc target overlapping proteomes in plants and animals"}, {"passage_id": "Discuss.p0011", "text": "Our observations of overlaps between the targets of GSK3 and O-GlcNAc in both Arabidopsis and mouse synapses suggest that the convergence of these two PTM pathways is an ancient mechanism of cellular regulation. Modification at serine and threonine residues of nucleocytoplasmic proteins by O-GlcNAc, catalyzed by O-GlcNAc transferase (OGT) using UDP-GlcNAc as a donor substrate, is considered a nutrient-sensing mechanism that regulates cellular homeostasis by responding to the metabolic status of sugars, amino acids, lipids, and nucleotides. O-GlcNAc modification has been studied extensively in mammals for its important roles in numerous diseases including cancer, diabetes, neuron degeneration, and immune disorders. In addition to altering protein conformation and interactions, O-GlcNAc modification can crosstalk with phosphorylation on the common target proteins by steric competition for occupancy at the same or proximal sites. However, the relationships between O-GlcNAc and specific kinase pathways are not fully understood. Several studies suggest a close interaction between O-GlcNAcylation and GSK3. For example, a few proteins with important roles in human diseases such as beta-catenin (cancer), tau (Alzheimer's disease), and α-synuclein (Parkinson's) are targets of both GSK3 and O-GlcNAc. Inhibition of GSK3 increased and decreased O-GlcNAcylation of different proteins, whereas O-GlcNAc affects GSK3 phosphorylation of heat shock factor 1. These observations of functional crosstalk were explained by the mutual modifications between OGT and GSK3: OGT is a substrate of GSK3beta and O-GlcNAcylation inhibits GSK3beta activity. The extent to which GSK3 and OGT target common substrates has remained unclear at the proteomic scale. Our findings of significant substrate overlap between GSK3 and OGT in both Arabidopsis and the mouse synapse suggest that co-regulation by GSK3-mediated phosphorylation and OGT-mediated O-GlcNAcylation might be an ancient and fundamental aspect of cellular homeostasis in eukaryotes. It's conceivable that GSK3 and O-GlcNAc respond to different upstream signals, e.g. growth factors and nutrients, to co-regulate cellular nutrient homeostasis and growth."}, {"passage_id": "Discuss.p0012", "text": "GSK3 and O-GlcNAc are known to impact neurological disorders such as Alzheimer's and Parkinson's diseases through co-regulation of β-catenin, tau, and α-synuclein. The additional shared substrates identified in this study may also contribute to the crosstalk between GSK3 and O-GlcNAc in neuronal functions and thus should be of interest for future research. For example, delta-catenin is a GSK3 substrate associated with intellectual disabilities, and the function of its O-GlcNAcylation remains to be studied."}, {"passage_id": "Discuss.p0013", "text": "Compared with the extensive investigation in mammals, research on O-GlcNAc in plants is at a stage of infancy. Recent studies clarified the molecular functions of the two OGT homologs SECRET AGENT (SEC) and SPINDLY (SPY) as O-GlcNAc transferase and O-fucose transferase, respectively. Genetic evidence indicates that SEC/O-GlcNAcylation and SPY/O-fucosylation have overlapping functions that are essential for viability as well as unique or opposite functions in specific pathways. The O-GlcNAcylome data from Arabidopsis shows large numbers of key regulatory proteins as targets of O-GlcNAc modification; how O-GlcNAc regulates the functions of these proteins remains largely to be investigated. The proteins targeted by both O-GlcNAc and BIN2 are nodes of junctions between these pathways and are thus of particular interest. These over represent a small number of pathways including RNA processing, translation, and transcription. Among these proteins targeted by both BIN2/GSK3 and O-GlcNAc is ACINUS, which was shown recently to be also modified by O-fucose and to play major roles in developmental transition and stress responses by modulating transcription and RNA alternative splicing. Additional shared substrates include translation initiation factor eIF4B2 and eIF4E-binding protein (CBE1). Notably, O-GlcNAcylation of eIF4GI in mammalian cells modulates stress granule dynamics and the translational switch in stress responses. In addition, BIN2 and O-GlcNAc target three of the five members of the TOPLESS (TPL) and all three components of the LEUNIG (LUG) family transcriptional repressors. TPL and LUG represent two subgroups of Gro/TLE-like co-repressors. The mammalian orthologs of TLEs are known to require O-GlcNAcylation for their transcriptional repression function. Thus, the function of O-GlcNAcylation in transcriptional repression seems to be conserved in plants and mammals. While not known to phosphorylate Gro/TLE co-repressors in animals, GSK3 has been shown to phosphorylate X-linked inhibitor of apoptosis protein (XIAP), which monoubiquitinates TLE in the Wnt pathway. As such, the similarity between the BR and Wnt pathways seems to extend from GSK3 phosphorylation of transcription factors (BZR1 and β-catenin) to O-GlcNAc modification of co-repressors (TPL and TLE). Future studies of the common targets of GSK3 and O-GlcNAc will shed light on the mechanism and logic of crosstalk between these two key regulatory systems, which are apparently important for both human health and agricultural productivity."}], "Conclusion": []}}, {"pmcid": "PMC10015339", "title": "SlMYB72 affects pollen development by regulating autophagy in tomato", "source_file": "PMC10015339.json", "source_url": "https://pmc.ncbi.nlm.nih.gov/articles/PMC10015339/", "included_counts": {"Abstract": 1, "Introduction": 4, "Discussion": 8}, "omitted_results_discussion": false, "sections": {"Abstract": [{"passage_id": "Abstract.p0002", "text": "The formation and development of pollen are among the most critical processes for reproduction and genetic diversity in the life cycle of flowering plants. The present study found that SlMYB72 was highly expressed in the pollen and tapetum of tomato flowers. Downregulation of SlMYB72 led to a decrease in the amounts of seeds due to abnormal pollen development compared with wild-type plants. Downregulation of SlMYB72 delayed tapetum degradation and inhibited autophagy in tomato anther. Overexpression of SlMYB72 led to abnormal pollen development and delayed tapetum degradation. Expression levels of some autophagy-related genes (ATGs) were decreased in SlMYB72 downregulated plants and increased in overexpression plants. SlMYB72 was directly bound to ACCAAC/ACCAAA motif of the SlATG7 promoter and activated its expression. Downregulation of SlATG7 inhibited the autophagy process and tapetum degradation, resulting in abnormal pollen development in tomatoes. These results indicated SlMYB72 affects the tapetum degradation and pollen development by transcriptional activation of SlATG7 and autophagy in tomato anther. The study expands the understanding of the regulation of autophagy by SlMYB72, uncovers the critical role that autophagy plays in pollen development, and provides potential candidate genes for the production of male-sterility in plants."}], "Introduction": [{"passage_id": "Introduction.p0002", "text": "Pollen formation and development are necessary for the reproduction of flowering plants and consist of several distinct stages. Pollen grains are developed from microspore mother cells in the microsporangium of an anther. Each microspore mother cell can form a microspore tetrad (four haploid microspores) through meiotic division. When the anther matures, the microspores dissociate and develop into pollen grains. The development of pollen could be influenced by many factors, such as tapetum irregularity, cytoskeleton alteration, auxin metabolism aberration, altered sugar utilization, and reactive oxygen species. Among all these factors the tapetum plays an important role in the regulation of pollen development."}, {"passage_id": "Introduction.p0003", "text": "Tapetum is the innermost layer of the anther and adheres to the microspores. The tapetum provides various enzymes, proteins, lipids, starch, sporopollenin, and other molecules required for pollen development. An adequately programmed cell death (PCD) is necessary for the degradation of tapetum, which for pollen development and microspores release. Many transcription factors (TFs) affect pollen development by regulating the tapetum PCD. The knocking out of the AtMYB103 gene in Arabidopsis leads to defective tapetal cell wall degradation, pollen development, and pollen exine formation. Mutants of Arabidopsis MYB33, MYB65, and rice GAMYB genes result in a loss of tapetum PCD and abnormal pollen development. Arabidopsis MYB80 regulates the tapetal PCD and pollen development by direct binding to pectin methylesterase, glyoxal oxidase, and aspartic protease genes. A putative bHLH gene affects the tapetum development and pollen formation in tomatoes."}, {"passage_id": "Introduction.p0004", "text": "Macroautophagy (autophagy) is involved in plant growth and development and plays critical roles in many abiotic and biotic stress responses. In normal circumstances, autophagy remains at a base level to degrade cytoplasmic components and maintain homeostasis in cells. Previous research has well documented that autophagy loss reduces seed yields and causes the senescence of premature leaves, but an increased level of autophagy promotes growth, seed yields, and nitrogen remobilization. Autophagy is upregulated and recycles cellular material and nutrients to promote plant survival during senescence or stress response. Autophagy is involved in cell death during tapetum degradation. In tobacco, the overexpression of Arabidopsis ATG6/Beclin1 genes in tapetum results in sterility, and excessive autophagy increases the PCD and abortion of microsporogenesis. The rice autophagy mutant OsATG7 exhibits delay of the tapetum layer’s degradation and leads to sporophytic male sterility. High temperatures lead to tapetal PCD abortion and damage pollen development, but autophagy mitigates the injury in pollen development in Arabidopsis."}, {"passage_id": "Introduction.p0005", "text": "The R2R3MYB is one of the most prominent families of TFs and is involved in plant development, metabolism, and stress responses. We have reported that SlMYB72 is a typical R2R3 MYB family TF and is involved in the accumulation of pigment in tomato fruits. In the present study, we found that SlMYB72 affected the tapetum degradation and pollen development in tomatoes. SlMYB72 affected SlATG7 expression and autophagy process in tomato anthers. SlATG7 also regulated the tapetum degradation and pollen development in tomatoes. The results strongly suggest that SlMYB72 affects pollen development by regulating autophagy in tomatoes and uncovers the important role of autophagy in tomato development."}], "Discussion": [{"passage_id": "Discuss.p0002", "text": "Tapetum degradation affects pollen development in anther"}, {"passage_id": "Discuss.p0003", "text": "The early or delayed tapetum degradation will cause abnormal growth of pollen. Studies have found that several MYB transcription factors participate in pollen development by affecting the degradation process of tapetum. Our study found that downregulation of the SlMYB72 gene inhibited the degradation of the anther tapetum in tomatoes. The pollen of RNAi-SlMYB72 plants showed abnormal morphology and reduced viability (Fig. 2). Overexpression of the SlMYB72 gene promoted the tapetum degradation and led to abnormal pollen development (Fig. 5). Downregulation of the SlATG7 gene delayed the anther tapetum’s degradation, resulting in abnormal pollen development and reduced pollen viability (Fig. 3). The results prove that the SlMYB72 and SlATG7 genes can affect the tapetum degradation and pollen development, and the tapetum degradation plays important role in pollen development. The inhibition of the tapetum degradation will seriously interfere with the normal development of pollen."}, {"passage_id": "Discuss.p0004", "text": "Autophagy is essential for pollen development in tomatoes"}, {"passage_id": "Discuss.p0005", "text": "Studies have provided evidence that autophagy plays an important role in the degradation of anther tapetum and pollen development. This study showed that downregulation of the SlMYB72 gene in tomatoes inhibited the expression of autophagy genes in tomato anthers. MDC staining and WB revealed that the autophagy in anthers of RNAi-SlMYB72 plants was significantly inhibited during the mononuclear microspore stage. The number of autophagosomes was decreased in the tapetum cells of the transgenic plants (Fig. 4). The results demonstrate the autophagy defect results in delayed tapetum degradation and abnormal pollen development in RNAi-SlMYB72 anthers, which are consistent with the results of Kurusu et al.. In the OsATG7 mutant, the tapetum autophagy is inhibited, and the degradation of the tapetum layer is hindered, which eventually leads to pollen abortion."}, {"passage_id": "Discuss.p0006", "text": "We studied the function of SlATG7, which is homologous to OsATG7, in tomato pollen development. The MDC, WB, and anatomy results showed that downregulation of the SlATG7 gene in tomatoes inhibited the autophagy occurrence and delayed tapetum degradation in anther. The RNAi-SlATG7 plants exhibited abnormal pollen morphology and reduced pollen viability (Fig. 7). The results indicate that the functions of the tomato SlATG7 gene in pollen development are relatively consistent with that of rice OsATG7 reported from Kurusu et al.. The autophagy gene ATG7 in rice and tomato affects anther tapetum degradation and pollen development under normal conditions. Arabidopsis ATG mediates pollen development at high temperatures but isn’t functional under normal conditions. The Arabidopsis ATG7 mutant undergoes normal embryogenesis, germination, and seedling development under normal conditions, demonstrating that the ATG7 gene is not essential in the pollen development of Arabidopsis. In tobacco, the downregulation of ATG7 affects the autophagy process in the anther but does not affect pollen development. These results indicate that the function of ATG7 in pollen development has functional differences among different species. The precise genomic editing of the ATG genes in different species will be carried out to identify the gene functions in tapetum degradation and pollen development in future research."}, {"passage_id": "Discuss.p0007", "text": "Transcriptional regulation of SlATG7 by SlMYB72"}, {"passage_id": "Discuss.p0008", "text": "Under abiotic stress, the autophagy and ATG genes are transcriptionally regulated in many plants, such as tomato, pepper, rice, wheat, and Arabidopsis. Some TFs have been reported to transcriptionally regulate autophagy and ATG genes. Heat shock factor 1A (HsfA1a) is involved in drought tolerance through regulating autophagy by directly transcriptional regulation of the ATG10 and ATG18f genes in tomatoes. WRKY DNA-binding protein 33 (WRKY33) functions as a possible autophagy modulator by regulating several ATG genes under heat stress in Arabidopsis. TGA motif-binding protein 9 modulates the autophagy and ATG gene expression by direct binding to their promoters under the stress conditions of sucrose starvation and osmosis in Arabidopsis. Until now, the transcriptional regulation of the ATG gene by TF is found only in abiotic stress conditions. In the present study, downregulation of SlMYB72 decreased the expressions of ATG genes, while overexpression of SlMYB72 increased the expression of some ATG genes (Figs 4 and 5). Downregulation of SlMYB72 also inhibited the autophagy in tomato anther tapetum. The results of RT-qPCR showed that SlMYB72 and SlATG7 had similar expression patterns in anther developmental stage (Figs 3 and 6), indicating that SlMYB72 may directly regulate the expression of SlATG7. The EMSA and ChiP-qPCR confirmed that SlMYB72 could directly target the ACCAAC/ACCAAA motif of the SlATG7 gene. Our research with the transient dual-luciferase assay found that SlMYB72 can transcriptionally activate the SlATG7 expression (Fig. 6). Downregulation of SlATG7 affected the tapetum degradation and pollen development in tomatoes. Our data indicate that SlMYB72 transcriptionally regulates the autophagy and SlATG7 gene during pollen development in tomatoes. Our study provides a new cue that MYB TF can transcriptionally regulate autophagy and ATG genes during plant development. Further study directly targeting SlMYB72 to other ATG genes is necessary to understand the transcriptional regulation of autophagy in the plant."}, {"passage_id": "Discuss.p0009", "text": "In summary, both SlMYB72 and SlATG7 affect tapetum degradation and pollen development in tomatoes. SlMYB72 affects the autophagy process in the pollen tapetum of tomatoes. SlMYB72 directly targets the SlATG7 gene and actives its expression. SlATG7 also affects the autophagy process, tapetum degradation, and pollen development in tomatoes. The present study demonstrates that SlMYB72 affects the tapetum degradation and pollen development via transcriptional activation of SlATG7 and autophagy in anthers. The results explore the roles of autophagy in tapetum degradation and pollen development and provide valuable candidate genes for the production of male sterility."}], "Conclusion": []}}, {"pmcid": "PMC10015340", "title": "Understanding water conservation vs. profligation traits in vegetable legumes through a physio-transcriptomic-functional approach", "source_file": "PMC10015340.json", "source_url": "https://pmc.ncbi.nlm.nih.gov/articles/PMC10015340/", "included_counts": {"Abstract": 1, "Introduction": 4, "Discussion": 5}, "omitted_results_discussion": false, "sections": {"Abstract": [{"passage_id": "Abstract.p0002", "text": "Vegetable soybean and cowpea are related warm-season legumes showing contrasting leaf water use behaviors under similar root drought stresses, whose mechanisms are not well understood. Here we conducted an integrative phenomic-transcriptomic study on the two crops grown in a feedback irrigation system that enabled precise control of soil water contents. Continuous transpiration rate monitoring demonstrated that cowpea used water more conservatively under earlier soil drought stages, but tended to maintain higher transpiration under prolonged drought. Interestingly, we observed a soybean-specific transpiration rate increase accompanied by phase shift under moderate soil drought. Time-series transcriptomic analysis suggested a dehydration avoidance mechanism of cowpea at early soil drought stage, in which the VuHAI3 and VuTIP2;3 genes were suggested to be involved. Multifactorial gene clustering analysis revealed different responsiveness of genes to drought, time of day and their interactions between the two crops, which involved species-dependent regulation of the circadian clock genes. Gene network analysis identified two co-expression modules each associated with transpiration rate in cowpea and soybean, including a pair of negatively correlated modules between species. Module hub genes, including the ABA-degrading gene GmCYP707A4 and the trehalose-phosphatase/synthase gene VuTPS9 were identified. Inter-modular network analysis revealed putative co-players of the hub genes. Transgenic analyses verified the role of VuTPS9 in regulating transpiration rate under osmotic stresses. These findings propose that species-specific transcriptomic reprograming in leaves of the two crops suffering similar soil drought was not only a result of the different drought resistance level, but a cause of it."}], "Introduction": [{"passage_id": "Introduction.p0002", "text": "By growing under environmental conditions with a wide range of variations in water availability, plants develop flexible water use strategies in response to water scarcity. As the gateway of both water efflux and CO2 intake, stomatal control is critical for balancing drought tolerance and growth under soil water shortages. Some plants develop a sensitive response to drought at the stomata level, representing a conservative water use strategy; conversely, some other plants adopt a ‘profligate’ water use strategy that is marked by less sensitive stomatal control that allows transpiration of more water. From an agronomic point of view, both strategies can be adaptive depending on the specific soil drought scenarios. Numerous studies have analysed water use traits in crops including legumes, grains, and trees, yet current mechanistic understanding of the trait plasticity is still limited."}, {"passage_id": "Introduction.p0003", "text": "Cross-species comparison of the dynamic water use traits is often challenged by the difficulty of generating homogenous progressive soil stress in a reasonably long term. Recently, several high-throughput platforms have emerged, some being equipped with feedback irrigation systems, to enable precise control of soil water content in each unit. One of these platforms, the PlantArray, which is a lysimeter-based system, provides real-time monitoring of the parameters related to whole-plant water relations such as transpiration rate (Tr), growth rate, and water use efficiency (WUE). Species-dependent dynamic patterns of these traits in response to progressive soil stress have been delicately revealed in cowpea and tomato using PlantArray."}, {"passage_id": "Introduction.p0004", "text": "Legumes are staple foods and important vegetables for many cultures worldwide. Water deficiency at any stage, especially during the grain filling and reproductive phases, can affect legume plant growth and ultimately reduce yield and plant biomass. The yield loss depends on the intensity and duration of drought, crop genotype and developmental stage. Soybean (Glycine max L) native to East Asia is the most important legume crop globally, while cowpea (Vigna unguiculata L) indigenous to West Africa is one of the most drought-tolerant vegetable legumes popular in Asia. The two crops are known to exhibit different regulatory modes of water consumption when suffering drought stress, and have been frequently used in comparative studies of the shoot responses to soil water deficiency. Cowpea typically demonstrates a slower rate of water loss and hence a higher leaf relative water content (RWC) and water potential than soybean as soil water is depleted, which is attributed to the better stomatal control. To date, the molecular mechanisms underlying the contrasting water use behaviors between the two species remain largely unknown."}, {"passage_id": "Introduction.p0005", "text": "In this study, we used the transpiration-interfaced automatic feedback irrigation function in PlantArray to generate consistent gradual soil drought for cowpea and vegetable soybean (known as maodou) plants. This enabled cross-species physiological and molecular comparisons in the shoot to be made under similar soil drought conditions while the ambient environments, including solar intensity and period, temperature and vapor pressure deficit (VPD), were identical. It also allowed for precise sampling of plant tissues under the intended soil water contents. Our results provide a high-resolution and comprehensive view on the physiological and molecular basis of the profligate versus conservative water use behaviors."}], "Discussion": [{"passage_id": "Discuss.p0002", "text": "Transpiration-interfaced automatic feedback irrigation based on soil VWC could accurately control the speed of soil water depletion in each pot, thus creating highly comparable drought scenarios in different pots. This approach reduces the confounding effects of leaf size and growth rate and maximizes the likelihood of finding genotypic drought response differences. The whole plant transpiration-based assay avoids problems of upscaling conventional leaf-based traits, such as photosynthetic carbon isotope discrimination, to the plant or field scale. The term ‘physiolomics’ was recently proposed to refer to this emerging subject of high-throughput physiology-based phenotyping. Benefiting from the long-term phenotyping and modeling of Trm,VPD, we discovered that cowpea had the potential to maintain a higher transpiration rate under very severe soil drought (VWC < 0.15). This finding is reminiscent of an earlier study reporting lower lethal RWC values of leaves in cowpea (40%) than in soybean (50%), and argued that conservation or profligation in water use is a conditional concept. Given the viewpoint that any plant traits to avoid or postpone drought become ineffective under terminal drought or in soils with very low water-holding capacity, we propose that the water regime-dependent conservative/profligate water use behavior in a plant is an adaptive trait to help balance survival and productivity under dynamic environmental changes. The high resolution and continuity of the physiolomic assay also led to the detection of the soybean-specific short-term increase along with a phase change of Trm under MD conditions. Making a conclusive interpretation to this phenomenon is still difficult at present, but it might be due to an interplay between MD and midday high temperature. Tr is known to be related to canopy temperature, and soybean is more heat sensitive than cowpea. Our assumption could find some support from the molecular data that orthologs of the clock gene ELF3, which is also a thermal responsiveness component, showed different regulations by drought between cowpea and soybean. WGCNA further uncovered a negative correlation of two Tr-associated co-expression modules comprising the GO term ‘response to heat’ between the two crops, reinforcing that heat responses may underpin the phase change of Trm."}, {"passage_id": "Discuss.p0003", "text": "The soil drought signal perceived by the roots triggers the accumulation of ABA and the initiation of the ABA signaling cascade, which is key to the induction of stomatal closure in shoots. The hormonal action of ABA is precisely controlled by its biosynthesis, catabolism and transduction. We found that the ABA signaling repressor gene HAI3 was among the top-upregulated genes in cowpea only, and the ABA-degrading gene CYP707A4 was identified as a soybean-specific hub gene associated with Tr. More interestingly, the regulation of both genes showed a drought scenario-dependent feature. We therefore postulate that the more profound and earlier-stage activation of HAI3 in cowpea contributed to the higher sensitivity of stomatal control and hence drought avoidance under MD, while the MD-specific upregulation of CYP707A4 in soybean is likely part of the fine-tuning mechanism to maintain higher Gs through ABA degradation. Taken together, the results suggest a species-dependent subtle regulation of ABA signaling via the balance of ABA signal activation and ABA degradation."}, {"passage_id": "Discuss.p0004", "text": "Trehalose, a soluble sugar synthesized via a two-step reaction involving trehalose-6-phosphate synthase (TPS), is known for its role in metabolic and osmotic regulation in a variety of organisms. Recently, the signaling role of trehalose has emerged in plants. Arabidopsis tps1 and tps5 (Class II) loss-of function mutants showed insensitivity and hypersensitivity to ABA induction of stomatal closure, respectively, suggesting that the two genes exerted contrasting roles in the adjustment of stomatal aperture under stressed conditions. Here, we identified VuTPS9 belonging to the class II subfamily as one of the hub genes and revealed the different responses of the TPS9 orthologs to progressive drought between cowpea and soybean. We provided evidence that overexpression of VuTPS9 increased osmotic stress-induced Gs and Tr inhibition under drought conditions. This effect is similar to that reported for AtTPS1, a class I TPS gene, but contrasting to that of the class II gene AtTPS5, arguing that the biological functions of TPS genes may not necessarily be related to their subfamily classifications. Our network analysis further suggests that the trehalose signal works with the circadian signal, ABA and energy metabolism processes to regulate transpiration rate in the shoots under soil drought conditions. Put together, these results add to our knowledge on the roles of the TPS9 gene in drought stress responses."}, {"passage_id": "Discuss.p0005", "text": "The endogenous circadian clock, a time-keeping mechanism, confers environmental fitness to higher plants. The reciprocal interaction between clock- and drought-responsive genes has been reported. For example, soybean orthologs of the morning loop component CCA1/LHY were found to negatively control drought tolerance by gating ABA biosynthesis and ABA signaling. A prevailing transcriptomic reconfiguration by drought stress was observed in the late day in poplus. Our results revealed different sensitivities as well as patterns of amplitude and phase of certain clock genes to soil drought between cowpea and soybean. Similarly, Li et al. (2019) reported that the interfaces between the soybean clock and abiotic stress signals were quite different from those in Arabidopsis, suggesting the contribution of species-specific circadian phases in response to environmental cues. The phase shift of gene expression can have a profound effect on related biological processes, as demonstrated in the case of iron utilization efficiency in soybean. In this study, MD significantly delayed the peak of GmPRR5 like-1 but had little impact on VuPRR5 like-1. In addition, the expressions of two RVE orthologs in cowpea but not in soybean showed alterations under MD and SD. These results suggested that the core oscillators regulate water budgeting in legumes. Furthermore, prevailing transcriptomic reconfiguration was observed in the late afternoon, which was evident at the MD stage for soybean, compared to the SD stage for cowpea. The elevated expression of clock genes in late days has been related to increased ABA synthesis in barley. Given the conserved relationship between ABA and drought response in plants, we assume that the interplay among crop type, drought scenario and TOD had an impact on ABA accumulation and was partly accountable to the contrasting water use behaviors in the two crops. Recently, the influences of the circadian clock on the long-term WUE of Arabidopsis were reported, providing evidence of the circadian clock gating of plant water budgeting."}, {"passage_id": "Discuss.p0006", "text": "Collectively, a model depicting the gene regulatory mechanisms underlying the differential water use strategies is proposed (Fig. 6). In cowpea, VuHAI3, a negative regulator of ABA signaling is down-regulated under MD, thus may quickly trigger ABA signaling for water conservation. The down-regulated VuTIP2;3 and up-regulated VuTPS9 are proposed to accelerate drought-induced stomatal closure, alongside the roles of many other genes including VuTPS11 and VuCYP707A. Up-regulated genes related to cellular components may modulate water use efficiency via cellular re-structuring and epigenetic regulation. In soybean, the higher Tr under MD caused by greater Gs is likely related to the high expression of the ABA degradation enzyme GmCYP707A4, accompanied by gene expression changes related to photosynthesis, leaf senescence, ribosome/translation, fatty acid metabolism and redox homeostasis. Circadian clock gene such as PRR5 and CHE also play an important role in modulating water use strategies by reshaping the rhythmic patterns, in a species-specific and/or drought strength-dependent manner. In the future, a more comprehensive understanding can be achieved by combining physiological phenotyping with morphological phenotyping."}], "Conclusion": []}}, {"pmcid": "PMC10015447", "title": "Integrative transcriptomic and proteomic analyses reveal a positive role of BES1 in salt tolerance in Arabidopsis", "source_file": "PMC10015447.json", "source_url": "https://pmc.ncbi.nlm.nih.gov/articles/PMC10015447/", "included_counts": {"Abstract": 5, "Introduction": 4, "Discussion": 4}, "omitted_results_discussion": false, "sections": {"Abstract": [{"passage_id": "Abstract.p0002", "text": "Salt stress is a major environmental factor limiting plant growth and development. Previous studies have indicated that the steroidal hormones—brassinosteroids (BRs) are important regulators of plant responses to salt stress. However, the underlying molecular mechanisms have not been fully understood."}, {"passage_id": "Abstract.p0003", "text": "Methods"}, {"passage_id": "Abstract.p0004", "text": "(1) Phenotypic analysis of bes1-D, BES1-RNAi and their wild-type (Col-0) under salt treatments with different concentrations of NaCl. (2) Transcriptomic and proteomic profiling of BES1-regulated genes and proteins under salt treatment; (3) qRT-PCR validation of selected BES1-regulated genes under salt stress; (4) Transient transcriptional assay of BES1 regulation on its putative target genes in Arabidopsis protoplasts; (5) Electrophoresis Mobility Shift Assay (EMSA) of BES1 binding with its potential target genes."}, {"passage_id": "Abstract.p0005", "text": "Results and Discussion"}, {"passage_id": "Abstract.p0006", "text": "Phenotypic analysis indicated that bes1-D, a gain-of-function mutant of the BR-regulated transcription factor BES1 in Arabidopsis showed better salt tolerance than the wild-type plant, while a BES1 RNA interference (BES1-RNAi) line was more sensitive to salt stress. Global gene expression profiling and time series clustering analyses identified a total of 1,170 genes whose expression was boosted in bes1-D under salt stress. Further GO enrichment and gene functional network analyses identified several key modules that are regulated by BES1 and most sensitive to salt stress perturbations, including stress response, response to ABA and ROS, flavonoid biosynthesis and transmembrane transport. A comparative proteomic analysis performed under the same stress conditions supported the results from the transcriptome analysis. In addition, transient gene transcription assays in Arabidopsis protoplasts and in vitro DNA binding assays verified that BES1 regulates the expression of some ion transporter genes directly and indirectly. Taken together, our results support a positive role of BES1 in plant salt tolerance."}], "Introduction": [{"passage_id": "Introduction.p0002", "text": "Salt stress adversely affects plant growth and reduces crop yields. It was reported that salt-affected soil accounted for around 10% of irrigated land. In order to adapt to salt stress, plants have evolved some salt response mechanisms. The Salt Overly Sensitive (SOS) pathway plays important roles in perceiving the salt signal and export excess Na+ out of cytoplasm, thus conferring salt tolerance to plants. The extracellular Na+ is first sensed by glycosyl inositol phosphoryl ceramides (GIPCs), a class of glycosylated sphingolipids in plasma membrane, which bind Na+ and trigger a quick increase in cytoplasmic Ca2+ concentration ([Ca2+]) through activating the gated Ca2+ influx channels. These cytosolic Ca2+ signals then activate the SOS pathway, in which the calcineurin B-like (CBL) proteins SOS3/CBL4 or Calcium Binding Protein 8 (SCaBP8) receive the [Ca2+] signals and recruits the CBL-interacting protein kinase SOS2/CIPK24 to plasma membrane to activate SOS1, a Na+/H+ antiporter, through phosphorylation. The activated SOS1 will mediate Na+ efflux and help intracellular ion homeostasis. The SOS3-SOS2 complex also positively regulate NHX, a vacuolar Na+/H+ exchanger, which transports Na+ from the cytoplasm to the vacuole. Furthermore, the Na+ transporter HKT1 (High-Affinity K+ Transporter 1), which mainly expresses in the root xylem parenchyma cells, is believed to participate in long-distance transportation and distribution of Na+ and K+ in plants. Recently, two phosphatases PP2C.D6 and PP2C.D7 were found to be able to inactive SOS1 through dephosphorylation under nonstress conditions, however, under salt stress conditions these phosphatases are inhibited by SCaBP8, therefore obviating their inhibition on SOS1. Besides causing ionic stress, excess salt also causes osmotic stress and oxidative stress. The osmotic stress is mediated by ABA-dependent and independent signaling pathways and these signal cascades further regulate downstream transcriptional gene expression. Salt stress often induces rapid production of reactive oxygen species (ROS), which may result in oxidation stress. ROSs also function as signaling molecules to regulate ion homeostasis through MAPK cascades. ROSs are toxic and must be kept at suitable levels. To reduce excess ROS accumulation, plants have evolved both enzymatic and nonenzymatic scavenging systems to mitigate ROS-induced damages."}, {"passage_id": "Introduction.p0003", "text": "BRs are a group of steroid phytohormones that promote plant growth and developments. BR signal is perceived by the cell-surface receptor kinase BRI1 (brassinosteroid insensitive 1) and its coreceptor BAK1 (BRI1-associated receptor kinase 1). BR binding activates BRI1’s kinase activity, leading to phosphorylation and activation of BSK1 and CDG1, two cytoplasmic receptor-like kinases. BSK1 and CDG1 mediate the signal transduction to BSU1 (BRI1 suppressor 1), a PP1-like phosphatase through phosphorylation. BSU1 then dephosphorylates and inactivates a downstream GSK3-like kinase BIN2, which negatively regulates BR signaling by phosphorylating and destabilizing the transcription factors BZR1 (brassinazole resistant 1) and its paralogue BES1 (BRI1-EMS-suppressor 1, also named as BZR2). Hence, inactivation of BIN2 during BR signal transduction will release the transcriptional activity of BZR1 and BES1. The dephosphorylated BRZ1 and BES1 subsequently translocate into the nucleus and regulate the expression of their target genes by binding to the BRRE or E-box motifs in their promoters. Genome-wide target gene profiling experiments revealed that BZR1 and BES1 target thousands of genes involved in multiple aspects of plant development"}, {"passage_id": "Introduction.p0004", "text": "BIN2 and BZR1/BES1 have been shown to act as mediators of crosstalk between BR signaling and other pathways. For example, BIN2 and BES1 were reported to interact with RD26 (responsive to desiccation 26) to coordinate BR- and ABA-regulated drought resistance. Under normal conditions, RD26 is transcriptionally repressed by BES1, however, under drought stress conditions, RD26 is induced to antagonize BES1’s transcriptional activity through direct interaction with BES1 and to repress plant growth, which is beneficial to drought survival of plants. The same authors also found that ABI1, a member of the 2C class of protein phosphatases (PP2Cs, negative regulators of ABA signaling), could inhibit BIN2’s kinase activity via dephosphorylation under normal conditions. Drought stress relieves ABI1 inhibition of BIN2, and the activated BIN2 strengthens drought tolerance through phosphorylating and stabilizing RD26. Another parallel study also found that under drought conditions BIN2 can phosphorylate and activate SnRK2 kinase in ABA signaling, thus promoting ABA responsive gene expression. Therefore, BR represses ABA responsive genes through BIN2 under normal conditions, thus promoting plant growth. These studies confirmed an antagonism relationship between BR and ABA and provided a mechanism for balancing plant growth and drought survival. In addition to drought, BZR1 and BES1 are also involved in plant responses to freezing, heat and salinity stress. In the case of salt stress, BIN2 was found to act as a molecular switch to help plant recovery after non-lethal salt stress in Arabidopsis. BIN2 is guided to plasma membrane by SOS3 and SCaBP8, where it inhibits SOS2 through phosphorylation, therefore negatively regulating plant salt tolerance. In addition, SlBZR1, a BZR1 homologue in tomato, was found to enhance salt tolerance in both tomato and Arabidopsis, and upregulate the expression of several stress responsive genes (i.e., SlAREB1, SlDREB1, SlRD29, SlERF1, SlCAT2, SlAPX2). Recently, VvBES1-3, a BES1 homologue from grape, was found to improve salt tolerance in transgenic Arabidopsis. Despite these interesting findings, it remains largely unknown for the mechanisms by which BZR1/BES1 mediate salt stress responses in plants."}, {"passage_id": "Introduction.p0005", "text": "In this study, we evaluated the role of BES1 in Arabidopsis salt responses at the genome level by using the bes1-D and BES1-RNAi mutant lines. Based on the phenotypes observed, we performed transcriptome sequencing to explore the molecular basis of BES1-induced salt resistance. Time series clustering analysis identified gene clusters specifically changed in bes1-D under salt stress. GO enrichment network analysis suggested a few key modules regulated by BES1. Further proteomic analysis and qRT-PCR assays were used to deepen our understanding of the salt stress responses in bes1-D. Finally, we selected several potential target genes of BES1 in regulating plant salt resistance and validated them by transient transcription assays and in vitro DNA binding assay (EMSA). This study provided new insights to the role of BR in plant responses to salt stress."}], "Discussion": [{"passage_id": "Discuss.p0002", "text": "BR has major effects on promoting plant growth and development, and it was also involved in regulation of plant responses to environmental changes such as drought, freezing, salt, and heat stresses. In this study, we found that bes1-D, a gain-of-function mutant of BES1, showed better growth performance and lower relative electrolyte leakage than wild-type under salt stress (150 and 200 mM NaCl), while the loss-of-function mutant BES1-RNAi performed poorer than the wild-type plants ( Figures 1 , 2 ). A consistent conclusion has been drawn by that SlBZR1 cloned from tomato enhanced salt tolerance in both tomato and Arabidopsis. But the molecular mechanism how SlBZR1 regulates its target genes was not clear, despite that several salt-responsive genes (i.e., SlAREB1, SlDREB1, SlRD29, SlERF1, SlCAT2, SlAPX2) were shown to be upregulated in SlBZR1D-overexpressing plants. BES1 is known to be directly regulated by BIN2 through phosphorylation. However, there were also evidences showing that the activation of BES1 can be mediated by PP2C phosphatases (ABI1) in a BR independent manner. These studies indicated a positive role of BZR1/BES1 in plant stress responses, and activation of BZR1/BES1 can be mediated by factors other than BIN2 only."}, {"passage_id": "Discuss.p0003", "text": "Transcriptome sequencing provides a full scenario of global gene expression of bes1-D and wild-type under salt stress ( Figure 3 ). DEGs and time series clustering analyses indicated that a total of 1,170 genes were enhanced in bes1-D under salt stress, of which the 365 genes in Cluster 2 were specifically upregulated and the 805 genes in Cluster 3 were boosted in bes1-D ( Figure 4A ). Two known BES1 target genes HSP70.4 (AT3G12580) and HSP90.1 (AT5G52640) were observed in Cluster 2, suggesting that BES1 may directly upregulate genes in these two clusters to enhance salt tolerance. Both transcriptome and proteome analyses showed that parts of the genes involved in ABA biosynthesis, catabolism, and signaling were induced by salt stress particularly in 2-day treatment samples ( Figure 7C ). Three ABA biosynthesis genes (i.e., ABA1, ABA3, and AAO3) were significantly upregulated in both bes1-D and Col-0 under salt stress, but their salt-induced fold changes in these two materials were almost identical. Four DREB genes (DREB2B, DREB2C, DREB19, and DREB26) were upregulated in bes1D_Salt_2d ( Figure 7C ), suggesting that BES1 may activate ABA signaling under salt stress. A previous study revealed that a crosstalk of ABA and BR signaling was established through the interaction of PP2Cs and BIN2, whereby PP2Cs (ABI1 and ABI2) dephosphorylated BIN2 under normal conditions. As PP2Cs are negative regulators in ABA signaling pathway, accumulation of ABA under stress conditions will inactive PP2Cs and promote BIN2 phosphorylation thereby inhibiting BES1 and BR responsive genes. A novel crosstalk between ABA and BR was reported by that BES1 activation mediated by PP2C phosphatases was not completely rely on BIN2. Our findings of the upregulation of DREB genes in bes1-D under salt stress provided a new clue for the crosstalk of BR and ABA signaling. Other than this, our transcriptome data demonstrated that a series of ROS related genes, particularly GST family, were upregulated in bes1-D under salt stress ( Figure 7E ). These findings are consistent with a functional study of TaBZR2 in wheat (Triticum aestivum) which showed that TaBZR2 enhances drought tolerance via targeting TaGST1, a scavenger of superoxide anions induced by drought stress. Expression heatmap showed that most of the anthocyanin biosynthesis genes (i.e., PAL1, PAL2, CHS, F3H, DFR, ANS, UF3GT, PAP1) were also upregulated in bes1-D under salt stress ( Figure 7D ), suggesting that BES1 promotes anthocyanins accumulation to help ROS scavenging under salt stress. A BR-induced accumulation of anthocyanins has been reported in grape (Vitis vinifera). It was shown that BES1 acts as an important regulator in plant response to UVB light stress. Under normal conditions, BES1 inhibits flavonoid biosynthesis genes MYB11, MYB12 and MYB111 through binding to their promoters as a transcriptional repressor. Under UVB light stress, down-regulated BES1 compromises the inhibition on these three genes and thus promoting flavonol accumulation. In our transcriptome data, the expression of these three genes were almost unchanged between bes1-D and the wild-type, either under stress or normal conditions ( Supplementary Figure S9 ). This inconsistency reflected complicated regulation of flavonol accumulation in different growth periods or conditions."}, {"passage_id": "Discuss.p0004", "text": "In our transcriptional activation assays, BES1-D was found to regulate four ion transporters (NHX2, CAX3, SLAH3, and HKT1) possibly by binding to their promoters ( Figure 8 ). Of these four genes, CAX3 was also previously identified as putative BES1 target gene in a ChIP-chip study. Chromatin accessibility is highly dynamics in response to growth and environmental changes. Therefore, the targets genes of transcription factors obtained under different conditions may be different. For example, an ATAC sequencing profiling revealed that cell-type-specific differences of transcription factors in Arabidopsis. Another study of accessible chromatin regions (ACRs) in tea genome demonstrated that 226 common THSs (distal transposase hypersensitive sites) were shared by normal samples (997 THSs) and chilling treated samples (663 THSs). Therefore, we speculate that BES1 may specifically regulate some of the target genes under salt stress. Indeed, our EMSA DNA-binding assays confirmed that NHX2 and CAX3 could specifically bind BES1."}, {"passage_id": "Discuss.p0005", "text": "In conclusion, our results in this study indicate that BES1-D, a constitutively active form of BES1, can increase plant salt tolerance in Arabidopsis. Under salt stress, the bes1-D mutant performed much better than the wilt-type (Col-0) and the BES1-RNAi line. Transcriptome sequencing results revealed that 1,170 genes were clearly upregulated in bes1-D compared to Col-0 under salt stress. Functional enrichment indicated that these genes were mostly enriched in key regulatory modules such as regulation of response to stress, responsive to ROS, flavonoid biosynthesis, and transmembrane transport, etc. Further proteomic analysis and qRT-PCR assays confirmed the findings from transcriptome analysis. Both transcriptomic and proteomic data confirmed that the upregulation of genes/proteins involved in regulation of response to stress, synthesis of secondary metabolites, ROS and ABA signaling, and those controlling ion transport are the key mechanisms of BES1 promotion of salt tolerance in Arabidopsis. Finally, transient gene transcription assays using Arabidopsis protoplasts and EMSA DNA binding assay confirmed that some of these genes are indeed under regulation of BES1 in plant cells."}], "Conclusion": []}}, {"pmcid": "PMC10017854", "title": "Overexpression of the cotton trihelix transcription factor GhGT23 in Arabidopsis mediates salt and drought stress tolerance by binding to GT and MYB promoter elements in stress-related genes", "source_file": "PMC10017854.json", "source_url": "https://pmc.ncbi.nlm.nih.gov/articles/PMC10017854/", "included_counts": {"Abstract": 1, "Introduction": 5, "Discussion": 5, "Conclusion": 1}, "omitted_results_discussion": false, "sections": {"Abstract": [{"passage_id": "Abstract.p0001", "text": "Cotton (Gossypium hirsutum L.) is the world’s most economically valuable textile crop. However, cotton plants are often subjected to numerous abiotic stresses that can dramatically limit yield. Trihelix transcription factors (TTFs) play important roles in abiotic stress responses in many plant species, and efforts to better understand their roles in cotton abiotic stress responses are ongoing. In this study, a member of the cotton TTF family (GhGT23) was functionally characterized. This protein contains a SANT domain and is a member of the SIP subfamily of TTF proteins. GhGT23 was significantly (p < 0.05) and highly expressed in cotton fiber compared to relatively low expression in other tissues. A significant (p < 0.05) increase in GhGT23 expression occurred in cotton seedlings within 12 hours of drought, salt, and ABA exposure. The GhGT23 protein localized in the nucleus but exhibited no signs of transactivation activity. GhGT23 overexpression in Arabidopsis conferred enhanced drought and salt stress tolerance. The expression of stress-related genes was higher in transgenic Arabidopsis expressing GhGT23 than in wild-type plants subjected to salt stress. The results of electrophoretic mobility shift assay revealed that GhGT23 could bind to the GT cis-elements GT-1Box (Box II), GT2-Box, GT3-Box, GT-3a (Site1-type), GT-3b, and Box as well as the MYB cis-elements MBS1 and MRE4. Our results demonstrate that GhGT23 positively regulates salt and drought stress responses, possibly by enhancing the expression of stress-related genes."}], "Introduction": [{"passage_id": "Introduction.p0002", "text": "Plant growth and crop production are constantly challenged by dynamic abiotic and biotic stresses in the environment. Some of the most common abiotic stresses that plants are subjected to are high salt, low temperature, and drought. These abiotic stresses can limit crop productivity and reduce average crop yields by more than 50%. Plant cells perceive environmental stress through sensors that trigger signaling pathways upon stress perception. These signaling pathways often include phosphorylation cascades that culminate in the activation of stress-responsive transcription factors (TFs). Upon activation, TFs translocate into the nucleus where they bind to cis-regulatory elements in the promoter regions of several stress-related genes. In this way, TFs play a critical role in translating the initial perception of stress by the plant into physiological changes that result in tolerance to the stress. Of the more than 64 transcription factor families identified in plants, the NAC, C2H2 zinc finger, bZIP, and WRKY families are the most studied and most widely involved in abiotic stress responses. Because of their documented roles in plant stress tolerance, TFs have become key targets for genetic engineering efforts to improve plant stress tolerance."}, {"passage_id": "Introduction.p0003", "text": "Trihelix transcription factors (TTFs) are a small family of plant-specific TFs that are present in diverse plant species. Chrysanthemum, tomato, rice, Arabidopsis, poplar, soybean, and maize each have 20, 36, 31, 28, 56, 63, and 59 TTF genes, respectively. Members of the TTF family are also known as GT factors, because they can bind to the GT element found in the promoter of some genes regulated by light. The first GT element was identified in the rbcS-3A gene promoter from pea in 1987. Since then, GT elements have been identified in soybean, maize, spinach, Arabidopsis, and rice genes."}, {"passage_id": "Introduction.p0004", "text": "The DNA-binding domains of TTFs are rich in proline as well as basic and acidic amino acids. They also contain three tandem helices, namely, the helix-loop-helix-loop-helix. The internal hydrophobic region of each helix contains regularly spaced repeats typically containing three tryptophan residues separated by a non-tryptophan residue (W-X-W-X-W). The third tryptophan residue is less conserved and is sometimes replaced with a phenylalanine or isoleucine residue. TTFs contain one or two trihelix DNA-binding domains at the N- or C-terminus that specifically bind to GT-elements. The Arabidopsis TTF family is divided into five subfamilies, namely, GT-1, GT-2, GTγ, SH4, and SIP1. Most subfamilies contain only one DNA-binding domain, but members of the GT-2 subfamily contain a DNA-binding domain at both the N- and C-terminus. The five subfamilies are further differentiated by the composition of the tryptophan repeats in each helix. Helixes in members of the GT-1 and SH4 subfamily, as well as the C-terminal DNA-binding domain of GT-2 subfamily members, contain a tryptophan residue at the end of the repeat (W-X-W-X-W). On the other hand, members of the GTγ subfamily, and the N-terminal DNA-binding domain of GT-2 subfamily members, contain a phenylalanine residue at the end of the repeat (W-X-W-X-F), whereas members of the SIP1 subfamily contain an isoleucine residue at the terminal position (W-X-W-X-I)."}, {"passage_id": "Introduction.p0005", "text": "Numerous plant TTFs, and the GT elements that they bind, have been reported to regulate responses to light, growth, and a variety of developmental processes such as morphogenesis of perianth organs, formation of trichomes and stomata, seed oil accumulation and abscission, kernel development, and late embryogenesis development. Recent studies on TTF family members in Arabidopsis, rice, soybean, wheat, tomato, chrysanthemum, and poplar have revealed that they are widely involved in plant responses to abiotic stress. Transgenic Arabidopsis overexpressing GT-4, AST1, or AtGTL1 exhibited improved salt and drought stress tolerance, whereas GmGT2A and GmGT2B expression was induced by high salinity, drought, cold, and abscisic acid (ABA) in soybean, and heterologous overexpression of these two genes in Arabidopsis improved salt, cold, and drought stress tolerance. Furthermore, overexpression of the rice genes OsGT-1 and OsGTgamma-2 in rice confered enhanced resistance to salt stress. Heterologous expression of wheat TaGT2L1D in Arabidopsis can suppress the expression of AtSDD1, a positive regulator of drought tolerance, by binding directly to the GT3 box in its promoter. Overexpression of the sorghum TTF genes sb06g023980 and sb06g024110 significantly enhanced tolerance of low temperature, high salt, and drought, whereas transgenic tomatoes overexpressing ShCIGT gained tolerance of low temperature and drought. Expression of poplar PtaGTL1 in Arabidopsis reduced stomatal conductance and leaf transpiration, which led to enhanced drought tolerance and water use efficiency. Taken collectively, these studies demonstrate a conserved role for TTF family members in diverse abiotic stress responses."}, {"passage_id": "Introduction.p0006", "text": "Cotton (Gossypium hirsutum L.) is an economically important textile fiber crop that is cultivated worldwide. Abiotic stress has become a major environmental factor limiting cotton cultivation and production due to global climate change and environmental pollution. Despite the economic ramifications of abiotic stress on cotton production, little is known about the mechanisms of abiotic stress tolerance in cotton compared to other agricultural crops. The obvious importance of the TTF family in abiotic stress responses in other crop species led us to hypothesize that this family of genes plays a similar role in cotton. We previously analyzed the expression of 24 cotton TTF genes in response to diverse abiotic stimuli to identify genes that were differentially expressed and involved in abiotic stress responses in cotton. Of the 24 TFF genes analyzed, GhGT23 was one of three that was differentially expressed in response to all of the abiotic stress treatments we tested. In this study, we further characterize the function of GhGT23, which belongs to the SIP subfamily of TFFs. The expression of GhGT23 was analyzed in response to salt stress, drought stress, cold stress, and ABA treatment in cotton. Heterologous overexpression of GhGT23 in Arabidopsis led to improved tolerance of salt and drought in seedlings, which was positively correlated with an increase in the expression of stress-related genes. Furthermore, GhGT23 could directly bind to multiple GT motifs and MYB elements. Our results further highlight the importance of TTF family members in plant abiotic stress responses and specifically provide key insights into the function of GhGT23 in salt and drought tolerance in cotton."}], "Discussion": [{"passage_id": "Discuss.p0002", "text": "Due to the reduction of arable land worldwide, cotton production has had to compete with grain production over shrinking sources of quality farmland. One strategy for the sustained production of cotton is to develop varieties that can grow in saline-alkali soil that is unsuitable for grain production. Current research efforts are focused on improving abiotic stress tolerance in cotton through genetic engineering of key regulators in stress response pathways. Common targets for engineering are key transcription factors that regulate the expression of downstream stress-response genes. Recent studies of TTF family members in diverse plant species have revealed that these transcription factors are involved in plant responses to abiotic stresses such as salt and drought. A previous study by our lab identified GhGT23 as a TTF in cotton that is differentially expressed in response to multiple abiotic stresses. In this study, we further characterize the function of GhGT23 in salt and drought stress in transgenic Arabidopsis lines overexpressing GhGT23."}, {"passage_id": "Discuss.p0003", "text": "GhGT23 was cloned from upland cotton, and a SMART analysis of the protein sequence identified a single SANT domain ( Figure 2A ). The SANT domain is multifunctional and participates in both protein-protein and protein-DNA interactions; it is closely related to enzymatic activity and substrate affinity. Phylogenetic analysis revealed that GhGT23 falls within the SIP subfamily of TTFs along with Arabidopsis AtASIL1 and AtASIL2 ( Figure 2B ). AtSIL1 and AtSIL2 are involved in stem cell regulation, embryo patterning, and the transition from vegetative to reproductive growth in Arabidopsis, but no role in abiotic stress tolerance has been described for these TTFs. Members of other TTF subfamilies, such as Arabidopsis AST1 and Brassica napus BnSIP1-1, do regulate the expression of downstream genes that promote enhanced tolerance to salt, osmotic, and drought stress. We demonstrated that GhGT23 expression was affected by salt, drought, cold, and ABA treatments, and GhGT23 was highly expressed under non-stressed conditions in cotton fibers ( Figures 3A, B ). The nuclear localization of GhGT23 we observed in Arabidopsis protoplasts provided additional evidence that this is a novel cotton TTF in the SIP subfamily that may regulate abiotic stress responses through an ABA-dependent signaling pathway ( Figure 4 )."}, {"passage_id": "Discuss.p0004", "text": "Generating stable transgenic cotton plants is challenging due to cost, time, and technical difficulties. As a cheaper, quicker, and easier alternative, TTFs from soybean and poplar have been successfully expressed in Arabidopsis to study their role in abiotic stress responses. We generated stable transgenic Arabidopsis lines overexpressing GhGT23 to gain further insight into the biological function of this TTF. These transgenic Arabidopsis lines had enhanced above-ground tolerance to salt and drought stress in both in vivo and in vitro assays ( Figures 5 – 8 ). Additionally, the primary roots of Arabidopsis expressing GhGT23 were longer than those of WT plants upon salt and drought stress ( Figure 9 ). These results demonstrate that overexpression of GhGT23 confers enhanced salt and drought stress tolerance in a heterologous system."}, {"passage_id": "Discuss.p0005", "text": "To gain further insight into the molecular mechanism underlying improved salt and drought tolerance in the GhGT23-overexpressing Arabidopsis lines, we selected some stress marker genes in Arabidopsis and monitored their expression in WT and transgenic lines after 7-day salt exposure. We noticed a significant increase in the expression of DREB1B, COR6.6, COR47, RD22, SAP18, COR15A, DREB2A, DREB2B, STZ, AP2, and DREB2C ( Figure 10 ). Dehydration-responsive element-binding (DREB) proteins are transcription factors involved in cold, drought, and salt stress response pathways. The Arabidopsis DREB-like transcription factors have been shown to regulate the expression of downstream stress-related genes including HsfA3, rd29A/cor78, kin1, kin2, cor6.6/kin2, cor15a, cor47/rd17, and erd10 to improve the tolerance of multiple stresses in transgenic plants. Part of their function is to regulate the expression of cold-responsive genes that are involved in stress tolerance. AtSTZ is a positive regulator of salt stress tolerance, whereas AtSAP18 is a negative regulator of drought and salt stress tolerance in Arabidopsis. These results demonstrate that overexpression of GhGT23 in Arabidopsis broadly affects the expression of many genes involved in plant abiotic stress tolerance."}, {"passage_id": "Discuss.p0006", "text": "The results of the dual-luciferase reporter assay indicated that GhGT23 does not have the ability to activate transcription on its own in Arabidopsis protoplasts ( Figure 11 ). However, our EMSA results demonstrated that GhGT23 can bind all six of the GT elements tested and two out of four MYB elements tested ( Figure 1 ). This was an unexpected discovery because TTFs are typically very selective for the cis-elements that they bind. These results also raise an interesting question regarding the function of GhGT23. If GhGT23 is not a transcriptional activator, what purpose does it have in binding GT and MYB elements? It is possible that GhGT23 is a transcriptional repressor or perhaps a transcriptional activator that requires other proteins in cotton that are not conserved in Arabidopsis."}], "Conclusion": [{"passage_id": "Concl.p0002", "text": "In this study, we cloned and characterized GhGT23, a novel TTF in cotton and a member of the SIP subfamily. We observed that the expression of GhGT23 is influenced by drought, salt, cold, and ABA treatments. Remarkably, Arabidopsis transgenic lines overexpressing GhGT23 exhibit enhanced tolerance of salt and drought stress, which results in better above-ground and below-ground growth in the presence of these stresses. We also found that GhGT23 overexpression increases the expression of multiple downstream stress-related genes in Arabidopsis, and the GhGT23 protein binds to diverse GT and MYB cis-elements. Interestingly, GhGT23 does not exhibit transcriptional activation activity, which brings into question the biological significance of GhGT23 binding to GT and MYB cis-elements. It is possible that GhGT23 functions as a transcriptional repressor or requires post-translational modifications performed by proteins in cotton that are not conserved in Arabidopsis. Future studies addressing these questions will reveal more about the molecular mechanism through which GhGT23, and possibly other SIP subfamily members, regulate plant stress responses."}]}}, {"pmcid": "PMC10018198", "title": "How ambient temperature affects the heading date of foxtail millet (Setaria italica)", "source_file": "PMC10018198.json", "source_url": "https://pmc.ncbi.nlm.nih.gov/articles/PMC10018198/", "included_counts": {"Abstract": 1, "Introduction": 5, "Discussion": 6}, "omitted_results_discussion": false, "sections": {"Abstract": [{"passage_id": "Abstract.p0001", "text": "Foxtail millet (Setaria italica), a short-day plant, is one of the important crops for food security encountering climate change, particularly in regions where it is a staple food. Under the short-day condition in Taiwan, the heading dates (HDs) of foxtail millet accessions varied by genotypes and ambient temperature (AT). The allelic polymorphisms in flowering time (FT)–related genes were associated with HD variations. AT, in the range of 13°C–30°C that was based on field studies at three different latitudes in Taiwan and observations in the phytotron at four different AT regimes, was positively correlated with growth rate, and high AT promoted HD. To elucidate the molecular mechanism of foxtail millet HD, the expression of 14 key FT-related genes in four accessions at different ATs was assessed. We found that the expression levels of SiPRR95, SiPRR1, SiPRR59, SiGhd7-2, SiPHYB, and SiGhd7 were negatively correlated with AT, whereas the expression levels of SiEhd1, SiFT11, and SiCO4 were positively correlated with AT. Furthermore, the expression levels of SiGhd7-2, SiEhd1, SiFT, and SiFT11 were significantly associated with HD. A coexpression regulatory network was identified that shown genes involved in the circadian clock, light and temperature signaling, and regulation of flowering, but not those involved in photoperiod pathway, interacted and were influenced by AT. The results reveal how gene × temperature and gene × gene interactions affect the HD in foxtail millet and could serve as a foundation for breeding foxtail millet cultivars for shift production to increase yield in response to global warming."}], "Introduction": [{"passage_id": "Introduction.p0002", "text": "Foxtail millet [Setaria italica (L.) P. Beauv.] is the second most cultivated millet after pearl millet, widely cultivated in China, India, Indonesia, the Korean peninsula, and southern Europe (FAOSTAT; http://faostat.fao/org/. Foxtail millet is a nutrient-rich food source that is high in essential amino acids, vitamins, and minerals compared with most cereal grains. Foxtail millet grains have become a good option for healthy diets because of its gluten-free protein, low glycemic index (GI), and high fiber content."}, {"passage_id": "Introduction.p0003", "text": "Foxtail millet was domesticated from its wild ancestor, green foxtail [S. viridis (L.) P. Beauv.], which is evolutionarily close to several cereals and energy crops and considered as the model C4 plants. Numerous foxtail millet accessions have been collected worldwide and preserved as valuable germplasms, and phenotypic and genotypic variations also indicate a very high genetic diversity. In comparison with maize, wheat, and sorghum, foxtail millet has high water usage efficiency, which is recognized as a drought-tolerant crop. Because of high adaptability in diverse and harsh environments, foxtail millet as a staple food has been brought to attention to cope with climate changes for food security. These agronomic and nutritional characteristics of foxtail millet are of great significance in the agricultural economy."}, {"passage_id": "Introduction.p0004", "text": "Flowering time (FT) is one major characteristic for plants adaptation in wide-range geographic distribution and is also an important trait for crop management and production. FT is a complex trait regulated by numerous genes, the environment, and gene–environment interactions. Many genetic mapping and molecular physiology studies have been performed in crops and exemplified in the model plants Arabidopsis and rice. In Arabidopsis, which required vernalization and long day (LD) for flower
