production of N fertilizers), and intensive irrigation make agriculture a major contributor to climate change. Conversely, plant growth has been proposed as a solution to mitigate greenhouse gas emissions and the associated climate change effects. Indeed, by their ability to fix C and produce biomass, plants are an ideal tool to capture and to sequester atmospheric CO2 either as biomass or in soils. The worldwide distribution of crops makes them an excellent system to deploy a C-sequestration plan at a large scale. However, we still need to identify the best root traits to mobilize to achieve this goal and identify how this will impact the carbon dynamics in the soil in realistic (field) conditions. In addition, the development of root systems capable of taking up nutrients and water more efficiently from the soil is a way to reduce the use of N fertilizers and water, thereby considerably reducing the impact of agriculture on climate. Therefore, comprehension of the mechanisms driving root system development and N and water use efficiency under climate change is a major challenge to produce climate-resilient crops. Much remains to be understood in order to develop and use such climate-resilient plants in the near future."}, {"passage_id": "Introduction.p0018", "text": "Ultimately, developing strategies to adapt agriculture to and mitigate the effects of climate change is a challenge that will require a truly interdisciplinary effort. While plant breeding will be a key component, sustainable solutions are unlikely to arise just from one discipline and will depend on system thinking. Plant biologists need to team up with other scientists such as soil scientists, agronomists, hydrologists, and economists to address these pressing issues."}], "Discussion": [], "Conclusion": [{"passage_id": "Concl.p0001", "text": "Overall conclusion"}, {"passage_id": "Concl.p0002", "text": "The complex nature of a changing climate requires plants to be systemically more efficient in dealing with the constraints that have been discussed here individually. A more integrated view and approach is required, as a plant that is more efficient in dealing with temperature extremes may at the same time be more vulnerable at elevated ambient temperature, under drought stress, or in a CO2-rich environment. This complexity calls for multi-partner initiatives that have the expertise and the means to tackle systemic aspects, ideally not in model plants, but directly in crop species."}]}}, {"pmcid": "PMC10012607", "title": "Genome-wide characterization and expression analysis of MYB transcription factors in Chrysanthemum nankingense", "source_file": "PMC10012607.json", "source_url": "https://pmc.ncbi.nlm.nih.gov/articles/PMC10012607/", "included_counts": {"Abstract": 7, "Introduction": 6, "Discussion": 8, "Conclusion": 1}, "omitted_results_discussion": false, "sections": {"Abstract": [{"passage_id": "Abstract.p0001", "text": "Background"}, {"passage_id": "Abstract.p0002", "text": "Chrysanthemum is a popular ornamental plant worldwide. MYB (v-myb avian myeloblastosis viral oncogene homolog) transcription factors play an important role in everything from stress resistance to plant growth and development. However, the MYB family of chrysanthemums has not been the subject of a detailed bioinformatics and expression investigation."}, {"passage_id": "Abstract.p0003", "text": "Results"}, {"passage_id": "Abstract.p0004", "text": "In this study, we examined 324 CnMYB transcription factors from Chrysanthemum nankingense genome data, which contained 122 Cn1R-MYB, 183 CnR2R3-MYB, 12 Cn3R-MYB, 2 Cn4R-MYB, and 5 atypical CnMYB. The protein motifs and classification of CnMYB transcription factors were analyzed. Among them, motifs 1, 2, 3, and 4 were found to encode the MYB DNA-binding domain in R2R3-MYB proteins, while in other-MYB proteins, the motifs 1, 2, 3, 4, 5, 6, 7, and 8 encode the MYB DNA-binding domain. Among all CnMYBs, 44 genes were selected due to the presence of CpG islands, while methylation is detected in three genes, including CnMYB9, CnMYB152, and CnMYB219. We analyzed the expression levels of each CnMYB gene in ray floret, disc floret, flower bud, leaf, stem, and root tissues. Based on phylogenetic analysis and gene expression analysis, three genes appeared likely to control cellulose and lignin synthesis in stem tissue, and 16 genes appeared likely to regulate flowering time, anther, pollen development, and flower color. Fifty-one candidate genes that may be involved in stress response were identified through phylogenetic, stress-responseve motif of promoter, and qRT-PCR analyses. According to genes expression levels under stress conditions, six CnMYB genes (CnMYB9, CnMYB172, CnMYB186, CnMYB199, CnMYB219, and CnMYB152) were identified as key stress-responsive genes."}, {"passage_id": "Abstract.p0006", "text": "This research provides useful information for further functional analysis of the CnMYB gene family in chrysanthemums, as well as offers candidate genes for further study of cellulose and lignin synthesis, flowering traits, salt and drought stress mechanism."}, {"passage_id": "Abstract.p0007", "text": "Supplementary Information"}, {"passage_id": "Abstract.p0008", "text": "The online version contains supplementary material available at 10.1186/s12870-023-04137-7."}], "Introduction": [{"passage_id": "Introduction.p0001", "text": "Background"}, {"passage_id": "Introduction.p0002", "text": "Transcription factors (TFs) bind to the DNA regulator sequence to regulate plant growth and development. They can also boost plant tolerance to abiotic and biotic stressors by orchestrating regulatory networks. The MYB family is a prominent TF family in eukaryotes that regulates a variety of biological processes. The name of MYB TFs derives from their conserved N-terminal MYB DNA-binding domain (DBD) repeats (Rs), which usually contain 52 amino acid residues per repetition. The MYB domain comprises one to four imperfect amino acid repeats. Accordingly, the MYB protein family can be divided into four subclasses based on the number of MYB domains: 1R, R2R3-, 3R-, and 4R-MYB proteins."}, {"passage_id": "Introduction.p0003", "text": "The first MYB gene was discovered in maize in 1997. Since then, a considerably wider variety of plant species, such as Arabidopsis thaliana, Oryza sativa (rice), Morella Rubra (Chinese bayberry), Cajanus Cajan (pigeon pea), etc. have shown evidence of the MYB family in genome-wide analyses. Previous studies have shown that the MYB family participates in diverse processes, including primary and secondary metabolism, root hair development, flower development, and responses to biotic and abiotic stresses."}, {"passage_id": "Introduction.p0004", "text": "DNA methylation is a conserved epigenetic mark that is important for the development and stress responses in plants and many animals. The CpG islands in plant genomes are more frequently methylated, and these variations in methylation status at promoters limit or increase the capacity of transcription factor (TF) proteins to bind to the DNA promoter, which in turn inhibits or increases the transcriptional activity of genes. Although multiple studies suggested that DNA methylation controlled anthocyanin accumulation and the MYB TFs’ role in the stress response. Studies on the effect of methylation in controlling MYB TF activities via CpG islands are scarce."}, {"passage_id": "Introduction.p0005", "text": "The productivity and quality of the commercially grown ornamental plant Chrysanthemum morifolium Ramat are considerably impacted by harsh environmental conditions. The MYB TF family, which are essential transcription factors in the plant stress response system, should be crucial for the growth and development of chrysanthemums. Chrysanthemum, on the other hand, has a substantial number of hybrid polyploidy variants lacking high-quality reference genomes. Because there is currently a dearth of reliable information about the Chrysanthemum reference genome, only a portion of the MYB family of genes has been studied in Chrysanthemum. It has become crucial to conduct genome-wide analysis of the MYB superfamily in chrysanthemum. Fortunately, a whole-genome fine mapping of C. nankingense was created using next-generation sequencing. C. nankingense is one of the progenitors of Chrysanthemum×morifolium (Ramat). Due to its simple diploid genetic background, it is suitable to use as a model plant in genetic studies. Identification and incorporation of important genes into commercial varieties improve the quality and stress tolerance of the plant. Therefore, it is of great significance to identify the MYB family genes in C. nankingense."}, {"passage_id": "Introduction.p0006", "text": "In this study, 324 MYB genes were found in the genome of C. nankingense (http://www.amwayabrc.com). In addition, we looked into the MYB family genes’ evolutionary relationships, conserved protein domains, exon-intron architectures, cis-acting elements, and recognition of CpG islands. We further analyzed the expression patterns of these genes in different tissues based on RNA-Seq data. Finally, a phylogenetic tree that included 51 CnMYBs and 64 functional MYBs regulating flavonoid biosynthesis or defense responses from other species was generated in order to find additional CnMYBs involved in the regulation of flavonoid biosynthesis and defense responses in C. nankingense. The expression levels of selected 18 response genes and the methylation status of 3 genes of the CnMYB genes family in shoots under salt and drought stresses were then analyzed by quantitative real-time PCR and methylation-specific polymerase chain reaction (MSP). Together, these findings lay a strong framework for further research into the functions of the CnMYB gene family in C. nankingense under various environmental stresses."}], "Discussion": [{"passage_id": "Discuss.p0002", "text": "In all eukaryotes, the MYB gene family participates in a variety of biological activities, such as metabolism, plant development, and responses to biotic and abiotic stimuli. Numerous species, including model plants, significant crops, and other plants have been studied in relation to the MYB family. Different plants had varying numbers of MYB family members, including 198 in Arabidopsis, 379 in soybeans, 129 in the Chines pear, 170 in grape, and 174 in Chinese bayberry. Here, 324 CnMYB genes from the C. nankingense genome were discovered using bioinformatics research (Fig. 1, Table S1). As a result, there was no correlation between the number of MYB genes and genome size. Based on phylogenetic research, the R2R3-MYB gene family from C. nankingense was divided into 32 subgroups, most of which had conserved motif compositions and exon-intron organizations except for the C26 and C28 subgroups, which showed the need for species to adapt to their particular environments (Figs. 2, 3). This outcome is somewhat consistent with the earlier reports. Other MYBs from C. nankingense were classified into 16 subgroups based on phylogenetic analysis, with a certain degree of divergent conserved motif compositions and exon-intron organizations (Fig. S2)."}, {"passage_id": "Discuss.p0003", "text": "Based on transcriptome data, we analyzed the expression patterns of 324 CnMYB genes in six tissues and divided them into 3 trends according to different expression patterns (Fig. 5). The expression levels of 60% CnMYBs (196 genes) are similar across all tissues (Third trend) (Fig. 5C). Second trend has 72 genes (22%) and highly expressed in the bud tissues (Fig. 5B). 20% of CnMYB (50 genes) genes are highly expressed in the stem (Fig. 5A). This result indicated that CnMYBs might perform diversified functions during the C. nankingense lifespan."}, {"passage_id": "Discuss.p0004", "text": "Lodging is one of the most important agronomic traits that play an essential role in the quality and yield of crops. Cellulose and lignin contents of plant stems can affect the resistance of plants against lodging. A previous study reported that AtMYB46 and AtMYB83 are considered secondary main switches for controlling secondary cell wall biosynthesis AtMYB46 and AtMYB83 can induce the expression of cellulose and lignin synthesis genes to promote the thickening of the secondary wall and their downstream MYB TFs (AtMYB58, AtMYB63, and AtMYB85) also play an important role in the regulation of secondary wall biosynthesis. Moreover, there are also some MYB TFs, such as AtMYB52, AtMYB54, AtMYB69, and AtMYB103 may also be involved in the regulation of secondary cell walls. Except, for positively regulating second cell wall synthesis genes of MYB transcription, AtMYB7, AtMYB4, and AtMYB32 may be negative regulators of lignin synthesis. The combined transcriptomic data and phylogenetic tree analysis showed that CnMYB278, CnMYB226, CnMYB180, CnMYB76, CnMYB127, and CnMYB219 may be involved in the regulation of cellulose and lignin synthesis (Fig. 2, Table S7). Among them, the CnMYB278 was specifically expressed in the tubular flower tissue, and the CnMYB127 and CnMYB219 genes were highly expressed in all tissues. While CnMYB226, CnMYB180, and CnMYB76 genes were highly expressed in the stem and slightly expressed in other tissues. These results suggest that CnMYB226, CnMYB180, and CnMYB76 genes should be considered important candidate genes involved in the regulation of cellulose and lignin synthesis in stem tissue (Table S7)."}, {"passage_id": "Discuss.p0005", "text": "MYB transcription factors family is one of the largest transcription factor families in plants. Some MYB TFs have effects on flowering time, anther, and pollen development, while other MYB proteins have been found to participate in secondary metabolism processes, such as the biosynthesis of proanthocyanidins, anthocyanins, flavonols, and flavonoids in plants. These metabolites directly affect the color of flowers and fruits, so some MYB TFs are involved in flower color development. In this study, we identified a number of CnMYB genes that had higher expression levels in flower bud tissue are higher than in tubular flower and tongue flower tissues (Table S7). These results indicate that most CnMYB were involved in the flower bud development. The combined genes’ higher expression in flower tissues of transcriptomic data and phylogenetic tree analysis showed that CnMYB279, CnMYB288, CnMYB157, CnMYB9, CnMYB152, and CnMYB219 TFs may be involved in the regulation of flowering time, anther, and pollen development (Fig. S2). CnMYB175, CnMYB93, CnMYB229, CnMYB8, CnMYB106, CnMYB39, CnMYB21, CnMYB127, CnMYB47, and CnMYB183 TFs may participate in the regulation of flower color (Fig.6)."}, {"passage_id": "Discuss.p0006", "text": "Numerous prior investigations have documented the crucial involvement of MYB TFs in the Arabidopsis stress response, particularly in response to abiotic stressors. Secondary Phenylpropanoid metabolites have been widely documented as defense metabolites for their role as antioxidants in protecting plants from abiotic stressors by scavenging reactive oxygen species. In this study, we integrated stress response and phenylpropanoid secondary metabolite proteins with CnMYB proteins to build a phylogenetic tree (Fig. 6). We selected 51 CnMYB proteins that may be involved in abiotic stress response in C. nankingense based on their similarities."}, {"passage_id": "Discuss.p0007", "text": "Analysis of cis-elements on gene promoters is very important because it allows predicting the functional role of the genes. A large number of cis-acting regulatory elements were obtained from these 51 CnMYB genes promoter (Fig. 7), including MYC recognition site, WRKY recognition site, MYB recognition site, MYB binding site involved in drought-inducibility (MBS), MYB binding site involved in the flavonoid biosynthetic genes regulation (MBSI), low-temperature responsiveness (LTR), abscisic acid responsiveness (ABRE), anaerobic induction site (ARE), MeJA responsiveness (TGACG-motif and CGTCA-motif), defense and stress responsiveness (TC-rich repeats) that are known to involve in various plant development and stress response functioning. The combined phylogenetic tree and stress-related cis-elements analysis would help us in selecting stress response candidate genes."}, {"passage_id": "Discuss.p0008", "text": "To further validate the stress-related candidate genes, we determined the expression patterns of 18 genes from 51 candidate CnMYB genes under drought and salt stresses by analyzing qRT-PCR. Eighteen CnMYB genes expressed differently at different time points, these patterns are similar to AtMYB genes in Arabidopsis under drought and salt stresses (Fig. 6). We focused on moderately and highly expressed genes. Among them, CnMYB127 clustered with Arabidopsis AtMYB4 and AtMYB7, indicating that CnMYB127 can negatively regulate abiotic stress. CnMYB11, CnMYB186, CnMYB199, and CnMYB149, as AtMYB60 homologs; AtMYB88, and AtMYB124, as CnMYB109 homolog; CnMYB219, CnMYB9, and CnMYB152, as AtMYB77 homologs; AtMYB13, and AtMYB15, as CnMYB172 homologs; AtMYB33 as CnMYB157 homolog, can positively regulate some abiotic stress. These 18 genes were randomly selected from 51 stress-resistant candidate genes and the stress-resistant functions of the other 33 genes need to be further verified, but the stress resistance of these 18 genes has demonstrated the accuracy of our predicted stress-resistant candidate genes."}, {"passage_id": "Discuss.p0009", "text": "There are many reports on MYB TFs’ regulation of abiotic stress in the plant, but its link with epigenetic control is rarely reported. As CG or CpG is the most abundant source of DNA methylation, methylation-sensitive amplification polymorphism and methylation-specific PCR (MSP) are two methods that have been applied to methylated genes. Here we have identified 44 genes that may alter the epigenetic makeup of chrysanthemum by having high CpG content in the promoter and gene body regions (Fig. 1, Table S2). Four of the 51 stress response candidate genes had CpG islands, among them, CnMYB219, CnMYB9, and CnMYB152 were identified on the basis of methylation-specific PCR (MSP) results (Fig. 6, Fig. S5). These three genes can regulate gene expression and may play a role in drought and salt stresses, as their expression significantly changed under stress conditions (Fig. 8). We only examined three brief treatment intervals to identify methylation; it would be preferable to investigate the methylation status over a wider range of treatment times in the future. Our future research will focus on the regulation of flower development and drought and salt stress functional candidate genes."}], "Conclusion": [{"passage_id": "Concl.p0002", "text": "In this study, 324 MYB genes were identified in the genome of C. nankingense. A comprehensive bioinformatics analyses were performed to investigate phylogenetic relationships, conserved motifs, gene structure, and promoter analysis. The present study investigated the expression patterns of these genes in different tissues by analyzing RNA-Seq data. CnMYB226, CnMYB180, and CnMYB76 genes were selected to further explore the regulation of cellulose and lignin synthesis in stem tissue. The regulation of flowering time, anthers development, pollen formation, and flower colors may be mediated by 16 MYB genes. We found 51 candidate genes by bioinformatics analysis that may be involved in stress resistance, and we also confirmed 18 of these candidate genes through qRT-PCR. According to gene expression levels under stress conditions, six CnMYB genes were identified as key stress-responsive genes. The information provided by these results may be helpful for further functional analysis of CnMYB gene to elucidate its development and abiotic stress mechanism in C. nankingense."}]}}, {"pmcid": "PMC10014550", "title": "Weighted gene co-expression network analysis revealed the key pathways and hub genes of potassium regulating cotton root adaptation to salt stress", "source_file": "PMC10014550.json", "source_url": "https://pmc.ncbi.nlm.nih.gov/articles/PMC10014550/", "included_counts": {"Abstract": 1, "Introduction": 5, "Discussion": 8, "Conclusion": 1}, "omitted_results_discussion": false, "sections": {"Abstract": [{"passage_id": "Abstract.p0001", "text": "Soil salinization is one of the main abiotic stresses affecting cotton yield and planting area. Potassium application has been proven to be an important strategy to reduce salt damage in agricultural production. However, the mechanism of potassium regulating the salt adaptability of cotton has not been fully elucidated. In the present research, the appropriate potassium application rate for alleviating salt damage of cotton based on different K+/Na+ ratios we screened, and a gene co-expression network based on weighted gene co-expression network analysis (WGCNA) using the transcriptome data sets treated with CK (0 mM NaCl), S (150 mM NaCl), and SK8 (150 mM NaCl + 9.38 mM K2SO4) was constructed. In this study, four key modules that are highly related to potassium regulation of cotton salt tolerance were identified, and the mitogen-activated protein kinase (MAPK) signaling pathway, tricarboxylic acid (TCA) cycle and glutathione metabolism pathway were identified as the key biological processes and metabolic pathways for potassium to improve cotton root salt adaptability. In addition, 21 hub genes and 120 key candidate genes were identified in this study, suggesting that they may play an important role in the enhancement of salt adaptability of cotton by potassium. The key modules, key biological pathways and hub genes discovered in this study will provide a new understanding of the molecular mechanism of potassium enhancing salinity adaptability in cotton, and lay a theoretical foundation for the improvement and innovation of high-quality cotton germplasm."}], "Introduction": [{"passage_id": "Introduction.p0002", "text": "Soil salinization seriously threatens the sustainable development of global agriculture and ecological balance, leading to the shortage of food and bioenergy, and has become one of the serious environmental challenges that cannot be ignored. Currently, more than 1.125 billion hectares of land worldwide have been affected by salinity, and about 4.03 billion people have been threatened by crop cultivation due to soil salinity. Therefore, promoting the development and utilization of saline-alkali land is of great practical significance for implementing sustainable development strategy and ensuring stable agricultural production."}, {"passage_id": "Introduction.p0003", "text": "Cotton (Gossypium hirsutum L.) is not only an important fiber crop and oil crop but also a raw material for the textile and fine chemical industry, which occupies a pivotal position in world economic development. The salt tolerance threshold of cotton is 7.7 dS m-1, which is considered as a pioneer crop for saline alkali land improvement. However, the increasing salt stress has seriously threatened the growth, yield and fiber quality of cotton, and hindered the sustainable production of cotton worldwide. Given that Na+ and K+ have similar ionic structural characteristics, a large number of Na+ will compete for the binding sites of K+ under salt stress, leading to K+ deficiency. Therefore, appropriate increased application of potassium fertilizer is one of the important strategies to reduce salt damage. Contemporary studies have shown that the application of appropriate doses of potassium (K) can improve the resistance of plants to high salinity. K+ has been proved to alleviates the negative effects of salt stress by balancing ion homeostasis, controlling osmotic balance and scavenging reactive oxygen species (ROS). Understanding the response and defense mechanism of cotton to salinity and exploring the key genes of potassium regulating cotton salt adaptability can provide theoretical support for optimizing cotton salt-tolerant variety breeding and improving cotton production efficiency."}, {"passage_id": "Introduction.p0004", "text": "Stress adaptation in plants is the result of the synergistic effects of multiple genes and metabolic pathways. Therefore, identifying plant salt tolerance genes and mining good crop resources at the whole genome level is a key step to improve plant salt tolerance. Several salt tolerance genes have been verified to regulate gene transcription, signal transduction and metabolic processes in plants. However, so far, the achievements in the cultivation of plant salt-tolerant varieties are still very limited. There are still many genes with high potential that have not been discovered in the regulation of salt tolerance in cotton. The popularity of sequencing technology has generated massive omics data, which have been applied to the research of cotton stress resistance. As a kind of molecular biological network, weighted gene co-expression network analysis (WGCNA) has been widely used in constructing gene interaction relationships, identifying key regulatory genes and predicting the function of unknown genes. Based on WGCNA, previous studies on the salt tolerance response of cotton, maize (Zea mays L.), rice (Oryza sativa L.), wheat (Triticum aestivum L.), Arabidopsis (Arabidopsis thaliana), bermudagrass (Cynodon dactylon (L.) Pers.) and green halophytic microalgae (Dunaliella salina) were conducted, and the key regulatory pathways and hub genes of salt adaptation in plants were identified, which provided useful information for further exploration of the transcriptional regulation mechanism of salt tolerance in plants."}, {"passage_id": "Introduction.p0005", "text": "The root is the initial and most sensitive organ to sense salt damage in plants, and is also an ideal target to study the molecular mechanism of salt tolerance in plants. To date, some salt-responsive transcriptome studies have been conducted in cotton roots. However, there are relatively few reports on the transcriptional regulation of potassium on cotton root adaptation to salt stress. How potassium improves salt tolerance of cotton through transcriptional regulation and what key regulatory factors in this process have not been clearly explained. However, salt adaptation of plants is a complex quantitative trait controlled by multiple genes, and the screening of hub genes regulating salt tolerance has always been an important challenge in cotton genetics and breeding."}, {"passage_id": "Introduction.p0006", "text": "Here, we carried out WGCNA based on a gene data set obtained from RNA-Seq to explore the key functional modules and biological metabolic pathways of potassium regulating cotton root adaptation to salt stress, identify the salt stress response hub genes and candidate genes, understand the molecular mechanisms of potassium improving cotton salt adaptability, and provide insights for the breeding of salt-tolerant cotton varieties."}], "Discussion": [{"passage_id": "Discuss.p0002", "text": "WGCNA is a key strategy to reveal the mechanism by which potassium regulates salt adaptation in cotton"}, {"passage_id": "Discuss.p0003", "text": "Cotton is one of the pioneer crops widely planted in saline-alkali areas, providing daily necessities such as natural fiber, plant protein and edible oil. However, the expansion and long-term development of saline soil has directly threatened the productivity of crops, including cotton. Increasing the application of potassium fertilizer has been proven to be an important strategy to enhance the resistance of crops to stress, but the regulatory mechanism by which potassium fertilizer improves the adaptation of cotton roots to salt stress has not been fully explained. In recent years, the transcriptome has opened a new door for analysing and revealing the molecular mechanisms and biological processes of plant abiotic stress responses. However, how to effectively mine and utilize the massive data obtained by RNA-Seq has always been a thorny problem for scientists. Differential expression analysis technology focusing on a single gene often misses a large amount of effective information. Therefore, WGCNA based on the overall gene expression patterns was proposed. Currently, combinatorial analysis of RNA-Seq and WGCNA has emerged as a method to discover key genes and interactions that may be related to stress function. In this study, WGCNA was used to analyse the effective statistics and bioinformatics of an RNA-Seq data set, and the regulatory mechanism of potassium on the cotton root response to salt stress was analysed from the global gene expression pattern. By screening the transcriptome data of cotton roots treated with CK, S and SK8 for 1, 6, 12 and 24 h, 24395 high-quality genes were obtained and divided into 20 co-expression modules. Four key modules, Cyan, Coral2, Blue and Darkorange2, which are highly related to potassium regulation of cotton salt tolerance, were identified according to the expression pattern of module genes. Furthermore, KEGG Pathway enrichment analysis showed that the plant MAPK signaling pathway and phenylpropane biosynthesis pathway in the Cyan module, the plant MAPK signaling pathway in the Coral2 module, the glutathione metabolism pathway in Darkorange2 module and the tricarboxylic acid cycle (TCA cycle) pathway in the Blue module were the key pathways in the above modules. At the same time, 21 hub genes and 120 candidate genes highly associated with hub genes were selected from key modules. It is speculated that these genes may be the dominant factors regulating the adaptation of cotton to salt stress."}, {"passage_id": "Discuss.p0004", "text": "Potassium enhances the salinity tolerance of cotton by regulating the MAPK signaling pathway"}, {"passage_id": "Discuss.p0005", "text": "Plant salt tolerance is achieved through the combination of cellular, molecular and physiological metabolic reactions. Therefore, it is necessary to take measures to explore and improve the key components of salt tolerance regulation. Plants activate a complex set of signaling pathways in response to various abiotic threats. Among them, the MAPK signaling pathway is an important mechanism for plants to respond to external stimuli (. MAPKs are a group of intracellular signal transduction factors that transduces extracellular stimulation signals into plant cells through three-layers protein kinases, namely, MAPK kinase kinase (MAPKKKs), MAPK kinase (MAPKKs) and MAPKs. Activation of MAPK elements and downstream genes may affect plant stress resistance. In the present study, the MAPK signaling pathway was significantly enriched in the Cyan and Coral2 modules, and hub genes related to abscisic acid receptor (PYL)-, protein phosphatase (PP2C)-, serine/threonine protein kinase (SnRK2)-, and protein kinase kinase kinase (MAPKKK17/18) were up-regulated by salt stress. In contrast, potassium treatment down-regulated the expression of these genes. There has been evidence that the combination ABA and PYL can alleviate the inhibition of SnRK2 by PP2C, activate SnRK2, induce plant stress response, and participate in the downstream MAPK signaling pathway. The expression of all MAPKs in chickpea was significantly increased under abiotic stress. Moreover, overexpression of OsMAPK33 reduced the tolerance of rice to salt stress. These evidence indicated that MAPKs played a negative regulatory role in plant resistance to abiotic stress. Consistent with previous conclusions, this study found that salt stress activated the expression of key elements in MAPK signaling pathway, while potassium application reversed the activation effect by reducing the expression of MAPKs and maintaining the stability of MAPK signal transduction system, which may be one of the possible reasons why potassium alleviates salt damage in cotton."}, {"passage_id": "Discuss.p0006", "text": "Potassium improved the salt tolerance of cotton by promoting the TCA cycle"}, {"passage_id": "Discuss.p0007", "text": "Increasing the energy produced by respiration is one of the survival strategies for plants to adapt to various stress environments, such as glycolysis, amino acid metabolism, and the TCA cycle.. In plants, the TCA cycle is a pivotal link between energy metabolism with carbon and nitrogen metabolism, providing adenosine triphosphate (ATP) and reducing agents for ion efflux, osmotic agent synthesis and reactive oxygen species removal. Citric acid, aconitic acid, α-ketobutyric acid, fumaric acid and malic acid are the main intermediates in the TCA cycle and important mediators of material metabolism and energy transformation. Previous studies have shown that salinity inhibits the activities of photosynthetic carbon metabolism and the TCA cycle. Salt stress resulted in decreased concentrations of most intermediates associated with the TCA cycle in maize hybrids and Karelinia caspia. The researchers suggest that maintaining the TCA cycle helps plants survive stress conditions such as high temperature, drought and salt stress. Salt-tolerant soybean varieties have higher amino acid accumulation rate and faster TCA cycle activity. Some scholars also pointed out that wild soybean promoted its energy metabolism and intermediate metabolite levels under salt-alkali stress by increasing TCA cycle activity, thus enhancing salt tolerance. In the present research, the TCA cycle was enriched in the Blue module, where the hub genes encoding ATP-citrate synthase ACLY, succinate dehydrogenase SDH, malate dehydrogenase MDH and succinyl CoA ligase SCUD were significantly down-regulated by salt stress, but significantly up-regulated after potassium application. The above results indicated that salt stress negatively regulated the TCA cycle in cotton roots, while potassium application activated the activity of the TCA cycle, which provided more carbon source and energy for the root response to salt stress, accelerated the physiological and metabolic response, and further enhanced the adaptability of cotton to salt stress."}, {"passage_id": "Discuss.p0008", "text": "Potassium enhanced the salt tolerance of cotton by activating glutathione metabolism"}, {"passage_id": "Discuss.p0009", "text": "Many inducible genes have been studied in plants under abiotic stress, including transcription factors, protein kinases and cytoprotective enzymes. Glutathione S-transferases (GSTs) are a group of multifunctional protective cellular enzymes that reduce ROS production by catalyzing the binding reactions of glutathione to various cytotoxic substrates. The expression and activity of GST genes were positively correlated with plant stress resistance. Several previous studies have identified the important role of GSTs in plant stress resistance. For example, transgenic plants that overexpressing GST improved the drought tolerance of Arabidopsis thaliana by enhancing ROS scavenging ability. CsGSTU8 plays a positive role in drought resistance of camellia. Overexpression of GSTs in tobacco and rice increased the resistance of transgenic plants to high temperature, low temperature and salt concentration. reported that overexpression of OsGSTL2 enhanced plant resistance to cold, osmotic stress and salinity stress. Our results showed that the glutathione metabolism pathway was significantly enriched in the Darkorange2 module. Five hub genes in this pathway all encoded glutathione S-transferase GST, and were down-regulated by salt stress but up-regulated by potassium application treatment. Enhanced stress capacity is accompanied by up-regulation of antioxidant genes and increased activity of antioxidant enzymes such as GSTs. The results of this study indicated that salt stress negatively regulated glutathione metabolism of cotton roots, which may lead to the outbreak of ROS in roots, resulting in salt damage. Potassium application increased the expression of GST gene, accelerated the clearance of ROS, improved the salt tolerance of cotton, and reduced the occurrence of salt damage. This conclusion was consistent with previous reports in tobacco and soybean."}], "Conclusion": [{"passage_id": "Concl.p0002", "text": "To sum up, in this study, the appropriate potassium application rate to alleviate salt damage of cotton was selected based on different K+/Na+ ratios, and a gene co-expression network based on WGCNA were constructed using the transcriptome data sets treated with CK, S, and SK8. The highlight of this study was to screen the key modules and hub genes of potassium to improve the salt adaptability of cotton roots based on the global gene expression. We proposed a hypothetical model to explain the regulatory mechanism of potassium on cotton root adaptation to salt stress ( Figure 9 ). Network analysis showed that the MAPK cascade signaling pathway, TCA cycle and glutathione metabolism pathway were the key biological pathways for potassium to improve salt adaptability in cotton roots. In this study, 21 key genes and 120 key candidate genes were identified based on gene connectivity, which may be potential targets for potassium regulation of salt tolerance in cotton. Although the results of this study have some limitations, further experimental studies are needed to verify its function in regulating salt adaptation. However, these results provide reliable guidance for further research on the molecular mechanism and the digging of key genes of potassium promoting salinity adaptability in cotton and other plants."}]}}, {"pmcid": "PMC10014554", "title": "Genome-wide analysis of the laccase (LAC) gene family in Aeluropus littoralis: A focus on identification, evolution and expression patterns in response to abiotic stresses and ABA treatment", "source_file": "PMC10014554.json", "source_url": "https://pmc.ncbi.nlm.nih.gov/articles/PMC10014554/", "included_counts": {"Abstract": 1, "Introduction": 3, "Discussion": 3, "Conclusion": 1}, "omitted_results_discussion": false, "sections": {"Abstract": [{"passage_id": "Abstract.p0001", "text": "Laccases are plant enzymes with essential functions during growth and development. These monophenoloxidases are involved in lignin polymerization, and their expression respond to environmental stress. However, studies of laccases in some plants and fungi have highlighted that many structural and functional aspects of these genes are still unknown. Here, the laccase gene family in Aeluropus littoralis (AlLAC) is described based on sequence structure and expression patterns under abiotic stresses and ABA treatment. Fifteen non-redundant AlLACs were identified from the A. littoralis genome, which showed differences in physicochemical characteristics and gene structure. Based on phylogenetic analysis, AlLACs and their orthologues were classified into five groups. A close evolutionary relationship was observed between LAC gene family members in rice and A. littoralis. According to the interaction network, AlLACs interact more with proteins involved in biological processes such as iron incorporation into the metallo-sulfur cluster, lignin catabolism, regulation of the symbiotic process and plant-type primary cell wall biogenesis. Gene expression analysis of selected AlLACs using real-time RT (reverse transcription)-PCR revealed that AlLACs are induced in response to abiotic stresses such as cold, salt, and osmotic stress, as well as ABA treatment. Moreover, AlLACs showed differential expression patterns in shoot and root tissues. Our findings indicate that AlLACs are preferentially involved in the late response of A. littoralis to abiotic stress."}], "Introduction": [{"passage_id": "Introduction.p0002", "text": "Laccases (EC 1.10.3.2), named after their presence in the Japanese lacquer tree (Toxicodendron vernicifluum), are multi-copper oxidases (LMCOs). These enzymes are involved in catalyzing the oxidation of one electron of various cellular compounds such as arylamines, phenols, and aromatic thiols. Members of the multi-copper oxidases superfamily include ceruloplasmin, nitrite reductase, ascorbate oxidase, and ferroxidase. Laccases have been identified in many organisms, including plants, fungi, insects, and bacteria, and are involved in a wide range of cellular processes. Plant laccases are copper-containing glycoproteins that act as key regulators for lignin polymerization and deposition in the plant cell wall. Laccases contain three conserved copper (Cu)-oxidase domains, which can be used to identify laccase family members. Due to their importance, members of this gene family have been identified and analyzed in plants, including Lolium perenne, Oryza Sativa, Sorghum bicolor, Arabidopsis thaliana, Brachypodium distachyon, Zea mays, Setaria viridis , Brassica napus, Gossypium arboretum, Saccharum officinarum, Eucalyptus grandis and Pyrus bretschneideri."}, {"passage_id": "Introduction.p0003", "text": "According to previous studies, laccases can be involved in various cellular processes. For instance, Liu and coworkers, reported that laccases are mostly induced in the early development stage of rice seedlings, and Simões and coworkers, showed that laccases from Setaria viridis are potentially involved in monolignol oxidation. Moreover, the study of laccases in loblolly pine revealed that these genes are expressed mainly in immature secondary xylem, the tissue for synthesized lignin. Lignin is critical in increasing plant vigor and resistance to biotic and abiotic stresses. Accordingly, the lignin content in the mutant line for laccases genes, LAC17 and LAC14, in Arabidopsis was decreased compared to wild-type lines, suggesting that laccases are involved in lignin polymerization and decomposition. Also the involvement of laccases in Cleome seed coat lignification was described. Other roles have also been suggested for laccases in plants, highlighting that the members of this gene family are involved in responding to environmental stresses. For instance, the overexpression of OsChI1, a laccase gene from rice, sharply increased the salt and drought tolerance in transgenic Arabidopsis. In addition, copper tolerance was improved in Arabidopsis transgenic lines for the overexpressed OsLAC10, a laccase10 gene from rice. Similarly, Cai and coworkers reported that the laccase2 gene in Arabidopsis is involved in response to abiotic stresses such as drought, and Xu et al. showed that laccase genes are induced by abiotic stresses such as low/high temperature, drought, and hormone application (ABA, MeJA, and SA) in citrus. Based on their broad substrate spectrum and ability to depolymerize lignin, laccases moved into the focus of current research. Furthermore they became of economic importance due to their use as bioactive component of ascorbic acid (vitamin C) sensors."}, {"passage_id": "Introduction.p0004", "text": "Aeluropus littoralis is a halophyte monocot model that can grow under salt and drought conditions. A. littoralis does not have the ability to be cultivated, but as a valuable source of resistance genes, it can be used in breeding and genetic engineering programs. The genomic resources for A. littoralis provide the opportunity to identify the key genes and molecular mechanisms of response to abiotic stresses. Motivated by the importance of laccase genes in increasing the resistance of plants against environmental conditions, the present study analyzed the sequence structure of laccase genes as well as their regulatory systems. In addition, the expression pattern of these genes in response to environmental stress and ABA hormone was investigated in root and shoot tissues."}], "Discussion": [{"passage_id": "Discuss.p0002", "text": "Laccases have important roles such as lignin polymerization in plants, and also contribute to resistance to environmental stresses. Enzymes of this gene family moved into focus due to their ability to catalyze steps in bio-economy and their utilization as biosensors. Thus far, laccases have not been studied in Aeluropus littoralis, a model plant that is highly resistant to salinity stress. A. littoralis has a high potential in the field of resistance to abiotic stresses and serves to identify and isolate new stress-adapted genes. In the current study, 15 AlLACs were identified from the A. littoralis genome. Previous studies have identified 30 LACs from rice, 40 LACs from the pear genome, 52 LACs from the Setaria viridis genome, 54 LACs from the Eucalyptus grandis genome, 29 LACs from the Brachypodium distachyon genome, 17 LACs from the Arabidopsis thaliana genome, and 27 LACs from the Sorghum bicolor genome. The lower number of laccase genes found here suggests that the laccase gene family is probably less extended in A. littoralis during evolutionary processes. Based on their physicochemical characteristics and gene structure, AlLACs were diverse, indicating that the members of this gene family are involved in various cellular processes. Intron/exon number was also diverse among AlLACs. It was stated that the number of exons/introns can affect the expression levels; genes with fewer exons can be rapidly activated. According to phylogenetic analysis, LAC gene family members from A. littoralis, Arabidopsis, and rice were grouped into five classes, and a close evolutionary process was observed between AlLACs and their orthologues in rice. This finding suggests that mutations have occurred in coding sequence regions after the divergence between dicots and monocots. In addition, the distribution of conserved motifs might be associated with the diversity and function of genes from a family. Some conserved motifs were observed in the extra-domain site – these regions can be used to identify AlLACs and their role of these proteins in stress response."}, {"passage_id": "Discuss.p0003", "text": "AlLACs also showed diverse 3D structures. Leucine, proline, valine, phenylalanine, glycine, and alanine were identified as the amino acids that affect the interaction and function of AlLACs. The interaction network for AlLAC proteins based on their orthologues in the model plant, Arabidopsis, suggested that laccases are probably involved in diverse cellular processes related to cellulose synthase activity and oxidoreductase activity, including iron incorporation into metallo-sulfur cluster, lignin catabolism, regulation of symbiotic processes, plant-type primary cell wall biogenesis, and L-ascorbic acid biosynthesis. Previous studies have also stated that laccases are associated with processes related to plant cell wall components. Notably, the weak interaction between the laccases indicates that they likely work in independent pathways."}, {"passage_id": "Discuss.p0004", "text": "Several classes of cis-acting elements related to response to hormones, light, abiotic and biotic stresses, growth and development processes were identified upstream of AlLAC genes, suggesting that the members of this gene family have multifunctional roles in A. littoralis. We investigated the expression profile of five AlLAC genes in response to ABA and PEG application, cold, and salt stress using qRT-PCR. Notably, AlLACs showed differential expression patterns in shoot and root tissues, indicating that these genes have different functions. Our findings demonstrated that AlLAC14 is more induced in shoot tissues after 48 hours of exposure to stresses, however further molecular functional studies of this gene are recommended. In addition, the selected AlLAC genes were upregulated in response to application of ABA hormone, a stress-dependent regulator that many signaling pathways use in response to adverse environmental conditions. The induction of AlLAC genes after 48 hours of ABA application raises that these genes probably have some interaction with signaling pathway related to ABA. Furthermore, the selected AlLAC genes illustrated diverse expression in response to abiotic stresses, including cold, salt, and osmotic stress. Interestingly, these AlLACs were induced after 48 hours of exposure to stress conditions, revealing that AlLACs are associated with late response pathways of A. littoralis. Several studies have mentioned the role of laccases in the process of lignification. Laccases involves in lignin polymerization and can affects the lignin synthesis. Lignin is a component of plant cell walls that plays an important role in increasing the resistance and strength of plants. Besides, it was reported that LACs can be regulated by transcription factor MYB and be induced by abiotic stresses. Our results suggest that laccases are involved in response to adverse conditions from direct and indirect pathways in A. littoralis."}], "Conclusion": [{"passage_id": "Concl.p0002", "text": "The present study identified 15 AlLACs in the Aeluropus littoralis genome, which formed five groups based on phylogenetic analysis. AlLACs showed high diversity in structure and physicochemical properties, suggesting that these gene family members were influenced by evolutionary pressure. Various cis-regulatory elements were observed upstream of AlLACs, revealing that AlLACs are involved in different cell signaling pathways. Moreover, AlLACs showed tissue-specific expression, suggesting that AlLAC genes might be associated with growth and development processes. All of the selected AlLAC genes were induced in response to salt, osmotic, and cold stress, indicating that they can play a role in increasing the tolerance to adverse conditions."}]}}, {"pmcid": "PMC10014838", "title": "Subsurface aeration mitigates organic material mulching-induced anaerobic stress via regulating hormone signaling in Phyllostachys praecox roots", "source_file": "PMC10014838.json", "source_url": "https://pmc.ncbi.nlm.nih.gov/articles/PMC10014838/", "included_counts": {"Abstract": 1, "Introduction": 5, "Discussion": 11, "Conclusion": 1}, "omitted_results_discussion": false, "sections": {"Abstract": [{"passage_id": "Abstract.p0001", "text": "Organic material mulching has been used extensively to allow Phyllostachys praecox to promote growth and development of shoots. However, the bamboo forest always showed a significant degradation, probably due to anaerobic damage caused by the mulching after several years. Therefore, we have innovatively proposed an improvement measure to aerate the underground pipes for the first time. We investigated the role of subsurface pipe aeration in regulating root hypoxia to reduce the stress and to identify the degradation mechanism. Results showed that aeration increased oxygen concentration, shoot yield and root growth compared with mulching, and the aeration enhanced the concentration of indole-3-acetic acid (IAA) and the expression of Aux/IAAs (Aux1, Aux2, Aux3, and Aux4). Aeration reduced gibberellin (GA), ethylene (ETH), and abscisic acid (ABA) contents as well as anaerobic enzyme activities (alanine transaminase, AlaAT; alcohol dehydrogenase, ADH; pyruvate decarboxylase, PDC; and lactate dehydrogenase, LDH), which alleviated root damage in anoxic conditions. Furthermore, correlation showed that the activities of ADH, LDH, PDC, and AlaAT showed significant linear correlations with soil oxygen levels. RDA analyses showed that ABA, IAA, and ETH were found as the key driving hormones of Aux/IAAs in the root of the forest mulched with organic material. Here we show that subsurface aeration increases soil oxygen concentration, shoot yield, root growth and regulates phytohormone concentrations and Aux/IAAs expression, which reduces anaerobic enzyme activities. Consequently, subsurface pipe aeration is an effective measure to mitigate the degradation of bamboo forests caused by soil hypoxia that results from organic material mulching."}], "Introduction": [{"passage_id": "Introduction.p0002", "text": "Phyllostachys praecox f. preveynalis is a bamboo species in the family Gramineae that is widespread in southern of China. The shoots of P. praecox are known as “the best bamboo shoots in China” because of their delicious taste, early season harvesting, high yield, and economic impact. The most effective way to obtain greater benefits is to mulch the bamboo forest with organic material in winter, which allows the farmer to harvest the shoots in the March earlier than expected. However, after 3-4 years of continuous mulch management, the P. praecox forest will inevitably experience an overall decline, resulting from degradation of the underground rhizome system, reductions in bamboo shoot production and quality, and flowering of the bamboo. According to prior studies, organic material mulching is the critical factor in the forest degradation since the fermentation of organic matter increased the temperature, blocked air exchange, and depleted the oxygen in the rhizosphere soil, resulting a low oxygen environment. Therefore, figuring out how to improve soil oxygen is the key to alleviating the bamboo degradation during the mulching period. Most of the methods currently used to alleviate root hypoxia are chemical methods that involve adding calcium peroxide (CaO2) or magnesium peroxide (MgO2), or quick release formulations like hydrogen peroxide (H2O2) or carbamide peroxide (CH4N2O·H2O2), which largely changes the soil structure and the original living environment of the plants. Other methods require manually inserting tubes into the soil to increase soil oxygen levels, which is time-consuming and labor-intensive. Therefore, we devised a method using subsurface pipe aeration to investigate whether it could effectively increase oxygen levels in the root zone, improve plant physiological and biochemical performance, and thus mitigate degradation of the bamboo forest."}, {"passage_id": "Introduction.p0003", "text": "Hypoxic stress occurs frequently in nature (b). In order to survive, cells switch from aerobic respiration to anaerobic fermentation, generating harmful metabolites including lactic acid, acetaldehyde, and ethanol (c). Ethanol and lactic acid fermentation are the two primary metabolic routes for energy production under hypoxic conditions. The pyruvate content then increases, and the anaerobic enzymes alanine aminotransferase (AlaAT), pyruvate decarboxylase (PDC), alcohol dehydrogenase (ADH), and lactate dehydrogenase (LDH), are produced in these “hypoxic” cells. PDC and ADH catalyse the conversion of pyruvate PDC and ADH to ethanol, followed by the conversion of pyruvate to lactate by LDH and the simultaneous oxidation of NADH to NAD+. The reversible interconversion of alanine and 2-ketoglutarate to pyruvate and glutamate is catalyzed by AlaAT in the presence of higher pyruvate concentrations. found that ADH and PDC activities increased in roots of cucumber under anaerobic condition. In Arabidopsis and Medicago truncatula, LDH and AlaAT fermentation are enhanced in anoxic and hypoxic cells. Plant tolerance to hypoxia stress can be improved by increasing anaerobic enzyme activity. Therefore, anaerobic enzyme activity is also an important indicator."}, {"passage_id": "Introduction.p0004", "text": "Plant hormones including gibberellin (GA), abscisic acid (ABA), ethylene (ETH) and the growth hormone, indoleacetic acid (IAA), interact with each other to regulate biochemical and physiological processes. Ethylene is the most sensitive hormone under hypoxic stress. Under anoxic conditions such as flooding, ethylene production is induced in the plant, which to some extent stimulates the formation of adventitious roots and air chambers, creating favorable conditions for nutrient and water uptake as well as oxygen input. Moreover, ethylene alleviates the toxic effects of secondary metabolites. The precursor of ETH, 1-aminocyclopropane-1-carboxylate (ACC), is formed by the action of ACC synthase (ACS) using methionine as the substrate, and ETH is then formed by the reactions catalyzed of ACC oxidase (ACO) with molecular oxygen as the coenzyme. ACO and ACS are important rate-limiting steps in ETH synthesis. In addition, GA has been shown to stimulate seed germination and root elongation, while ABA is a potent inhibitor of GA activity. ETH promotes elongation plant development and adventitious root production by managing the dynamic stability of ABA and GA concentration to expand the contact area of plants with air for more oxygen. Plant growth hormones known as auxins, such as IAA, increase root initiation and postpone plant senescence. found interaction between IAA and other hormonal signals during stress adaptation, which might be mediated by changes in plant growth and development. In addition, it was also found that the high IAA/ABA ratio is associated to the activity of rhizome buds in P. praecox. suggest that there are improvements in IAA, GA3, and Zeatine while a reduction in ABA under mulch + fertilizers. These findings suggest that endogenous hormones are vital in the formation of bamboo roots. The key hormonal changes that lead to bamboo forest degradation after long-term mulching with organic materials and the relationship between them are poorly studied and deserve further investigation."}, {"passage_id": "Introduction.p0005", "text": "Auxin/indole-3-acetic acid (Aux/IAA) proteins are transcription factors (TFs) that control auxin-responsive gene expression during plant development. Aux/IAA family member genes are often homologous in the same plant; for example, SlIAA2, SlIAA13, SlIAA15, SlIAA16, and SlIAA20 genes in tomato are functionally similar and are significantly expressed during root development. Other studies have also found specificity in Aux/IAA gene functions, such as the expression of AetIAA3, AetIAA11, and AetIAA26 in Aegilops tauschii, which are tissue-specific genes that are expressed specifically in pistils, seeds, and roots, respectively. The majority members of the Aux/IAA TF family have been associated with lateral root growth. For example, the AtIAA14 gene controls lateral root development in Arabidopsis. In wheat, TaIAA1 regulates the development of important organs such as roots and tillers, and also flowering and leaf patterns. In addition, there is also crosstalk between the Aux/IAA family and ethylene, and it thus regulates plant growth. According to, ETH modifies alkaline stress-mediated root development inhibition by increasing the expression of Aux1 and auxin-related genes, which enhances auxin accumulation. So yet, only four members of the Auxin family, Aux1, Aux2, Aux3, and Aux4, have been discovered in P. praecox. Whether the Aux/IAA gene family has crosstalk with GA and/or ABA to regulate root growth is still unknown for the organic material mulching system used in P. praecox."}, {"passage_id": "Introduction.p0006", "text": "In this study, the effects of subsurface pipe aeration on soil oxygen and root physiology and biochemistry of a P. praecox forest under organic material mulching were investigated. The aims of the study were to examine the hypotheses: aeration improves the soil condition and associated physiological and biochemical properties of bamboo forests. The obtained evidences are expected to provide a new direction for the sustainable cultivation of bamboo forests."}], "Discussion": [{"passage_id": "Discuss.p0002", "text": "Aeration improved soil condition and bamboo growth under mulching"}, {"passage_id": "Discuss.p0003", "text": "In natural environments, soil hypoxia is caused by factors such as heavy rainfall, poor soil structure, and little drainage, which generate unfavorable porosity and ventilation interactions in the soil, restricting root growth and crop output considerably. Nevertheless, when bamboo forest grove is mulched, the organic material heats and ferments. The aerobic microorganisms consume oxygen directly from the soil, and the thick mulching material stops ambient oxygen from entering the soil, which causes a lack of oxygen at the root level, unlike flooding and soil slumping. We discovered in the investigation that soil temperatures increased and soil oxygen concerntration decreased during the mulching period ( Figure 2A, B ; Table 2 ), which is in line with previous research findings. However, aeration significantly reduced soil temperature, increased oxygen content, diameter at breast height, shoot production and root growth, suggesting that soil aeration using buried pipes is effective in improving soil condition and bamboo growth. After removal of the mulch, soil oxygen concentrations recovered substantially but remained slightly lower than in the control. Also, soil temperatures did not differ significantly between the three treatments from June onwards. It is possible that mulching changed the soil microbial populations and soil structure, but after the organic material was removed, the soil repaired itself and gradually returned to the control level. Root growth is known to be limited by low soil oxygen availability. Hence, we found that mulching reduced root activity while aeration increased it. Also, it has stronger root activity in March than the other months ( Figure 2C ; Table 2 ). It is similar to previous research findings, suggested that root system’s breathing capacity varies seasonally, meaning that respiratory capacity peaks in spring and a respiratory minimum occurs in late summer. This tendency might be attributed to environmental pretreatment together with an overall genetic-based program to extend the length of root activity and reduce the root system’s carbon requirement."}, {"passage_id": "Discuss.p0004", "text": "Aeration changed anaerobic enzyme activity under mulching"}, {"passage_id": "Discuss.p0005", "text": "Pyruvate produced by glycolysis will undergo anaerobic respiration (also called fermentation) in plant cells once the oxygen content is low. The reversible conversion of alanine and 2-ketoglutarate to pyruvate and glutamate is catalyzed by AlaAT. Fermentation may be classified into two types: lactic acid fermentation, in which LDH is responsible for catalyzing the transformation of lactate to pyruvate then back, with the end product being lactate; and alcoholic fermentation, in which ADH catalyzes the acetaldehyde-to-ethanol conversion. PDC catalyzes the oxidative decarboxylation of pyruvate to acetyl-CoA and NADH, with carbon dioxide and ethanol as byproducts. Neither type of fermentation produces ATP molecules and both are detrimental to cell survival. Our results showed that the activities of PDC, LDH, AlaAT and ADH were significantly increased of bamboo root during the mulching period ( Figure 3A-D ; Table 2 ). This discovery is in line with the findings of. After the mulch was removed, anaerobic enzyme activity of mulching remained greater than in the control, but aeration drastically decreased anaerobic enzyme activity. It occurred because the mulching technique lowered soil oxygen concentration and enhanced anaerobic enzyme activity. There was a linear relationship between the activities of the anaerobic enzymes ADH, PDC, LDG, and AlaAT and soil oxygen concerntration ( Figure 6 ; Table 2 ). Extensive molecular and biochemical analyses revealed the mechanism behind these relationships. In hypoxic tissues in barley (Hordeum vulgare) and M. truncatula, AlaAT activity and gene expression are stimulated. Previous studies have shown that flood-tolerant plants accumulate alanine by activating AlaAT, and that the alanine is carried via the xylem and becomes a transportable energy source. AlaAT is essential for plant life not only in hypoxia, but also throughout the reoxygenation period following hypoxia. Additionally, when the oxygen content was inadequate in the root zone, the activities of LDH, PDC, and ADH, as well as the expression of the genes that encode these enzymes, were elevated in cucumber. Increased anaerobic enzyme activity may enhance plant tolerance to hypoxia. For example, plants of white clover with strong ADH activity, demonstrate better flood tolerance under flood stress than plants with weak ADH activity. Generally, subsurface buried pipe aeration reduced the anaerobic enzyme activity of bamboo roots caused by mulching with organic materials."}, {"passage_id": "Discuss.p0006", "text": "Aeration regulated hormone variation under mulching"}, {"passage_id": "Discuss.p0007", "text": "The levels of some phytohormones in P. praecox are highly susceptible to external environmental conditions, and the insulating effect of mulching disrupts the balance of endogenous hormones. Endogenous plant hormones, including IAA, GA, ABA, and ETH, are the “switches” that modulate and control plant growth. A previous study showed that lateral shoots at the base of bamboo plants had significantly higher IAA/ABA and ZT/ABA levels one year after mulching than did plants grown without mulching, thus promoting early differentiation of lateral shoots. However, this does not correspond with our experimental results, where we found significant increases in GA and ABA contents and a reduction in growth hormone content of roots treated with organic material mulch for consecutive years, and this was also found in degraded P. praecox stands ( Figure 4 ; Table 2 ). The ABA, GA, and cytokinin (CTK) contents of flowering bamboo in the degraded P. praecox forest were all higher than in unflowered bamboo, with the most significant increase being in ABA content. It might be because long-term mulching inhibited plant root growth, but the anoxic environment caused by mulching allowed the roots of bamboo to stretch towards soil surface to find more oxygen, thus increasing the contents of ABA, which promotes the formation of plant organ separation, and GA, which promotes cell elongation and division, ultimately leading to degradation of the bamboo forest. Previously, also found that long-term mulching caused roots to grow toward the ground in search of oxygen, which promoted root elongation. This phenomenon is also observed in rice. Deep-water rice leaves and internodes may stretch and grow above the water surface under flood circumstances to gather oxygen and prevent drowning. We also found that the higher ABA contents in September and December and the higher IAA contents in March and June may be related to the growth habit of the plant ( Figure 4A, B ; Table 2 ), where the plant grows vigorously in spring and summer, while abscisic acid inhibits germination and promotes dormancy and plant organ separation in autumn and winter. In addition, the actions of ABA and IAA are antagonistic, and one study showed that ABA may function as an inhibitor of GA and restrict root development, allowing the plant to survive during flooding. Our results suggest that there may be some antagonistic effects between ABA and IAA and GA in the hypoxic environment caused by organic material mulching ( Figure 7 ; Table 2 ). In addition to this, it has been shown that the fast buildup of ethylene in submerged tissues (through physical trapping and active synthesis) under anoxic circumstances, causes alterations in branch lengthening, glucose metabolism, and adventitious root development. At the same time, the equilibrium of GA and ABA contents is likewise coordinated by ETH under anoxic conditions caused by submergence. In this investigation, we discovered significant increases in ETH content and the activities of enzymes involved in ethylene synthesis (ACO, ACS), and also a significant positive correlation between ETH and GA contents under organic material cover ( Figures 3E, F ; 4D ; 7 ; Table 2 ). It is due to the synergy established by the combination of ETH and GA. From this we can infer that ETH perception is essential for adventitious root development, and GA substantially promotes the ensuing ETH-induced adventitious root growth. Aeration from the buried pipes provided oxygen to alleviate soil hypoxia caused by mulching, thus changing the hormone contents in the bamboo roots by reducing the ABA, GA, and ETH contents, decreasing the activities of ACS and ACO, increasing the IAA content, and finally improving metabolic and physiological alterations in roots."}, {"passage_id": "Discuss.p0008", "text": "Aeration regulated Aux/IAAs gene expression under mulching"}, {"passage_id": "Discuss.p0009", "text": "It is well known that auxin is the key regulator during plant growth. IAA, a most abundant hormone in higher plants, is a weak acid, and growth hormone influx and efflux carriers promote its intercellular movement Auxin transporters are necessary for the transfer of auxin into various cells. AUXIN1 (encoded by Aux1) is an auxin influx carrier. AUXIN1 is the major transporter for auxin uptake in root hairs and it controls root gravitropism, root hair formation, and leaf phyllotaxy. In this study, we found that mulching reduced the expression of Aux1 ( Figure 5A ), and that Aux1 expression was highly associated with growth hormone and unfavorably related to ETH concentrations. Aux2 and Aux3 have been implicated in processes like as hypocotyl elongation and foliar growth in Arabidopsis and rice. Aux3 regulates lateral root growth and root hair production, whereas Aux4 regulates plant tiller height. In the present study, mulching reduced gene expression of Aux genes, while aeration increased Aux gene expression ( Figure 5 ). Aux/IAAs expression was favorably linked with IAA and negatively associated with ethylene ( Figures 7 , 8 ). It is because ETH can control IAA synthesis by regulating Aux1 expression and growth hormone synthesis-related genes, which in turn regulate root development under adverse situations."}, {"passage_id": "Discuss.p0010", "text": "Following aeration, the correlations between each enzyme and hormones indicator and gene expression were also investigated. Aux/IAAs gene expression was highly related to many enzyme and hormones factors, and the expression of Aux1, 2, 3, and 4 was closely associated with root development factors ( Figure 8 ). The results imply that Aux/IAAs genes are engaged in the management of hormone levels as well as the regulation of anaerobic enzymes and root respiration activity to keep proper root development, while Aux/IAAs contributing in this mechanism. showed the expression of Aux/IAA in Zea nicaraguensis of hypoxic circumstances altered dramatically, and it may also govern the development of adventitious roots and the production of vented tissue. Mulching caused fast alterations in a number of critical enzyme and hormones markers in P. praecox. Here, LDH, PDC, ABA, IAA, and ETH all had significant impacts on the expression of Aux/IAAs ( Figure 8 ). It demonstrates that the overlay affects Aux/IAAs expression in plants, which in turn regulates changes in endogenous hormone levels that are involved in regulating anaerobic respiratory enzymes and ultimately improving ability of plant roots to cope with hypoxia caused by organic materials."}, {"passage_id": "Discuss.p0011", "text": "Overall, the findings of our investigation demonstrate that mulching with organic material degrades P. praecox forests ( Figure 9 ), which consistent with the phenomenon observed informally by local farmers. We are here for the first time to demonstrate the mechanism of underground pipeline aeration to mitigate the degradation of bamboo forest. We also explain for the first time that hormones crosstalk with Aux/IAAs and thus regulate changes in enzyme and hormones indicators under bamboo forest mulching. We therefore are of the opinion that our subsurface aeration strategy will help to mitigate soil hypoxia and, in turn, improve the growth of bamboo. However, the intensity and time of the aeration needs to be studied in detail in the future."}, {"passage_id": "Discuss.p0012", "text": "There are certain limitations to this study, namely that we only studied the effects of short-term aeration on plant biochemistry. Different aeration times may also have inconsistent effects on plant growth. Moreover, our experiment lasted for one year, which is a short period of time compared to a long-term bamboo mulch, and long-term monitoring of soil changes to determine physiological and biochemical changes in bamboo roots could be conducted in future studies. Due to the lack of research on the application of aeration systems to alleviate soil hypoxia caused by organic mulching, many scientific and technical problems remain. Our study could serve as a representative example of this research area and generate interest in further research on the role of post-mulching aeration in various cropping systems."}], "Conclusion": [{"passage_id": "Concl.p0002", "text": "Mulching with organic matter resulted in a decline in soil oxygen content and a reduction in shoot yield and root growth accompanied with increasing activities of anaerobic enzymes (ADH, LDH, PDC, and AlaAT). Here we innovatively propose a mechanism for improving the degradation of bamboo forest by underground pipeline aeration and find the crosstalk between hormones and Aux/IAAs under mulching and thus regulate the changes of enzyme and hormones indicators. Moreover, subsurface pipe aeration increased the expression of Aux/IAAs genes (Aux1, Aux2, Aux3, and Aux4) and IAA concentration, and reduced ABA, GA, and ETH concentrations and limited ETH synthesis enzyme activity (ACS and ACO) in the roots. The increased soil oxygen content improved root growth and shoot yield and reduced anaerobic enzyme activity, thus enhancing root resistance to organic material mulching-induced hypoxia. These findings suggest that subsurface pipe aeration helps to mitigate mulch-induced root hypoxia in bamboo and support sustainable bamboo production."}]}}, {"pmcid": "PMC10015162", "title": "Mapping the signaling network of BIN2 kinase using TurboID-mediated biotin labeling and phosphoproteomics", "source_file": "PMC10015162.json", "source_url": "https://pmc.ncbi.nlm.nih.gov/articles/PMC10015162/", "included_counts": {"Abstract": 2, "Introduction": 8, "Discussion": 12}, "omitted_results_discussion": false, "sections": {"Abstract": [{"passage_id": "Abstract.p0002", "text": "Elucidating enzyme–substrate relationships in posttranslational modification (PTM) networks is crucial for understanding signal transduction pathways but is technically difficult because enzyme–substrate interactions tend to be transient. Here, we demonstrate that TurboID-based proximity labeling (TbPL) effectively and specifically captures the substrates of kinases and phosphatases. TbPL-mass spectrometry (TbPL-MS) identified over 400 proximal proteins of Arabidopsis thaliana BRASSINOSTEROID-INSENSITIVE2 (BIN2), a member of the GLYCOGEN SYNTHASE KINASE 3 (GSK3) family that integrates signaling pathways controlling diverse developmental and acclimation processes. A large portion of the BIN2-proximal proteins showed BIN2-dependent phosphorylation in vivo or in vitro, suggesting that these are BIN2 substrates. Protein–protein interaction network analysis showed that the BIN2-proximal proteins include interactors of BIN2 substrates, revealing a high level of interactions among the BIN2-proximal proteins. Our proteomic analysis establishes the BIN2 signaling network and uncovers BIN2 functions in regulating key cellular processes such as transcription, RNA processing, translation initiation, vesicle trafficking, and cytoskeleton organization. We further discovered significant overlap between the GSK3 phosphorylome and the O-GlcNAcylome, suggesting an evolutionarily ancient relationship between GSK3 and the nutrient-sensing O-glycosylation pathway. Our work presents a powerful method for mapping PTM networks, a large dataset of GSK3 kinase substrates, and important insights into the signaling network that controls key cellular functions underlying plant growth and acclimation."}, {"passage_id": "Abstract.p0003", "text": "Combining TurboID-mediated proximity labeling with quantitative phosphoproteomics identifies BIN2 signaling components including kinase substrates in vivo, revealing cellular functions of BIN2."}], "Introduction": [{"passage_id": "Introduction.p0001", "text": "IN A NUTSHELL"}, {"passage_id": "Introduction.p0002", "text": "Background: Intracellular signal transduction relies on specific and dynamic interactions between kinases and their substrates. Identifying substrate proteins of each kinase is crucial for understanding cellular signaling transduction pathways but is technically challenging because of the transient nature of the enzyme–substrate interactions and the large number of kinases acting in a cell. Arabidopsis thaliana BRASSINOSTEROID-INSENSITIVE2 (BIN2) is one of the best-studied plant kinases, with key roles in multiple signaling pathways including the brassinosteroid and auxin pathways. However, BIN2's in vivo interactors and substrate proteins have not been fully characterized. Recent studies have developed the TurboID biotin ligase as a highly efficient proximity labeling tool; its efficiency in mapping transient protein–protein interactions has not been fully explored."}, {"passage_id": "Introduction.p0003", "text": "Question: Can a fusion protein containing a kinase and the TurboID biotin ligase biotinylate the substrate proteins phosphorylated by the BIN2 kinase? Is this approach effective, when combined with phosphoproteomics, in identifying kinase substrates that interact transiently? What are the substrates and cellular targets of BIN2? How does the BIN2 signaling network overlap with other signaling pathways?"}, {"passage_id": "Introduction.p0004", "text": "Findings: We show that TurboID is an effective and specific tool for mapping kinase signaling networks. We identified 482 BIN2-proximal proteins, including about two-thirds that showed BIN2-dependent phosphorylation and many known BIN2 interactors and substrates. The dataset of in vivo BIN2 interactors and substrates uncovers an expansive signaling network and reveals a convergence between the BIN2/GSK3 and O-GlcNAc modification pathways in both plants and animals."}, {"passage_id": "Introduction.p0005", "text": "Next steps: How BIN2 acts specifically in various signaling pathways and how it regulates various substrate proteins and cellular functions are key questions to be answered in future studies. How BIN2-mediated phosphorylation crosstalks with O-GlcNAcylation is another important question with broad implications. Our dataset of candidate proteins with modification sites will enable future investigations that advance our understanding of these important questions."}, {"passage_id": "Introduction.p0007", "text": "GLYCOGEN SYNTHASE KINASE 3 (GSK3) is a major signaling hub in animals and plants. In animals, GSK3 was initially identified as a regulator of sugar metabolism but has since been found to act in numerous signaling pathways and phosphorylate over a hundred cellular proteins. As a hub of cellular signal transduction, GSK3 has been implicated in major human diseases such as diabetes, cancer, and neurological disorders. In plants, the best-characterized GSK3-like kinase, BRASSINOSTEROID-INSENSITIVE2 (BIN2), was first identified as a key component of the brassinosteroid (BR) signaling pathway in Arabidopsis thaliana, where BIN2 phosphorylates and inhibits the BRASSINAZOLE-RESISTANT1 (BZR1) family of BR-responsive transcription factors. BR signaling through the receptor kinase BRASSINOSTEROID INSENSITIVE1 (BRI1) leads to BIN2 dephosphorylation, ubiquitination, and degradation, resulting in protein phosphatase 2A (PP2A)-mediated dephosphorylation and nuclear accumulation of BZR1, which mediate BR-responsive gene expression and plant growth."}, {"passage_id": "Introduction.p0008", "text": "Recent molecular genetic studies have elucidated BIN2's broad functions in a wide range of developmental and physiological processes. For example, BIN2 acts in additional receptor kinase pathways that regulate asymmetric cell division, differentiation of stomata and xylem cells, and development of lateral roots. BIN2 also interacts with components of other hormonal and light signaling pathways and plays a role in salt stress response
