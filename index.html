tolerance to salt. In this work, we identify a chloroplast localized 2-Cys Prx encoding gene TaBAS1 ( Figure 1 ), and its overexpression obviously enhances salt tolerance in wheat and Arabidopsis ( Figures 3 , S3 ). In line with the reports that the enhancement of salt tolerance by 2-Cys Prxs from Suaeda salsa L. and Tamarix hispida, our data indicate that the role of 2-Cys-Prxs in salt tolerance is conserved in different plants. Moreover, TaBAS1 enhances grain yield of wheat under salt stress, but has no adverse effect on the growth and yield under the control condition ( Figure 7 ), exhibiting its potential in the germplasm improvement of wheat without imposing the trade-offs between yield and tolerance. Moreover, 2-Cys Prxs have been proved to enhance the tolerance to cold, heat and drought. Thus, the genes of 2-Cys Prxs and/or other components that directly modulating the level of H2O2 (ROS) and other basic physiological bases of the adaption to abiotic stress could be used for improving broad-spectrum tolerance to abiotic stresses."}, {"passage_id": "Discuss.p0004", "text": "The role of TaBAS1 is associated with ROS homeostasis"}, {"passage_id": "Discuss.p0005", "text": "2-Cys Prxs possess peroxidase activity on a variety of peroxide substrates, and contribute to the tolerance to oxidative stress. Consistently, TaBAS1 enhances the tolerance to H2O2 and MV-induced oxidative stress, reduces ROS levels, and increases CO2 assimilation rate under salt stress ( Figures 3E , 4 , S4 , 7I ), further confirming the physiological basis of 2-Cys Prxs in the response to salt (abiotic) stress. Note that TaBAS1 overexpression enhances the tolerance to H2O2 in wheat but not Arabidopsis ( Figure S4 ), which may owe to the difference in the response threshold to H2O2 treatment that need to be studied in the future. Moreover, TaBAS1 promotes the activities of ROS scavenging enzymes SOD, GPX and CAT ( Figures 5A–C ), consistent with the previous studies that 2-Cys Prxs elevate these ROS scavenging enzymes in other plants. This indicates that 2-Cys Prxs can affect the ROS scavenging system to efficiently remove excessive ROS together. It has been suggested that the peroxidase activity of 2-Cys Prxs can be compensated by the other antioxidant systems of the chloroplasts, such as the ascorbate-glutathione cycle in combination with superoxide dismutase. In line with that wheat SOD gene TaSOD2 promotes the activities of GPX, APX and SOD, our results show the close association among the components of ROS scavenging machinery in plants. On the other hand, NOX is the crucial component of ROS production system. Here, we find TaBAS1 elevates the activities of NOX, and accelerates the expression levels of NOX encoding genes ( Figures 5D , S5 ). Moreover, our previous study showed that SR3 has higher ROS level and NOX activity compared with JN177 under both control and salt stress conditions. In combination with these data, TaBAS1 offers salt tolerance through ROS homeostasis modulation, which is achieved via pushing both ROS scavenging and production systems. As toxic and signaling molecules, a suitable level of ROS modulated by the balance between ROS production and scavenging systems is required. NOX plays crucial roles in abiotic stress tolerance and antioxidant defense capacity. For example, the mutation of rice NOX genes OsRbohA and OsRbohB reduced drought tolerance, but its overexpression enhanced ROS level and drought tolerance; the inhibition of NOX activity by the inhibitor DPI significant reduces salt tolerance of wheat. The contribution of wheat SOD gene TaSOD2 in salt tolerance is associated with NOX, and the inhibition of NOX activity by adding DPI or the mutation of NOX genes removes the role of TaSOD2. Here, the inhibition of NOX activity abolished the role of TaBAS1 in salt and oxidative tolerance ( Figures 5 , S6 ). In line with the increase of the activities of SOD, GPX and CAT in the TaBAS1 overexpression lines, 2-Cys Prxs seem to enhance salt tolerance via modulating not only ROS scavengers but also ROS producers to alter the ROS homeostasis."}, {"passage_id": "Discuss.p0006", "text": "The contribution of TaBAS1 needs the resumption ability of its reduction status"}, {"passage_id": "Discuss.p0007", "text": "The reduction of peroxidatic Cys is necessary for the activity of 2-Cys Prxs, and NTRC plays important roles in the redox balance of the 2-Cys Prxs because it is an efficient reductant of 2-Cys Prxs. NTRC redox system is integrated by the redox balance of the 2-Cys Prxs, which controls the redox regulatory network of the chloroplasts. The mutation of NTRC decreases the levels of 2-Cys Prxs. Here, we find that the inhibition of NTRC activity erases the role of TaBAS1 in the tolerance to salt and oxidative stress ( Figures 6 , S7 ), firstly confirming that the enhancement of salt tolerance by 2-Cys Prxs is dependent on NTRC. Moreover, TaBAS1 promotes the expression of NTRC genes ( Figures 6A, B ). This may result in NTRC accumulation to ensure the reduction capacity for 2-Cys Prxs, which promotes their activities to enhance salt tolerance. It is noted that the increase in the expression of NTRC genes by TaBAS1 overexpression was found in the present of salt and oxidative stress ( Figures 6A, B ). Because the ROS level is elevated under salt stress, the orchestration between NTRC and 2-Cys Prxs appears to be dependent on ROS status. Under the stressful condition, ROS are over-accumulated, which causes the oxidation of 2-Cys Prxs and therefore needs more NTRC to reduce."}, {"passage_id": "Discuss.p0008", "text": "In summary, TaBAS1 exhibits the potential in wheat molecular breeding because of not imposing the trade-offs between salt and yield. The performance of TaBAS1 in salt tolerance is closely associated with intracellular ROS homeostasis and the cycle of 2-Cys Prx redox status, suggesting the complication of ROS modulatory scenario in plants."}], "Conclusion": []}}, {"pmcid": "PMC10043383", "title": "Identification of long noncoding RNAs involved in plumule-vernalization of Chinese cabbage", "source_file": "PMC10043383.json", "source_url": "https://pmc.ncbi.nlm.nih.gov/articles/PMC10043383/", "included_counts": {"Abstract": 1, "Introduction": 4, "Discussion": 5, "Conclusion": 1}, "omitted_results_discussion": false, "sections": {"Abstract": [{"passage_id": "Abstract.p0001", "text": "Vernalization is a phenomenon in which plants must undergo a period of continuous low temperatures to change from the vegetative growth stage to the reproductive growth stage. Chinese cabbage is a heading vegetable, and flowering time is an essential developmental trait. Premature vernalization leads to premature bolting, which causes a loss of product value and yield. While research into vernalization has provided a wealth of information, a complete understanding of the molecular mechanism for controlling vernalization requirements has not yet been elucidated. In this study, using high-throughput RNA sequencing, we analyzed the plumule-vernalization response of mRNA and long noncoding RNA in the bolting-resistant Chinese cabbage double haploid (DH) line ‘Ju Hongxin’ (JHX). A total of 3382 lncRNAs were identified, of which 1553 differentially expressed (DE) lncRNAs were characterized as plumule-vernalization responses. The ceRNA network revealed that 280 ceRNA pairs participated in the plumule-vernalization reaction of Chinese cabbage. Through identifying DE lncRNAs in Chinese cabbage and analyzing anti-, cis-, and trans-functional analysis, some candidate lncRNAs related to vernalization promoting flowering of Chinese cabbage and their regulated mRNA genes were found. Moreover, the expression of several critical lncRNAs and their targets was verified using qRT-PCR. Furthermore, we identified the candidate plumule-vernalization-related long noncoding RNAs that regulate BrFLCs in Chinese cabbage, which was interesting and different from previous studies and was a new discovery. Our findings expand the knowledge of lncRNAs in the vernalization of Chinese cabbage, and the identified lncRNAs provide rich resources for future comparative and functional studies."}], "Introduction": [{"passage_id": "Introduction.p0002", "text": "Flowering time is significant for harvesting valuable agricultural products. Exposure to low temperatures causes plants to bolt and flower, especially in Brassica green leafy vegetables, which are sensitive to vernalization. Bolting and flowering lead to the devaluation of agricultural products, and breeding high bolting resistant varieties has important economic significance. In addition, the control of flowering time is crucial for crop seed breeding, which can rapidly breed seeds and obtain high-purity materials. Chinese cabbage (Brassica rapa L. ssp. pekinensis) is a cruciferous leafy Brassica vegetable that originated in China and has a long history of cultivation. The vernalization of Chinese cabbage can be divided into two types: seedling-vernalization and plumule-vernalization. Seedling-vernalization is a kind of vernalization in which seedlings grow to a certain size, accumulate certain nutrients, and then experience low-temperature treatment; plumule-vernalization is a kind of vernalization mode in which seeds are subjected to low-temperature treatment in the germination state."}, {"passage_id": "Introduction.p0003", "text": "The second step of the central dogma is to translate genetic information from RNA to protein, which is crucial. However, more than 75% of RNA transcripts are not translated into proteins, which does not mean they have no function. Among them, long noncoding RNA (lncRNA) is a noncoding RNA with a length of more than 200 nt. Although lncRNA is a transcript with relatively low abundance, it has many functions and regulatory roles in transcriptional, post-transcriptional, and epigenetic aspects. LncRNAs form complementary double strands with transcripts encoding protein genes, interfering with mRNA shearing to form different shear forms, and they bind to specific proteins. LncRNA transcripts can regulate the activity of the corresponding proteins and act as a structural component to form nucleic acid–protein complexes with proteins, etc.. With the development of sequencing technology, an increasing number of lncRNAs have been identified in many crops, such as Arabidopsis thaliana, Solanum lycopersicum, Solanum tuberosum, Oryza sativa, and Zea mays. Currently, some related lncRNAs have also been studied in various characteristics of Chinese cabbage. In a downy mildew study of Chinese cabbage, disease-responding mRNAs and long noncoding RNAs were identified using two resistant lines and one sustainable line. In addition, there have been studies on lncRNAs in Chinese cabbage under heat stress. Song et al. conducted a comparative analysis of 37 lncRNAs, comprehensively analyzed lncRNAs in Chinese cabbage, and expanded some lncRNAs identified in the Chinese cabbage heat stress response. Research on lncRNAs in Chinese cabbage is still scarce and requires further analysis."}, {"passage_id": "Introduction.p0004", "text": "In recent years, lncRNAs about plant flowering have been increasingly reported. LncRNA MAS fine-tune flowering time by regulating the expression of MAF4, a member of FLOWERING LOCUS C (FLC) family; Intronic long noncoding RNA, RICE FLOWERING ASSOCIATED (RIFLA) regulates OsMADS56-mediated flowering in rice; Genome-wide was used to screen and identify some long non-coding RNA related to flowering/bolting of Lactuca sativa. FLC is a flower inhibitor that can maintain the vegetative growth of plants. Once plants experiencing a long period of cold, FLC activates several important genes in the process of plant growth by inhibiting a series of genes required to activate the transition from apical meristem to inflorescence and finally converts the vegetative growth of plants into reproductive growth, and its related lncRNAs have also been a research hotspot. There are three main types of lnRNAs involved in the vernalization of Arabidopsis: cold-induced long antisense intragenic RNA (COOLAIR), which encompasses most of the FLC locus from 5’ to 3’ polyadenylation sites, and COOLAIR is alternately involved in polyadenylation and splicing; COLD ASSISTED INTRONIC NONCODING RNA (COLDAIR) has been identified in the first intron of FLC in the sense direction; and COLDWRAP (cold of winter-induced noncoding RNA from the promoter) overlaps with the promoter region of FLC. These three lncRNAs are affected by vernalization and silence the expression of FLC, thus promoting the reproductive transformation of Arabidopsis. In the study of vernalization-related lncRNAs in Chinese cabbage, only COOLAIR-like transcripts have been detected in BrFLC2, and thus far there are no reports on COLDAIR or COLDWRAP transcripts in Chinese cabbage."}, {"passage_id": "Introduction.p0005", "text": "In this study, we first conducted plumule-vernalization of different degrees on a bolting-resistant Chinese cabbage DH line, determined the sequencing period of RNA-seq according to the phenotypes of the shoot apical meristem (SAM) section and the flowering time after vernalization, and characterized lncRNAs related to Chinese cabbage vernalization. A total of 3382 lncRNAs were identified in response to Chinese cabbage plumule-vernalization. Anti-, cis-, and trans-functional analysis of DE lncRNA revealed that some lncRNAs related to vernalization promoted flowering in Chinese cabbage. The structure and expression of antisense lncRNAs regulating BrFLC were further studied to reveal the molecular mechanism of Chinese cabbage plumule-vernalization."}], "Discussion": [{"passage_id": "Discuss.p0002", "text": "Although great progress has been made in vernalization genes and noncoding RNAs in Arabidopsis, research on noncoding RNA in the vernalization of Chinese cabbage has also made progress. However, the mechanism of vernalization affecting noncoding RNA and promoting the flowering of Chinese cabbage is still poorly understood. Whole-genome gene expression profiles may enable insight into the plumule-vernalization of Chinese cabbage. To better understand the response to plumule-vernalization at the transcription level, we evaluated the transcriptional landscape of a Chinese cabbage variety (JHX) that needs vernalization for bolting and flowering using high-throughput RNA-seq. Chinese cabbage is a crop with plumule-vernalization and seedling-vernalization. Plumule-vernalization means that germinated seeds can sense low temperatures, and after plumule-vernalization, through artificial treatment or natural low temperatures, plumules can enter bolting, flowering, and fruiting without the heading stage. Moreover, Chinese cabbage ‘JHX’ is a DH line, and selecting pure line material can ensure smooth sequencing and analysis."}, {"passage_id": "Discuss.p0003", "text": "The SAM status of many plants and various characteristics have been observed by slices to further determine the growth and development period of plants and the function of genes. We used toluidine blue to dye the SAM of Chinese cabbage under different plumule-vernalization treatments combined with different flowering times after plumule-vernalization and selected representative periods NV, V5, V15, V25, and T3 for RNA-seq ( Figure 1 ). The general characteristics of lncRNAs in Chinese cabbage during plumule-vernalization treatment were described in detail in this study. CNCI and CPC programs identified 3382 lncRNAs in the sequencing samples, and most of the lncRNAs were shorter than 1000 nt in length and contained far fewer exons than mRNA ( Figure 2 ), which was consistent with the previous results of Chinese cabbage lncRNA response to heat stress."}, {"passage_id": "Discuss.p0004", "text": "Interestingly, in the DE lncRNA analysis, V15 vs V25 only upregulated 16 lncRNAs and downregulated 8 lncRNAs, which was the control group with the least DE lncRNAs ( Figure 3D ). We also found that the flowering days at this stage were very similar after V15 to V25 treatment ( Figure 1C ). The vernalization effect should have a critical value, and after reaching the critical value, the effect of vernalization promoting rapid bolting and flowering can be maintained."}, {"passage_id": "Discuss.p0005", "text": "We constructed a co-expression network of predicted anti-, cis-, and trans-regulated genes and their matching DE lncRNAs ( Figures 4 – 6 ). We found 11 genes related to ‘flowering’ through functional annotation and GO analysis of anti-, cis-, and trans-regulated genes and 20 matching lncRNAs ( Figures 7D–F ). Phylogenetic analysis places FLC in a subfamily with two other MADS-box genes, AGL27 and AGL31. AGL27 is a regulator of flowering time and a repressor of the transition from vegetative development to reproductive development, and AGL27 has also been named FLOWERING LOCUS M (FLM). In this study, the expression of AGL27 first increased and then decreased rapidly during plumule-vernalization, and the two matching lncRNAs (MSTRG.19387.1 and MSTRG.19387.2) showed the same expression change. Moreover, AGL27 expression was anti-regulated by two lncRNAs, in which MSTRG.19387.1 also trans-regulated AGL27. MAF5 is normally repressed, and its ectopic overexpression under non-inductive short days causes late flowering. In our study, MAF5 was also affected by vernalization. With vernalization, the expression of MAF5 was significantly reduced. There were three trans-regulated MAF5 in the four matching lncRNAs, and MSTRG.6639.1 not only anti-regulated MAF5 but also trans-regulated MAF5. Some studies have shown that when BrFLC1, BrFLC2, and BrFLC3 were transformed into Arabidopsis, the transformed plants showed delayed flowering time. Five lncRNAs trans-regulated FLC3 in our study, and the expression levels decreased significantly with vernalization. EARLY FLOWERING 3 (ELF3) and ELF4 were first identified on genetic screens for photoperiodism mutants and were found to regulate circadian rhythms. Mutants elf3 and elf4 promote the early flowering of Arabidopsis. In our study, the expression of two lncRNAs was trans-regulated, and two ELF3 genes gradually increased with the vernalization process. Compared with previous results, it is possible that ELF3 genes are not affected by vernalization and promote the early flowering of Chinese cabbage. However, the expression of MSTRG.11657.1 and its trans-regulated ELF4 gradually decreased during vernalization, and MSTRG.11657.1 was also an lncRNA of trans-regulated FLC3. It was thus clear that ELF4 (BraA05g006,050.3C) may be affected during vernalization as FLC3 because of the reduced expression during vernalization, which promotes flowering. KNUCKLES (KNU) mediates the repression of WUSCHEL (WUS) in floral meristem determinacy control and terminates the floral meristem. In this study, four lncRNAs trans-regulated two KNU genes. The expression of KNU (BraA06g035260.3C) increased first from NV to V5 but decreased rapidly from V5 to T3, and two matching lncRNAs (MSTRG.22885.1 and MSTRG.1729.2) had the same expression mode. The expression of KNU (BraA09g004360.3C) decreased due to vernalization, but the expression of its two matching lncRNAs (MSTRG.16147.1 and MSTRG.29395.1) was opposite; one was affected by vernalization, and its expression was increased, and the other was decreased. Arabidopsis trxG genes ULTRAPETALA1 (ULT1) and ULT2 together restrict shoot and floral stem cell activity and establish apical–basal gynoecium polarity. The two DE lncRNAs, MSTRG.1592.1 and MSTRG.20791.1, cis-regulated ULT1 and ULT2, respectively, and their expression levels increased from NV to V5 and decreased from V5 to T3, indicating that the ULT genes and their matching lncRNAs may be affected by vernalization to promote the transition of the growth period. The SUPPRESSOR OF BIR1 1 (SOBIR1) in Arabidopsis was annotated as a negative regulation of floral organization abscission. The expression of the SOBIR1 gene was gradually upregulated during the vernalization of Chinese cabbage, while the expression of MSTRG.23762.1, an lncRNA of trans-regulated SOBIR1, was downregulated with vernalization. Whether the change in SOBIR1 expression is caused by vernalization remains to be studied. These candidate lncRNAs and their mRNA related to ‘flowering’ were affected by plumule-vernalization. These findings improved our understanding of how vernalization promotes flowering in Chinese cabbage, and these candidate lncRNAs and mRNA could be used in future studies."}, {"passage_id": "Discuss.p0006", "text": "BrFLC1, BrFLC2, and BrFLC3 are copies that are syntenic to AtFLC, which originated from the genome triplication event of Chinese cabbage since it diverged from Arabidopsis. COOLAIR is an lncRNA that plays an important role in regulating FLC during vernalization in Arabidopsis. Three types of antisense intragenic RNA COOLAIR in Arabidopsis are divided into two categories: proximally polyadenylated class I and distally polyadenylated class II. Previous studies detected only COOLAIR-like transcripts detected from BrFLC2, which were involved in the suppression of BrFLC2. In our study, six antisense lncRNAs targeted BrFLC1 (BraA10g027720.3C) and BrFLC2 (BraA02g003340.3C) ( Figure 9A–C ). Interestingly, MSTRG.33720.1 anti-regulated BrFLC1, which was not identified in previous studies. At the same time, the lncRNAs of five anti-regulated BrFLC2 were structurally different from those previously studied. Li et al. grouped them into two classes (class I and class II) according to polyadenylation sites in intron 6 or within the promoter of BrFLC2. In this study, four lncRNAs of anti-regulated BrFLC2 were all class II types (cleared and polyadenylated within the sequence antisense to the BrFLC2 promoter) ( Figure 9C ). To define the relationship between BrFLC1, BrFLC2, and their matching lncRNAs, the abundance of related transcripts was analyzed using real-time PCR. The expression of BrFLC1 decreased with vernalization, but the expression of BrFLC1-lncRNA increased gradually and decreased slightly at V25 ( Figure 9D ). BrFLC2 decreased rapidly at the beginning of vernalization and maintained a low expression pattern. The expression of BrFLC2-lncRNA increased gradually and decreased significantly at V25 ( Figure 9E )."}], "Conclusion": [{"passage_id": "Concl.p0002", "text": "As a vernalization vegetable crop, a few reports have identified long noncoding RNAs under vernalization in Chinese cabbage. Hence, we identified lncRNAs in the SAM of Chinese cabbage on a large scale and identified lncRNAs under plumule-vernalization treatment. This study expands our knowledge of lncRNAs involved in the plumule-vernalization response by identifying DE lncRNAs and conducting anti-, cis-, and trans-functional analyses in Chinese cabbage. Many genes and lncRNAs that promoted the bolting and flowering of Chinese cabbage, as well as antisense lncRNAs, targeted BrFLC differently from previous studies. The critical lncRNAs identified in our study provide valuable information for plumule-vernalization response lncRNAs in Chinese cabbage and provide rich resources for further research on the biological functions of lncRNAs in plants."}]}}];
const STORAGE_KEY = 'pmc_prefilter_manual_labels_v1';
let current = 0;
let labels = loadLabels();

function escapeHtml(value) {
  return String(value || '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
}
function loadLabels() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}'); } catch (e) { return {}; }
}
function saveLabels() { localStorage.setItem(STORAGE_KEY, JSON.stringify(labels)); }
function counts() {
  let c = {KEEP:0, DROP:0, UNSURE:0};
  for (const a of ARTICLES) { if (labels[a.pmcid]) c[labels[a.pmcid]] += 1; }
  return c;
}
function renderCounts() {
  const c = counts();
  const done = c.KEEP + c.DROP + c.UNSURE;
  document.getElementById('done').textContent = done;
  document.getElementById('keepCount').textContent = c.KEEP;
  document.getElementById('dropCount').textContent = c.DROP;
  document.getElementById('unsureCount').textContent = c.UNSURE;
  document.getElementById('bar').style.width = (ARTICLES.length ? (100 * done / ARTICLES.length) : 0) + '%';
  const dl = document.getElementById('download');
  if (done === ARTICLES.length) dl.classList.add('ready'); else dl.classList.remove('ready');
}
function renderArticle() {
  const a = ARTICLES[current];
  document.getElementById('goto').value = current + 1;
  document.getElementById('pmcid').innerHTML = `<a href="${a.source_url}" target="_blank" rel="noopener">${escapeHtml(a.pmcid)}</a>`;
  document.getElementById('title').textContent = a.title || '(No title found)';
  document.getElementById('meta').textContent = `${a.source_file} | included passages: ` + JSON.stringify(a.included_counts || {});
  document.getElementById('notice').innerHTML = a.omitted_results_discussion ? '<div class="notice">Combined Results+Discussion section was detected and omitted from this review page.</div>' : '';
  const container = document.getElementById('sections');
  container.innerHTML = '';
  for (const sec of ['Abstract','Introduction','Discussion','Conclusion']) {
    const items = (a.sections && a.sections[sec]) || [];
    const div = document.createElement('div');
    div.className = 'section';
    let inner = `<h2>${sec} <span class="count">${items.length} passage(s)</span></h2>`;
    if (!items.length) {
      inner += '<div class="empty">No passage from this section was included/found.</div>';
    } else {
      for (const p of items) {
        inner += `<div class="passage"><div class="pid">${escapeHtml(p.passage_id)}</div><div class="text">${escapeHtml(p.text)}</div></div>`;
      }
    }
    div.innerHTML = inner;
    container.appendChild(div);
  }
  updateButtons();
  renderCounts();
}
function updateButtons() {
  const label = labels[ARTICLES[current].pmcid];
  for (const [id, klass] of [['btnKeep','keep'], ['btnDrop','drop'], ['btnUnsure','unsure']]) {
    document.getElementById(id).className = '';
  }
  if (label === 'KEEP') document.getElementById('btnKeep').className = 'selected keep';
  if (label === 'DROP') document.getElementById('btnDrop').className = 'selected drop';
  if (label === 'UNSURE') document.getElementById('btnUnsure').className = 'selected unsure';
}
function setLabel(label) {
  labels[ARTICLES[current].pmcid] = label;
  saveLabels();
  updateButtons();
  renderCounts();
}
function clearCurrent() {
  delete labels[ARTICLES[current].pmcid];
  saveLabels();
  updateButtons();
  renderCounts();
}
function resetAll() {
  if (!confirm('Clear all labels?')) return;
  labels = {};
  saveLabels();
  renderArticle();
}
function nextArticle() { if (current < ARTICLES.length - 1) { current += 1; renderArticle(); window.scrollTo(0,0); } }
function prevArticle() { if (current > 0) { current -= 1; renderArticle(); window.scrollTo(0,0); } }
function downloadTSV() {
  const rows = ['PMCID	MANUAL_JUDGE'];
  for (const a of ARTICLES) rows.push(`${a.pmcid}	${labels[a.pmcid] || ''}`);
  const blob = new Blob([rows.join('
') + '
'], {type: 'text/tab-separated-values'});
  const url = URL.createObjectURL(blob);
  const link = document.createElement('a');
  link.href = url;
  link.download = 'prefilter_step2_manual_judgments.tsv';
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
  URL.revokeObjectURL(url);
}
document.getElementById('goto').addEventListener('change', function() {
  let value = parseInt(this.value, 10);
  if (Number.isNaN(value)) value = 1;
  value = Math.max(1, Math.min(ARTICLES.length, value));
  current = value - 1;
  renderArticle();
  window.scrollTo(0,0);
});
document.addEventListener('keydown', function(e) {
  if (e.target && ['INPUT','TEXTAREA'].includes(e.target.tagName)) return;
  if (e.key === 'ArrowRight') nextArticle();
  if (e.key === 'ArrowLeft') prevArticle();
  if (e.key.toLowerCase() === 'k') setLabel('KEEP');
  if (e.key.toLowerCase() === 'd') setLabel('DROP');
  if (e.key.toLowerCase() === 'u') setLabel('UNSURE');
});
renderArticle();
</script>
</body>
</html>
