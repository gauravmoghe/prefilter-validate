iven by the UBQ10 promoter in our overexpression lines, whereas previous work used 35S, whose activity can vary in different organs and under abiotic stress. Nevertheless, we recently also found opposite ABA and ABA-related phenotypes for the loss-of-function mutant and Arabidopsis lines expressing the SCL30a SR protein under the control of the 35S promoter."}, {"passage_id": "Discuss.p0003", "text": "SR proteins are established phosphoproteins, and several phosphorylation residues have been annotated for SR45. Moreover, a phosphoproteomics study listed SR45 as displaying reduced phosphorylation under ABA conditions. Consistent with these results, we found that upon ABA exposure, SR45 is dephosphorylated at several residues in a SnRK2-dependent manner, indicating that ABA signaling downstream of SnRK2 kinases either activates phosphatases that dephosphorylate SR45 or deactivates kinases that phosphorylate SR45 under control conditions. Interestingly, we detected ABA-induced accumulation of a specific SR45 phosphoisoform (Figure 3A) in the snrk2.2/3/6 background, suggesting that this SR45 (de)phosphorylation event occurs either through ABA signaling upstream of SnRK2s or independently of these core ABA pathway components. SnRK2-independent ABA signaling, in which PP2C phosphatases dephosphorylate other kinases that activate different branches of ABA signaling, has previously been reported. Our findings fit with the general model in which dephosphorylation negatively regulates ABA signaling (reviewed in). In fact, several PP2C phosphatases are known to negatively regulate ABA signaling, and the corresponding loss-of-function mutants display ABA-hypersensitive phenotypes, as observed for SR45."}, {"passage_id": "Discuss.p0004", "text": "Importantly, we found that the SR45 protein accumulates upon ABA treatment in a SnRK2-dependent manner and that the phosphorylation status of the protein controls this ABA-induced increase in SR45 levels. Indeed, using phosphomutant and phosphomimetic lines in which the SR45 protein is never phosphorylated or mimics constitutive phosphorylation at T264, a previously reported ABA-specific SR45 dephosphorylation residue, we showed that: (i) a switch in SR45 phosphorylation status is required for ABA induction of SR45 protein accumulation, (ii) dephosphorylation of the T264 residue upon ABA exposure results in reduced ubiquitination levels and lower proteasomal degradation rates of SR45, and (iii) SR45 phosphorylation at T264 enhances plant ABA sensitivity at the early seedling stage."}, {"passage_id": "Discuss.p0005", "text": "Our results demonstrate functional and physiological relevance for ABA-mediated posttranslational modification of an SR-related splicing factor that negatively regulates ABA responses during early plant development. We show that SR45 is phosphorylated under control conditions, with phosphorylation of a single residue being able to modulate the protein’s ubiquitination levels and the amounts of SR45 that are targeted for degradation by the ubiquitin–proteasome system. Upon exposure to ABA, downstream signaling triggers SR45 dephosphorylation, thus reducing both the ubiquitination and the degradation rates of the protein. Consistent with ABA stabilization of the SR45 protein, we also demonstrate that the protein’s role as a negative regulator of the ABA pathway is dependent on SR45 protein levels, pointing to ABA-induced SR45 accumulation as a mechanism of negative autoregulation of ABA signaling. Also in agreement with our model (Figure 7), SR45 phosphomimetic lines are more sensitive to ABA: when T264 dephosphorylation is prevented, SR45 is degraded at higher rates, resulting in lower amounts of SR45 protein and enhanced seedling sensitivity to ABA. Given that SR45 is dephosphorylated by ABA, both the overexpression and the phosphomutant lines display a decreased ABA response. Figure 7 illustrates the biological significance of our findings: when stress is perceived and ABA levels increase sharply, seedling growth is repressed but so is phosphodegradation of SR45; as the splicing factor gradually accumulates, ABA-mediated inhibition of seedling development is alleviated to allow a physiological trade-off between growth and stress tolerance."}, {"passage_id": "Discuss.p0006", "text": "In plants, protein phosphodegradation is crucial for regulation of the phytochrome interacting factor 5 (PIF5) and PIF3 transcription factors involved in light signaling, but it has also been shown to directly regulate key ABA signaling components, including the Arabidopsis PYR/PYL receptors, DREB2A (DEHYDRATION-RESPONSIVE ELEMENT-BINDING PROTEIN 2A), and RopGEF1 (GUANINE NUCLEOTIDE EXCHANGE FACTOR 1). Moreover, the RING-type E3 ligase KEG (KEEP ON GOING) regulates itself via ABA-dependent phosphodegradation, thereby stabilizing the ABI5 (ABA-INSENSITIVE 5) transcription factor, which is ubiquitinated by this E3 ligase. As for SR proteins, although their phosphorylation-dependent degradation has not yet been reported, a couple of studies in humans have looked into both phosphorylation and proteasomal degradation of these RNA-binding proteins. found that mutating an AKT-signaling phosphorylation site has no effect on proteasomal degradation of the human SR protein SRSF5, whereas acetylation downregulates phosphorylation levels and promotes degradation of SRSF2, suggesting a link between acetylation and phosphorylation in regulating the levels of this SR protein."}, {"passage_id": "Discuss.p0007", "text": "In line with our findings, UBQ3 (POLYUBIQUITIN 3) is a reported interactor of Arabidopsis SR45. SR45 has also been reported to interact with the products of the At2g43770 and At1g10580 genes, which are predicted to contain WD40 domains. WD40 proteins function as potential substrate receptors of CUL4 E3 ubiquitin ligases, and it is interesting to note that two components of these E3 ligases are also reported to be negative regulators of ABA signaling. However, phosphorylated substrates are usually recognized by F-box proteins, which are part of the Skp1–Cullin–F-box complex, a different major type of E3 ubiquitin ligase (reviewed in). Further biochemical and genetic studies should enable identification of both the kinases or phosphatases and the E3 ligase complexes that regulate SR45 protein levels and unveil the precise molecular mechanisms that lead to SR45 dephosphorylation and accumulation in response to ABA."}], "Conclusion": []}}, {"pmcid": "PMC10030372", "title": "The PtoTCP20-miR396d-PtoGRF15 module regulates secondary vascular development in Populus", "source_file": "PMC10030372.json", "source_url": "https://pmc.ncbi.nlm.nih.gov/articles/PMC10030372/", "included_counts": {"Abstract": 2, "Introduction": 6, "Discussion": 8}, "omitted_results_discussion": false, "sections": {"Abstract": [{"passage_id": "Abstract.p0001", "text": "Secondary vascular development is a key biological characteristic of woody plants and the basis of wood formation. Our understanding of gene expression regulation and dynamic changes in microRNAs (miRNAs) during secondary vascular development is still limited. Here we present an integrated analysis of the miRNA and mRNA transcriptome of six phase-specific tissues—the shoot apex, procambium, primary vascular tissue, cambium, secondary phloem, and secondary xylem—in Populus tomentosa. Several novel regulatory modules, including the PtoTCP20-miR396d-PtoGRF15 module, were identified during secondary vascular development in Populus. A series of biochemical and molecular experiments confirmed that PtoTCP20 activated transcription of the miR396d precursor gene and that miR396d targeted PtoGRF15 to downregulate its expression. Plants overexpressing miR396d (35S:miR396d) showed enhanced secondary growth and increased xylem production. Conversely, during the transition from primary to secondary vascular development, plants with downregulated PtoTCP20expression (PtoTCP20-SRDX), downregulated miR396 expression (35S:STTM396), and PtoGRF15 overexpression (35S:PtoGRF15) showed delayed secondary growth. Novel regulatory modules were identified by integrated analysis of the miRNA and mRNA transcriptome, and the regulatory role of the PtoTCP20-miR396d-PtoGRF15 signaling cascade in secondary vascular development was validated in Populus, providing information to support improvements in forest cultivation and wood properties."}, {"passage_id": "Abstract.p0002", "text": "Wang et al. present an integrated analysis of the miRNA and mRNA transcriptome during vascular development in Populus. Novel regulatory modules were identified, and the regulatory role of the PtoTCP20-miR396d-PtoGRF15 signaling cascade during the transition from primary to secondary vascular development was validated in Populus."}], "Introduction": [{"passage_id": "Introduction.p0002", "text": "Secondary vascular development is a key biological characteristic of woody plants and the basis of wood formation. The shoot apical meristem (SAM) contains stable populations of pluripotent stem cells, which give rise to all of the protoderm, ground meristem, and procambium in shoots. The procambium divides periclinally and differentiates into primary vascular tissue and the cambium, a type of lateral meristem, at the primary-secondary growth transition zone."}, {"passage_id": "Introduction.p0003", "text": "Vascular tissue is composed of xylem and phloem, which are continually produced by periclinal division from the procambium during primary vascular development and from the cambium during secondary vascular development. It has been demonstrated that CLAVATA3/ENDOSPERM SURROUNDING REGION-like peptide ligands and the leucine-rich repeat domains of the corresponding receptors are important for the regulation of stem cell activity in apical and lateral meristems. WUSCHEL (WUS) has been reported to function in stem cell maintenance in the SAM. WUSCHEL HOMEOBOX-RELATED 4 (WOX4) and WOX14 are cambium specific, and homeodomain-leucine zipper III (HD-ZIPIII) is expressed in the cambium and immature xylem cells. Tracheary element differentiation inhibitory factor-tracheary element differentiation inhibitory factor receptor-WOX4 signaling plays a key role in the maintenance of vascular meristem organization during vascular development. Throughout the life of woody plants, the development of primary vascular tissue into secondary vascular tissue is progressive and may require a specific regulatory network of molecular interactions."}, {"passage_id": "Introduction.p0004", "text": "High-throughput RNA sequencing (RNA-seq) has become the technology of choice for transcriptome investigation. RNA-seq enables the detection of transcripts that correspond to annotated genes as well as the identification of novel genes and transcripts. A recent analysis of high-spatial-resolution transcriptome profiles revealed the uncharacterized modularity of wood formation in Populus tremula. Several transcription factor (TF) family members, including no apical meristem (NAC), v-myb avian myeloblastosis viral oncogene homolog (MYB), and zinc-finger proteins, have been reported to regulate secondary growth. WRKY TFs have been found to be upregulated in the Arabidopsis thaliana stem during secondary growth and in aspen tension wood. Also, weighted gene correlation network analysis (WGCNA) applied to the results of high-throughput RNA-seq led to the identification of a xylem synthesis regulator."}, {"passage_id": "Introduction.p0005", "text": "MicroRNAs (miRNAs) play key roles in various aspects of plant development and stress responses. isolated miRNAs from developing xylem and cloned 22 miRNAs, which were predicted to function in the biosynthesis of cell wall metabolites. For example, Ptr-miR397a has been identified as a negative regulator of laccase genes that affect lignin content in Populus trichocarpa. Pto-miR6443 has been demonstrated to modulate S lignin biosynthesis by specifically regulating F5H2 in Populus tomentosa. A previous study found that miRNA165/6 is necessary for SAM formation, vascular patterning, cambium activity, and xylem differentiation. miR394 was shown to play a role in SAM formation. A recent study has suggested that PtrMYB161 functions as an activator as well as a repressor in a four-layer wood formation transcriptional regulatory network. The L1-miR171-HAIRY MERISTEM (HAM) signaling cascade mediated by the WUS-HAM-CLV3 regulatory loop has been reported to define plant shoot architecture. Growth-regulating factors (GRFs) from a nine-member TF family in Arabidopsis form a complex with the GRF-interacting factors involved in plant growth. Seven of nine GRFs are regulated by miR396 in Arabidopsis. Subsequent studies have shown that the miR396-GRF module has diverse roles in plant growth and development, including stem, leaf, seed, flower, and root growth; coordination of plant growth with stress responses; and regulation of plant longevity. Nineteen candidate GRF genes were identified in P. trichocarpa. Bioinformatics analysis, degradome analysis, and transient transcription assays showed that 18 poplar GRFs were targeted by miR396, with GRF12b the only exception. In Populus alba × Populus glandulosa, PagGRF7a has a negative effect on leaf size control, and PagGRF12a and PagGRF12b positively coordinate the regulation of leaf size. PagGRF12a interacts with PagGIF1b to form a complex that inhibits xylem development through direct upregulation of PagXND1a."}, {"passage_id": "Introduction.p0006", "text": "Plant development depends on complex networks of gene regulatory pathways, of which miRNAs and TFs are key components. Approximately two-thirds of known miRNAs target TFs in plants, and the consequences of miRNA-targeted regulation are significant."}, {"passage_id": "Introduction.p0007", "text": "An understanding of the spatiotemporal control of transcriptional complexity in a multicellular organism requires detailed knowledge of its transcriptional status at specific developmental stages. Several transcriptomics studies have revealed extensive regulatory networks of genes and TFs that function in plant growth and xylem differentiation. Analysis of hierarchical TF and chromatin binding networks has suggested that wood formation involves combinations of TF-DNA and TF-TF (protein-protein) regulation to determine regulatory homeostasis. However, miRNAs and miRNA-TF networks that function during the transition from primary to secondary vascular development have not been reported. In this study, we used high-throughput sequencing to analyze the mRNA transcriptome and miRNAs during vascular development in Populus. Phase-specific transcripts, especially TFs, and miRNAs were identified and used to construct gene regulatory networks. Some novel regulatory modules were found to play roles in vascular development, and the function of the PtoTCP20-miR396d-PtoGRF15 signaling cascade during the transition from primary to secondary vascular development was confirmed by genetic transformation, biochemical, and molecular assays. These findings provide information to support improvements in forest cultivation and wood properties."}], "Discussion": [{"passage_id": "Discuss.p0002", "text": "Phase-specific genes and miRNAs during vascular development in Populus"}, {"passage_id": "Discuss.p0003", "text": "Secondary growth is a key characteristic of woody plants. In poplar, cambium development and secondary phloem and xylem differentiation during secondary vascular development have been extensively analyzed by RNA-seq. It has also been reported that many xylem upregulated genes are involved in cell wall and lignin biosynthesis, and a novel modularity of wood formation has been revealed by high-spatial-resolution transcriptome profiles in P. tremula. In addition, 62 058 new alternatively spliced isoforms from the SAM to the fifth internode were identified by Populus stem transcriptome analysis. However, the miRNAs and miRNA-TF networks involved in the transition from primary to secondary vascular development have not been reported until now. In this study, we obtained six tissue-specific samples, including the SA, procambium, primary vascular tissue, cambium, secondary phloem, and secondary xylem, in Populus by cryosectioning technology for miRNA and mRNA transcriptome sequencing (Supplemental Figure 1). In total, 34 626 genes were identified, and four distinct co-expression modules were generated. The expression patterns identified by our analysis distinguished two developmental processes: SA-procambium-cambium continuum development and secondary vascular development. In particular, genes identified during SA-procambium-cambium continuum development were primarily involved in vascular meristem development, whereas those identified during secondary vascular development were primarily involved in differentiation of the cambium into secondary phloem and xylem. During SA-procambium-cambium continuum development and secondary vascular development, 1857 and 696 TF-target regulatory relationships, respectively, were identified by gene co-expression analysis and target gene prediction. For example, PtoTCP20 and PtoGRF15 were predicted to function during the transition from primary to secondary growth."}, {"passage_id": "Discuss.p0004", "text": "In plants, transcriptional gene silencing and post-transcriptional gene silencing are directed by miRNAs. Previous studies have focused on the expression of miRNAs in response to various abiotic stresses, including cold, salt, drought, and high temperature and the expression of critical components of small RNA pathways during regeneration of the secondary vascular system. In this study, 105 DE miRNAs were identified, including miR166, which is necessary for SAM formation, vascular patterning, and xylem differentiation; miR171 and miR394, which play roles in SAM formation; and miR319, which is involved in secondary vascular development and xylem differentiation. Several miRNAs, including miR1446, miR159, miR160, miR164, miR167, miR169, miR393, miR396, miR472, and miR482, were identified as regulators of secondary vascular development by GO functional analysis."}, {"passage_id": "Discuss.p0005", "text": "Novel regulatory modules identified during vascular development by integrated analysis of the miRNA and mRNA transcriptome"}, {"passage_id": "Discuss.p0006", "text": "Plant development depends on complex networks of gene regulatory pathways. In this study, miR166-PtoHB5, miR166-PtoHB8, miR319-PtoTCP20, and miR396-PtoGRF15 were identified as miRNA-hub TF pairs, whereas miR164-NAC, miR393-bHLH, miR160-ARF, miR156-SPL, and miR172-AP2 were identified as miRNA-TF pairs (Figure 3)."}, {"passage_id": "Discuss.p0007", "text": "Members of several families of TFs, including SPL, AP2, NAC, TCP, and GRF, are targets of miRNAs that are known to regulate vascular development. In a previous study, the miR165-SPL-miR172-AP2 signaling cascade was found to participate in several aspects of plant growth and development, such as the juvenile-to-adult phase transition, flowering time, and floral patterning determination."}, {"passage_id": "Discuss.p0008", "text": "The miR319-TCP-miR164-NAC signaling cascade plays a role in boundary and SAM formation, leaf shape and size, and several phytohormone signaling pathways in Arabidopsis, but its function during poplar secondary vascular development is not well understood. Similarly, the role of the miR319-TCP-miR396-GRF signaling cascade in Arabidopsis leaf development has been established. In our own previous work, miR319a-targeted PtoTCP20 was revealed to regulate secondary growth via interactions with PtoWOX4 and PtoWND6A/B in P. tomentosa . A recent study showed that PagGRF15 plays an important role in cell expansion and leaf growth in poplar. PagGRF12a inhibits xylem development by upregulating PagXND1a expression, but there is no reference to the regulatory role of the miR396-GRF15 module in the transition from primary to secondary growth in poplar. In our study, PtoGRF15 was validated as the target of miR396d, consistent with the results of Zhou et al. (2019), and was found to have a relatively high expression level in the stem of poplar. 35S:miR396d plants showed visible phenotypes in terms of secondary vascular development and xylem differentiation, and overexpression of PtoGRF15 resulted in delayed and decreased secondary vascular tissue growth. We found that the miR396d precursor gene was activated by PtoTCP20 (Figure 6), indicating that the miR319-PtoTCP20-miR396d-PtoGRF15 signaling cascade plays a vital role in vascular development in Populus."}, {"passage_id": "Discuss.p0009", "text": "We performed an integrated analysis of RNA-seq and small RNA sequencing during vascular development in Populus, and novel interactions, including PtoTCP20-miR396d-PtoGRF15 in secondary vascular development, were identified as regulatory modules in poplar (Figure 7). The expression level of miR396d gradually increased from primary to secondary vascular development in P. tomentosa, whereas that of PtoGRF15 gradually decreased. PtoTCP20 activated miR396d precursor gene transcription, and miR396d targeted PtoGRF15 to regulate its expression. The 35S:miR396d plants showed enhanced secondary growth and increased xylem production, whereas 35S:PtoGRF15 plants showed delayed secondary growth. Thus, the PtoTCP20-miR396d-PtoGRF15 signaling cascade in secondary vascular development was validated by genetic transformation, biochemical, and molecular experiments in Populus, providing important information to support improvements in forest cultivation and wood properties."}], "Conclusion": []}}, {"pmcid": "PMC10030943", "title": "Transcriptomic analysis of pea plant responses to chitooligosaccharides’ treatment revealed stimulation of mitogen-activated protein kinase cascade", "source_file": "PMC10030943.json", "source_url": "https://pmc.ncbi.nlm.nih.gov/articles/PMC10030943/", "included_counts": {"Abstract": 1, "Introduction": 4, "Discussion": 7}, "omitted_results_discussion": false, "sections": {"Abstract": [{"passage_id": "Abstract.p0001", "text": "Since chitooligosaccharides (COs) are water-soluble, biodegradable and nontoxic compounds, their application may be considered as a promising plant-protecting agent. However, the molecular and cellular modes of action of COs are not yet understood. In this study, transcriptional changes in pea roots treated with COs were investigated via RNA sequencing. Pea roots treated with the deacetylated CO8-DA at low concentration (10-5 М) were harvested 24 h after treatment and their expression profiles were compared against medium-treated control plants. We observed 886 differentially expressed genes (fold change ≥ 1; p-value < 0.05) 24 h after treatment with CO8-DA. Gene Ontology term over-representation analysis allowed us to identify the molecular functions of the genes activated in response to CO8-DA treatment and their relation to biological processes. Our findings suggest that calcium signaling regulators and MAPK cascade play a key role in pea plant responses to treatment. Here we found two MAPKKKs, the PsMAPKKK5 and PsMAPKKK20, which might function redundantly in the CO8-DA-activated signaling pathway. In accordance with this suggestion, we showed that PsMAPKKK knockdown decreases resistance to pathogenic Fusarium culmorum fungi. Therefore, analysis showed that typical regulators of intracellular signal transduction pathways involved in triggering of plant responses via CERK1 receptors to chitin/COs in Arabidopsis and rice may also be recruited in legume pea plants."}], "Introduction": [{"passage_id": "Introduction.p0002", "text": "The capacity of a plant to prevent pathogen attack can be defined by regulation of plant immunity. Plants have well-developed mechanisms regulating immunity and leading to activation of resistance to pathogens. These mechanisms are defined according to the pathogen molecules recognized by the plant. One of mechanism, known as microbe-associated molecular patterns (MAMPs)-triggered immunity (MTI), is based on the ability of plants to recognize MAMPs by cell surface transmembrane pattern recognition receptors (PRRs). Ligand perception by PRRs triggers intracellular signal transduction followed by plant defense responses activation and restriction of pathogen distribution. Despite the wide variety of MAMPs, plants demonstrate pretty similar responses to recognition of these diverse structures, based on activation of intracellular receptor-like cytoplasmic kinases and mitogen-activated protein kinases (MAPKs) triggering defense responses in the host. Among them, the MAPK cascade is highly conserved and involved in phosphorylation of various downstream protein targets, which leads to the activation of defense responses. In general, MAPK cascade consists of three protein kinases: a MAP kinase kinase kinase (MAPKKK), a MAP kinase kinase (MAPKK), and a MAP kinase (MAPK), which are involved in sequential activation by phosphorylation. In the model plant Arabidopsis, 21 MEKK1-type MAPKKKs, 10 MAPKKs and 20 MAPKs were identified."}, {"passage_id": "Introduction.p0003", "text": "To overcome the plant immune responses, pathogens produce a variety of effectors entering the host cells. The effectors are able to suppress plant immune response, targeting PRRs and downstream signaling regulators, allowing the pathogens to infect the plant. In response plants have developed an effector-induced immune system referred to as effector-triggered immunity (ETI). The intracellular receptor proteins with nucleotide-binding and leucine rich domains (NBS-LRR or NLRs) were shown to be involved in the recognition of effectors and triggering plant resistance. In the absence of a specific NBS LRR to the effector, the plant became susceptible to microbial infection."}, {"passage_id": "Introduction.p0004", "text": "Derivatives of chitin and chitosan known as chitooligosaccharides (COs) are well-known MAMPs showing the ability to trigger resistance in plants by elicitation of defense responses. COs are defined as chitin or chitosan oligomers consisting of N-acetyl-D-glucosamine or D-glucosamine residues with a degree of polymerization less than 20 and molecular weight of up to 3900 Da. Their application results in MTI-triggering resistance to a broad range of plant pathogens. These compounds act as plant-protecting agents and may be considered as safe and environmentally friendly agrochemicals. However, the influence of these compounds has been investigated mainly in model plants such as Arabidopsis and rice, while the mechanisms triggered by COs and operating in crop plants remain little studied."}, {"passage_id": "Introduction.p0005", "text": "Plants have a highly sensitive perception system for chitin, chitosan and COs as recent studies have shown. These proteins belong to a specific class of PRRs receptors having Lysin motif (LysM) in extracellular domains. In Arabidopsis and rice, the Chitin Elicitor Receptor Kinase 1 (CERK1) receptors can recognize more than one elicitor molecules with the common elicitor motifs such as chitin/COs as well as peptidoglycan and its derivatives. These multifunctional receptors play a crucial role in plant resistance to pathogen attack. However, the precise mechanisms regulating signal transduction in CERK1-triggered immunity are still far from understanding. The pea (Pisum sativum L.) is one of the most important crops worldwide, however, the molecular and cellular modes of action of COs in this plant remain poorly characterized and require further study. Deacetylated oligomers such as heptamers and octamers (CO7-DA, CO8-DA) are the most effective elicitors inducing the accumulation of phytoalexins and synthesis of pathogenesis-related proteins in pea. In accordance with this, we have shown recently a high affinity of CERK1-like receptor in legume plant pea Pisum sativum L., the PsLYK9, to CO7-DA and CO8-DA molecules. Here we focused on transcriptomic analysis of CO8-DA-triggered immunity through PsLYK9 receptor in pea Pisum sativum L. and found a set of putative intracellular regulators, which may be involved in signal transduction and activation of plant responses to this elicitor."}], "Discussion": [{"passage_id": "Discuss.p0002", "text": "Since our experiments were aimed at clarifying the molecular and cellular modes of action of COs in crop legume P. sativum L., we investigated the transcriptional changes in control and treated pea roots via RNA sequencing. Here we describe the pathways and mechanisms triggered by CO8-DA and operating in crop legume plant P. sativum L."}, {"passage_id": "Discuss.p0003", "text": "Taken together, our results point to a rapid and significant activation of pea genes involved in regulation of host defense responses, induced by CO8-DA, in accordance with previous findings for chitin-related compounds in Arabidopsis, rice, potato, tea. We have shown that a set of genes encoding specific enzymes involved in the biosynthesis of phytoalexins and other secondary metabolites was up-regulated in response to CO8-DA, that was in line with previous findings in other plants. The pea plant treatment with CO8-DA stimulated the synthesis of such components as lignins, reinforcing the cell wall. Similar effect of COs was previously shown in rice and tea."}, {"passage_id": "Discuss.p0004", "text": "At the same time, one of the most important aims during screening of differentially expressed genes may be searching for the specific genes responsible for plant resistance activation to pathogens. Since these genes may be the subject of direct genetic manipulations to increase plant crop stability. Indeed, some genes encoding disease resistance proteins such as Psat7g105600, Psat4g088560, Psat7g083880 were identified in our experiments as probable orthologs of genes previously found and well-studied in Arabidopsis (At5g15730, At5g66900, At1g18390). The information about homologous genes in Arabidopsis indicates their involvement in a positive regulation of resistance to biotic and abiotic stress responses. Therefore, these genes are potential targets for increasing legume plant resistance to pathogens."}, {"passage_id": "Discuss.p0005", "text": "Based on our transcriptomic analysis there is some evidence that CO8-DA elicitor may stimulate expression of genes encoding NBS-LRRs or NLRs, thereby increasing plant immune response. In susceptible plants, pathogens inject effectors into the host cell to prevent the immune response. In contrast, recognition of effectors by NLRs leads to ETI activation resulting in the “hypersensitive response” followed by death of the host cell and restriction of pathogen growth. Recent studies showed that heterologous expression of the NBS-LRR genes may significantly enhance pathogen resistance in recipient plants. It demonstrates that application of CO elicitors for stimulation of these genes may be considered as a promising tool for manipulation with plant resistance."}, {"passage_id": "Discuss.p0006", "text": "The results demonstrate that CO8-DA treatment may affect the hormonal status of pea plants. We have shown that ethylene mediated signaling pathway is up-regulated by CO8-DA. Moreover, a number of genes related to jasmonic acid (JA) and salicylic acid (SA) signaling events were found to be differentially regulated. Analysis of literature data suggests that these pathways are required for plant defense response development as it was shown previously for other plants."}, {"passage_id": "Discuss.p0007", "text": "Calcium signaling plays a key role in plant responses to environmental stimuli. In Arabidopsis, stimulation of PRRs by MAMPs (flg22, elf18, chitin/COs) results in a rapid transient influx of extracellular Ca2+ into the cytosol, followed by the activation of receptor-like cytoplasmic kinases and mitogen-activated protein kinases. Indeed, our results suggest the existence of a signaling pathway from CERK1-like receptor, the LYK9, to intracellular activation of calcium signaling and an MAPK cascade in response to treatment in pea Pisum sativum L. Perception of CO8-DA by pea plant induced the expression of genes related to regulation of calcium signaling in the cells. Among them, the gene encoding glutamate receptor-like channel and calcium-dependent protein kinase were found in our experiments. Here we found two MAPKKKs, the PsMAPKKK5 and PsMAPKKK20, which might function redundantly in the chitin/COs signaling pathway. At the next step, the PsMAPKK6 plays the most important role in the signal transduction pathway that is followed by PsMAPK3/PsMAPK6 activation. In accordance with this suggestion, we showed that PsMAPKKK20-RNAi knockdown may decrease chitin-induced defense marker activation and resistance to pathogenic Fusarium fungus."}, {"passage_id": "Discuss.p0008", "text": "These results were consistent with those in Arabidopsis and rice, where CERK1 elicitation was able to activate signal transduction, including calcium-regulated channels, receptor-like cytoplasmic kinases and mitogen-activated protein kinases, which might regulate the plant resistance. Previously, receptor-like cytoplasmic kinase AtPBL27 was reported to connect CERK1-mediated chitin/COs perception to MAPK cascade activation (AtMAPKKK5) in Arabidopsis. In rice, OsRLCK185 and OsRLCK176 might function redundantly and activate OsMAPKKK18 and OsMAPKKK11, rice orthologs of AtMAPKKK5, in the OsCERK1-induced chitin and peptidoglycan signaling pathways. Therefore, our findings suggest that in pea the calcium signaling regulators and MAPK cascade activated by CO8-DA induce immune responses by phosphorylating a complex of downstream targets."}], "Conclusion": []}}, {"pmcid": "PMC10030974", "title": "Identification of a pluripotency-inducing small compound, PLU, that induces callus formation via Heat Shock Protein 90-mediated activation of auxin signaling", "source_file": "PMC10030974.json", "source_url": "https://pmc.ncbi.nlm.nih.gov/articles/PMC10030974/", "included_counts": {"Abstract": 1, "Introduction": 3, "Discussion": 5}, "omitted_results_discussion": false, "sections": {"Abstract": [{"passage_id": "Abstract.p0001", "text": "Plants retain the ability to generate a pluripotent tissue called callus by dedifferentiating somatic cells. A pluripotent callus can also be artificially induced by culturing explants with hormone mixtures of auxin and cytokinin, and an entire body can then be regenerated from the callus. Here we identified a pluripotency-inducing small compound, PLU, that induces the formation of callus with tissue regeneration potency without the external application of either auxin or cytokinin. The PLU-induced callus expressed several marker genes related to pluripotency acquisition via lateral root initiation processes. PLU-induced callus formation required activation of the auxin signaling pathway though the amount of active auxin was reduced by PLU treatment. RNA-seq analysis and subsequent experiments revealed that Heat Shock Protein 90 (HSP90) mediates a significant part of the PLU-initiated early events. We also showed that HSP90-dependent induction of TRANSPORT INHIBITOR RESPONSE 1, an auxin receptor gene, is required for the callus formation by PLU. Collectively, this study provides a new tool for manipulating and investigating the induction of plant pluripotency from a different angle from the conventional method with the external application of hormone mixtures."}], "Introduction": [{"passage_id": "Introduction.p0002", "text": "Since plants are sessile organisms, they have developed mechanisms thorough evolution that enable flexible responses to ever-changing internal and external situations. One of such abilities is a high degree of plasticity for changing developmental programs. Plants can generate a pluripotent tissue called callus by dedifferentiating somatic cells. In nature, a callus is a mass of highly proliferative cells mainly for injury repair and occasionally acts as a site for pluripotency acquisition to regenerate organs. A pluripotent callus can also be artificially induced from explants using a callus-inducing medium (CIM) which contains appropriate concentrations of auxin and cytokinin at a high auxin/cytokinin ratio. Shoot tissues can then be regenerated by transferring the callus to a cytokinin-rich shoot-inducing medium (SIM). This methodology has been widely used, from basic genetic technologies to agricultural applications. However, because the success of callus induction for many plant species still requires time-consuming attempts with changing the amount and ratio of applied hormones for each species, the development of alternative pluripotency induction methodologies will help overcome this situation by complementing the conventional methodology."}, {"passage_id": "Introduction.p0003", "text": "Callus induction by CIM partly shares processes with lateral root formation. The formation of lateral root primordia is initiated by the division of differentiated pericycle cells adjacent to protoxylem cells, called xylem pole pericycle (XPP) cells. CIM induces the formation of XPP-like cells even if the starting explant is derived from any organs, and the formed callus initial exhibits a lateral-root-primordia-like structure. CIM-induced callus formation is suppressed in mutants incapable of lateral root initiation, indicating that CIM requires the activation of a lateral root development program for callus induction. The ability of auxin to trigger lateral root initiation underlies the fact that auxin is an essential ingredient of CIM to initiate callus formation. Callus tissues express genes involved in the formation and maintenance of root meristem such as WUSCHEL-RELATED HOMEOBOX 5 (WOX5), SCARECROW (SCR), PLETHORA (PLT) family, and these genes play important roles in establishing pluripotency. When a callus is transferred to SIM, the established pluripotency in the callus enables shoot regeneration that reconstructs shoot meristems and develops shoot tissues. However, although molecular mechanisms for pluripotency induction have been gradually revealed, the current understanding is mainly based on reports on CIM- or wound-induced calli. Therefore, approaches without hormone treatment or wounding may reveal as-yet-unknown mechanisms of pluripotency induction."}, {"passage_id": "Introduction.p0004", "text": "In this study, we identified a novel pluripotency-inducing small compound, PLU, that induces the formation of callus with tissue regeneration potency without external application of either auxin or cytokinin. PLU-induced callus formation required activation of the auxin signaling pathway despite the reduction in the amount of active auxin. Further analyses revealed that Heat Shock Protein 90 (HSP90) mediates a significant part of PLU-initiated early responses, and that PLU potentiates auxin signaling via activation of expression of auxin receptor genes in an HSP90-dependent manner. Collectively, this study provides novel insights and a new tool for understanding and manipulating the induction of plant pluripotency."}], "Discussion": [{"passage_id": "Discuss.p0002", "text": "CIM, which has been used for artificial callus induction, requires externally supplemented auxin and cytokinin to induce pluripotency. Although PLU does not require the external application of either auxin or cytokinin to initiate the formation of pluripotent callus, PLU potentiates responsiveness to endogenous auxin by inducing the expression of auxin receptors. However, only activation of auxin signaling is considered insufficient to induce pluripotency. It was reported that, although TIR1 overexpression enhances the sensitivity to auxin, overexpression of TIR1 or AFBs do not cause callus formation. It is likely that, though auxin responses are required for callus induction, the TIR1 overexpression alone is insufficient to cause callus induction. Like cytokinin in the case of CIM, another additional factor(s) would be required to effectively induce callus formation. In this regard, the sugar-type preference of PLU for the pluripotency induction may be noteworthy. It is known that the glucose/sucrose ratio affects growth and development and that sugar signaling is complexly intertwined with cytokinin signaling. Exploring a mechanism underlying the sugar-type preference of PLU may lead to understanding why PLU can effectively induce pluripotency without the external application of cytokinin."}, {"passage_id": "Discuss.p0003", "text": "Cis-element analysis and following experiments revealed the overrepresentation of the HSE motif among PLU-upregulated genes and the requirement of HSP90 for PLU-initiated callus formation. A variety of internal and external stresses, as well as heat stress, modulate HSP90 activity. HSP90 proteins, which pre-exist in cells, initiate downstream events in response to stresses. Because our RNA-seq data indicates no rapid change in HSP90 expression after PLU treatment, PLU likely modulates the activity of pre-existing HSP90 proteins. The unidentified direct target of PLU may be a factor acting in the machinery that modulates HSP90 activity in response to specific stress. Because HSP90 functions by forming context-specific protein complexes, it would be interesting to investigate whether PLU influences HSP90-including protein complexes and what context-specific complex PLU modulates."}, {"passage_id": "Discuss.p0004", "text": "PLU induces expression of TIR1/AFB-family genes in an HSP90-dependent manner. It was reported that heat stress enhances the TIR1 activity by stabilizing TIR1 proteins via HSP90. However, despite the overrepresentation of the HSE motif among PLU-upregulated genes, PLU treatment did not induce apparent heat responses such as enhanced elongation of hypocotyls. Because a variety of stresses such as osmotic stress, drought, and pathogens can affect the transcription of TIR1/AFB-family genes, PLU may modulate some stress-related pathway other than heat. Combined with the report that HSP90 stabilizes TIR1 proteins upon heat stress, PLU may synergistically activate TIR1 in an HSP90-dependent manner by both the transcriptional level and the protein stability level."}, {"passage_id": "Discuss.p0005", "text": "Other possible mechanisms for the mode of action of PLU may include the modulation of auxin transport. True leaves of PLU-treated seedlings exhibited a venation pattern similar to those with defects in auxin transport. Unlike IAA that can directly and globally affect downstream genes and, therefore, can rapidly activate DR5 responses, PLU may modulate a mechanism that can affect the expression of only a part of auxin-regulated genes ( Figure S3 ). Auxin transport could be involved in this partial effect of PLU on auxin-regulated genes."}, {"passage_id": "Discuss.p0006", "text": "Although artificial induction of callus by CIM containing auxin and cytokinin is a general procedure for plant transformation and some agricultural applications, the production of pluripotent callus is still challenging for many plant species. Another small compound, fipexide (FPX), was also reported to promote callus formation and shoot regeneration in plants, and the mode of action of FPX seems different from that of PLU or CIM because FPX forms pluripotent tissues without vasculatures, while PLU and CIM induce those with vasculatures ( Figure 1F ). Further exploring details of pluripotency-inducing mechanisms activated by these novel compounds, including analysis of which parts or functional groups in their chemical structures are critical for their activities, may lead to developing alternative pluripotency induction methodologies that complement the conventional methodology. Because these compounds contain an amide linkage, which could be cleaved in plants, they may become active forms by being cleaved in plants. It would be noteworthy that their possible chemical structures after the presumable cleavage of the amide linkage can commonly retain the same moiety as the side chain of 2,4-D, a synthetic auxin. In this scenario, the identification of actual in planta structures of such auxin-like forms after the cleavage may provide further insights into the understanding of the mode of action of these compounds and facilitate the applied usage of these compounds."}], "Conclusion": []}}, {"pmcid": "PMC10031092", "title": "Editorial: Sorghum and pearl millet as climate resilient crops for food and nutrition security, volume II", "source_file": "PMC10031092.json", "source_url": "https://pmc.ncbi.nlm.nih.gov/articles/PMC10031092/", "included_counts": {"Introduction": 12}, "omitted_results_discussion": false, "sections": {"Abstract": [], "Introduction": [{"passage_id": "Introduction.p0001", "text": "Achieving global food and nutritional security in the 21st century is challenging as it coincides with climate change and economic vulnerabilities. The reliance on major food crops, i.e. wheat, rice and maize, contributing to 60% of plant-based calories in the entire human diet, further threatens food security. Therefore, it is of utmost importance to explore more native crops, often called orphan crops, and find alternative solutions to address food security. The Food and Agriculture Organization of the United Nations (FAO) has declared 2023 as the International Year of Millets (IYOM) to coordinate agricultural research across continents to scale up the production of alternative nutritious crops and foods. Sorghum and millets are gluten-free, nutrient-rich food crops with a low glycemic index (GI). These grow in marginal areas prone to drought where water-intensive major crops sometimes fail to grow. Sorghum is an important cereal crop grown in south Asia and Africa; it belongs to the same family of Poaceae as millets. Global millet initiatives and biofortification networks are working towards reaching one billion people with biofortified crops by 2030. The current research topic on Sorghum and Pearl millet as Climate Resilient Crops for Food and Nutrition Security, Volume II, comes at the right time to nurture scientific evidence for millet and sorghum research and development, products and promotions. This volume comprises eight manuscripts and aims to provide new insights into the breeding approaches, precision phenotyping, genetic resources, molecular analysis, physiological analysis, biotic stress adaptation mechanisms, nutritional aspects, abiotic stress resistance and gene mapping for the improvement and understanding of the fundamentals of these highly important climate-smart crops."}, {"passage_id": "Introduction.p0002", "text": "Pearl millet"}, {"passage_id": "Introduction.p0003", "text": "Pearl millet is one of the most produced and consumed cereal crops in Sub-Saharan Africa. This climate-resilient crop is often called a climate-smart crop. During its reproductive phase, it thrives under all adverse environmental conditions such as salinity, drought and extreme heat. Recent evidence has also shown the role of pearl millet in mediating biological nitrification inhibition (BNI) under drought stress. This crop is a multipurpose cereal that provides food and nutrition to undeveloped and developing nations across the globe. In our previous editorial on sorghum and pearl millet as climate-resilient crops for food and nutrition security, we have provided an overview of how these crops can help fight the climate crisis and feed almost 10 billion people by 2050."}, {"passage_id": "Introduction.p0004", "text": "Today, Pearl millet is considered one of the important crops to face global warming. Flowering time (FT) is one key trait that could be modulated to face future global changes. In the study by Faye et al., where West African 109 pearl millet landraces accessions were grouped into 66 early-flowering (EF) and 43 late-flowering (LF) varieties, the main aim was to detect genes linked to flowering in general and for traits within each flowering group. The phenotypic diversity and the genomic data of these landraces provided evidence of the role of PhyC gene in flowering in addition to other genes such as FSR12 and HAC1. HAC1 and two other genes (FSR12, Hd16) were in QTLs identified on chromosome 2. In another study, iron (Fe) and zinc (Zn) contents and their combined abilities in West African Pearl millet lines were evaluated (Gaoh et al.). This study selected eight diverse collections based on grain Fe and Zn content, based on agronomic and morphological traits, two landraces and six open-pollinated varieties evaluated. A highly positive correlation was found between grain Fe content and grain Zn content in parental lines and hybrids, suggesting these traits could be improved simultaneously in a variety. The hybrid ICMV 167006 × HKP (2.3 t/ha) was identified as the highest-yielding and most stable hybrid across environments by the GGE biplot (Gaoh et al.). Moreover, enhancing the Fe and Zn content in food grains through plant breeding is a sustainable and economical solution to tackle micronutrient deficiency (approach so-called biofortification) in Asia and Africa, where the resources are very less. For this, three CMS lines along with ten restorers (testers) of pearl millet were used with 31 hybrids to assess the genetic potential to increase the bioavailability of Fe/Zn content. The manifestation of heterosis in F1 provided various cross-combinations that may be guided to enhance the population’s Fe/Zn profile by combining ability tests. A plant population with enhanced Fe/Zn bioavailability, higher grain yields, higher grain Fe/Zn content, and lower phytate content can be designed by delaying cross-combination selection until later generations (Thribhuvan et al.). Many studies indicated that optimizing phytates in the seed is more appropriate than significantly reducing phytate levels, as most plant phosphorous is stored as phytate, which is essential for root growth and development."}, {"passage_id": "Introduction.p0005", "text": "Pearl millet is commercially underutilized due to the rapid onset of hydrolytic rancidity of seed lipids post-milling, here the authors have investigated the underlying molecular and biochemical mechanisms of rancidity development in the flour from inbred lines of contrasting genotypes under accelerated ageing conditions (Aher et al.). In this study, the authors have reported the breakdown of storage lipids (triacylglycerols; TAG) and free fatty acid accumulation over the time course for 12 inbred lines, out of which the high rancidity lines had the highest amount of FFA in 21 days, suggesting that TAG lipases may be the cause of rancidity (Aher et al.). Substantial amounts of volatile aldehyde compounds were observed in the high rancidity lines, which are characteristic products of lipid oxidation. Lipases expressed in seed post-milling were sequenced from low and high rancidity lines. Polymorphisms were identified in two TAG lipase genes (PgTAGLip1 and PgTAGLip2) from the low rancidity line. Therefore, these genetic variations can be exploited through marker-assisted breeding or precision genome editing technologies (CRISPR-based approaches) to develop pearl millet elite cultivars with improved flour shelf life creating profits for smallholder farmers and improved markets in South Asia and Sub-Saharan Africa (Aher et al.)."}, {"passage_id": "Introduction.p0006", "text": "Pearl millet is a unique cereal which can withstand prolonged drought and heat stress. Aquaporin (AQP) genes actively involve desiccation tolerance and water transport. Their potential role in abiotic stress tolerance was functionally validated and systematically characterized (Reddy et al.). This study identifies 34 AQP genes in pearl millet, which are grouped into four subfamilies, including 11 PIPs (plasma membrane intrinsic proteins), 9 TIPs (tonoplast intrinsic proteins), 11 NIPs (nodulin-26-like intrinsic proteins), and 3 SIPs (small basic intrinsic proteins). Phylogenetic relationship within the subfamilies of PgAQPs and between AQPs of related species shows their evolutionary relationship and possible functions with their localizations, mainly in the plasma membrane."}, {"passage_id": "Introduction.p0007", "text": "Further sequence analysis revealed that PgAQPs are similar to the AQP genes in sorghum. The PgAQPs were expressed differentially under high VPD (vapour pressure deficit) and progressive drought stresses where the PgPIP2 expression was observed; under high VPD and drought stress, six genes showed significant expression (Reddy et al.). Transgenics exhibited better tolerance due to lower Tr (transpiration rate) when compared to WT plants under heat and drought stress. Constitutive expression of pearl millet aquaporin PgPIP2; 6 in tobacco seemed to impart abiotic stress tolerance with reduced transpiration, thereby assisting in water conservation. Tissue-specific or stress-inducible promoters for more specific AQP expression levels can further improve stress tolerance. This study has shown that the molecular breeding of pearl millet is now possible, especially for generating abiotic stress-tolerant cultivars (Reddy et al.). The major biotic stress in pearl millet is the blast or leaf spot disease caused by the ascomycete fungus Magnaporthe grisea (Herbert) Barr. This has recently become an economic concern in India (Singh et al.). The present study explains through RNA-Seq and investigates the transcript dynamics in the inbred ICMB 93333 genotype, which had a unique differential reaction to two isolates—Pg 45 (avirulent) and Pg 174 (virulent) of M. grisea. The transcriptome results identified 2,300 differentially expressed genes (DEGs) which showed activation or repression of specific genes in various pathways consisting of cell wall defense, pathogenesis-related proteins (PR), primary and secondary metabolic pathways, reactive oxygen species and signalling pathways, which were identified by comparing the host-plant compatible and incompatible interactions. These genes will be searched for their functional SNPs and help develop tolerant variety through marker-assisted breeding (Singh et al.)."}, {"passage_id": "Introduction.p0008", "text": "Foxtail millet"}, {"passage_id": "Introduction.p0009", "text": "In foxtail millet, downy mildew is caused by Sclerospora graminicola; leaf cracking and yellowing symptoms develop throughout the leaf surface when infected by this parasite. To identify this pathogenic disease, authors explored the effects on chlorophyll synthesis and photosynthesis of leaves infected by S. graminicola. An elite foxtail millet variety, JG21, sensitive to S. graminicola, was used. S. graminicola inhibited chlorophyll synthesis and caused loose mesophyll cell arrangement (Zhang et al.). Carotenoid content, chlorophyll, net photosynthetic rate (Pn) of leaves and stomatal conductance in infected leaves decreased significantly, and intercellular CO2 contents increased. One thousand six hundred eighteen DEGs were detected at five different stages of plant growth. Photosynthesis and light reaction-associated genes were enriched. Based on the weighted gene co-expression network analysis (WGCNA) with 19 gene co-expression modules related to photosynthesis revealed, six hub genes related to chlorophyll synthesis were found suppressed during infection. Weak chlorophyll synthesis and rapid chloroplasts disappearance in foxtail millet was observed succeeding the infection of S. graminicola, defence responses and resistance of foxtail millet to S. graminicola were inhibited, and the sexual reproduction in S. graminicola could be completed rapidly (Zhang et al.)."}, {"passage_id": "Introduction.p0010", "text": "Sorghum"}, {"passage_id": "Introduction.p0011", "text": "Sorghum is a C4 photosynthetic, climate-resilient crop producing grain and fodder in harsh environmental conditions. It performs best under temperature and water constraints. Sorghum is a staple food for more than 200 million people in Africa and Asia; productivity of sorghum in India is low due to shoot flies, drought and grain mold; therefore, in this study, authors have checked the genetic progress made over 30 years and assessed the steps that should be taken to facilitate future genetic improvement (Nagesh Kumar et al.). To achieve the goal, 24 high yielding varieties with better nutritional characteristics and tolerance to shoot fly and grain mold were evaluated in the Telangana state field of India. The study reports a high overall genetic gain of 44.93 kg/ha/yr and 331.63 kg/ha/yr for grain yield and fodder yield, respectively, over the first released sorghum variety CSV 15. The study revealed that sorghum genotypes bred with diverse genetic and physiological backgrounds, such as landraces and with tolerance to pests and diseases, had stable yield performance (Nagesh Kumar et al.)."}, {"passage_id": "Introduction.p0012", "text": "The above contributions of the research ideas and implementation to this research topic led to valuable cues for a better understanding of sorghum and millets withstanding the climate crisis. These results can facilitate successful breeding for sorghum and pearl millet in the near future. To better understand these crops, combined efforts among upstream research, variety/genotype improvement, and field management are required. Finally, we greatly appreciate and sincerely thank the efforts of the journal editors, peer reviewers, and authors. This volume would not have been possible without their significant efforts and contribution. We hope our readers can identify valuable information from this volume and find appropriate collaborators to conduct and promote their great success."}], "Discussion": [], "Conclusion": []}}, {"pmcid": "PMC10031741", "title": "A D-cysteine desulfhydrase, SlDCD2, participates in tomato fruit ripening by modulating ROS homoeostasis and ethylene biosynthesis", "source_file": "PMC10031741.json", "source_url": "https://pmc.ncbi.nlm.nih.gov/articles/PMC10031741/", "included_counts": {"Abstract": 1, "Introduction": 6, "Discussion": 8}, "omitted_results_discussion": false, "sections": {"Abstract": [{"passage_id": "Abstract.p0002", "text": "Hydrogen sulfide (H2S) is involved in multiple processes during plant growth and development. D-cysteine desulfhydrase (DCD) can produce H2S with D-cysteine as the substrate; however, the potential developmental roles of DCD have not been explored during the tomato lifecycle. In the present study, SlDCD2 showed increasing expression during fruit ripening. Compared with the control fruits, the silencing of SlDCD2 by pTRV2-SlDCD2 accelerated fruit ripening. A SlDCD2 gene-edited mutant was constructed by CRISPR/Cas9 transformation, and the mutant exhibited accelerated fruit ripening, decreased H2S release, higher total cysteine and ethylene contents, enhanced chlorophyll degradation and increased carotenoid accumulation. Additionally, the expression of multiple ripening-related genes, including NYC1, PAO, SGR1, PDS, PSY1, ACO1, ACS2, E4, CEL2, and EXP was enhanced during the dcd2 mutant tomato fruit ripening. Compared with the wild-type fruits, SlDCD2 mutation induced H2O2 and malondialdehyde (MDA) accumulation in fruits, which led to an imbalance in reactive oxygen species (ROS) metabolism. A correlation analysis indicated that H2O2 content was strongly positively correlated with carotenoids content, ethylene content and ripening-related gene expression and negatively correlated with the chlorophyll content. Additionally, the dcd2 mutant showed earlier leaf senescence, which may be due to disturbed ROS homeostasis. In short, our findings show that SlDCD2 is involved in H2S generation and that the reduction in endogenous H2S production in the dcd2 mutant causes accelerated fruit ripening and premature leaf senescence. Additionally, decreased H2S in the dcd2 mutant causes excessive H2O2 accumulation and increased ethylene release, suggesting a role of H2S and SlDCD2 in modulating ROS homeostasis and ethylene biosynthesis."}], "Introduction": [{"passage_id": "Introduction.p0002", "text": "Hydrogen sulfide (H2S) is emerging as a signaling molecule in all living organisms. Accumulating evidence over the past decades has shown that H2S participates in a vast number of physiological processes critical for plant growth and development, such as stomatal movement, flowering, and responses to abiotic stresses. Furthermore, multiple studies have revealed that H2S can delay leaf and flower senescence and prevent the ripening of fruits, such as strawberry, tomato, and kiwifruit, by modulating the antioxidant system and antagonizing the ethylene pathway. For example, H2S could maintain the freshness of cut flowers by reducing the oxidative damage caused by excessive reactive oxygen species (ROS). Hu et al. revealed that the senescence of mulberry fruit is delayed by exogenous H2S treatment and that the mechanism is related to the enhanced activity of antioxidant enzymes. Additionally, H2S counteracts the biological effect of ethylene and thereby alleviates the ripening and senescence of banana and tomato during postharvest storage. Previous research has mainly revealed the mechanism through which exogenous H2S prevents fruit ripening, but the influence of endogenous H2S in fruit ripening still needs further investigation."}, {"passage_id": "Introduction.p0003", "text": "In higher plants, H2S emission has long been observed in pumpkin, cucumber, cantaloupe, corn, and others. Currently, H2S can be generated during sulfur assimilation and cysteine decomposition. In the sulfate assimilation pathway, H2S is formed mainly through sulfite reductase (SiR), and sulfide is then integrated into the first organic sulfur-containing molecule cysteine by O-acetylserine thiol lyase (OAS-TL). Via another route, H2S is generated from L-cysteine by the catalysis of L-cysteine desulfhydrase (LCD) or from D-cysteine by D-cysteine desulfhydrase (DCD), but the two enzymes are not structurally related and are evolutionarily independent. DCD catalyzes the production of H2S from D-cysteine, which was first reported in Escherichia coli. Two putative DCD homologous genes were later found in Arabidopsis, and these are called AtDCD1 (At1g48420) and AtDCD2 (At3g26115). DES1, a member of the OAS-TL family, is regarded as the main cysteine desulfhydrase in the cytosol of Arabidopsis cells. In addition, β-cyanoalanine synthase (CAS) produces H2S during the detoxification of cyanide. The common characteristic of these cysteine desulfhydrases is that they all use pyridoxal 5′-phosphate (PLP) as the cofactor. The mutation of DES1 or SiR as an endogenous H2S-generating enzyme results in early leaf senescence, which suggests that endogenous H2S may be a signal that influences the senescence process of plants."}, {"passage_id": "Introduction.p0004", "text": "Cysteine plays a critical role in plant primary and secondary metabolism through its incorporation into proteins and integration into sulfur-containing defense compounds. L-cysteine, not D-cysteine, is the amino acid stereoisomer that is incorporated into peptides. D-amino acids have come to be regarded as physiological signaling molecules in mammals, particularly in the central nervous system. For instance, endogenous D-cysteine in the mammalian brain acts as a negative impact factor of growth factor signaling during cortical development. In plants, D-cysteine can be assembled into camalexin, which confers toxicity to several species of fungi. DCD activity can be detected in multiple plants, such as Arabidopsis, Spinacia oleracea, Chlorella fusca, and Nicotiana tabacum, which suggests the presence of D-cysteine in plants. A serine/aspartate racemase has been identified as being involved in the generation of D-serine/aspartate in plants, but the potential for a cysteine racemase in plants has not yet been reported. The cysteine concentrations in the cytosol, which is the major site of cysteine synthesis, are estimated to be greater than 300 μM, whereas other cell compartments, such as the chloroplast and mitochondrion, each contain less than 10 μM cysteine. The concentrations of free D-amino acids such as D-Asp, D-Asn, D-Glu, and D-Gln are approximately 0.2% to 8% relative to the corresponding L-amino acids in plants; however, cysteine data were not provided. Therefore, research on D-amino acids or their related metabolism in plants is an emerging field with many open questions."}, {"passage_id": "Introduction.p0005", "text": "In Arabidopsis, Cd-induced WRKY13 promotes the production of H2S by binding to the DCD (gene encoding DCD) promoter and thereby enhances plant tolerance to Cd. In our previous study, we found that a SlLCD1 gene-edited mutant displays premature fruit ripening, which suggests that SlLCD1 is a negative impact factor of fruit ripening. The role of SlLCD1 in natural and dark-induced leaf senescence was thus studied, and the results showed that SlLCD1 mutation causes earlier leaf senescence. However, whether DCD participates in tomato fruit ripening and leaf senescence remains unclear."}, {"passage_id": "Introduction.p0006", "text": "Tomato is a typical climacteric fruit and an economically important vegetable worldwide. Fruit ripening is associated with changes in metabolic pathways. Pigments, particularly chlorophyll and carotenoids, show substantial changes during tomato fruit ripening that lead to the change in fruit color from green to red. In the ripening process, the degradation of chlorophyll begins with the conversion of chlorophyll b to chlorophyll a. PAO (pheophorbide a monooxygenase) and PPH (pheophytin pheophorbide hydrolase) are then needed for subsequent chlorophyll degradation. In addition, SGR (STAY-GREEN) proteins can affect the degradation of chlorophyll by interacting with chlorophyll-degrading enzymes, and SGR1 in tomato can promote chlorophyll degradation. Tomato fruit ripening is alco accompanied by carotenoids biosynthesis; during this process, phytoene synthase (PSY) is the key rate-limiting enzyme, and phytoene dehydrogenase (PDS) is involved in subsequent steps leading to the formation of lycopene. Among plant hormones, ethylene elicits profound metabolic changes during tomato fruit ripening. During the ripening process, the ACC synthase- and ACC oxidase-encoding genes ACS1, ACS2, ACS4, ACO1, and ACO3 show increasing expression, which suggests their important roles in tomato fruit ripening. In a biological context, ROS, which are byproducts of natural aerobic metabolism, are composed of superoxide anion (O2•−), hydrogen peroxide (H2O2), and hydroxyl radicals (·OH), which have been previously associated with oxidative stress. However, accumulating evidence has revealed that ROS also operate as intracellular signaling molecules that participate in multiple physiological processes. During peach fruit ripening, O2•− is required at the middle stage of fruit development, and H2O2 acts as a potential signaling molecule to stimulate the late stage of fruit development. In addition, H2O2 is a signaling molecule that accumulates during the ripening of nectarine fruit and at the beginning of grape berry ripening. Oxidative stress is also an integrative factor for triggering tomato fruit ripening, which suggests the signaling role of oxidants in initiating fruit ripening."}, {"passage_id": "Introduction.p0007", "text": "The interaction of H2S with other signals such as ethylene and ROS has attracted increasing attention. H2S alleviates oxidative stress by dynamically modulating antioxidant enzyme systems and antagonizing the effect of ethylene; however, the mechanism through which endogenous H2S affect ROS homeostasis and ethylene biosynthesis during fruit ripening is largely unclear. Thus, in the present work, the function of SlDCD2 in tomato fruit ripening was investigated by virus-induced gene silencing (VIGS) and CRISPR/Cas9-mediated gene editing. In addition, the effect of SlDCD2 mutation on ROS homeostasis and ethylene biosynthesis was studied to reveal the role of SlDCD2 and H2S in modulating ROS and ethylene metabolism."}], "Discussion": [{"passage_id": "Discuss.p0002", "text": "In our previous study, the SlLCD1 gene-edited mutant displayed accelerated fruit ripening and earlier leaf senescence, suggesting that SlLCD1 is a negative impact factor of fruit ripening and leaf senescence. However, the role of DCD in tomato fruit ripening and leaf senescence remains unclear. In the present work, the proteins in S. lycopersicum, A. thaliana, V. vinifera, and G. max that are homologous to AtDCD1 (AT1G48420) were obtained. SlDCD1/2 show high homology with homologs in grapevine, and SlDCDs are evolutionarily closer to VvDCDs. Previous studies have shown that the application of exogenous H2S effectively alleviates postharvest senescence in grape, but whether DCD influences grape ripening and senescence is unclear."}, {"passage_id": "Discuss.p0003", "text": "Because SlDCD2 expression shows an increasing trend during fruit ripening, we propose that SlDCD2 may be involved in fruit ripening. First, the expression of SlDCD2 was transiently silenced by VIGS, and accelerated fruit ripening was observed in TRV2-SlDCD2 fruits compared with fruits carrying the empty vector. The expression of SlDCD2 in SlDCD2-slicenced fruits was approximately half that found in the control fruits, suggesting the efficiency of the gene silencing. Additionally, the chlorophyll content in the SlDCD2-silenced fruits degraded more rapidly than that in the control fruits, and greater carotenoids accumulation was detected in SlDCD2-silenced fruits. In addition, SlDCD2 silencing increased the expression of the chlorophyll degradation genes NYC1, PAO, and SGR1, the carotenoids synthesis genes PSY1 and PDS, the ethylene synthesis genes ACO1, ACS2, and E4, and the cell wall metabolism gene CEL2, suggesting the potential negative role of SlDCD2 in fruit ripening."}, {"passage_id": "Discuss.p0004", "text": "The role of SlDCD2 was confirmed by stable SlDCD2 gene editing of tomato lines using CRISPR/Cas9 technology. Both dcd2-1 and dcd2-5 showed decreased H2S release, accelerated fruit ripening and an increase in the content of cysteine. D-cysteine and L-cysteine were supplied as substrates for the dcd2-1 and dcd2-5 mutants, and the mutants only showed decreased H2S production when the substrate was D-cysteine. In addition, the substrate selectivity was confirmed by purified SlDCD2 protein, which only used D-cysteine as the substrate. However, AtDCD2 was found to catalyze the production of H2S from both D-cysteine and L-cysteine, suggesting that the function of DCD2 is not highly conserved in Arabidopsis and tomato. The levels of chlorophyll and carotenoids in the dcd2 mutant fruits were analysed, and the results indicated that SlDCD2 mutation caused accelerated chlorophyll degradation and premature carotenoids biosynthesis."}, {"passage_id": "Discuss.p0005", "text": "Previous studies indicate that H2S delays fruit ripening by antagonizing the effect of ethylene. The results show that H2S prolongs the postharvest ripening and senescence of banana during storage by antagonizing the effect of ethylene. In the present study, the ethylene content in dcd2-1 fruits was significantly higher than that in WT fruits. The correlation analysis indicated a negative correlation between H2S produced with either L-cysteine or D-cysteine as the substrate and the ethylene content. In addition, exogenous ethylene treatment decreased the expression of SlDCD2 compared with that obtained with the control treatment. Therefore, mutation of SlDCD2 may induce enhanced ethylene biosynthesis and thereby accelerate fruit ripening, which further suggests the antagonizing effect between H2S and ethylene."}, {"passage_id": "Discuss.p0006", "text": "The effect of reduced H2S on the expression of ripening-associated genes was also evaluated in the dcd2 mutant. The expression of NYC1, SGR1, and PAO was highly upregulated during dcd2 fruit ripening. In addition, the expression of the carotenoids biosynthesis genes PSY1 and PDS was upregulated in dcd2 mutant fruits. Tomato fruit ripening is also accompanied by increases in ethylene synthesis and cell wall degradation. The present study indicates that ACO1, ACS2, and E4 were all expressed at obviously higher levels in dcd2 than that in WT tomato fruits. Our data also show that the dcd2 mutant showed increased expression of CEL2 and EXP."}, {"passage_id": "Discuss.p0007", "text": "Exogenous H2S was found to delay the ripening and senescence of multiple plants by reducing excessive ROS. The production of ROS during fruit ripening and senescence is natural and unavoidable due to imbalanced metabolism. However, how endogenous H2S affects ROS homeostasis remains unclear. Therefore, we determined the ROS content during fruit ripening. The data indicate that H2O2 was significantly increased in both WT and dcd2-1 fruits during fruit ripening and that the content in dcd2-1 fruits was clearly higher than that in WT fruits. The production of O2•− did not significantly differ between WT and dcd2-1 plants. The dcd2-1 mutants also showed increased MDA contents compared with the WT at 36 and 39 DPA. In a previous study, Pilati et al. observed a rapid accumulation of H2O2 during grape ripening, which may be associated with grape softening and ripening. In addition, the H2O2 levels linearly increased as the nectarine fruit developed and ripened on trees. The promoting effect of H2O2 on fruit ripening has also been observed in pears. In the present study, H2O2 was increased at 39 DPA in dcd2-1 fruits, which had just completed their transition from the breaker to the red stage. Consistently, previous studies observed elevations in the H2O2 levels in tomatoes, which also exhibited changes in their skin color. Therefore, fruit ripening appears to be positively associated with H2O2. The results indicate that H2O2 is the ROS signal that participates in the tomato fruit ripening process. Additionally, the enzymatic activities of SOD, CAT, APX, and POD were analysed, and the results showed that SOD activity in dcd2-1 fruits was always higher than that in WT fruits during fruit ripening. CAT and APX activity could help alleviate oxidative damage by reducing the H2O2 levels to below toxic levels, and compared with that in the WT plants, dcd2 mutation resulted in significant decreases in CAT and APX activities at 36 DPA. POD activity in both WT and dcd2-1 fruits decreased gradually during fruit ripening, whereas the activity in dcd2-1 fruits was significantly higher than that in WT fruits. SOD catalyzes the dismutation of O2•− to molecular oxygen and H2O2, and CAT decomposes H2O2. The levels of O2•− and H2O2 are controlled by the activity of different antioxidative enzymes. As revealed in the current study, dcd2 mutation caused higher SOD activity and lower CAT activity, which may act synergistically to produce excessive H2O2. In addition, the H2O2 level increased significantly during fruit ripening, which also supports the role of H2O2 in fruit ripening. Overall, SlDCD2 mutation caused H2O2 and MDA accumulation, suggesting that the lower level of H2S in dcd2-1 may lead to an imbalance in ROS metabolism and that excessive H2O2 may accelerate fruit ripening. As CAT undergoes persulfidation in the leaves of Arabidopsis, we found decreased CAT activity in dcd2-1 fruits; thus, we propose that an appropriate endogenous level of H2S may provide a microenvironment favorable for the activity of CAT. The results depicted in Fig. 5M and N show that 50 μM NaHS could enhance the activity of CAT in tomato tissues, suggesting that endogenous H2S enhances CAT activity. However, whether the increased CAT activity is caused by protein persulfidation still needs further research."}, {"passage_id": "Discuss.p0008", "text": "To reveal the potential association among the parameters, the correlations among the chlorophyll a, chlorophyll b, total chlorophyll, and carotenoid contents, H2O2 content, O2•− production rate, MDA content and gene expression of NYC1, PAO, SGR1, PDS, PSY1, ACO1, ACS2, E4, CEL2, and EXP were analyzed. The results indicate that the chlorophyll content was negatively correlated with the expression of ripening- and senescence-related genes, whereas the carotenoids content was positively related to the expression of these genes. Moreover, the chlorophyll content was negatively correlated with the H2O2 content, but no obvious correlation was found between the O2•− production rate and the MDA content. In addition, H2O2 was positively correlated with the carotenoids content and the expression of all ripening-related genes. Therefore, H2O2 is the key ROS that promotes fruit ripening because a strong positive correlation was found between H2O2 and the carotenoids content and ripening-related gene expression. However, the O2•− production rate and MDA content were not significantly related to fruit ripening. Therefore, we provide strong evidence showing that H2O2 is the ROS that modulates fruit ripening and that H2S reduction is associated with excessive H2O2 accumulation. The interaction between H2S and H2O2 is complex. H2S was found to facilitate the generation of H2O2 by increasing NADPH oxidase at the transcriptional and enzymatic levels. However, the function of H2S in fruit ripening involves the removal of excessive H2O2. The role of H2S in modulating ROS homeostasis was also studied in dcd2 leaves, and the data indicate that the dcd2 mutant exhibited earlier leaf senescence. In addition, dcd2 mutation caused a higher level of H2O2, whereas the production of O2•− did not significantly differ between WT and dcd2 leaves."}, {"passage_id": "Discuss.p0009", "text": "In summary, we found that SlDCD2 is involved in H2S generation and that the reduction in endogenous H2S results in accelerated fruit ripening and earlier leaf senescence. Additionally, the decreased H2S level in the dcd2 mutant caused excessive H2O2 accumulation and increased ethylene release, suggesting the role of H2S and SlDCD2 in regulating ROS homeostasis and ethylene biosynthesis. In addition, we provide strong evidence showing that H2O2 is the key form of ROS that participates in fruit ripening."}], "Conclusion": []}}, {"pmcid": "PMC10031744", "title": "Development of homozygous tetraploid potato and whole genome doubling-induced the enrichment of H3K27ac and potentially enhanced resistance to cold-induced sweetening in tubers", "source_file": "PMC10031744.json", "source_url": "https://pmc.ncbi.nlm.nih.gov/articles/PMC10031744/", "included_counts": {"Abstract": 1, "Introduction": 4, "Discussion": 9}, "omitted_results_discussion": false, "sections": {"Abstract": [{"passage_id": "Abstract.p0002", "text": "Polyploid plants typically display advantages on some agronomically important traits over their diploid counterparts. Extensive studies have shown genetic, transcriptomic, and epigenetic dynamics upon polyploidization in multiple plant species. However, few studies have unveiled those alternations imposed only by ploidy level, without any interference from heterozygosity. Cultivated potato is highly heterozygous. Thus, in this study, we developed two homozygous autotetraploid lines and one homozygous diploid line in parallel from a homozygous diploid potato. We confirmed their ploidy levels using chloroplast counting and karyotyping. Oligo-FISH and genome re-sequencing validated that these potato lines are nearly homozygous. We investigated variations in phenotypes, transcription, and histone modifications between two ploidies. Both autotetraploid lines produced larger but fewer tubers than the diploid line. Interestingly, each autotetraploid line displayed ploidy-related differential expression for various genes. We also discovere
