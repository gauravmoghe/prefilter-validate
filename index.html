d a genome-wide enrichment of H3K27ac in genic regions upon whole-genome doubling (WGD). However, such enrichment was not associated with the differential gene expression between two ploidies. The tetraploid lines may exhibit better resistance to cold-induced sweetening (CIS) than the diploid line in tubers, potentially regulated through the expression of CIS-related key genes, which seems to be associated with the levels of H3K4me3 in cold-stored tubers. These findings will help to understand the impacts of autotetraploidization on dynamics of phenotypes, transcription, and histone modifications, as well as on CIS-related genes in response to cold storage."}], "Introduction": [{"passage_id": "Introduction.p0002", "text": "Polyploid plants typically display enlarged organ, altered architecture, enhanced growth vigor, and improved tolerance to abiotic stresses, as well as novel phenotypes compared to their diploid progenitors, which thus may not only provide them a fitness advantage for short-term adaptation, but also offer a potential breeding approach to increase yields in crops without gene manipulation. Polyploids typically include autopolyploids and allopolyploids. Autopolyploids are considered to arise within a single species by the doubling of homologous genome, whereas allopolyploids arise through the merging of genomes from different species (hybridization) and subsequent doubling."}, {"passage_id": "Introduction.p0003", "text": "A number of allopolyploid plant species, including important crops, have been well studied, such as bread wheat, Brassica juncea, strawberry, and cotton. Investigations of allopolyploidization in such plant species mainly focus on genetic variation, changes in gene expression and DNA methylation. Since the merge of distinct subgenomes affecting allopolyploid offspring on both ploidy level and heterozygosity, it is challenging to discuss the effect of ploidy level on such changes alone without any interferences from heterozygosity. The example of maize suggests that gene expression is altered by both hybridization and ploidy change. Therefore, whole-genome doubling (WGD) of homozygous diploid plants may provide an ideal system to assess the ploidy level on genetic, gene expression, and epigenetic variations. Compared to allopolyploidization, few studies have been dedicated to investigating the impacts of autopolyploidization on genetic and epigenetic changes. In addition, most of these studies only focus on alternation of DNA methylation as the epigenetic impact caused by autopolyploidization, whereas evidence for changes in histone modifications are limited, such as active histone marks H3K4me3 and H3K27ac, as well as repressive histone mark H3K27me3. Thus, the dynamics of histone modifications upon autopolyploidization remain elusive."}, {"passage_id": "Introduction.p0004", "text": "Potato is the most important non-grain food crop. After harvesting, potato tubers are usually stored at cold temperature to control diseases and prevent sprouting. However, along with the cold storage, starch is broken down into reducing sugars (glucose and fructose) in potato tubers. This process is called cold-induced sweetening (CIS). The accumulation of reducing sugars further results in an unsatisfactory dark color and accumulation of acrylamide in processing potato products with high temperature. CIS is a long-lasting challenge to the potato industry. Successful attempts to improve the resistance to CIS are achieved mainly by silencing/mutating a key gene called vacuolar invertase (VINV) using RNAi, TALENs, and CRISPR-Cas9. However, the regulation of a number of other key genes involved in CIS is unclear. Polyploid plants are often associated with better tolerance to abiotic stresses over their diploid progenitors, such as cold. Thus, understanding the expression and epigenetic regulation of CIS-related genes at different ploidy levels may provide clues for improving resistance to CIS in potato."}, {"passage_id": "Introduction.p0005", "text": "Cultivated potato (Solanum tuberosum, 2n = 4x = 48) is highly heterozygous. However, a doubled monoploid, DM1–3516 R44 (S. tuberosum group Phureja, 2n = 2x = 24, referred to as DM 1–3) with its homozygous and well-sequenced genome has been a valuable source for genetic, cytogenetic, and epigenetic studies. DM 1–3 and its derived tetraploids provide an ideal system and allow us to study the impacts of ploidy levels on genetic and epigenetic variations on a genome-wide scale, with minimal interference from heterozygosity. In this study, we developed two tetraploid potato lines from DM 1–3 through WGD using callus culture. Both tetraploid derivatives displayed phenotypic polymorphisms, including larger tuber size, over the parallel diploid line, which failed in WGD. Chloroplast counting and karyotyping confirmed their ploidy levels. No structural variations were observed between the tetraploid and diploid lines at chromosome level using Oligo-FISH. Genome re-sequencing revealed limited DNA sequence variations among these lines, indicating these potato lines are nearly homozygous. Interestingly, each homozygous tetraploid line displayed ploidy-related differential expression for various genes. We discovered a genome-wide enrichment of H3K27ac in genic regions upon WGD. However, that enrichment was not associated with differential gene expression between two ploidies. The tetraploid lines may exhibit better resistance to CIS than the diploid line, indicated by lower levels of reducing sugars in cold tubers. The differences in reducing sugar content among three potato lines are coincident with the expression of key genes involving in CIS, which seems to be associated with the levels of H3K4me3. Our study will provide useful germplasm and help to understand the impacts of WGD on multiple aspects from phenotypes, chromosomes, to genetic and epigenetic variations, as well as on CIS-related genes in response to cold storage."}], "Discussion": [{"passage_id": "Discuss.p0002", "text": "Phenotypic variations upon WGD"}, {"passage_id": "Discuss.p0003", "text": "WGD in both autopolyploids and allopolyploids can lead to immediate phenotypic, genetic, and epigenetic changes and such polyploids might have adaptive advantage compared to their diploid progenitors. In this study, both autotetraploid potato lines were associated with various phenotypic changes compared to their parallel diploid line (Fig. 1; Table S1, see online supplementary material), which are typical differences commonly found between diploid and polyploid from other plant species. General observations show that tetraploid potato cultivars are associated with higher yield than diploid ones. However, the total tuber yield of two autotetraploid lines in this study was significantly lower than that of the diploid line (Fig. S2b, Table S1, see online supplementary material), although both autotetraploid lines produced larger but fewer tubers (Fig. 1c; Table S1, see online supplementary material). Thus, the elevation of the ploidy level from homozygous diploid to tetraploid might contribute to the average tuber size rather than the total yield. A recent pioneer study in hybrid potato showed that F1 hybrids produced significant higher single plant tuber yield than their homozygous diploid parents, indicating the heterosis may impact the tuber yield. Thus, heterozygous diploid potato may produce comparable tuber yield to the tetraploid one. Deciphering the regulation of key genes between ploidies as well as between diverged subgenomes may provide clues for breeding targets."}, {"passage_id": "Discuss.p0004", "text": "WGD impacts epigenetic modifications in the autotetraploid lines"}, {"passage_id": "Discuss.p0005", "text": "The autotetraploid lines did exhibit sequence differences compared to the diploid line upon WGD (Fig. S4, see online supplementary material). Thus, the autotetraploid lines harbor more genetic diversity over the diploid line. Interestingly, 96% of the DEGs between two ploidies lacked any sequence polymorphisms in their putative promoters and coding regions (Fig. 5), suggesting epigenetic modifications may play a role in regulation of differential expression. However, the variations of all tested histone modifications appear to be not associated with the direction of the differential expression (Fig. S11, see online supplementary material), indicating the DEGs are likely to be regulated by other epigenetic modifications. DNA methylation has been discovered to play a regulatory role in differential expression between ploidies in multiple plant species, such as autotetraploid apple, Aegilops tauschii, Artemisia annua, Arabidopsis thaliana, and rice, implying that it is possible that the differential expression between the autotetraploid and diploid potato lines might be potentially mediated by differential DNA methylation."}, {"passage_id": "Discuss.p0006", "text": "Both autotetraploid lines displayed similar enrichment of H3K27ac in genic regions upon WGD (Fig. 4b). Histone modification H3K27ac is associated with transcription activation in plants. However, both up- and down-regulated genes showed increased levels of H3K27ac upon WGD (Fig. S11a, see online supplementary material), suggesting the independence of H3K27ac to the alternation of transcription. Histone acetylation generally enhances chromatin accessibility by neutralization of the basic charge in histones. In plant, H3K27ac is enriched and peaked around TSSs, where chromatin is more accessible. We speculate that WGD-induced enrichment of H3K27ac might provide more accessible chromatin environment facilitating the access of transcription factors (TFs)."}, {"passage_id": "Discuss.p0007", "text": "WGD impacts gene expression unpredictably between each tetraploid line"}, {"passage_id": "Discuss.p0008", "text": "An interesting question raised by this study is why WGD-induced phenotypically similar autotetraploid individuals were associated with divergent gene expression. Noticeably, the ploidy-related DEGs in DM4X-17 (n = 158) are close to six times more than the DEGs in DM4X-13 (n = 27) (Fig. S6b, see online supplementary material), and these DEGs overlapped in a very small proportion between the tetraploid lines (Fig. 3). Thus, WGD may affect expression of different genes in each autotetraploid lineage. Alteration of gene expression upon polyploidization has been well studied in both animal and plant systems and the alternation tends to be species-specific. For instance, in Arabidopsis, two accessions (C24 and Ws) exhibited opposite direction of the expression change upon autotetraploidization. Intriguingly, four autotetraploid individuals derived from two wild diploid potato species, respectively, displayed line-specific expression patterns with a large proportion of DEGs specific to each autotetraploid line, which is similar to our findings in the homozygous potato lines. Coincidently, the GO terms of the ploidy-related DEGs from the wild potato study as well as from our current study were mainly enriched in functions related to responses to stresses and cell components. None of these terms were associated with plant architecture, development, or growth. One possible explanation for the discrepancy between similar phenotypes and diverse gene expression between autotetraploid individuals would be that key genes related to core functions for development remain genetically and epigenetically identical between the derived autotetraploid individuals."}, {"passage_id": "Discuss.p0009", "text": "Autotetraploid lines may be associated with better resistance to CIS"}, {"passage_id": "Discuss.p0010", "text": "WGD-induced polyploids were associated with enhanced tolerance to abiotic stresses, such as cold, drought, and salt. Similarly, the autotetraploid potato lines in this study may be associated with better tolerance to cold stress. We found that a number of genes involved in the carbohydrate metabolism pathway displayed diverse pattern of differential expression among the three potato lines in response to cold stress (Fig. 8d). The differences in differential expression pattern among the three lines are coincident with their amount of sucrose and reducing sugar contents (Fig. 8b and c). It is noted that cold tubers from both autotetraploid lines contained lower levels of reducing sugars than cold tubers from the diploid line, while the elevation of reducing sugars upon cold storage was less in the autotetraploid lines (Fig. 8c), implying that the autotetraploid lines may be associated with better tolerance to CIS. The differences in sucrose and reducing sugars contents among the three potato lines seem to be coincident with their differences in differential expression of key genes for sucrose degradation and reducing sugar synthesis, such as SuSy4 and VINV (Fig. 8d; Fig. S18, see online supplementary material). In addition, their expression tended to be associated with the level of histone modification H3K4me3. Thus, understanding the epigenetic regulation of such key genes involved in CIS between ploidies may provide clues for the improvement of resistance to CIS."}], "Conclusion": []}}, {"pmcid": "PMC10031990", "title": "Physiological, transcriptome and co-expression network analysis of chlorophyll-deficient mutants in flue-cured tobacco", "source_file": "PMC10031990.json", "source_url": "https://pmc.ncbi.nlm.nih.gov/articles/PMC10031990/", "included_counts": {"Abstract": 7, "Introduction": 5, "Discussion": 4, "Conclusion": 1}, "omitted_results_discussion": false, "sections": {"Abstract": [{"passage_id": "Abstract.p0001", "text": "Background"}, {"passage_id": "Abstract.p0002", "text": "Photosynthetic pigments in higher plants, including chlorophyll (Chl) and carotenoids, are crucial for photosynthesis and photoprotection. Chl-deficient tobacco seedlings generally have a lower photosynthesis rate and higher nitrate-nitrogen (NO3-N) content, which causes a profound influence on tobacco yield and quality. In this study, a stable albino leaf mutant (Al) and slight-green leaf mutant (SG) obtained from the common flue-cured tobacco (Nicotiana tabacum L.) cultivar ‘Zhongyan 100’ (ZY100) by mutagenesis with ethyl methanesulfonate (EMS) were used as materials. The differences between the Chl-deficient mutants and the wild-type (WT) were analyzed in terms of biomass, photosynthetic fluorescence parameters, and carbon- and nitrogen-related physiological parameters. RNA sequencing (RNA-seq) and weighted gene co-expression network analysis (WGCNA) were used to explore the key pathways and candidate genes regulating differentiated chlorophyll and nitrate content."}, {"passage_id": "Abstract.p0003", "text": "Results"}, {"passage_id": "Abstract.p0004", "text": "The results showed that, when compared to the WT, the Chl content and biomass of mutant plants were considerably lower while the NO3-N content was substantially elevated. The net photosynthetic rate, photosynthetic fluorescence parameters, carbohydrate, soluble protein, and carbon- and nitrogen-related enzyme activities all decreased in leaves of mutants and the development of chloroplasts was abnormal. Applying more nitrogen improved the growth and development of mutants, whereas NO3-N content distinctively increased compared with that of the WT. Through transcriptome sequencing, the downregulated genes in mutants were enriched in plant hormone signal transduction and nitrogen metabolism, which are involved in pigment biosynthesis and the carbon fixation pathway. In addition, two hub genes and seven transcription factors identified from the blue module through WGCNA were likely to be key candidate factors involved in chlorophyll synthesis and nitrate accumulation."}, {"passage_id": "Abstract.p0006", "text": "Our results demonstrated that differences in chlorophyll and nitrate content were caused by the combined effects of chloroplast development, photosynthesis, as well as related biological activity. In addition, transcriptome results provide a bioinformatics resource for further functional identification of key pathways and genes responsible for differences in chlorophyll and nitrate content in tobacco plants."}, {"passage_id": "Abstract.p0007", "text": "Supplementary Information"}, {"passage_id": "Abstract.p0008", "text": "The online version contains supplementary material available at 10.1186/s12870-023-04169-z."}], "Introduction": [{"passage_id": "Introduction.p0001", "text": "Background"}, {"passage_id": "Introduction.p0002", "text": "Photosynthesis provides substrate and energy for secondary metabolism in plants and acts as one of the major determinants of carbon balance and growth in plants. Besides, the photosynthates can be provided as the carbon skeleton for plant assembly, cell metabolism, material transportation, and nitrogen metabolism. Crop yield is heavily correlated with plant growth and over 90% of crop biomass is derived from photosynthetic products. The ability and efficiency of photosynthesis are of great value for improving the productivity and quality of crops. Tobacco (Nicotiana tabacum L.) is a leaf-used plant and is considered to be an economically significant crop. Photosynthesis is crucial for the yield and quality of tobacco leaves. In addition, a reduced photosynthesis rate (Pn) leads to the accumulation of nitrate, which is the precursor of tobacco-specific nitrosamines (TSNAs). TSNAs are potent carcinogens that occur at high levels in tobacco products and can cause cancer in humans. Therefore, improving photosynthesis should be justified to decrease the risk of TSNA exposure to the portion of the population that uses tobacco products."}, {"passage_id": "Introduction.p0003", "text": "Photosynthetic pigments, including chlorophyll (Chl) and carotenoids, are involved in harvesting and converting light through photosynthesis into chemical energy that plants use to supply both carbon and other biochemical products for growth and development. Burley tobacco seedlings, which is homozygous for recessive mutant alleles at the Yellow Burley 1 (Yb1) and Yellow Burley 2 (Yb2) loci, had higher nitrate and TSNA accumulation. Besides, the biomass of burley tobacco was significantly lower than that of flue-cured tobacco, and a similar leaf biomass was achieved when the burley tobacco was given six-fold more nitrogen fertilizers, but a higher nitrate content was observed. We hypothesized that changes in some genes and pathways resulted in the lack of Chl, which in turn affected the photosynthesis efficiency and enzyme activities of plants and had adverse effects on the chemistry matrix, such as producing higher levels of nitrate and TSNA. However, the link between a lack of Chl and abnormal nitrate accumulation is still unclear, and the hypothesis remains to be verified. In this study, Chl-deficient tobacco seedlings were employed to determine the underlying mechanisms of chlorophyll biosynthesis and the relationship between chlorophyll and nitrate contents."}, {"passage_id": "Introduction.p0004", "text": "The entire Chl biosynthesis process starts from L-glutamine-tRNA and ultimately forms Chl a and Chl b through a multistep enzymatic reaction involving 15 enzymes and more than 20 genes. During this process, some transcriptional regulators also strongly affected the efficiency of chlorophyll synthesis and the development of chloroplasts, such as the LONG HYPOCOTYL 5 (HY5) protein, multiple organellar RNA editing factors (MORFs), and the NAC transcription factor (TF), WRKY, and MYB families. Additionally, studies have reported that the expression of some genes related to chloroplasts also affect their biogenesis. The resultant disruption in Chl metabolism and chloroplast assembly can lead to abnormal leaf color."}, {"passage_id": "Introduction.p0005", "text": "Many yellow-green leaf color mutants in plants, including wheat, rice, apple, Chinese cabbage, and tea have been discovered. Also, methylome, metabolomics, and transcriptomics technical methods have been employed to explore the potential mechanisms underlying leaf color variation. However, the physiological and molecular mechanism of Chl biosynthesis and nitrate accumulation in Chl-deficient tobacco seedlings remains unclear. In this study, Chl-deficient mutants were used to explore the underlying molecular mechanisms in response to Chl deficiency in tobacco. Meanwhile, the changes of Chl-deficient tobacco in response to low and high nitrogen levels were also investigated. Specifically, we sought to identify key differentially expressed genes (DEGs) underlying the molecular mechanisms of chl differentiation and nitrate accumulation and further identify the relationship between Chl and nitrate content of Chl-deficient tobacco. Our results provide a theoretical basis for further investigating the mechanism of Chl metabolism and in response to Chl deficiency, thus laying a solid foundation for the improvement of nitrogen-use efficiency and risk reduction in tobacco products via genetic engineering in the future."}], "Discussion": [{"passage_id": "Discuss.p0002", "text": "As an leaf-harvested cash crop, nitrate is a negative factor affecting flue-cured tobacco quality which contributes to the accumulation of TSNAs. The burley tobacco, which is a chloroplast-deficient mutant, is known to contain higher TSNA and nitrate concentrations than flue-cured tobacco. Previous studies have showed that the lack of chlorophyll affects the photosynthesis efficiency, thus leading to higher levels of nitrate. But the linkage between chlorophyll lackness and nitrate accumulation in flue-cured tobacco is still unclear and the hypothesis remains to be verified. In our study, the chlorophyll content in tobacco leaves of Al and SG decreased substantially compared to WT (Fig. 1c–e), and the photosynthetic fluorescence-related indices (Pn, Fv/Fm, Fv/F0, Y(II), total sugar, and reducing sugar content) (Figs. 3 and 4j and k) all decreased distinctively under the same nitrogen level. The results were in line with previous studies reported by Shao et al. and Lu et al., indicating that reduced Chl content indeed has a profound influence on tobacco photosynthesis. Additionally, lower enzyme activities and higher NO3-N content were achieved compared to WT (Fig. 4a–i). Based on the downregulated DEGs between mutants and wild-type, we found that the sesquiterpenoid and triterpenoid biosynthesis, plant hormone signal transduction and nitrogen metabolism pathways were enriched. And the KEGG network analysis revealed that the nitrogen metabolism has a connection with alanine, aspartate and glutamate metabolism, cyanoamino acid metabolism, arginine metabolism, and carbon fixation pathways (Fig. 7a). A lower expression level of genes involved in these pathways would lead to reduced pigment, which in turn affects related protein synthesis and enzyme activities, leading to the accumulation of nitrate. Higher nitrate accumulation would therefore increase the risk of exposure to TSNA and reduce nitrogen use efficiency."}, {"passage_id": "Discuss.p0003", "text": "Chloroplasts are important organelles for photosynthesis in plants, and are also the site of synthesis and accumulation of photosynthetic pigments such as Chl and carotenoids. In addition, the chloroplast ultrastructure results showed that variegated leaf color mutants exhibited varying degrees of structural change. A previous study reported that the number of chloroplasts in the the yellow green peel (ygp) mutant of cucumber (Cucumis sativus L.) was lower than that in the wild-type. Similar structural changes were also detected in a study of leaf color mutants of tomatoes. In this study, the cell structure was disorganized in albino mutants and no starch grains were found in chloroplasts. Although the cell structure of SG mutants was normal, it exhibited smaller chloroplast along with lower amount of starch grains than those of the WT (Fig. 2). The instability of chloroplast structure may cause chlorophyll flow into the cytoplasm, which is then destroyed by redox which may cause the yellow phenotype of plants. Ribosomal proteins play essential parts in the translation of key proteins involved in chloroplast development and repair. Transcriptome analysis uncovered that the upregulated genes between Chl-deficient mutants and the WT were most significantly enriched in ribosome (ko03010), which would affect Chl synthesis (Fig. 6a). The biosynthesis of Chl is regulated by many genes and any mutation would affect Chl accumulation. In contrast, our study found the expression of HEMA1 (gene_20318), HEMC (gene_76264), and CHLG (gene_43039, and gene_78699), encoding the enzymes for the Chl biosynthesis pathway, were all upregulated in mutant plants, which might be a compensating reaction in response to the abnormal chloroplast structure (Fig. 6c)."}, {"passage_id": "Discuss.p0004", "text": "It is generally accepted that Chl plays an essential role in photosynthesis. The crop yield depends on Chl content and net photosynthetic rate. A previous study revealed that burley tobacco, a Chl-deficient mutant, had a lower leaf biomass and net photosynthetic rate compared with flue-cured tobacco. Nitrogen is an important component of protein, nucleic acid, Chl, and some hormones in plants and rational nitrogen is conducive to the photosynthetic capacity and development of plants. Noor et al. reported that increasing nitrogen application can improve the Chl fluorescence parameters and photosynthetic pigment content of wheat. In our study, the photosynthetic parameters, key enzyme activities related to carbon and nitrogen metabolism, were all improved by applying three times more nitrogen (Figs. 3a–d and 4a–e). Trend analysis showed that the most upregulated genes in response to nitrogen were involved in metabolic pathways, biosynthesis of secondary metabolites, and carotenoid biosynthesis (Fig. 8a–f). More nitrogen application upregulated the genes involved in these key pathways, resulting in increased pigment content and dry matter of mutant leaves. Notably, the dry matter of SG mutant leaves with three times more nitrogen was similar to the WT but showed a remarkable increase in the NO3-N contents (Fig. 4j), which is due to the lower nitrogen use efficiency in Chl-deficient tobacco plants. Therefore, further study is needed to improve the nitrogen use efficiency (NUE) in Chl-deficient plants."}, {"passage_id": "Discuss.p0005", "text": "Currently, the WGCNA method can specifically identify genes related to target traits and obtain co-expression modules with high biological significance. Further, WGCNA is used to pinpoint key regulatory genes, such as hub genes. In this study, seven transcription factor genes and two key genes were identified by WGCNA analysis, and they were directly related to the chlorophyll and NO3-N content. The differential roles of these genes have been reported in a few published studies. Xue et al. found that 21 TFs of the 17 families (e.g., bHLH, C3H, MYB, ERF, NAC, and C2H2 families) were co-expressed with the chlorophyll metabolism-related DEGs (e.g., CLH) in the L. japonica flowers. In Arabidopsis, both the TGA1 and TGA4 regulate not only the biosynthesis of SA and pipecolic acid (PA) but also the root response to nitrate. NAC056, a nuclear-localized transcription activator, plays a critical role in promoting nitrate assimilation and root growth in Arabidopsis.OsMYB102 has been reported to perform an important role in directly activating the expression of OsCYP707A6, encoding an ABA catabolic enzyme, and thus delaying leaf yellowing. Therefore, we speculate that the transcription factors screened by transcriptome sequencing may result in pigment and nitrate differentiation. Most importantly, we believe that our current research findings deliver valuable bio-information on the candidate pathways and associated genes involved in the determination of tobacco leaf color and NO3-N content. However, the function of these identified genes and TFs still needs to be verified. In the future, molecular studies of the genes indentified in this work can be potential targets to dicipher regulatory mechanism of chlorophyll and nitrogen metabolism."}], "Conclusion": [{"passage_id": "Concl.p0002", "text": "In conclusion, chloroplast structure had a direct effect on chlorophyll content. Similar biomass, higher photosynthesis, and carbon and nitrogen enzyme activities were achieved when the slight-green mutant was administered three-fold more nitrogen fertilizer, but a higher nitrate content was observed than the wild type seedlings. Transcriptome results revealed that the underlying contributing factor for pigment differentiation in tobacco leaves was the differential gene expression of plant hormone signal transduction, nitrogen metabolism, porphyrin metabolism, and transcriptional regulation. Lower expression level of genes involved in these pathways leads to reduced pigment, which in turn affects related protein synthesis and enzyme activity, resulting in the accumulation of nitrate."}]}}, {"pmcid": "PMC10034057", "title": "Transcriptomics and metabolomics revealed that phosphate improves the cold tolerance of alfalfa", "source_file": "PMC10034057.json", "source_url": "https://pmc.ncbi.nlm.nih.gov/articles/PMC10034057/", "included_counts": {"Abstract": 6, "Introduction": 5, "Discussion": 10, "Conclusion": 1}, "omitted_results_discussion": false, "sections": {"Abstract": [{"passage_id": "Abstract.p0002", "text": "Alfalfa (Medicago sativa L.) is a highly nutritious leguminous forage that plays an essential role in animal husbandry. In the middle and high latitudes of the northern hemisphere, there are problems with its low rates of overwintering and production. The application of phosphate (P) is an important measure to improve the cold resistance and production of alfalfa, but little is known about the mechanism of P in improving the cold resistance of alfalfa."}, {"passage_id": "Abstract.p0003", "text": "Methods"}, {"passage_id": "Abstract.p0004", "text": "This study integrated the transcriptome and metabolome to explain the mechanism of alfalfa in response to low-temperature stress under two applications of P (50 and 200 mg kg-1) and a control of none applied."}, {"passage_id": "Abstract.p0005", "text": "Results"}, {"passage_id": "Abstract.p0006", "text": "The application of P fertilizer improved the root structure and increased the content of soluble sugar and soluble protein in the root crown. In addition, there were 49 differentially expressed genes (DEGs) with 23 upregulated and 24 metabolites with 12 upregulated when 50 mg kg-1 of P was applied. In contrast, there were 224 DEGs with 173 upregulated and 12 metabolites with 6 upregulated in the plants treated with 200 mg kg-1 of P compared with the Control Check (CK). These genes and metabolites were significantly enriched in the biosynthesis of other secondary metabolites and the metabolic pathways of carbohydrates and amino acids. The integration of the transcriptome and metabolome indicated that P affected the biosynthesis of N-acetyl-L-phenylalanine, L-serine, lactose, and isocitrate during the period of increasing cold. It could also affect the expression of related genes that regulate cold tolerance in alfalfa."}, {"passage_id": "Abstract.p0008", "text": "Our findings could contribute to a deeper understanding of the mechanism that alfalfa uses to tolerate cold and lay a theoretical foundation for breeding alfalfa that is highly efficient at utilizing phosphorus."}], "Introduction": [{"passage_id": "Introduction.p0002", "text": "As a cool-season perennial forage crop, alfalfa (Medicago sativa L.) plays a variety of beneficial roles for livestock, soil coverage, soil fertility, and human health. It has a high biomass yield, excellent nutritional quality, and wide adaption, and it can fix nitrogen (N). Alfalfa is grown on approximately 30 million ha of land worldwide, and the global production of alfalfa hay was 210.9 million metric tons. North America is the primary producer of alfalfa in the world; the United States has the largest planting area with more than 7.23 million ha of alfalfa grown annually, with Canada and Mexico close behind. The cultivated area of alfalfa in China is approximately 3.77 × 106 hm2, which is approximately 13% of the world’s total arable land used to grow alfalfa. The growth of alfalfa is primarily distributed in northeastern, northwestern, and northern China. In these northern regions, the inability of alfalfa to withstand low subfreezing temperatures remains one of its biggest challenges, which hampers the development of the alfalfa industry and animal husbandry."}, {"passage_id": "Introduction.p0003", "text": "The morphological and physiological characteristics of the roots are strongly associated with the cold resistance of alfalfa. The root types of alfalfa primarily include four types: tap, branch, rhizomatous, and creeping roots. Tap-rooted types have a main root and a narrow, protruding crown; the branch-rooted types of alfalfa have a moderately wide crown and a number of primary roots; the rhizomatous- and creeping-rooted types have a protected crown, develop new roots readily, and can also develop stems from the roots. The shoots can separate from the maternal parent plant and become independent plants to survive; thus, they more easily regrow after freezing damage and show strong cold resistance. A substantial amount of research has documented that the root crown, lateral roots, and root biomass affect the winter survival and persistence of alfalfa. Previous studies have primarily focused on the root crown. It is a transitional plant structure that is located between the shoots and the root system. It is also the uppermost dormant organ of the winter plant body, which is crucial to overwintering and regeneration in the spring. The overwintering rate of alfalfa is closely related to the size and depth of the root crown; they grow more deeply and thicker in the soil, which helps the plants to successfully survive the winter. This is considered to be a cold-sensitivity escape mechanism to prevent the exposure of the overwintering organ to low temperature. The major alfalfa varieties with strong cold resistance have more lateral roots because they help alfalfa plants to absorb more water and nutrient elements from the soil to supply the demand of overwintering plants for nutrients. The root biomass is related to the accumulation of organic matter, and the herringbone branching is conducive to the absorption of deeper water by alfalfa, which contributes to improve the plant’s cold resistance. Its physiology, including the contents of soluble sugar and protein, is also closely related to cold resistance. Soluble sugar acts as an osmotic regulator, a cryoprotectant, and a signaling molecule to stabilize the cell membrane and scavenge reactive oxygen species (ROS) under low-temperature stress, and its contents increase during the freezing process to protect the plant cells. Therefore, the accumulation of sugar at the root crown before winter is related to the cold resistance of alfalfa. Soluble proteins are strongly hydrophilic and can enhance the water-holding capacity of cells. The accumulation of soluble proteins can bind more water to the cells and reduce the damage caused by low temperatures. The increase in the soluble protein content of alfalfa in autumn and winter helps to enhance its resistance to low temperatures."}, {"passage_id": "Introduction.p0004", "text": "As an important means of regulating cultivation, nutrient management not only can improve the production of alfalfa, but it is also an essential measure to improve its stress resistance. Phosphorus is one of the three essential nutrients for plant growth and development, which is absorbed in the form of phosphate (P). It is an essential macroelement that plays a role in an array of processes, including energy generation, nucleic acid synthesis, photosynthesis, glycolysis, respiration, membrane synthesis and stability, respiration, carbohydrate metabolism, and N fixation. In addition, it plays a vital role in enhancing the adaptability of plants to the external environment. P is also an important component of phospholipids and ATP, which affect the resistance of plants to low temperatures. Phospholipids in the plant cell membranes can interact with proteins, sugars, and other substances to alleviate the cell dehydration caused by low-temperature stress and protect the stability of cell membranes. Plants can be negatively affected by the low levels of phosphorus that affect a variety of growing environments, particularly in soils that are calcareous or alkaline. A deficiency in P will affect plant photosynthesis, such as by limiting the distribution and utilization of carbohydrates and the absorption and transport of P. This can also cause an imbalance in the production and clearance of ROS and an array of physiological, biochemical, and metabolic changes resulting in damage to the plants. The application of P can increase the contents of soluble sugar in plants, and sucrose transport in the phloem requires ATP hydrolysis to provide energy so that P can regulate the metabolism and transport of sucrose in plant leaves. Current studies have shown that the application of moderate P fertilizer can promote the root growth of alfalfa and increase the content of cold-resistant substances, such as starch and soluble proteins, in the root crown of alfalfa to some extent. However, the related molecular mechanism remains unclear."}, {"passage_id": "Introduction.p0005", "text": "The recently developed technologies of high-throughput sequencing, high-resolution mass spectrometry, and information processing have made systems biology (omics) research a major focus of scientific investigation. The integrated analyses of transcriptomic and metabolic data obtained from two biological levels, i.e., transcript and metabolite levels, respectively, can serve as a useful way to study complex biological phenomena. In addition, these integrated analyses have been applied to various plant biological processes, including the evolutionary adaption of poplar species (Populus L.) to salinity stress, rice (Oryza sativa L.) insect interaction research, and the response of wild soybean (Glycine max L.) to N starvation. However, to our knowledge, there are few studies that have examined the mechanisms of the effect of P fertilizer on the cold resistance of alfalfa by integrating the analyses of transcriptomic and metabolic data."}, {"passage_id": "Introduction.p0006", "text": "In this study, alfalfa was exposed to three P treatments for 90 days. We measured the contents of the soluble sugar and protein of root crowns and some root indices. In addition, we performed transcriptomic and metabolomic studies among the three P treatments under cold temperature. Our integrated transcriptome–metabolome analysis allowed us to gain a deeper understanding of alfalfa’s response to the application of P in terms of cold tolerance. We sought to identify the strategies used by alfalfa to respond to the application of P during the increase in cold stress, which could be used to improve the cold tolerance and yield of alfalfa and breed new alfalfa varieties."}], "Discussion": [{"passage_id": "Discuss.p0002", "text": "Effect of P fertilizer on the phenotypical and physiological indices of alfalfa during the increase in cold weather"}, {"passage_id": "Discuss.p0003", "text": "Roots are the source of all the mineral elements required for plant growth; thus, root growth and development are highly plastic and vary substantially depending upon numerous soil factors. The root biomass is related to the accumulation of organic matter, which can contribute to improve the cold resistance of plants. The root crown is the transitional plant structure located between the shoots and the root system, and it can influence photosynthate translocation, water transport, winter hardiness, and spring regrowth. Alfalfa plants with deep and large root crowns survived the winter better than the plants with shallow and small root crowns. In addition, alfalfa with more lateral roots have strong cold resistance, and the possession of more lateral roots facilitates the absorption of more nutrients and water from the soil to meet the nutritional needs of overwintering alfalfa plants. Previous research had proven the effect of a localized supply of soil P on the root proliferation of plants. In this study, the cutting seedings had no obvious taproot, and the branch roots grew directly from the lower end of the root crown. The application of P fertilizer promoted the development of the root crown, widened the root crown, and increased the dry root weight. However, the increase in the number of branch roots was not apparent, and the depth of root crown was reduced. Our results showed that the application of P fertilizer can promote the development of the root system, particularly the root crown to some extent, and improve the cold resistance of alfalfa, which also facilitates the growth and development of alfalfa."}, {"passage_id": "Discuss.p0004", "text": "Soluble sugars and soluble proteins are intracellular osmotic regulators, which can be increased by stress, thus, improving the adaptability of plants to respond to stress. Under low-temperature stress, amino acids, such as proline, arginine, and methionine, and soluble sugars, such as sucrose, glucose, and raffinose, accumulate in the root crowns, roots, and leaves of alfalfa. In addition to reducing water loss, the enormous accumulation of these solutes can also prevent the cells from freezing and help to stabilize membrane integrity. As the amount of low-temperature stress increased, the contents of soluble protein and soluble sugar in the alfalfa root crown increased and improved the cold resistance of alfalfa. When the temperature increased, the resistance disappeared, and the sugar and protein content decreased. P is an essential element in the composition of cells, which can participate in the composition of nuclear protein, lecithin, enzymes, ATP, and ADP among others and has an important impact on the synthesis, transport, and storage of sugar. P can enhance N fixation by legumes, promote fat metabolism, and enhance the stress resistance of crops. These changes occur because P can increase the content of soluble sugar and phospholipids in plants. Soluble sugar can reduce the freezing point of cell cytoplasm, and phospholipid can improve the adaptability of cells to temperature changes, thus, enhancing the cold resistance of crops. We found that the contents of soluble sugar and soluble protein both increased during exposure to increasing amounts of cold when P was applied, which is consistent with the findings of."}, {"passage_id": "Discuss.p0005", "text": "Effect of P on the transcriptome of alfalfa roots under low-temperature stress"}, {"passage_id": "Discuss.p0006", "text": "In general, when plants are subjected to low-temperature stress, they will change at the transcriptome level to resist the damage caused by low temperatures. Plant-specific upregulated DEGs under low-temperature stress play a more critical role in determining plant cold resistance than downregulated DEGs, and a higher percentage of upregulated genes increases the resistance of plants to cold. In this study, we found that the P fertilizer had a substantial effect on the expression of alfalfa genes at low temperatures, and the number of DEGs and upregulated DEGs increased with the increase in P application."}, {"passage_id": "Discuss.p0007", "text": "Several key genes were detected in alfalfa following the application of P ( Table S1 ). Cold regulated (COR) genes are genes that respond to low temperatures and are expressed by the regulation of a specific signal transduction pathway, and the products of COR genes are cryoprotective proteins that act by reducing membrane permeability during freezing and increasing the ability of membranes to expand during thawing. Thus, the constitutive expression of the COR genes could improve the freezing tolerance of plants. The novel cold-regulated genes CsCOR1 and CbCOR15 enhance dehydration tolerance in tobacco (Nicotiana benthamiana). proved that the rigidification of the plasma membrane could induce COR genes and result in cold acclimation. In this study, the expression of COR was upregulated under the application of P, which enhanced the cold resistance of alfalfa. CYP71D10 (P450) is a protein-coding gene present in plants, which have an immense variety of P450s that act on different substrates. The differential activities of P450s are believed to represent one of the mechanisms that enables certain crops species to be more tolerant of abiotic stress than other crops, particularly following herbicide treatment. Our research proved that the application of P under low temperatures could enrich the expression of a P450 that plays a vital role in cold tolerance. PAT is a photonuclear aspartate aminotransferase, which has not only the activity of ASPAT but also the activity of prephenate transaminase. It is primarily located in the cytoplasm, mitochondria, and plastids and is involved in not only plant metabolism but also the abiotic stress response pathways of plants. PAT reduces the accumulation of ROS and protects the structural integrity of cell membranes, which improves the abiotic tolerance stress of plants. S-adenosyl methionine synthetase (SAMS) uses L-methionine as a substrate, and ATP provides the energy to catalyze the synthesis of S-adenosylmethionine, which plays a very important role in the responses of plants to stress. confirmed that the overexpression of SlSAMS1 significantly reduced the accumulation of superoxide (), hydrogen peroxide (H2O2) and malondialdehyde and enhanced the contents of abscisic acid and the enzymes that scavenge ROS, including superoxide dismutase, catalase, and ascorbate peroxidase, and plays an important role in improving the drought and salt tolerance of transgenic tomato (Solanum lycopersicum L.). showed that the overexpression of MfSAMS1 promoted polyamine synthesis and oxidation, which, in turn, improved the induction of protection against antioxidants by H2O2. As a result, this enhanced the tolerance to freezing and chilling stress in transgenic alfalfa plants. Our study proved that the expression of SAMS in the root crown of alfalfa treated with P was enhanced, which improved the plant’s resistance to cold. HSP70 plays an important role in plant growth and development and responds to various abiotic stresses, such as heat, drought, salinization, hormones, and other environmental perturbations. In heat-tolerant varieties of pepper (Capsicum annuum L.), the level of expression of CaHsp70 was rapidly upregulated upon heat stress, and the thermal stability of biofilm was simultaneously enhanced. found that the expression of JcHsp70s and its corresponding miRNAs, which are highly responsive to low temperature, is generally negatively regulated, and the interaction between JcHsp70s and miRNAs may be involved in the process of improving the cold tolerance of purging nut (Jatropha curcas L.) under low temperatures. In this study, treatment with P fertilizer also increased the expression of HSP70 in the root crown of alfalfa under low-temperature stress. In addition, there are other DEGs owing to the application of P fertilizer. These DEGs were enriched in three metabolic pathways, including the biosynthesis of other secondary metabolites, carbohydrate metabolism, and amino acid metabolism. They can also be involved in scavenging excess ROS, supplying energy, and maintaining cell osmotic pressure under low-temperature stress, which are very important for alfalfa to survive over the winter."}, {"passage_id": "Discuss.p0008", "text": "Effects of phosphate on the metabolism of alfalfa roots under low-temperature stress"}, {"passage_id": "Discuss.p0009", "text": "The changes in plant metabolites under stress can reflect the ability of plants to adapt to stress. Plants accumulate different sugars and amino acids under low-temperature stress, such as trehalose, glucose, fructose, inositol, galactitol, raffinose, sucrose, putrescine, ascorbate, phenylalanine, and alanine. Under the influence of external substances, the expression of metabolites in plants will also change after responding to low-temperature stress. Flavonoids are important secondary metabolites, which can enhance plant resistance and chemical defenses, thus, improving the tolerance of plants to abiotic stress. When plants are injured, secondary metabolites, such as alkaloids and polyphenolic acids, will gradually accumulate and form defense structures, thus, enhancing plant resistance. Terpenoids can directly or indirectly participate in a series of biological processes, such as hormone synthesis, cell membrane stability, and photosynthesis in plants. Plants can improve their ability to protect and defend themselves by regulating the content of terpenoids. Sugar metabolism is a critical metabolic cycle process in plant growth and development, and providing energy is the primary function of sugar metabolism. Secondly, sugar synthesis metabolism can also play an important role in the response of plants to abiotic stress. Plants with low external levels of Pi have serious problems maintaining a balanced ratio of sugars, lipids, amino acids, organic acids, terpenes, and flavonoids, but the application of P can improve this situation. In this experiment, the application of P could regulate the types and contents of metabolites. When a small amount of P fertilizer is applied, it primarily affects the biosynthesis of secondary metabolites, while the application of more P fertilizer primarily affects the biosynthesis of secondary metabolites, amino acid metabolism, carbohydrate metabolism, and others."}, {"passage_id": "Discuss.p0010", "text": "Integrated metabolome and transcriptome analysis revealed the mechanism used by phospate to improve cold tolerance"}, {"passage_id": "Discuss.p0011", "text": "The mechanism of cold resistance of alfalfa is very complex and involves morphology, physiology and biochemistry, molecular, transcription, and metabolism. Hence, it is crucial to integrate a variety of combinatorial techniques to comprehensively analyze the mechanism of the cold resistance of alfalfa. During cold acclimation, root morphology and the synthesis of compatible solutes were closely related to the cold resistance of alfalfa. Less root mass and lower concentrations of root total non-structural carbohydrates can minimize the survival of plants over the winter when the plants are subjected to low temperatures. The crown depth below the soil surface is viewed as a key morphological adaptation for forage legumes to overwinter successfully. The alfalfa varieties that have more branch rooting in general were better able to resist cold than the varieties that have a taproot or fewer types of branch roots. The accumulation of soluble sugars under low temperature plays an important role in the acquisition of cold tolerance in plants. Several proteins were increasingly or newly synthesized during the acclimation of alfalfa to the cold. Simultaneously, free amino acids were shown to accumulate in the taproots and crowns. The increase in free proline was notable, and the concentrations of arginine and histidine were also markedly increased. In this study, the application of P fertilizer significantly changed the traits of root system architecture and increased the contents of soluble sugar and protein during the cold accumulation period. In addition, there were commonly annotated pathways shared by the transcriptome and metabolome. Thus, the application of P fertilizer influences the cold tolerance of alfalfa. With the increase in the application of P, the common metabolic pathways for the enrichment of DEGs and metabolites affected by P gradually increased. The biosynthesis of amino acids is regulated by a compound metabolic network that links N assimilation with carbon metabolism. Carbohydrate metabolism is the most important basic metabolism in the plant, which provides the necessary carbon frame and energy to synthesize amino acids, proteins, and nucleic acids in N metabolism. Under low-temperature stress, the application of P primarily affected the contents of L-serine, N-acetyl-L-phenylalanine, isocitrate, and lactobiose. A correlation analysis revealed that the production of L-serine positively correlated with MGL, HMT3, CAS1, BGLU11, PAT, CAS2, ACO1, SAMS2, and RFS1. N-acetyl-L-phenylalanine positively correlated with MGL and HMT3, and lactobiose positively correlated with RFS6. Among them, RFS1 and RFS6 are related to the synthesis of raffinose synthase, which is a crucial enzyme in the raffinose metabolism pathway. This pathway can catalyze the reaction of inositol galactoside and sucrose to raffinose, and they can also catalyze the reaction of inositol galactoside and raffinose to synthesize stachyose. Its expression can be regulated by various stress response signals and transcription factors. SAMS2 facilitates the synthesis of S-adenosyl methionine synthetase and can be induced by a variety of stress factors; its overexpression can significantly improve the resistance to plant stress. The overexpression of PAT increased the contents of proline and soluble sugar in transgenic Arabidopsis thaliana and improved the cold, drought, and saline–alkali tolerance of plants. Other genes also play essential roles in the synthesis and metabolism of amino acids and carbohydrates. Thus, the moderate application of P fertilizer can improve the cold resistance of alfalfa by regulating the synthesis and metabolism of amino acids and sugars."}], "Conclusion": [{"passage_id": "Concl.p0002", "text": "Low-temperature stress affects the growth and development of alfalfa, leading to morphological, physiological, metabolic, and molecular changes and, thus, limits the overwintering and production of alfalfa. The application of P can improve the cold resistance and forage yield of alfalfa. In this study, we analyzed the changes of alfalfa under low-temperature stress by transcriptomic and metabolomic approaches after the application of P. We found that the application of P fertilizer improved the root structure and increased the content of soluble sugar and soluble protein in the root crown, and there were 49 DEGs (23 genes upregulated) and 24 metabolites (12 upregulated) following 50 mg kg-1 of P applied and 224 DEGs (173 genes upregulated) and 12 metabolites (6 upregulated) following 200 mg kg-1 of P applied, respectively, compared with the CK. These genes and metabolites were significantly enriched in the biosynthesis of other secondary metabolites, carbohydrate metabolism, and amino acid metabolism pathways. The integration of the transcriptomic and metabolomic analyses showed that P could affect the biosynthesis of N-acetyl-L-phenylalanine, L-serine, lactose, and isocitrate and the expression of related genes to regulate the cold tolerance of alfalfa. Our findings could contribute to a deeper understanding of the mechanism that alfalfa uses to respond to cold tolerance and lay a theoretical foundation for breeding highly P-efficient alfalfa."}]}}, {"pmcid": "PMC10034362", "title": "Photoacclimation and entrainment of photosynthesis by fluctuating light varies according to genotype in Arabidopsis thaliana", "source_file": "PMC10034362.json", "source_url": "https://pmc.ncbi.nlm.nih.gov/articles/PMC10034362/", "included_counts": {"Abstract": 1, "Introduction": 7, "Discussion": 14, "Conclusion": 2}, "omitted_results_discussion": false, "sections": {"Abstract": [{"passage_id": "Abstract.p0001", "text": "Acclimation of photosynthesis to light intensity (photoacclimation) takes days to achieve and so naturally fluctuating light presents a potential challenge where leaves may be exposed to light conditions that are beyond their window of acclimation. Experiments generally have focused on unchanging light with a relatively fixed combination of photosynthetic attributes to confer higher efficiency in those conditions. Here a controlled LED experiment and mathematical modelling was used to assess the acclimation potential of contrasting Arabidopsis thaliana genotypes following transfer to a controlled fluctuating light environment, designed to present frequencies and amplitudes more relevant to natural conditions. We hypothesize that acclimation of light harvesting, photosynthetic capacity and dark respiration are controlled independently. Two different ecotypes were selected, Wassilewskija-4 (Ws), Landsberg erecta (Ler) and a GPT2 knock out mutant on the Ws background (gpt2-), based on their differing abilities to undergo dynamic acclimation i.e. at the sub-cellular or chloroplastic scale. Results from gas exchange and chlorophyll content indicate that plants can independently regulate different components that could optimize photosynthesis in both high and low light; targeting light harvesting in low light and photosynthetic capacity in high light. Empirical modelling indicates that the pattern of ‘entrainment’ of photosynthetic capacity by past light history is genotype-specific. These data show flexibility of photoacclimation and variation useful for plant improvement."}], "Introduction": [{"passage_id": "Introduction.p0002", "text": "A potential limitation to plant growth under natural conditions is their ability to acclimate to fluctuating light and the speed at which this acclimation occurs. Within natural environments, light intensities constantly fluctuate as a result of changes in solar angle, seasonal variation, passing clouds or movement of overlapping foliage. These fluctuations occur over different timescales, although have been shown to occur as rapidly as sub-second. However, natural shade cast by overhead leaves or cloud cover does not only differ in intensity, but also in spectral quality. This shade often has a reduced red: far red ratio and is deficient in photosynthetically active radiation (PAR: 400-700 nm) due to selective filtering by photosynthetic pigments. This creates a complex challenge for the photosynthetic machinery, with the signals and pathways underlying response poorly understood. Plants have evolved a number of mechanisms to cope with fluctuations in the light environment. These enable the efficient capture and use of light at low irradiance, and avoid damage to photosynthetic machinery at high irradiance. However, leaf photosynthesis does not respond instantaneously to a sudden change in light, and there is often a delay before steady state is reached. The length of this delay is closely linked to the photosynthetic induction state, which is a physiological condition dependent on recent light history. The induction state is dependent on a number of different processes including photoprotection, the activation state of photosynthetic enzymes and stomatal dynamics. However, regardless of induction state, the photosynthetic machinery is able to acclimate (termed photosynthetic acclimation or photoacclimation) to differences in the intensity and spectral composition of light."}, {"passage_id": "Introduction.p0003", "text": "Although often referred to as a single process, photosynthetic acclimation involves multiple processes across molecular, cellular and anatomical scales that are often distinct. Acclimation refers to changes in the composition and organization of photosynthetic apparatus and can be broadly split into two processes: developmental acclimation and dynamic acclimation. Despite originating from distinct mechanisms, they may overlap in terms of photosynthesis phenotype. Developmental acclimation describes changes to cell size, number and shape and is set early during development. This can arise as different leaves are exposed to varying light levels; as such they optimize photosynthetic efficiency according to the light environment in which they are exposed. Differences in developmental acclimation state can be seen as changes in the characteristics of the light response curve of photosynthesis. Leaves that developed under a higher light level will have a higher maximum photosynthesis rate (Pmax ). However, leaves that developed under lower light levels will have a lower light compensation point (LCP). This functions to improve carbon gain at low light intensities, resulting in a shorter, but more sensitive, light-limiting state, thus allowing improved exploitation of low light levels and a swift response to any influx of light due to a passing sun fleck or change in light availability. Differences are observed due to changes in chlorophyll concentration, leaf thickness and molecular alterations such as changes in photosystem I (PSI) and photosystem II (PSII) structure and concentration plus changes in photosynthetic enzyme activities."}, {"passage_id": "Introduction.p0004", "text": "The second form of acclimation is dynamic acclimation, which can be characterized as structural and biochemical changes in the photosynthetic machinery of a mature leaf. It involves reversible responses to light, encompassing changes in the expression of genes and concentration of enzymes which result in alterations in phenotype following an irradiance increase or decrease. Responses include changes to PSI and PSII levels or structure; changes in the regulation of electron transport components; changes in enzyme concentrations such as Rubisco and ATPase; changes in granal stacking, changes in stomatal conductance and; the chloroplast avoidance/accumulative response. As such, full dynamic acclimation may take 7 days. Dynamic acclimation can also effect the pigment composition found in a leaf, and adaptations to changes in irradiance can manifest themselves as changes in chlorophyll content and ratios. Chlorophyll a is found in the reaction center of both photosystems, and its synthesis is dependent on the synthesis of photosystems, whereas chlorophyll b is an accessory pigment, part of the antenna complex and therefore is more readily synthesized when light levels drop in an attempt to harvest maximum light. Analysis of chlorophyll content and ratios can provide an alternative to analysis of dark respiration rates, which can be difficult to accurately measure. Dynamic acclimation can also be seen through changes to the light response curve characteristics, particularly the impact on Pmax ."}, {"passage_id": "Introduction.p0005", "text": "The capacity for plants to undergo developmental or dynamic acclimation is species, or genotype, specific. Previously studies on Arabidopsis thaliana show accession-, or ecotype-, specific differences in acclimation capacity. This confers plant fitness under fluctuating light with the popular accession Colombia (Col) exhibiting an inability to undergo dynamic acclimation. Furthermore, identified the gene At1g61800, encoding a glucose-6-phosphate/phosphate translocator- GPT2, as integral to ability to dynamically activate. GPT2 is thought to mediate dynamic acclimation responses via metabolic fluxes. It is responsible for the import of glucose-6-phosphate (G6P) from the cytosol into the chloroplast. This has the net effect of increasing starch synthesis, resulting in an increase in chloroplastic phosphate concentration, leading to gene expression changes which allow the cell to sense changes in environmental signals. Whilst gpt2 knock out mutants grow normally, and demonstrate developmental acclimation, they do not exhibit dynamic acclimation, which means they can provide a negative control for demonstrating the fitness benefits of dynamic acclimation in Arabidopsis."}, {"passage_id": "Introduction.p0006", "text": "Both developmental and dynamic acclimation are important under natural conditions but knowledge of how they interact together is poorly understood. Fluctuating light presents a potential challenge to the acclimation process: a high light acclimated leaf will not perform well under low light and vice versa. This is partly as a result of constraints imposed by the anatomy of the leaf, as well as the correlation between photosynthetic capacity and dark respiration. Therefore, should a plant exploit high light via raising Pmax and/or should a plant enhance light capture and reduce respiratory loss under low light? There has been extensive research on how plants acclimate to high- and low- light, however, few experiments have focused on the effect of controlled fluctuating light. Of those that have been carried out, experiments have predominantly used fluctuating light patterns that alternate between a fixed high and low value, with exceptions e.g., thus they do not represent the varying irradiances that plants are subject to in the natural environment."}, {"passage_id": "Introduction.p0007", "text": "Recent research has focused more on the short term metabolic efficiencies of photosynthesis during light switches without the ‘background’ shifts in long term changes in composition and this has effects on canopy productivity. During the shift from low to high light, the ‘induction state’ of photosynthesis determines the rate of response and is governed by enzyme activation state and stomatal aperture. The induction state is in turn determined by the length of time spent in high or low light - the leaf ‘light history’ or entrainment. We currently have limited information on genetic variation of entrainment although a recent study showed variation in deactivation state of Rubisco. Furthermore, it is understood that the maximum photosynthetic capacity of a plant is dependent on the number of switches between high and low light intensity and the proportion of time spent under each irradiance. For example, the more time recently spent in high light, the faster the induction response due to the persistence of metabolic and physiological processes that favor photosynthesis such as Rubisco activation state and stomatal conductance. Thus both photoacclimation and entrainment of photosynthesis determine the overall plant response. However there have been few approaches to understand how this can be measured or modelled. Until recently, producing accurate fluctuations of light were not possible but lightemitting diode- (LED) based growth chambers enable us to subject plants to a predetermined and controlled pattern of irradiance."}, {"passage_id": "Introduction.p0008", "text": "This study addresses two unknown aspects of acclimation. We hypothesized that (1) Arabidopsis will engage separate high (photosynthetic capacity) and low (light harvesting and respiration) acclimation responses in a fluctuating light regime and (2) the entrainment of induction state differs between Arabidopsis genotypes. We approach this by studying contrasting genotypes of Arabidopsis that have varying acclimation responses. After transfer to fluctuating light we measured photosynthetic light response curves and chlorophyll composition. We compared these data to our dynamic model of acclimation. We show the existence of separate acclimation responses in fluctuating light that optimize light harvesting and quantum yield at low and capacity under high light while rate of entrainment of induction state by light history varies between accessions."}], "Discussion": [{"passage_id": "Discuss.p0002", "text": "Photosynthetic acclimation to irradiance is known to include changes in leaf anatomy, biochemistry and physiology. However, many aspects of the process are still unknown and the regulatory steps underlying acclimation are yet to be fully elucidated. Transitions from low to high light require photosynthetic induction, including the activation of Rubisco and the opening of stomata, whereas transitions from high to low light require the relaxation of dissipative energy processes, collectively known as non-photochemical quenching (NPQ)."}, {"passage_id": "Discuss.p0003", "text": "Fluctuating light drives independent responses for different acclimation components"}, {"passage_id": "Discuss.p0004", "text": "One of the commonly cited functions of acclimation is maintenance of photosynthetic efficiency under the new light regime. For example the lowering of light compensation point, Rd and antenna size under low light. However naturally fluctuations create a dilemma in which both low light and high light acclimation states would be beneficial during the same photoperiod. How do plants deal with this problem? We argue that these features, often seen as fixed to high light or fixed to low light, are not necessarily in conflict ( Figure 6 ). Low light acclimated leaves can support high photosynthetic rates as long as photoprotective mechanisms are engaged and other stress factors such as high leaf temperature are not present. Up-regulation of electron transport components can induce a higher Pmax during dynamic acclimation without change in Calvin cycle components."}, {"passage_id": "Discuss.p0005", "text": "In consensus with the literature, both WT plants exhibited an increase in Pmax under fluctuation light ( Figure 3 ). Increasing Pmax under high light is usually mirrored by a step-wise increase in Chl a:b ratio, due to loss of light harvesting complex (LHCII). found that in the accession Col-0, there was an increase in LHCa1 in non-fluctuating conditions, indicating that fluctuating light was inducing a preferential high light response despite the occurrence of low light periods in the regime. Within this study, a lower Chl a:b ratio was observed for Ler in the FL treatment compared to CL treatment ( Figure 7 ), this combined with the significant increase in Pmax ( Figure 3 ) plus a change in photosynthesis at 50 µmol m -2 s -1 in the days following a change in the light treatment ( Figure 4 ) suggests features of acclimation to both the high- and low- light are present ( Figure 6 ). Whilst Chl a:b and leaf Chl content were typical of a low light response, Pmax was independent of this. With the exception of Ws, the Chl a:b responses indicate acclimation of the antenna to low light, not high light upon transfer to FL. Therefore, chlorophyll traits operated independently to the lack of Pmax acclimation conferred by the GPT2 gene. The reduction in chlorophyll content under FL could therefore have been achieved by a reduction in chloroplast number, size or cell size whilst the stromal fraction for Rubisco content increased to confer the higher Pmax . The origin of the higher Pmax would therefore need to be determined."}, {"passage_id": "Discuss.p0006", "text": "Contrary to previous experiments, there was no significant difference in Rd for any accession, although this may be due to the difficulty in measuring dark respiration within the whole plant chamber. Rd is an essential component of light acclimation and normally rises and falls in line with Pmax . A high Rd would be disadvantageous under low light periods."}, {"passage_id": "Discuss.p0007", "text": "used constant light to identify three distinct phases of acclimation in Ler; a low light response, a high light response and a less pronounced response at intermediate light intensities, which they linked to changes in the content and composition of the thylakoid components as well as both photosystems. This is consistent with the suggestion that the regulation of Pmax and Chl a:b is largely independent. Whilst acclimation to high light was also exhibited by Ws, the corresponding change in chlorophyll was not seen. However, a decrease in Chl a:b ratio under FL vs CL was also observed in the gpt2- mutants suggesting that the mutant was still able to acclimate to lower light intensities, but not higher intensities. It is unclear why the Ws background would show a different response to gpt2- when the Pmax shows the typical response to HL. These findings suggest that the effect of fluctuating light on acclimation is to invoke multiple pathways that allow an acclimation response to both high and low irradiances."}, {"passage_id": "Discuss.p0008", "text": "grew plants outdoors in unheated green houses, and found that under naturally fluctuating light, WT Ws had a higher fitness relative to gpt2- mutants and WT Col. The same study also showed the inability for Col to dynamically acclimate to an increase in irradiance under controlled conditions (see Supplementary Figure 1 in). The fact that Col expresses GP T2 but does not acclimate supports the hypothesis that alternative pathways, not involving GPT2, are necessary for dynamic acclimation under fluctuating light. The role of GPT2 is to translocate G6P into the chloroplast to enable starch synthesis. This results in an increased chloroplastic phosphate pool, causing changes in gene expression enabling acclimation to high light. In contrast, gpt2- mutants have a higher photosynthesis rate at lower light levels than the parental WT Ws plants. However, this improved photosynthetic rate may be a result of developmental acclimation, not dynamic. Nevertheless, combined with the significantly lower Chl a:b ratio found within this study, this suggests that acclimation components can operate independently."}, {"passage_id": "Discuss.p0009", "text": "So far we have taken a simplistic approach, focusing on antenna size as given by Chl a:b and features of the light response curve notably Pmax which may be limited by Rubisco, stomatal conductance and electron transport rate depending on conditions. We may consider any component of the chloroplast to be part of acclimation and further work is needed to determine how these operate in relation to each other. For example, changes in Rubisco concentration and activity, along with molecular changes such as cytochrome-b/f activity and LHC and photosystem stoichiometry. We may determine some general trends, i.e., levels of Cytochrome-b/f, ATPase, plastoquinone and Rubisco will be needed to achieve high Pmax , the question is how much. showed that election transport was more important than Rubisco in Arabidopsis Col-0. There may be much variation in nature: there is evidence that in developmentally acclimated plants, some species do not change their chlorophyll a:b ratios. Furthermore, some changes in chlorophyll a:b ratio have been attributed to genes involved in LHCII distribution, which is a known induction n response."}, {"passage_id": "Discuss.p0010", "text": "‘Entrainment’ of photosynthetic capacity in fluctuating light is genotype - dependent"}, {"passage_id": "Discuss.p0011", "text": "In previous work we formulated a mathematical framework of dynamic acclimation that defined the optimal adjustments to net photosynthesis under fluctuating light conditions. Applied within this study we describe two key aspects of the acclimation process: first the rate of acclimation itself and second ‘entrainment’ of Pmax by the fluctuating light. As described previously, transient high light events induce a ‘fading memory’ which influences both the induction state and the likelihood of inducing acclimation ( Figure 5 ). We show a new feature of acclimation in fluctuating light which is the ‘fading memory’ or τ which varies according to genotype. This indicates that there is genetic variation for both speed of response to fluctuating light but also in the sensitivity to which the plants sense and measure light transients."}, {"passage_id": "Discuss.p0012", "text": "Previous research on variation among Arabidopsis accessions found variation between Ler-0 and Ws-2 in the PSI/PSII ratio, the lateral mobility of the thylakoid membrane and in chlorophyll protein complexes. In particular, the authors proposed that increased value of the nonphotochemical quenching qN or NPQ reported for Ler-0 under control conditions might limit the capacity for the photosynthetic apparatus to adapt to changing light intensities. NPQ is known to be sensitive to changes in the energy status of the chloroplasts (energy-dependent quenching) and thus presents the most sensitive parameter for the early detection of such changes. Whilst did not assess Ws, they found that certain photosynthetic traits were correlated with the ecological niche to which the accession originated. For example, they found that a reduction in PSII operating efficiency (ϕPSII) under fluctuating light correlates with latitude: with those originating further north exhibiting the lowest ϕPSII. Therefore our conclusion for variation in terms of the timing and rate of onset of acclimation is consistent with the known variation among Arabidopsis accessions."}, {"passage_id": "Discuss.p0013", "text": "Implication of photosynthetic acclimation for crop plants"}, {"passage_id": "Discuss.p0014", "text": "Fluctuating light experiments have been performed on plants under natural conditions, these found that the ability to acclimate provided a fitness advantage by optimizing photosynthetic efficiency for a new environment. However, in these experiments, plants were subject to fluctuations in temperature and humidity as well as light thus entangling photosynthetic acclimation to irradiance from that of temperature or humidity is difficult to achieve. Nevertheless, more realistic representations of the natural environment will be critical for determining the adaptive significance of acclimation and determining the limits placed on plants. However, quantifying the physiological response of plants under environmentally relevant conditions is extremely difficult."}, {"passage_id": "Discuss.p0015", "text": "Photosynthesis in nature responds largely to fluctuating light in addition to the fixed longer term square waves commonly used for studies in photoacclimation. Confounding this are species- and genotype-specific differences in plant structure as well as physiological capacity will influence the overall impact of growth conditions on performance. Acclimation is a complex process potentially involving most photosynthetic components in the chloroplast and experimental data indicates that the past light history of a leaf is critical in determining the optimal Pmax under a given light level (e.g. Figure 5 ). Whilst this can be controlled or determined relatively easily within small plants with simple structures, such as Arabidopsis, knowledge of the past light history is difficult to obtain for larger plants, or crop plants, like rice (Oryza sativa) and wheat (Triticum aestivum). The complex canopy structure of these plants combined with environmental factors such as weather conditions and wind, cloud or solar movement mean that a given section of leaf within the same plant will be subject to light changes that vary in frequency and longevity. Knowledge of the underlying mechanisms of this process, what fitness advantages acclimation provides and how it could be manipulated will therefore be critical in targeting crops for improved productivity and yield."}], "Conclusion": [{"passage_id": "Concl.p0001", "text": "Concluding remarks"}, {"passage_id": "Concl.p0002", "text": "In consensus with the literature, our findings suggest that dynamic acclimation to high- and low light are controlled by at least two distinct mechanisms, and that both are utilized in A. thaliana. Whilst GPT2 is required for high light acclimation, it does not seem to be necessary for low light acclimation. Furthermore, whilst light history influences the capacity to acclimate to a change in irradiance, the length, or speed, of response to light history is also genotype specific. This lays the necessary groundwork for understanding the features of fluctuating light and the speed and direction of multi-faceted responses that provide optimal acclimation state to both high and low light within short time periods."}]}}, {"p
