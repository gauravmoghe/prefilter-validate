 tandem duplication events of Group III WRKY gene family were considered as main contributors to the rapid expansion of Citrus species WRKY gene family."}, {"passage_id": "Discuss.p0008", "text": "The expression and promoter analysis of WRKY genes provide important clues for their function under CLas-infection"}, {"passage_id": "Discuss.p0009", "text": "Previous studies have shown that WRKYs involved in pathogenic mechanism in plants. SA is a vital hormone in the immunological responses to pathogens. Several WRKY genes have been reported to be induced by SA and play a crucial role in plant disease resistance. CaWRKY6 transcriptionally activated CaWRKY40 and positively regulated Ralstonia solanacearum resistance in pepper. VqWRKY31 was confirmed to fight against powdery mildew pathogen attack in grapevine. The mechanism of their resistance to pathogen infection was all related to SA signaling. In our current study, expression pattern analysis of WRKY family genes from C. sinensis and P. trifoliata showed that most of the genes displayed different up- and down-regulation patterns in response to SA treatment and CLas-infection. Several genes showed a significant induction multiple. For example, the expression levels of CsWRKY24 reached 259.17 and 92.20 times at 3 and 6 h after SA treatment, respectively (Fig. 5, Supplementary Table S5). CsWRKY4 and PtrWRKY43 separately exhibited an enhanced expression level of 17.99-fold and 48.56-fold compared to healthy plants (Fig. 6, Supplementary Table S6), suggesting that some WRKY genes could be stimulated by SA treatment or CLas-infection. Further investigation revealed a high percentage of overlap between WRKY genes which expressed dramatically after CLas-infection and SA treatment. Previous studies have shown that homologous genes of these WRKY genes function in the SA-mediated plant disease resistance. For instance, AtWRKY6 (a homologous gene of CsWRKY4/PtrWRKY15) positively influenced the pathogen defense-associated PR1 promoter activity, most likely involving NPR1 function due to the elevated transcription levels of NPR1 in Arabidopsis thaliana. AtWRKY70 (a homologous gene of CsWRKY24/PtrWRKY42) have been identified as a node of convergence for integrating SA- and JA-mediated signaling events during plant response to bacterial pathogens. Gain or loss function of WRKY70 led to opposite effects on JA-mediated resistance to A. brassicicola and the SA-mediated resistance to E. cichoracearum, suggesting that it had a vital role in balancing SA-dependent and JA-dependent defense pathways. Given that orthologous genes among different plants are generally considered to retain similar functions and to share other key properties, we hypothesize that these homologous WRKY genes in Citrus may likewise play a critical role in the SA-induced resistance pathway to HLB. Notably, AtWRKY11, the homologous gene of last Citrus WRKY orthologous gene pairs, has been discovered to be a negative regulator of the basal resistance to Pseudomonas syringae pv tomato (Pst). Loss function of AtWRKY11 enhanced resistance to both avirulent and virulent Pst strains. Another study showed that two Arabidopsis TFs, AtWRKY11 and AtWRKY70, were identified as essential regulators in Induced Systemic Resistance (ISR) triggered by Bacillus cereus AR156. AR156 treatment dramatically induced the transcription of AtWRKY70, but inhibited that of AtWRKY11 in Arabidopsis leaves. AtWRKY11 regulated AR156 triggering ISR by activating JA signaling pathway, while AtWRKY70 regulated ISR by activating SA signaling pathway. These researches indicate that there are multiple regulatory pathways in the mechanisms of WRKY genes in disease resistance signaling pathway."}, {"passage_id": "Discuss.p0010", "text": "To analyze the difference of WRKY gene in SA signaling and HLB response between disease tolerant and susceptible varieties, we screened WRKY genes with opposite expression patterns after two treatments in sweet orange and trifoliate orange, resulting in the identification of seven pairs of homologous WRKY genes (Fig. 7C-D), suggesting that these genes may play a pivotal role in the differences in susceptibility of citrus varieties to HLB disease. The cis-elements present in the promoter regions are important molecular switches that control a wide range of gene regulatory networks. Our analysis of these seven pairs of homologous WRKY genes revealed significant differences in the promoter cis-elements of two homologous WRKY gene pairs (CsWRKY7/PtrWRKY39, CsWRKY33/PtrWRKY32). Previous studies showed that AtWRKY33 (a homologous gene of CsWRKY7/PtrWRKY39) participates in the SA signal pathway and plays a negative regulatory role in resisting Botrytis cinerea concomitant with increased expression of SA-regulated PR-1 gene, and reduced expression of JA-regulated genes such as PDF1.2 in wrky33 mutant plants. However, the specific upstream regulatory factors of WRKY33 are still not clear. WRKY45 (a homologous gene of CsWRKY33/PtrWRKY32 in rice) is an important TF in the SA signaling pathway, which mediates chemically induced resistance to a variety of pathogens. One research revealed that the TF Ideal Plant Architecture 1 (IPA1) was phosphorylated at Ser163 within its DNA binding domain along with the alteration of DNA binding specificity after the infection of Magnaporthe oryzae. Phosphorylated IPA1 binds to the promoter of WRKY45 and activates its expression, thereby enhancing disease resistance in rice. These findings imply that the disease resistance conferred by WRKY45 might be closely related to its promoter activity and upstream regulators. In conclusion, the above findings suggest that the opposite expression patterns of two pairs of homologous WRKY genes (CsWRKY7/PtrWRKY39, CsWRKY33/PtrWRKY32) may also be related to their upstream regulatory factors between disease-tolerant and disease-susceptible citrus varieties."}, {"passage_id": "Discuss.p0011", "text": "The candidate WRKYs are typical TFs"}, {"passage_id": "Discuss.p0012", "text": "A close relationship between the function of TFs and their localization has been demonstrated by numerous studies. In the present study, the two screened pairs of homologous WRKY genes, CsWRKY7, PtrWRKY39, CsWRKY33 and PtrWRKY32 were all localized in the nucleus (Fig. 9A). Transcriptional activation analysis showed that all the four WRKY proteins exhibited transcriptional activity in yeast cells (Fig. 9C), demonstrating that these WRKY proteins are typical TFs with transcriptional activation regulatory ability and function in the nucleus, thus implying that their functions may be related to the direct regulatory effects on downstream target genes. However, more in-depth studies are needed to elucidate the upstream regulators and potential downstream target genes in SA signaling pathway and CLas-infection. Our results provide comprehensive information for the function of WRKY genes in Citrus and take important significance in the identification of HLB resistance genes as well as the investigation of molecular mechanism and regulatory network in response to HLB and regulated by SA signaling pathway."}], "Conclusion": [{"passage_id": "Concl.p0002", "text": "A total of 52 and 51 WRKY genes were identified and analyzed in two Citrus species: C. sinensis and P. trifoliata, respectively. qRT-PCR and promoter analysis showed that the expressions of 2 pairs of candidate orthologous WRKY genes were opposite between two Citrus species, and these genes might be involved in the HLB response and SA signaling pathway. Experiments indicated that these WRKY genes (CsWRKY7/PtrWRKY39, CsWRKY33/PtrWRKY32) are classic WRKY TFs with transcriptional regulation function localized in the nucleus."}]}}, {"pmcid": "PMC10038198", "title": "Genome-wide identification of DnaJ gene family in Catalpa bungei and functional analysis of CbuDnaJ49 in leaf color formation", "source_file": "PMC10038198.json", "source_url": "https://pmc.ncbi.nlm.nih.gov/articles/PMC10038198/", "included_counts": {"Abstract": 1, "Introduction": 4, "Discussion": 4, "Conclusion": 1}, "omitted_results_discussion": false, "sections": {"Abstract": [{"passage_id": "Abstract.p0001", "text": "DnaJs are the common molecular chaperone proteins with strong structural and functional diversity. In recent years, only several DnaJ family members have been found to be able to regulate leaf color, and it remains to be explored whether there are other potential members that also regulate this character. Here, we identified 88 putative DnaJ proteins from Catalpa bungei, and classified them into four types according to their domain. Gene-structure analysis revealed that each member of CbuDnaJ family had same or similar exon-intron structure. Chromosome mapping and collinearity analysis showed that tandem and fragment duplication occurred in the process of evolution. Promoter analyses suggested that CbuDnaJs might be involved in a variety of biological processes. The expression levels of DnaJ family members in different color leaves of Maiyuanjinqiu were respectively extracted from the differential transcriptome. Among these, CbuDnaJ49 was the largest differentially expressed gene between the green and yellow sectors. Ectopic overexpression of CbuDnaJ49 in tobacco showed that the positive transgenic seedlings exhibited albino leaves, and the contents of chlorophyll and carotenoid were significantly reduced compared with those of wild type. The results suggested that CbuDnaJ49 played an important role in regulating leaf color. This study not only identified a novel gene of DnaJ family members regulating leaf color, but also provided new germplasm for landscaping."}], "Introduction": [{"passage_id": "Introduction.p0002", "text": "Leaf color variation is a common phenomenon in the plant kingdom. With the development and application of leaf color in landscaping and marker-assisted breeding, people began to notice the importance of leaf color traits. More and more studies have shown that leaf color is an ideal material for studying chloroplast development, chlorophyll synthesis and photomorphogenesis."}, {"passage_id": "Introduction.p0003", "text": "The current research on the mechanism of leaf color mainly focused on chlorophyll metabolism pathway, chloroplast formation or development, and nuclear-cytoplasmic signaling pathway. Firstly, chlorophyll metabolism is a regulatory network affected by a variety of enzymes, and any enzyme or gene mutation could cause leaf color variation. For example, inhibition of CHLH reduced the activity of magnesium chelating enzyme and decreased the synthesis rate of chlorophyll in tobacco. Secondly, the chloroplast is the primary organ responsible for pigment synthesis and photosynthesis. Inhibition of each stage would lead to chloroplast development defects and inhibition of pigment synthesis. Truncated CCT domain genes could impair chloroplast development in barley, resulting in variegated leaves in the seedlings. Thirdly, it is well known that there exists information exchange between chloroplasts and nuclear genes, and the expression defects of retrograde signals in this pathway could easily lead to leaf variation. The GENOMES UNCOUPLED 4 (GUN4) is a typical retrograde regulatory protein, and it could interact with heme-derived linear tetrapyrroles to stimulate the enzymatic activity of magnesium chelatase (MgCh). As mentioned above, most of the current studies were based on forward genetics to study the function of specific genes. There were few reports to predict candidate mutant genes by reverse genetics with omics and molecular biology methods to verify that the genes are related to the biological function of concern. In recent years, the development of high-throughput technology provides the possibility of non-population characteristic analysis. For example, sequenced birch leaf mutants and found that BpGLK1 regulates chlorophyll content and chloroplast development by combining sequencing results and transcriptome data. The key candidate gene PcMYB10.6 related to proanthocyanidin biosynthesis was identified from transcriptome data, and the underlying mechanism of constitutive activation of this gene was revealed by. However, few researchers currently suspect that the expression level of heat shock proteins affect leaf color."}, {"passage_id": "Introduction.p0004", "text": "DanJ proteins belong to the heat shock proteins Hsp40. The DanJ proteins consist of three domains: the highly conserved J-domain of the N-terminal, the zinc finger domain and the C-terminal domain. Currently, most researchers support the classification of DnaJ family proteins into three categories according to their conserved domains, including DnaJ-A, DnaJ-B and DnaJ-C. The DnaJ-A proteins contain a J-domain, a zinc finger domain and followed by a nonconservative C-terminal domain. Compared with DnaJ-A proteins, the DnaJ-B proteins lack a zinc finger, while DnaJ-C proteins retain only a J-domain. In recent years, some scholars have discovered a new type of DnaJ proteins named DnaJ-D, which contains an incomplete HPD tripeptide of the J-domain, and its overall structure is similar to J-domain, so-called J-like protein. Until now, DnaJ proteins have been identified in different species, and generally play a role in plant growth and development, stress resistance, etc. With the in-depth study of heat shock proteins, their role in regulating leaf color has also been revealed. For instance, The DnaJ-A proteins DJA6 and DJA5 are essential for chloroplast iron-sulfur cluster biogenesis. Reduced expression of OsDjA7/8 in rice leads to albino lethal at the seedling stage. DnaJ-B type gene ANU7 induces leaf chloroplast development defect, which leads to leaf albinism or partial albinism. ARC6 is a typical J-like domain gene that regulates chloroplast division, mutated ARC6 gene could lead to fragmented chloroplast division in Arabidopsis. To sum up, the reported DnaJ proteins related to leaf color mainly belong to three types: DnaJ-A, DnaJ-B and DnaJ-D. However, few studies have been reported on DnaJ-C proteins regulate leaf color."}, {"passage_id": "Introduction.p0005", "text": "Catalpa bungei is a native tree species which is famous for its precious timber and garden ornamental value, widely distributed in China. Maiyuanjinqiu (Identification code: 20150150) is a new variation of leaf color found in the growing seedlings of C. bungei by our group, which showed variegated leaves with great value in garden appreciation. Herein, we performed a genome-wide identification and characterization analysis of CbuDnaJs. The tissue-specific profiles of DnaJ family genes in different leaf color sectors were mapped according to the differential transcriptome, and the function of CbuDnaJ49 was further verified in transgenic tobacco. This study not only provides good material for the innovative utilization of germplasm resources, but also provides an effective way for other plants to analyze the molecular mechanism of specific traits by using reverse genetics and molecular biology."}], "Discussion": [{"passage_id": "Discuss.p0002", "text": "In this study, 88 members of CbuDnaJ were successfully identified based on the C. bungei genome. The identified number of CbuDnaJ family genes was lower than that found in wheat, this difference might be due to the evolutionary differences and ploidy among different species. The isoelectric point of CbuDnaJs protein varies from 4.64 (CbuDnaJ37) to 10.62 (CbuDnaJ61) ( Table S5 ). Among them, proteins with isoelectric points greater than 7 accounted for 66% of the whole family, this result was similar to that in Capsicum annuum L. and Tolypocladium guangdongense."}, {"passage_id": "Discuss.p0003", "text": "The classification and nomenclature of J-domain proteins have been debated for a long time. The DnaJ members were initially subdivided into A, B and C types according to the bacterial DnaJ classification method. J-domain is the defining feature of all DnaJs. It has a highly conserved and functionally critical His-Pro-Asp (HPD), which is essential co-chaperones with heat shock protein 70 (Hsp70). However, with further study, some proteins with high homology to DnaJs but no conserved J-domain were found, which is characterized by the lack of crucial classification is outdated. proposed that the classification of DnaJs should be based on evolutionary correlation. They suggested that even DnaJ-A within the most conserved prototypical, their function has evolved following gene duplication. In our evolutionary analysis of CbuDnaJs, we also found this situation ( Figure S1 ). However, because there is no precise new classification method at present, we still classify it according to the structural feature method of. But considering that the related proteins lacking the functional J-domain have essential value in the evolutionary history and functional diversification, we have not eliminated this type of gene (CbuDnaJ46, CbuDnaJ48, CbuDnaJ59, CbuDnaJ77), and classified them into DnaJ-D according to ( Figure 1 ). This result was similar to the evolutionary distribution of Sorghum bicolor, suggesting that gene drift events occur between members of adjacent evolutionary branches within the species. The results of chromosomal location and duplication analysis showed that CbuDnaJs were unevenly distributed on the 20 assembled chromosomes of C. bungei. There were a large number of fragment repeats and several tandem repeat events in CbuDnaJ family genes ( Figure 3 ), which suggested that some members of DnaJ gene family were evolved through gene replication events in C. bungei."}, {"passage_id": "Discuss.p0004", "text": "The intron-exon structure could help to understand the conservatism and evolutionary characteristics of gene families more systematically and comprehensively. It is an important clue for the evolution and functional analysis. The visual analysis of intron-exon structure in this study showed that the number and distribution of introns and exons were highly conservative, and most CbuDnaJs contain 1-3 introns. The results of conservative motif analysis also support this point ( Figure 2 ). This structurally similar evolutionary branch suggested that these genes might have similar physiological functions. In our analysis of the vascular plant C. bungei, we found that the introns of almost all the DnaJ members in C. bungei were at both ends of the whole gene sequence, which was most likely due to the large loss of introns that occurred during the evolution of the species. Introns increase the length of genes and increase the frequency of recombination between genes, which was conducive to the evolution of species. Walter Gilbert suggested that protein-coding genes were produced by exon integration, a process that exons together through recombination of intron sequences. Introns are thus seen as remnants of a process that promotes protein evolution. However, some other researchers support the point that the presence of introns in the genome is an energy burden for many cells. This lost structure might help to quickly activate gene expression in response to environmental stress in C. bungei. The result is supported by. In addition, promoter is an important part of genes, which can control the start time and expression degree of gene transcription, the analysis of promoter is the premise and basis of expression regulation research. We analyzed the cis-acting elements of the promoter of the CbuDnaJ family genes ( Figure S2 ). The results showed that CbuDnaJs contained a large number of cis-regulatory elements related to plant growth hormone (gibberellin GARE-motif, abscisic acid ABRE and auxin TGA-element), defense against stress (jasmonic acid CGTCA-motif, salicylic acid TCA-element, low-temperature LTR) and light response (GT1-motif, G-box, Box 4). Several active elements, such as meristem expresses CAT-box, O2-site and HD-Zip 1 were found. These results suggested that CbuDnaJs might play a role in regulating various biological activities."}, {"passage_id": "Discuss.p0005", "text": "Subcellular localization results showed that the CbuDnaJ49 was expressed in chloroplast, nucleus and plasma membrane. This result was different from that of the homologous gene AtDnaJ20 in A. thaliana, suggesting CbuDnaJ49 might have new functions ( Figure 6 ). Ectopic expression in model plants is a common experimental method to identify gene function due to the lack of regenerative and transgenic systems in woody plants. To explore the biological function of CbuDnaJ49 gene, the overexpressed CbuDnaJ49 gene was transformed into tobacco, and the pigment contents in transgenic tobacco leaves were measured to identify the positive transgenic plant. The leaves of overexpressed plants showed different degrees of bleaching phenotype, and a few plants started from the cotyledon, and the leaf edge showed chlorosis ( Figure 7 ). In our study, the chloroplast development gene FtsZ was significantly down-regulated in transgenic plants, the down-regulation of FtsZ has been reported in tobacco to disrupt normal chloroplast development severely ( Figure 8B ). In contrast, the expression levels of genes related to pigment metabolism did not significantly reduce in albino leaves, there might exist a compensatory mechanism in the albino leaves, such as post-transcriptional regulation, however, the detailed mechanism remains to be further studied. Although previous studies have shown that several DnaJ genes played a pivotal role in chloroplast assembly and division, however, these reported genes usually belong to the type of DnaJ-A, DnaJ-B or DnaJ-D. The identified gene CbuDnaJ49 is a member of DnaJ-C that contains only J-domain, until now, no such type of DnaJ genes associated with leaf color has been reported. Although CbuDnaJ49 was presumed to be a key gene in regulating leaf color, it is not yet clear that the mutation of this gene was responsible for the leaf color character of Maiyuanjinqiu. It is not impossible to obtain effective information by mapping cloning, the combination analysis of multiple omics might be helpful to further analyze the molecular mechanism of leaf color formation in Maiyuanjinqiu."}], "Conclusion": [{"passage_id": "Concl.p0002", "text": "Here, we performed a genome-wide identification and characterization analysis of DnaJ family genes in C. bungei for the first time. We identified the largest differentially expressed gene between the green and yellow sectors of Maiyuanjinqiu and C. bungei. Furthermore, we verified that CbuDnaJ49 was indeed related to leaf color by ectopic overexpression in tobacco. The transgenic plants exhibited albino leaves, and the contents of chlorophyll and carotenoid were significantly reduced compared with those of wild type. The identified gene CbuDnaJ49 is a member of DnaJ-C that contains only J-domain. Until now, no such type of DnaJ genes associated with leaf color has been reported. This study not only provides good material for the innovative utilization of germplasm resources, but also provides an effective way for other plants to analyze the molecular mechanism of specific traits by using reverse genetics and molecular biology."}]}}, {"pmcid": "PMC10039871", "title": "Molecular mapping and characterization of QTLs for grain quality traits in a RIL population of US rice under high nighttime temperature stress", "source_file": "PMC10039871.json", "source_url": "https://pmc.ncbi.nlm.nih.gov/articles/PMC10039871/", "included_counts": {"Abstract": 1, "Introduction": 3, "Discussion": 9, "Conclusion": 1}, "omitted_results_discussion": false, "sections": {"Abstract": [{"passage_id": "Abstract.p0001", "text": "Elevated nighttime temperatures resulting from climate change significantly impact the rice crop worldwide. The rice (Oryza sativa L.) plant is highly sensitive to high nighttime temperature (HNT) during grain-filling (reproductive stage). HNT stress negatively affects grain quality traits and has a major impact on the value of the harvested rice crop. In addition, along with grain dimensions determining rice grain market classes, the grain appearance and quality traits determine the rice grain market value. During the last few years, there has been a major concern for rice growers and the rice industry over the prevalence of rice grains opacity and the reduction of grain dimensions affected by HNT stress. Hence, the improvement of heat-stress tolerance to maintain grain quality of the rice crop under HNT stress will bolster future rice value in the market. In this study, 185 F12-recombinant inbred lines (RILs) derived from two US rice cultivars, Cypress (HNT-tolerant) and LaGrue (HNT-sensitive) were screened for the grain quality traits grain length (GL), grain width (GW), and percent chalkiness (%chalk) under control and HNT stress conditions and evaluated to identify the genomic regions associated with the grain quality traits. In total, there were 15 QTLs identified; 6 QTLs represented under control condition explaining 3.33% to 8.27% of the phenotypic variation, with additive effects ranging from − 0.99 to 0.0267 on six chromosomes and 9 QTLs represented under HNT stress elucidating 6.39 to 51.53% of the phenotypic variation, with additive effects ranging from − 8.8 to 0.028 on nine chromosomes for GL, GW, and % chalk. These 15 QTLs were further characterized and scanned for natural genetic variation in a japonica diversity panel (JDP) to identify candidate genes for GL, GW, and %chalk. We found 6160 high impact single nucleotide polymorphisms (SNPs) characterized as such depending on their type, region, functional class, position, and proximity to the gene and/or gene features, and 149 differentially expressed genes (DEGs) in the 51 Mbp genomic region comprising of the 15 QTLs. Out of which, 11 potential candidate genes showed high impact SNP associations. Therefore, the analysis of the mapped QTLs and their genetic dissection in the US grown Japonica rice genotypes at genomic and transcriptomic levels provide deep insights into genetic variation beneficial to rice breeders and geneticists for understanding the mechanisms related to grain quality under heat stress in rice."}], "Introduction": [{"passage_id": "Introduction.p0002", "text": "Rice (Oryza sativa L.), a major staple food, provides 35–60% of the dietary calorie intake for an estimated three billion people in the world and plays a vital role in food security and sustainability in Asia, Americas, and Africa. To meet the demands of the increasing world’s population, rice breeders and geneticists have been working on developing high yielding and improved grain quality rice varieties. In recent years, rice growers and consumers have been paying attention to grain quality, along with grain yield in rice ever since climate change was recognized as a serious threat to the stability and quality of the rice crop. Based on recent statistics of Intergovernmental Panel on Climate Change (IPCC), the mean temperature of the global air surface has been increased from 1.0 to 3.7 °C in the recent years, which would potentially increase the frequency and magnitude of heat stress events. Under these critical conditions, climate change due to global warming has increased both the nighttime temperature and daytime temperature; however, greater warming has been observed at night than during the day in rice growing regions worldwide. High nighttime temperature (HNT) is one of the detrimental factors deteriorating grain quality year-by-year and declining the grain yield of the rice crop. Several studies have shown that a rise of 1 °C in nighttime temperature reduced rice grain yield by 10% and grain quality. Rice is highly sensitive to HNT stress at various phenological growth stages; however, grain filling at the reproductive stage is the most sensitive, leading to poor grain quality under greenhouse and field conditions. In particular, HNT stress during grain filing stage increases respiration and oxidative stress in cells causing reduced flux of carbohydrates from the flag leaf to developing seeds and directly affects the grain quality. A rise in nighttime temperatures has been shown to have a negative impact on grain quality and grain yield in the major rice growing areas of Asia and the United States (US). Thus, rice breeders and geneticists need to focus on grain quality characteristics in order to improve overall grain quality under HNT stress using novel genomics-assisted techniques."}, {"passage_id": "Introduction.p0003", "text": "Rice grain quality is a complex trait with various components, including grain appearance, milling, and eating, cooking, and nutritional qualities. The appearance quality of rice grain is primarily determined by grain dimensions, a combination of grain length (GL), grain width (GW), and grain thickness (GT), endosperm opacity (chalkiness), chalky grain percentage, chalky area, and chalky degree (percentage chalkiness-% chalk). The chalky grains have opaque spots either in the endosperm ranging in size, on the dorsal side of the grain (white belly) or in the center (white corner). Moreover, several studies have reported that HNT stress affects physio-chemical attributes such as increased chalk formation, reduced amylose content resulting smaller grain size in rice crop, variation in flour protein ingredients, altered the enzyme activities, and poor starch packing resulting increased chalkiness in developing grains. When rice grains are exposed to HNT stress (≥ 27 °C/80.6 °F at nighttime), 90.2% grains of japonica rice cultivar “Koshikihari” during 3–35 days after flowering showed milky-white and white-back. The HNT stress causes impairment of starch biosynthesis and triggers inhomogeneous starch deposition resulting in loosely packed irregular and smaller starch granules in rice grains. Recently, Shi et al. reported that HNT stress declined the head rice yield and grain width, altered the amylose content while it increased the chalkiness in several rice genotypes. Amylose content is lower under HNT stress (16.1%) compared to control nighttime temperature conditions (19.1%), suggesting that lower activity of amylose synthesis might be involved in chalk formation. The grain length, grain width, and chalkiness in rice grains determine overall grain quality and price in the rice market. The genetic basis of these traits is poorly understood under heat stress conditions and the important goal lies in improving these complex correlated traits using advanced genetic tools/techniques on multi-omics datasets such as genome, transcriptome, metabolome, and proteome for genomics-assisted breeding."}, {"passage_id": "Introduction.p0004", "text": "Grain quality traits (GL, GW and % chalk) are polygenic quantitative traits. Recent revolutionary genomic advances in QTL mapping in bi-parental recombinant inbred lines (RILs) and genome-wide association studies (GWAS) on diverse populations can resolve genetic architecture of complex traits. So far, more than 400 QTLs for grain size have been mapped across 12 chromosomes of rice, of which 109, 95, and 107 QTLs were associated with GL, GW, and 100-grain weight, respectively. A few of these QTLs have been fine-mapped and a total of 14 major genes are shown to be significantly involved in controlling grain size and shape including four independent genes (GW2, GW8, GS5, and GW5/qSW5) for GW, eight genes (GS2/GL2, GL3.1/qGL3, GL4, GLW7, GS3, OsLG3, OsLG3b/qLGY3, and TGW6) for GL, and two pleiotropic genes (GW6a and GL7/GW7) controlling both GL and GW that also have larger impact on grain weight. In last several years, many QTLs for grain appearance and eating quality have been identified in different mapping populations (RILs, DHs, CSSLs, F2, and BC2F2). Over the past two decades, several QTLs have been identified and are associated with grain dimension, across the chromosomes of rice. More than one hundred QTLs have been related to the chalkiness trait, including 30 QTLs for percent grains with white core (PGWC), 26 QTLs for degree of endosperm chalkiness (DEC: %chalk), 12 QTLs for area of endosperm chalkiness (AEC), 11 QTLs for white-backed kernel, and 3 QTLs for basal white (BW), all distributed across12 chromosomes and are catalogued in the Gramene database. A larger number of the QTLs associated with chalkiness were detected on chromosomes 5, 6, and 8 in different genetic backgrounds and environments. The QTL clusters were found on the hotspot regions of these three chromosomes. Even though HNT stress significantly deteriorates rice grain quality, a limited number of studies have been conducted to dissect the HNT stress tolerance in rice, and as a result very few QTLs/loci related to chalkiness under heat stress have been identified worldwide. However, until now, no study has been reported on QTLs mapping for GL and GW under HNT stress in bi-parental populations in rice worldwide. Despite the increasing knowledge of QTL mapping, metabolomics, and transcriptomic responses to HNT stress in rice, the understanding and dissection of genetic basis of grain quality traits and HNT stress tolerance in rice is still limited. Hence, based on our best knowledge and recent survey of the literature & databases, in the United States, this is the first study to identify genetic loci and putative candidate genes controlling grain quality traits and HNT stress tolerance mechanisms in tropical japonica (TRJ) rice under HNT stress. In this study, we investigated a recombinant inbred line (RIL) population of two elite US rice cultivars “Cypress” and “LaGrue” for grain quality traits under HNT stress. The study was carried out with the objectives: to screen and evaluate the RIL populations with both parents for grain quality traits (GL, GW, and % chalk) and their correlations under HNT stress, identify the QTLs with SNP markers by using Inclusive Composite Interval mapping (IM-Add and IM-EPI) method, validate the QTL-linked markers with previously reported QTLs, and characterize the QTL regions to identify the candidate genes for grain quality traits with HNT stress tolerance using genome-scale and transcriptome analyses. This novel study of molecular mapping and characterization of these QTLs at genome and transcriptome levels will be useful to provide insights on favorable allele mining, identification of potential candidate genes related to grain quality and HNT stress tolerance mechanisms in US grown TRJ rice cultivars, which would be beneficial to rice breeders and geneticists for developing good grain quality and heat tolerant rice cultivars in the US."}], "Discussion": [{"passage_id": "Discuss.p0002", "text": "HNT stress,one of the detrimental factors, negatively effects grain quality traits leading to poor grain quality in rice grains. Enhancing HNT stress tolerance with minimizing poor grain quality in US rice cultivars is one of the evolving targets in rice breeding. It has been determined that HNT stress (≥ 27 °C) during grain filing days in japonica rice triggers impairment of starch biosynthesis resulting into the increased chalkiness. The increase in chalkiness alters the amylose content declining rice grain shape and size. To improve the grain quality under HNT stress, it is extremely essential to identify favorable alleles linked with candidate genes related to grain quality traits using genome to phenome-assisted approaches. Here, we have carried out phenomics analysis of MY2 RIL population with both parents “Cypress and LaGrue” for grain quality traits under HNT stress and control conditions (Fig. 1), which allowed us to map and deeply characterize the genomic region linked with grain quality traits under HNT stress."}, {"passage_id": "Discuss.p0003", "text": "The broad range of phenotypic variation for grain quality traits under HNT stress and control conditions in the population indicates that GL, GW, and % chalk come up with quantitative inheritance that would be useful for QTL mapping. Our findings revealed that the parent Cypress showed least reduction in GL, GW, and smaller increase in % chalk while other parent LaGrue exhibited significantly higher reduction in GL, GW, and greater increase in % chalk under HNT stress compared to control conditions. So, the significant reduction in GL and GW is related to decline in carbohydrate availability due to high nighttime respiration or reduced carbon assimilates supply under HNT stress in rice. Thus, the activity of several enzymes involved in biosynthesis and deposition of starch in the endosperm, negatively impacts grain dimensions and grain appearance in rice and other cereal crops. The investigation of genetic variation derived from the both parents in the MY2 RIL populations, under HNT stress conditions, showed the highest genetic variation in % chalk followed by GW and GL (Fig. 2A–C, Table 1). Our results suggest that there was transgressive variation in the RIL populations exhibiting larger phenotypic values of each quality trait compared to both parents under prolonged HNT stress. This indicates that positive and negative alleles or loci with epistasis or additive effects, derived from both parents, can function together to substantially affect the GL, GW, and % chalk. Several studies have shown that grain appearance is primarily determined by grain shape & size, a combination of GL, GW, and grain thickness (GT). During grain filling stage (R6 stage), air temperature in the environment plays an important role in generating unexpected variations in rice grain quality. High broad sense heritability and relationship between grain quality traits under control and HNT stress conditions indicate the strong trait stability in different environments and strong genetic control directing the selection of genotypes-based GL, GW, and % chalk for HNT stress tolerance, which can be used in rice breeding."}, {"passage_id": "Discuss.p0004", "text": "The physical appearance traits (GL, GW, and chalkiness) determining grain quality in rice are important to rice growers and consumers. Most of the rain appearance traits such as GL, GW, and length and width ratio are heritable and can be selected through conventional breeding approaches; however, significant improvement in grain architecture such as chalkiness is difficult to achieve. Currently, low-price sequencing of rice genomes and availability of advanced genomics tools and technologies have re-imagined rice breeding for mapping the QTLs/genes related to grain yield and quality. The grain quality traits including grain length, width, ratio of length & width, and chalkiness are the polygenic quantitative traits. To date, more than 200 QTLs for GL and GW and more than 100 QTLs for chalkiness components have been identified in Indica and indica-japonica background of rice. However, until now, this is first study focusing on mapping and characterization of QTLs for quality traits in the TRJ background RIL population derived two elite TRJ US rice cultivars “Cypress and LaGrue” under HNT stress. In the QTL mapping analysis, the additive effects suggest that the favorable alleles with negative effect were contributed by Cypress and favorable alleles with positive effect were come from LaGrue (Table 2). A QTL with more than 20% PVE was considered as a major effect QTL. Thus, among 9 additive effect QTLs for GL, GW, and %chalk under HNT stress, 4 QTLs related to % chalk are major effect-QTLs showing more than 20% phenotypic variance and these QTLs were mapped on chr1, ch6, ch7, and chr10. The higher phenotypic variation explained for most of the studied %chalk revealed major genes/QTLs to be responsible. To analyze the QTLxQTL interaction, surprisingly, there was no QTLXQTL interaction for GL and GW under HNT stress. However, for % chalk, locus on chr1 showed significant epistatic interaction with loci on chr2, chr4, chr5, ch6, chr7, chr8, chr10, chr11, and ch12 with PVE range from 0.62 to 2.37% and epistatic effect range from 0.50 to 2.79%. So, the epistatic interactions for % chalk in the genome suggest that the genomic region on chr1 plays an important role in controlling % chalk in rice grains."}, {"passage_id": "Discuss.p0005", "text": "Based on the physical positions of the SNP makers, identified QTLs related to GL, GW, and % chalk under control and HNT stress were investigated for co-localization with the previously reported QTLs for GL, GW, and chalkiness mapped in indica-japonica background. To validate the strength of the identified 15 QTLs for GL, GW, and % chalk under control and HNT stress conditions in the present study, 29 major effects QTLs related to grain quality traits (GL, GW, ratio of length and width, chalkiness components) reported in 15 independent publicly available studies in last two decades were analyzed. Among 15 QTLs, 12 QTLs were coincided with the genomic regions of these previously reported 29 QTLs (Table 2, Fig. 5, Supplementary Fig. S4). These 12 QTLs for GL, GW, and % chalk in rice genome showed the strongest evidence of co-localization with other well-characterized and major effects previously reported QTLs, which suggest that these QTLs are consistently stable in the rice genome. The genomic regions of these QTLs bear useful gene targets to understand the HNT stress tolerance mechanism. Our co-localization analysis revealed that this information can be implemented in rice breeding using these SNPs for marker-assisted selection and introgression of the co-localized genomic regions with these QTLs of grain quality traits into other elite US rice cultivars to develop new rice cultivars. In addition, a follow-up search for these favorable alleles that we found in 83 rice accessions of the JDP will facilitate the selection of the trait phenotypes for other novel elite alleles."}, {"passage_id": "Discuss.p0006", "text": "To characterize the 51 Mbp of genomic region comprising15 QTLs for grain quality traits in the present study, a set of 83 rice accessions of the JDP was used to discover new favorable alleles using existing natural genetic variation. Among 868,823 polymorphic alleles, 131,269 alleles representing 15% of the total alleles are newly discovered alleles showing novel genomic variation between both parents, Cypress and LaGrue. Based on the SNP type, region, functional class, position, proximity to the gene or gene features, 6160 newly discovered SNPs/alleles (out of 868,823 total) are high impact SNPs (HISs), of which 865 HISs representing 14% of the total HISs have shown novel genetic variation between both parents. The HISs identified in this study are possible candidates for their use as functional markers to differentiate the two US cultivars, and thus find useful in genomics-assisted breeding and introgression studies. The SNPs that are unable to differentiate between Cypress and LaGrue are also useful in the sense that they indicate the presence of natural genetic variation for GL, GW, and % chalk in the japonica accessions of the JDP. The detailed summary of these SNPs with the genomic region of 15 QTLs showing highly dense distribution of SNPs/alleles in 83 rice genotypes of the JDP is shown in Fig. 5 and Supplementary Table S3. These observations emphasize the power of this analysis as there was a 2600-fold increase in SNP density over the initial set of markers that were used to identify the QTLs thus providing higher marker saturation (initial marker density = one marker every 155 Kb). Upon validation, these SNPs will provide a valuable resource for the future genomics-assisted breeding efforts for the traits of interest such as grain yield and grain quality."}, {"passage_id": "Discuss.p0007", "text": "In the transcriptome analysis, a total of 7117 genes were identified in the 51Mbp region comprising the 15 QTLs using IRGSP 1.0 genomic feature file (GFF) as a reference. Out of these, we identified 495 genes there either up- or down-regulated in response to HNT stress and showed significant variation for gene expression under control and HNT stress conditions in a genotype-dependent manner (Fig. 6). Narrowing down further, a subset of 35 genes associated with GL, GW, and % chalk under HNT stress were selected based on their known functions in starch biochemical pathways, stress-responsive pathways, and gene ontology (GO) (Supplementary Fig. S5). Two genes, LOC_Os01g55160 and LOC_Os_01g64330 with unknown functions, identified in this study, have previously been shown to be upregulated under endoplasmic reticulum (ER)R stress during endosperm development in rice, which could be responsible for aggregation of abnormal protein bodies overall affecting the rice gran quality. Moreover, plant beta-galactosidases (B-gals) have been well characterized and are involved in degradation of structural pectin and xyloglucans in plant cell walls. The observed expression pattern of the B-gals 4 gene (LOC_Os01g65460) in this study is downregulated in Cypress HNT under stress; however, highly expressed in LaGrue under HNT stress, therefore alludes to starch degradation in LaGrue under HNT stress as compared to Cypress."}, {"passage_id": "Discuss.p0008", "text": "Other genes identified in this study are thought to have potentially relevant roles such as in starch accumulation, endosperm formation &development, stress response, grain size, grain quality, chalkiness etc., some of which are described below in detail. Five potential candidate genes identified in the genomic region of QTL, qChalk7HNT, belong to α-amylase/trypsin inhibitors upregulated in Cypress under HNT stress conditions. In addition, upregulation of OsDGAT1-2, LOC_Os06g36800, in LaGrue under HNT stress could be a cause of increased chalkiness because of accumulation of triacylglycerol (TAG) and lipid bodies, thereby hindering proper starch accumulation under HNT stress. The cyclin protein, LOC_Os01g59120, is 7× upregulated in Cypress under HNT stress vs LaGrue under HNT stress and plays a critical role in endosperm formation and maintenance of embryo development in rice. The upregulation of LOC_Os06g38790, an orthologue gene (ZmEBE-1) of maize, in rice may play a role under HNT stress conditions in Cypress under HNT stress vs LaGrue under HNT stress in early development of specialized domains of the endosperm. OsHAP3//nuclear factor-YB (NF-YB)/CCAAT binding factor-A (CBF-A) in rice regulates chloroplast plastid biogenesis. OsLMS, LOC_Os01g63820, shares amino-acid similarity to the Arabidopsis FIERY2/CPL1 gene, known to control many plant stress responses and development. FERONIA-like receptor (FLR1) family members’ effect grain size & quality and stress tolerance, and FLR2 and FLR8 negatively regulate grain size. Downregulation of FLR2 gene in Cypress under HNT stress suggests maintaining grain filling compared to LaGrue under HNT stress condition. The cumulative slight perturbation in the expression of multiple genes at multiple loci under HNT stress could cause a QTL for a particular trait to be additive and epistatic. Similarly, the upregulation of a gene in non-photosynthetic tissue (endosperm) in Cypress under HNT stress vs LaGrue under HNT stress could have a potential role in amyloplastic formation."}, {"passage_id": "Discuss.p0009", "text": "To find the candidate genes for grain quality in US japonica rice, we followed a two-tier approach using differential gene expression and newly discovered favorable alleles/SNPs overlapped with the 149 DEGs exhibiting significant changes in the expression under control and HNT stress identified 11 candidate genes with high impact SNP associations (Table 4). Of particular interest is the HEAT protein (LOC_Os01g60050), a microtubule organization protein that is essential for cortical microtubule organization in plant cells and is speculated to play an important role during cellurization. This gene is stress responsive and is 12× upregulated in Cypress (HNT tolerant parent) as compared to LaGrue (HNT sensitive parent) under HNT stress. It is also worth noting that four out of 11 loci are transposon derived protein-coding genes that are marred with HISs and show differential gene expression under HNT stress. For instance, the loci LOC_Os06g25760-a retrotransposon belonging to the Ty3-gypsy subclass contains 15 HISs. Such rapid rate of mutations accumulating SNPs at a higher rate in transposons as compared to genes is a meaningful observation from an evolutionary perspective of genome structure and function. Additionally, due to their presence in the transcriptome, these transposons are presumably active in the genome and are differentially expressed in a stress responsive manner. This makes them candidates of choice to study transposon-mediated regulation of genes involved in HNT stress response."}, {"passage_id": "Discuss.p0010", "text": "The power of allele mining using the top-down approach to integrate the genomic and transcriptomic datasets has its takeaway. Of the possible 6.1 million SNPs distributed across the 12 chromosomes or 868,823 SNPs distributed across the 15 QTLs on nine chromosomes, we narrowed down to a subset of 30 High Impact SNPs for further testing (Table 4). Additionally, from a total of ~ 48 K genes in the rice genome, we shortlisted a potential set of 11 protein coding genes including transposons for validation and characterization (Table 4). These genes are important because i. They reside in the QTL regions of interest, ii. They are differentially expressed between the parental genotypes “Cypress” and “LaGrue” in a stress responsive manner, and iii. They harbor the HISs and could be functionally relevant. Besides increasing the marker saturation of the initial set of 1178 SNP markers by 2600-fold, we identified a set of polymorphic markers that distinguish between two parents, Cypress and LaGrue, that can be put to future use for introgression or other breeding strategies."}], "Conclusion": [{"passage_id": "Concl.p0002", "text": "This is the first integrated study to screen the MY2 RIL population (185 lines) derived from two US rice cultivars, “Cypress and LaGrue”, for grain quality traits such as GL, GW, and % chalk at booting stage (R2: reproductive stage) under HNT stress, map & characterize the QTLs regions by mining for novel alleles and identify the candidate genes for grain quality under HNT stress. Phenotypic screens indicated that the MY2 RIL population with both parents (US rice cultivars) showed a wide range of variation for GL, GW, and % chalk under HNT stress compared to control conditions and the RIL population exhibited strong trait correlation and high broad sense heritability for grain quality traits under HNT stress. Thus, the phenotyping insights suggest that the MY2 RIL population exhibited transgressive segregation that would be useful for QTLs mapping and their characterization to find the candidate genes for GL, GW, and %chalk under HNT stress. Co-localization of 15 QTLs with the previously reported 29 major effects-QTLs for GL, GW, and % chalk validates the robustness of the favorable alleles linked with the QTLs and strengthens the QTL analysis in this study. Further characterization of the QTLs through allele mining and identification of genes that showed genotype dependent differential expression under HNT stress and control conditions led us to identify 11 candidate genes with high impact SNP associations based on the position, function, and predictive cause/effect of the SNPs. Therefore, all the findings from this study are noteworthy and the approach used demonstrates the power of integration of phenotypic, genomic, and transcriptomic data for gaining insights into genetic variations to understand the mechanisms responsible for heat stress tolerance that contribute to the grain quality in rice. These insights will be useful for developing allele-specific markers for genotyping US (japonica background) rice germplasms/elite breeding lines, optimizing genomic predictions for breeding program, establishing SNPs-assisted breeding strategies to breed superior varieties with improved grain quality and yield."}]}}, {"pmcid": "PMC10040793", "title": "Enhancement of phytolith-occluded carbon accumulation of Moso bamboo response to temperatures elevation and different fertilization", "source_file": "PMC10040793.json", "source_url": "https://pmc.ncbi.nlm.nih.gov/articles/PMC10040793/", "included_counts": {"Abstract": 1, "Introduction": 4, "Discussion": 7, "Conclusion": 1}, "omitted_results_discussion": false, "sections": {"Abstract": [{"passage_id": "Abstract.p0001", "text": "The accumulation of phytolith-occluded carbon (PhytOC) in Moso bamboo could be a novel long-term carbon sequestration strategy. The objective of this study was to investigate the effects of temperature change and different fertilization on PhytOC accumulation. The pot experiment was established with different fertilization (including control (CK), nitrogen fertilizers (N), silicon fertilizers (Si), and a combination of nitrogen and silicon (NSi)) under high- and low-temperature. Despite the different fertilization, the PhytOC accumulation of the high-temperature group increases by 45.3% on average compared with the low-temperature group, suggesting higher temperature is greatly beneficial to the PhytOC accumulation. Fertilization significantly increases the accumulation of PhytOC (increased by 80.7% and 48.4% on average for the low- and high-temperature group, respectively) compared with CK. However, the N treatment increased both Moso bamboo biomass and PhytOC accumulation. The difference in the accumulation of PhytOC in Si and NSi was insignificant, indicating the combination of N and Si didn’t bring extra benefit to PhytOC accumulation compared to Si fertilizer alone. These results indicated the application of nitrogen fertilizer is a practical and effective method for enhancing long-term carbon sequestration for Moso bamboo. Based on our study, we conclude that global warming poses a positive effect on promoting the long-term carbon sequestration of Moso bamboo."}], "Introduction": [{"passage_id": "Introduction.p0002", "text": "The continuous change of climate has appeared to accompany the development of the pre-industrial era. Plants play an important role in carbon sinks by absorbing carbon dioxide (CO2) and mitigating climate change. However, some organic carbon that is temporarily fixed by plants may return to the atmosphere through biochemical cycles. Therefore, long-term carbon sequestration strategies for terrestrial ecosystems need to be further explored. As a typical silicon accumulator, bamboo produces a large amount of phytolith during the growth process. The phytoliths are amorphous silica particles that are deposited during plant growth. During the formation process, a fraction of organic carbon was occluded within the phytolith, which is called phytolith occluded carbon (PhytOC). The PhytOC could be locked up in phytoliths for centuries or even longer periods without being returned to the atmosphere as quickly as other organic carbon components. Hence, the plant PhytOC sequestration mechanism could make a novel way in mitigating climate change. The area of bamboo the forest is about 6.42 million hectares in China, among which the Moso bamboo (Phyllostachys heterocycla (Carr.) Mitford cv. Pubescens Mazel ex H.de leh.) forest covers the largest area, accounting for about 72.96%. Therefore, the Moso bamboo is of great potential for long-term carbon sequestration."}, {"passage_id": "Introduction.p0003", "text": "For years, many researchers have focused on enhancing PhytOC accumulation. Studies revealed that the accumulation of phytolith and PhytOC are related to biomass, which is achievable through fertilization. Therefore, the promotion of PhytOC sequestration through fertilization has been frequently investigated by previous research. Studies have demonstrated that nitrogen (N) fertilizer contributes to plants’ biomass and phytolith production. In recent years, silicon fertilizer was widely applied to increase plants’ tolerance to biological and abiotic stresses. As a typical silicon-accumulating plant, the application of silicon (the basic element of phytolith) is also beneficial for the accumulation of PhytOC in plant tissues. However, whether the combination of N and Si (NSi) fertilizer can enhance PhytOC production is still awaiting interpretation."}, {"passage_id": "Introduction.p0004", "text": "Under the background of global warming, the temperature continues to rise over the past years. Studies revealed that the elevation of temperature may enhance various physicochemical and biological processes, thereby promoting silicon uptake and accumulation within the plants. Other studies indicated that the production of phytolith and PhytOC positively responds to silicon accumulation. However, whether the elevation of temperature directly promotes the accumulation of phytolith and PhytOC is still unclear."}, {"passage_id": "Introduction.p0005", "text": "Although the strategies for enhancing the accumulation of phytolith and PhytOC have been investigated extensively throughout the world. Few studies, however, have investigated the effects of fertilization on PhytOC accumulation under different temperatures. Moreover, the optimized management strategies for enhancing PhytOC sequestration when considering multiple factors are not available yet. The aims of this study were: 1) to investigate the effects of temperature elevation and different fertilization on the PhytOC sequestration in Moso bamboo leaves; 2) explore the possible mechanisms of PhytOC accumulation in Moso bamboo leaves and 3) propose a practical and cost-effective management method to enhance the long-term carbon sequestration for Moso bamboo forest."}], "Discussion": [{"passage_id": "Discuss.p0002", "text": "Factors related to the PhytOC accumulation in Moso bamboo leaves"}, {"passage_id": "Discuss.p0003", "text": "Besides fertilization, the accumulation of PhytOC in Moso bamboo leaves could be affected by many factors, including the quality of the Moso bamboo seedlings, the type of soil, and cultivation conditions (mainly temperature in our study). Based on our results, we infer that the PhytOC accumulation quality was not attributed to the Moso bamboo seedlings, because the differences in properties of Moso bamboo seedlings for different temperature groups and fertilization treatments are insignificant ( Table 2 ). The contribution of soil type to the PhytOC accumulation was also excluded because of the cultivation of all the Moso bamboo seedlings using the same soil. Temperature is one of the critical factors that affect the accumulation of PhytOC ( Figures 1 , 4A–C ). Higher temperatures significantly increase the accumulation of PhytOC. This could attribute to the increase in metabolite production in the bamboo leaves under higher temperatures. These metabolite productions were captured and wrapped by phytolith as PhytOC. Thus, the accumulation of PhytOC in the high-temperature group was significantly larger than that of the low-temperature group. Based on the discussion above, it is inferred that the increase of the temperature is another effective method for promoting PhytOC accumulation because compared with low-temperature group, the accumulation of PhytOC for the high-temperature group increased by 61.1% even without fertilization. Therefore, the bamboo forests in warmer areas are more potential for long-term carbon sequestration. Moreover, our results further indicate that global warming also poses a positive effect on the PhytOC accumulation, which automatically mitigates climate change by sequestering more carbon in the phytolith."}, {"passage_id": "Discuss.p0004", "text": "Possible mechanism of PhytOC accumulation following different fertilization"}, {"passage_id": "Discuss.p0005", "text": "The effects of nitrogen application were revealed by the interception of the fitting curves with (N and NSi) and without nitrogen treatment (CK and Si), respectively. The shift of the interception indicates the marked increase of leaf biomass following nitrogen application. Moreover, the application of silicon fertilizer (both Si and NSi) increased not only the leaf Si accumulation but also the accumulation of phytolith and PhytOC ( Figures 4B, C ). The beneficial effects of fertilization on PhytOC accumulation were also reported in previous research. The slope of the fitting curves generally revealed the biological dilution effect on the concentration of leaf Si, phytolith, and PhytOC ( Figures 4A–C ). In spite of the marked increase of leaf biomass, the identical slope in Figure 4A indicating the dilution effect on leaf Si concentration following different fertilization is unobservable. In contrast, the dilution effect was clearly observed in Figure 4B , indicating the increase of leaf biomass following nitrogen application (N and NSi) diluting the concentration of phytolith in the Moso bamboo leaves during the growth process."}, {"passage_id": "Discuss.p0006", "text": "Our results further indicated bio silicification process of Moso bamboo is formed by a completely passive mechanism because the accumulation of phytolith and leaf Si is affected directly by the concentration of soil-available silicon. This was also supported by previous research. The phytolith is mainly produced within the bamboo leaves, which relies on the amount of silicon absorption. Thus, the application of silicon fertilizer is beneficial to phytolith accumulation, which was supported by numerous studies. Fertilization also affects the photosynthesis and transpiration rate of Moso bamboo leaves, especially for the N and NSi treatment, because About 75% of leaf N is allocated in the chloroplasts, and most of them are used photosynthetic apparatus. The increase in photosynthesis and transpiration rate for the N and NSi treatment could also attribute to the increase in the total leaf area that is related to the leaf biomass after the nitrogen fertilizer was applied ( Figures 1D , 3 )."}, {"passage_id": "Discuss.p0007", "text": "Fertilization strategies for promoting the PhytOC accumulation"}, {"passage_id": "Discuss.p0008", "text": "The PhytOC is critical for long-term carbon sequestration. Therefore, increasing the accumulation of PhytOC is the priority principle for establishing management strategies. According to our study, two primary factors can enhance the accumulation of PhytOC, including fertilization and temperature level. For fertilization, the differences in the accumulation of PhytOC among all three fertilizers are insignificant. Therefore, the economic benefit-cost ratio should be considered when selecting fertilizers. As one of the most important economic forests, nitrogen fertilizer was widely applied for increasing the biomass of the Moso bamboo forest. Therefore, the application of nitrogen fertilizer is a simple and effective method that is suitable for enhancing PhytOC accumulation. Silicon fertilizer is usually optional in the management of the Moso bamboo forest. Although the silicon fertilizer can significantly increase the accumulation of PhytOC. However, the application of silicon fertilizer is limited by multiple factors. One of the limiting factors is the content of soil available silicon, which varies differently in the different Moso bamboo growing regions. Moreover, the effectiveness of the silicon fertilizer relies on soil pH. Thus, the application of silicon fertilizer is not a practical method for promoting PhytOC sequestration. The combination of Si and N didn’t gain extra benefits on PhytOC accumulation. Therefore, the synergistic use of Si and N fertilizer is not an optimized management method for enhancing the PhytOC accumulation."}], "Conclusion": [{"passage_id": "Concl.p0002", "text": "This study investigates the effects of temperature elevation and different fertilization on the accumulation of phytoliths and PhytOC. Our results indicated that the accumulation of PhytOC in Moso bamboo leaves positively responds to temperature elevation and fertilization. In warmer areas, the higher temperature significantly increases the accumulation of PhytOC. For routine forest management strategies, the application of nitrogen fertilizer is a practical and effective method for promoting long-term carbon sequestration for the Moso bamboo forest. Based on our study, it is predicted that global warming poses a positive effect on the long-term carbon sequestration of Moso bamboo, which enables the automatic mitigation of climate change. Given the promoting strategies of PhytOC for mitigating climate change, the application rate of fertilizers and the interaction between fertilizers and temperatures will be taken into consideration when establishing fertilization strategies in our future studies."}]}}, {"pmcid": "PMC10040805", "title": "Generation of new rice germplasms with low amylose content by CRISPR/CAS9-targeted mutagenesis of the FLOURY ENDOSPERM 2 gene", "source_file": "PMC10040805.json", "source_url": "https://pmc.ncbi.nlm.nih.gov/articles/PMC10040805/", "included_counts": {"Abstract": 1, "Introduction": 4, "Discussion": 1}, "omitted_results_discussion": false, "sections": {"Abstract": [{"passage_id": "Abstract.p0001", "text": "FLOURY ENDOSPERM 2 (FLO2), encoding a tetratricopeptide repeat domain (TPR)-containing protein located in the nucleus, is considered to be a regulatory protein that controls the biosynthesis of seed storage substances. The diversity of flo2 allele is attributable for the variations in grain appearance, amylose content (AC), and physicochemical properties, influencing the eating and cooking quality (ECQ) of rice. In this study, we used CRISPR/Cas9 to introduce loss-of-function mutations into the FLOURY ENDOSPERM 2 gene in Suken118 (SK118), a widely cultivated elite japonica rice variety in Jiangsu, China. Physiochemical analyses of the flo2 mutants were congruent with previous studies, exhibiting lowered AC and viscosity, risen gel consistency (GC) and gelatinization temperature (GT) values, which were all instrumental to the improvement of ECQ. However, the wrinkled opaque appearance and the decrease in grain width, grain thickness and grain weight imply trade-offs in grain yield. Despite the ex-ante estimation for low yielding, the superior ECQ in these novel genotypes generated by using genome editing approach may have the potential for formulating high value specialty food."}], "Introduction": [{"passage_id": "Introduction.p0002", "text": "Rice (Oryza sativa L.), one of the most important crops worldwide, provides staple food for feeding half of the world’s population. The steady increase in grain yield, coupled with the rapid improvements in human living conditions, has fostered ever increasing public demands for foods of high quality and high versatility. Consequently, the rice quality, as measured by a range of standardized parameters, including milling, appearance, nutrition and eating and cooking quality (ECQ), has been commonly used to select for and evaluate the breeding lines prior to commercial release. Amylose and amylopectin constitute starch that is the dominant component in rice grains and accounts for about 90% of the weight of the rice endosperm. As the most important quality trait, ECQ is affected by multiple factors such as amylose content (AC) and an eclectic list of physicochemical properties of endosperm. Despite the recent increase in the awareness of the health benefits of high AC rice, it appears that a seemingly polarized market has emerged, especially for the formulation of specialty food, where the low AC trait is desired as it could well be attributed for the favorable food texture and taste. Further, some rice cultivars, such as Nanjing 46 and Nanjing 9108, with relatively high ECQ and low AC (10-15%) are popular with consumers in China and the broad East Asian region, which are soft yet not sticky after cooking, and are defined as soft japonica rice. Therefore, there is impetus to develop rice genotypes with low AC to meet market requirements."}, {"passage_id": "Introduction.p0003", "text": "FLOURY ENDOSPERM 2 (FLO2), a member of a conserved gene family in plants, encodes a tetratricopeptide repeat domain (TPR)-containing protein located in the nucleus. It has been reported that FLOURY ENDOSPERM 2 could not only modulate the expression of starch synthesis-related genes including OsAGPL2, OsAGPS2b, OsGBSSI, OsBEI, OsBEIIb, OsISA1 and OsPUL, but also directly impact on the amylose biosynthesis by manipulating the splicing efficiency of Wx pre-mRNA. Previous studies have shown that flo2, the loss-of-function mutant of FLOURY ENDOSPERM 2, produced two distinct phenotypes, one with white and floury endosperm, and the other with dull grain. In the former, starch granules were small, spherical and loosely packed with large air space. The FLOURY ENDOSPERM 2 also affected grain size as demonstrated by both overexpression and null mutation approaches. In addition, flo2 mutant was also endowed with alterations in grain physicochemical properties including grain breakdown, setback and consistency. Therefore, FLOURY ENDOSPERM 2 plays an important role in the determination of grain quality by regulating the accumulation of storage substances in the endosperm. Previous methods to generate flo2 mutants by chemical mutagens such as EMS have the disadvantages of safety risk, low efficiency and uncontrollable direction."}, {"passage_id": "Introduction.p0004", "text": "In the last few years, as one of the most advanced systems for genome editing, CRISPR/Cas has been commonly used to make precise and predictable genome modifications in crop plants to obtain desired traits. This is especially true for rice, where impressive progress has been made and a plethora of traits have been modified by applying the CRISPR/Cas9 editing system, by virtue of rice’s economic significance and the ease of transgenic regeneration. For grain quality improvement, Wx is a key gene that encodes granule binding starch synthase I (GBSSI) involved in amylose biosynthesis. It has been genetically edited to manipulate AC and/or improve ECQ in a number of recent studies in rice. Likewise, a number of other key genes involved in amylopectin fine structure, such as SSII-2, SBEIIb, BEIIb and ISA1, have been edited for ECQ improvements."}, {"passage_id": "Introduction.p0005", "text": "In this study, to induce AC and improve ECQ of a widely cultivated elite japonica variety, Suken118 (SK118), two loss-of-function mutants of FLOURY ENDOSPERM 2 gene were generated by CRISPR/Cas9 technology. Our results show that knockout of FLOURY ENDOSPERM 2 gene can significantly reduce the content of straight chain powder. The physicochemical properties of flo2 mutants showed that lower AC and viscosity, higher gelation degree and gelatinization temperature were helpful to improve the edible and cooking quality of rice. Therefore, FLOURY ENDOSPERM 2 has potential application value in green and healthy rice breeding."}], "Discussion": [{"passage_id": "Discuss.p0002", "text": "In summary, in this study we have generated low AC/high ECQ rice genotypes through targeted mutagenesis of FLOURY ENDOSPERM 2 by using CRISPR/Cas9 approach and demonstrated that editing of FLOURY ENDOSPERM 2 could be an effective route to reduce AC and accelerate rice breeding to achieve desired high ECQ trait. We have also analyzed the physicochemical properties of the flo2 mutants, which have not only verified the improvements in rice ECQ, but also provided useful data for industrial evaluation of these potentially useful germplasm. Undesired, the mutations of FLOURY ENDOSPERM 2 have led to a significant reduction in seed weight, which may imply a possible reduction in grain yield. This necessitates further evaluation for their agronomic performance, especially in the field conditions. Nevertheless, there might be a net gain in its output value given that the high value niche market for high-ECQ grains is rapidly expanding. Future studies could also be directed to the incorporation of high yielding traits, for example, by simultaneous targeting a number of negative regulatory genes, such as GS3, TGW6 and GS6, leading to an optimal balance between quality and yield traits."}], "Conclusion": []}}, {"pmcid": "PMC10043318", "title": "TaBAS1 encoding a typical 2-Cys peroxiredoxin enhances salt tolerance in wheat", "source_file": "PMC10043318.json", "source_url": "https://pmc.ncbi.nlm.nih.gov/articles/PMC10043318/", "included_counts": {"Abstract": 1, "Introduction": 5, "Discussion": 7}, "omitted_results_discussion": false, "sections": {"Abstract": [{"passage_id": "Abstract.p0001", "text": "Efficient antioxidant enzymatic system contributes to salt tolerance of plants via avoiding ROS over-accumulation. Peroxiredoxins are crucial components of the reactive oxygen species (ROS) scavenging machinery in plant cells, but whether they offer salt tolerance with potential for germplasm improvement has not been well addressed in wheat. In this work, we confirmed the role of a wheat 2-Cys peroxiredoxin gene TaBAS1 that was identified through the proteomic analysis. TaBAS1 overexpression enhanced the salt tolerance of wheat at both germination and seedling stages. TaBAS1 overexpression enhanced the tolerance to oxidative stress, promoted the activities of ROS scavenging enzymes, and reduced ROS accumulation under salt stress. TaBAS1 overexpression promoted the activity of ROS production associated NADPH oxidase, and the inhibition of NADPH oxidase activity abolished the role of TaBAS1 in salt and oxidative tolerance. Moreover, the inhibition of NADPH-thioredoxin reductase C activity erased the performance of TaBAS1 in the tolerance to salt and oxidative stress. The ectopic expression of TaBAS1 in Arabidopsis exhibited the same performance, showing the conserved role of 2-Cys peroxiredoxins in salt tolerance in plants. TaBAS1 overexpression enhanced the grain yield of wheat under salt stress but not the control condition, not imposing the trade-offs between yield and tolerance. Thus, TaBAS1 could be used for molecular breeding of wheat with superior salt tolerance."}], "Introduction": [{"passage_id": "Introduction.p0002", "text": "High salinity is one of the major environmental constraints on plant growth and crop production. To identify salt tolerant genes not imposing the trade-offs between salt tolerance and growth/yield is crucial for building the germplasms to confront the circumstance of salt stress. As a typical physiological response to salt and other abiotic stresses, reactive oxygen species (ROS) often over-accumulate in plants, which results in serious secondary damage in cells. Thus, the genes efficiently avoiding ROS over-accumulation would be the excellent candidates for molecular breeding."}, {"passage_id": "Introduction.p0003", "text": "Plants possess a complicated ROS scavenging system, including a set of enzymes such as superoxide dismutase (SOD), catalase (CAT), and ascorbate peroxidase (APX). Besides, peroxiredoxins (Prxs) are simple proteins with peroxidase activity on a variety of peroxide substrates, such as hydrogen peroxide (H2O2). They compromise several isoforms that are specifically distributed in cytosol, chloroplasts as well as other organelles and even in the extracellular space. Prxs are characterized by a peroxidatic cysteine (Cys) at the active site, which could be oxidized by the peroxide substrates to reduce the peroxides to the corresponding hydroxylated compounds. According to the peroxidatic cysteine, Prxs are differentiated into two categories, 1-Cys and 2-Cys Prxs. 2-Cys Prxs are homodimeric enzymes where the two subunits are linked covalently via a disulphide bridge in the oxidized form. 2-Cys Prxs highly accumulate in the chloroplasts, and they contain an N-terminal extension which is important for importing the preprotein into the chloroplasts. The chloroplast is not only the site of photosynthesis, but also an important source of H2O2. Abiotic stresses have been found to induce ROS over-production in the chloroplasts. 2-Cys Prxs have proved to play the central role of in chloroplast redox regulation, and they participate in the response to oxidative and abiotic stresses such as high temperature through modulating chloroplast redox. However, whether they offer the tolerance to salt, a major abiotic stress crops confront, has not been reported."}, {"passage_id": "Introduction.p0004", "text": "Upon ROS, the peroxidatic Cys of 2-Cys Prxs becomes transiently oxidized as sulfenic acid (-SOH) and then condenses with the resolving Cys to form a disulfide bridge, and this disulfide has to be reduced for a new catalytic cycle. The chloroplast localized NADPH-dependent thioredoxin reductase C (NTRC) is an efficient reductant of 2-Cys Prxs, indicating a possible relationship between antioxidant mechanisms and redox regulation. NTRC participates in the redox regulation of chloroplast enzymes that depend on 2-type Thioredoxins (Trxs) through the control of the redox balance of 2-Cys Prxs. The redox status of 2-Cys Prxs was severely impaired in the ntrc mutant. The association between 2-Cys Prxs and NTRC in the response of salt and other abiotic stresses has not been reported."}, {"passage_id": "Introduction.p0005", "text": "Besides as toxic molecules, ROS serve as the signals that are crucial for regulating diverse biological processes. Thus, nontoxic ROS levels need to be fine-tuned to maintain suitable homeostasis via the orchestration by both ROS production machinery involving ROS-producing enzymes and the metabolic counter-process involving ROS-scavenging enzymes. NADPH oxidases (NOX) are the major producers of ROS. The inhibition of NOX by mutating the encoding gene or applying the NOX inhibitors reduces ROS production, abiotic stress tolerance, and antioxidant defense capacity. The responses of ROS to various environmental stimuli may be attributed to different regulatory mechanisms of ROS production via NADPH oxidases. On the other hand, the alteration of ROS scavengers affects the activity of ROS producers. For instance, TaSOD2 encoding a superoxide dismutase enhances salt tolerance and NOX activity, and the inhibition of NOX erases the role of TaSOD2. However, whether the role of 2-Cys peroxiredoxins in salt stress tolerance is associated with the alteration of ROS scavenging and production systems is not clear."}, {"passage_id": "Introduction.p0006", "text": "We previously bred a salt-tolerant wheat cultivar SR3 via asymmetric somatic hybridization with common wheat cultivar JN177 as the parent. In comparison with JN177, SR3 has superior photosynthesis efficiency under salt stress. To gain insight into the biochemical basis for salt tolerance of SR3, we performed a proteomic analysis and found there had obvious difference between the chloroplast proteomes of SR3 and JN177, and identified a 2-Cys peroxiredoxin TaBAS1 with differential abundances between SR3 and JN177. In this work, we found that TaBAS1 that offered salt tolerance. The role of TaBAS1 in salt tolerance was associated with ROS producer NOX and 2-Cys Prx’s reductant NTRC. TaBAS1 overexpression enhanced grain yield under salt stress without imposing the trade-offs between salt and yield, showing TaBAS1 is an excellent candidate gene for germplasm improvement."}], "Discussion": [{"passage_id": "Discuss.p0002", "text": "TaBAS1 is a salt tolerant gene with potential in molecular breeding"}, {"passage_id": "Discuss.p0003", "text": "Salt and other abiotic stresses induce comprehensive physiological alteration, which in turn enhances the adaptation capacity of plants to the stresses. Thus, the genetic manipulation of genes directly modulating the physiological response would efficiently enhances the
