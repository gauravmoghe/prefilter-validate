ing, multiple genetic pathways regulate the response to internal or external cues, including photoperiod, temperature, vernalization, autonomous, and hormone pathways. Compared with the regulation of flowering in Arabidopsis under LD conditions, studies on flowering in rice and temperate cereals under short-day (SD) conditions also highlight the conservation of their regulation. Integrating with two major genes, FLOWERING LOCUS T (FT) and SUPPRESSOR OF OVEREXPRESSION OF CO1 (SOC1), regulates the transition from the vegetative growth stage to the reproductive stage. The CO-FT system is conserved among angiosperms. Rice, an SD monocot model plant, has a Heading date 1 (OsHd1)–Heading date 3a (OsHd3a) pathway, which is homologous to the AtCO-AtFT pathway in Arabidopsis. However, rice has another unique pathway, the grain number, plant height, and heading date 7 (OsGhd7)–Early heading date 1 (OsEhd1)–OsHd3a pathway. The FT pathway research in foxtail millet is still limited. Several FT quantitative trait loci (QTLs) regions were first identified by a cross between foxtail millet and its wild relative green foxtail, including some candidate genes from autonomous and photoperiod pathway such as AtCO and AtFT/OsHD3A/OsRFT1. The genome-wide association studies (GWAS) on foxtail millet revealed candidate genes underlying FT such as pseudo-response regulator gene, SiPRR37."}, {"passage_id": "Introduction.p0005", "text": "Studies of FT-related traits in foxtail millet landraces collected from various regions in Europe and Asia revealed that the variations in HD, floral initiation, and panicle development are influenced by temperature and daylength. Ambient temperature (AT) and photoperiod are the two critical environment cues that affect FT, and AT has recently attracted much attention due to global climate change. Raising AT also promotes flowering in Arabidopsis and rice. The AT increased in Northern Europe from 1985 to 2009, causing oats, wheat, and maize to heading approximately 1–3 weeks earlier and yields decreased. Several genes regulated by AT were identified. PHYTOCHROME B (AtPHYB), a photoreceptor, is known to act as a temperature sensor at night and senses daytime temperature through PHYTOCHROME INTERACTING FACTOR4 (AtPIF4), thereby enhancing AtFT expression. OsPHYB as an AT sensor increases OsGhd7 repressor activity at low AT to delay FT but decreases OsGhd7 at a high AT to promote FT."}, {"passage_id": "Introduction.p0006", "text": "FT is regulated by the coordination of local environmental signal and plant genetic information. In addition, their genotype-by-environment (G × E) interactions are crucial for local adaptation. The genetic diversity of Taiwan foxtail millet is very high due to adaptation to various environment and selection by various preferences of indigenous peoples. In our previous study, HDs varied widely among 133 Taiwan foxtail millet accessions, ranging from 53.7 to 109.5 days. Foxtail millet, an SD plant, is cultivated in Taiwan under the SD condition with the day length in the range of 10.5–11.5 h. The HD variations could be accounted by different genotypes and AT. The major factors affecting HD variation are genetic diversity and AT, not photoperiod. Thus, this study aimed to understand how genotypes of foxtail millet, AT, and their G × E effects lead to HD variation. Understanding the G × E effects on HD or FT is important for improving the crops under the future climate change conditions."}], "Discussion": [{"passage_id": "Discuss.p0002", "text": "In Taiwan, foxtail millet has been cultivated for more than 5,000 years. Because of the indigenous people preferences and the high adaptability of foxtail millet to various environments, the genetic diversity of landraces is very high, which is reflected in agronomic traits and grain quality. HD variation among foxtail millet accessions were observed when cultivated in different locations under natural SD conditions in Taiwan ( Figure 1 ). Although photoperiod and temperature were found to be important environmental factors regulating FT, other environmental factors interact to affect crop growth. Nine accessions grown in southern, central, and northern Taiwan exhibited significant differences in HD ( Figure 1 ). The three environmental factors of relative humidity, precipitation, and sunshine duration had no significant difference among these characters. Although the relative humidity and sunshine duration were significantly different only between CY and TP (P < 0.05), the temperature was highly significantly different between the three environments in TC, CY, and TP (P < 0.001), suggesting that AT is the main factor affecting the HD of foxtail millet under SD conditions ( Figure 1 )."}, {"passage_id": "Discuss.p0003", "text": "The four accessions grown at higher AT entered HD earlier, and the change in AT had different effects on HD of different accessions in the temperature-controlled phytotron ( Figure 2 ). The India landrace Andhra Pradesh was the least affected by AT, and the average HD difference between 30/25°C and 15/13°C was 51 days. However, the other three accessions were significantly affected by AT with a difference of more than 80–115 days. Lower AT also obviously impeded plant growth, such as cultivar TT8 and landrace Arie delayed heading for 150 days at 15/13°C ( Figure 2 ). Because the optimum temperature for foxtail millet cultivation is between 16°C and 25°C. On the other hand, four accessions grew well at 30/25°C but failed at 35/30°C with growth arrest. Foxtail millet grows faster under higher ATs, and its growth rate has a linear relationship with the increase of AT in the optimum temperature range, which is similar to that of rice. FT is influenced by genetic variation that interacts with the environment, the so-called G × E interaction, where different varieties grow optimally in different environments. The results support the notion that HD variations of foxtail millet can be explained by different genotypes (gene, G), different locations (environment, E), and the interaction between genotypes and locations (G × E); especially, the environment factors have a significant effect on HD ( Figure 1 )."}, {"passage_id": "Discuss.p0004", "text": "With the availability of reference genomes and the advent of genomic approaches of model plants such as Arabidopsis and rice, the genome information has allowed the comparison of flowering pathways in extending into other species. Eight genes were selected to investigate their nucleotide polymorphism in nine accessions, including Taiwan and India accessions ( Table 1 ). A nucleotide substitution from G to A in SiCO intron 1 results in the splicing variation that was widely distributed in landraces from European and Asia, and the HD variation might result from the loss of function of the SiCO protein in foxtail millet. In this study, the allelic variation in these nine accessions at this nucleotide was not associated with HD at three locations in Taiwan. In contrast, the allelic polymorphisms of SiGhd7-2, SiGhd7-3, SiEhd1, SiCO4, and SiFT11 were associated with HD at three locations in Taiwan ( Table 1 , Figure 3 ), indicating that these genes were candidates for FT-related genes in foxtail millet."}, {"passage_id": "Discuss.p0005", "text": "The expression levels of 14 tested genes in four accessions were significantly affected by temperature, genotype, and temperature × genotype interaction. Meanwhile, these FT-related genes expression, such as SiGhd7-2, SiEhd1, SiFT, and SiFT11, were also significantly associated with HD ( Table 2 , Figures 4 , 5 ). In Arabidopsis, thermal induction from 23°C to 27°C under SD conditions was sufficient to trigger flowering, and this trigger was accompanied by an increase in AtFT expression, suggesting that AtFT can be activated independent of the photoperiod pathway. In rice, low temperature affects the expression of the floral pathway integrator gene OsHd3a. When the temperature was decreased from 27°C to 23°C, the OsHd3a mRNA expression was significantly reduced under both SD and LD conditions, indicating that the expression of OsHd3a is dependent on photoperiod and AT pathway. In foxtail millet, change in the expression levels of SiFT and SiFT11 associated with AT, thereby affecting HD under the SD condition ( Figures 4 , 5 )."}, {"passage_id": "Discuss.p0006", "text": "The correlation of gene × gene interactions with AT results revealed that the expression levels of SiPHYB and SiPRR family members were significantly positively correlated with each other and with that of SiGhd7 and SiGhd7-2 and negatively correlated with that of SiCO4 ( Figures 6A, B ). In addition, the expression levels of SiGhd7 and SiGhd7-2 were also significantly negatively correlated with the expression levels of SiEhd1 and SiFT11, and the expression level of SiEhd1 was significantly positively correlated with those of SiFT11 and SiFT ( Figures 6A, B ). AtPHYB could sense temperature changes, and OsPHYB affected the expression of OsGhd7. OsGhd7 is temperature-regulated and mainly suppresses HD in rice because OsGhd7 represses OsEhd1 and OsHd3a. Therefore, the expression of these FT-related genes such as SiGhd7-2, SiEhd1, and SiFT11 in foxtail millet is similar to that in rice, and they are all important genes that regulate foxtail millet HD under high AT conditions ( Table 3 , Figures 5 , 6 )."}, {"passage_id": "Discuss.p0007", "text": "Foxtail millet has attracted attention in combating climate change to ensure food security because of its high adaptability to harsh environments compared with other crops. Establishing trait-associated gene regulatory pathways requires many functional validations to demonstrate the interaction between genes. However, studies on HD pathways in foxtail millet are still limited. In this study, variations in HD among nine accessions were observed when cultivated in southern, central, and northern Taiwan under the natural SD condition ( Figure 1 ). Subsequently, the study demonstrated that under SD conditions in Taiwan, the HD of foxtail millet accession was significantly correlated with AT. The suitable AT for foxtail millet growth is between 13°C and 30°C, and a higher AT promotes earlier HD ( Figure 2 ). The allelic polymorphisms in FT-related genes were also associated with HD variations ( Table 1 , Figure 3 ). Thus, this study explored the relationship between the expression levels of 14 key FT-related genes and AT and HD ( Table 2 , Figures 4 , 5 ). Through the correlation coefficients of the expression levels of each FT-related gene with AT, a coexpression regulatory network was identified that interacted and was affected by AT ( Table 3 , Figure 6 ). The study of coexpression regulatory network revealed key FT-related genes and their possible interactions in the regulation of foxtail millet HD under AT changes, which provided a preliminary understanding and molecular basis for elucidating the mechanism of foxtail millet HD under SD conditions ( Figure 6 ). This study provides a new understanding of possible flowering pathways in foxtail millet and is advisable to apply candidate gene approaches for successful breeding strategies for shift production to increase yield in response to global warming."}], "Conclusion": []}}, {"pmcid": "PMC10018785", "title": "The class B heat shock factor HSFB1 regulates heat tolerance in grapevine", "source_file": "PMC10018785.json", "source_url": "https://pmc.ncbi.nlm.nih.gov/articles/PMC10018785/", "included_counts": {"Abstract": 1, "Introduction": 4, "Discussion": 9, "Conclusion": 1}, "omitted_results_discussion": false, "sections": {"Abstract": [{"passage_id": "Abstract.p0002", "text": "Grape is a widely cultivated crop with high economic value. Most cultivars derived from mild or cooler climates may not withstand increasing heat stress. Therefore, dissecting the mechanisms of heat tolerance in grapes is of particular significance. Here, we performed comparative transcriptome analysis of Vitis davidii ‘Tangwei’ (heat tolerant) and Vitis vinifera ‘Jingxiu’ (heat sensitive) grapevines after exposure to 25°C, 40°C, or 45°C for 2 h. More differentially expressed genes (DEGs) were detected in ‘Tangwei’ than in ‘Jingxiu’ in response to heat stress, and the number of DEGs increased with increasing treatment temperatures. We identified a class B Heat Shock Factor, HSFB1, which was significantly upregulated in ‘Tangwei’, but not in ‘Jingxiu’, at high temperature. VdHSFB1 from ‘Tangwei’ and VvHSFB1 from ‘Jingxiu’ differ in only one amino acid, and both showed similar transcriptional repression activities. Overexpression and RNA interference of HSFB1 in grape indicated that HSFB1 positively regulates the heat tolerance. Moreover, the heat tolerance of HSFB1-overexpressing plants was positively correlated to HSFB1 expression level. The activity of the VdHSFB1 promoter is higher than that of VvHSFB1 under both normal and high temperatures. Promoter analysis showed that more TATA-box and AT~TATA-box cis-elements are present in the VdHSFB1 promoter than the VvHSFB1 promoter. The promoter sequence variations between VdHSFB1 and VvHSFB1 likely determine the HSFB1 expression levels that influence heat tolerance of the two grape germplasms with contrasting thermotolerance. Collectively, we validated the role of HSFB1 in heat tolerance, and the knowledge gained will advance our ability to breed heat-tolerant grape cultivars."}], "Introduction": [{"passage_id": "Introduction.p0002", "text": "Heat stress is broadly considered a major determining factor affecting crop growth and development, limiting production and quality. Photosynthesis is a sensitive physiological process affected by high temperature. High temperature rapidly inhibits photosynthesis by changing chloroplast structure, inactivating ribulose-1,5-bisphosphate carboxylase-oxygenase (Rubisco), decreasing the abundance of photosynthetic pigments, and damaging photosystem II. In addition, high temperature influences the stability of proteins and membranes, induces the accumulation of reactive oxygen species (ROS), and changes the production and signal transduction of plant hormones, resulting in transcriptomic reprogramming and metabolomic changes. Nonetheless, plants have also evolved complex and inter-connected signaling pathways and response mechanisms to high temperature."}, {"passage_id": "Introduction.p0003", "text": "Grapevines are valuable crops widely cultivated throughout the world. However, during the growing season, grapevines often suffer from heat stress, that affects development and fruit metabolism, thus limiting grape yield and quality. In the past, our research on grape responses to high temperature mainly focused on physiological and morphological changes. With advances in high-throughput RNA sequencing technology, we now possess a powerful tool for investigating the global response of plants to heat stress. Liu et al. characterized some stress-related genes that encode transcription factors (TFs), antioxidant enzymes, heat shock proteins (HSPs), and glycolytic enzymes by analysing the transcriptomics and proteomics of Vitis vinifera ‘Cabernet Sauvignon’ under high temperature. Jiang et al. analysed the transcriptomics and proteomics of V. vinifera ‘Jingxiangyu’ grapevines exposed to 35°C, 40°C, and 45°C, and revealed that alternative splicing is an important post-transcriptional regulatory event during grapevine responses to heat stress. Based on phosphoproteomic and acetylproteomic analyses of the ‘Jingxiangyu’ leaves under elevated temperature, phosphorylation of serine/arginine-rich splicing factors is involved in heat response. By investigating the effects of high temperature on grape berries based on proteomic and metabolomics analyses, Lecourieux et al. found 592 differentially accumulated proteins in Cabernet Sauvignon plants. However, previous research has mostly focused on heat-sensitive cultivars of V. vinifera, resulting in a limited understanding of grapevine responses to high temperatures. By analysing the transcriptional profiles of heat-tolerant and sensitive tea cultivars, 78 differential expressed genes (DEGs) have been identified, validating a rational approach to identify the key genes using two varieties with contrasting heat tolerance. In addition, none of those genes reported in the previous studies have been experimentally verified to regulate heat tolerance in grapevines by transgenic methods. Therefore, it is essential to include heat-tolerant grapevine germplasms to acquire global insight into heat tolerance mechanisms and verify functionally of key heat response genes in grapevine."}, {"passage_id": "Introduction.p0004", "text": "Heat shock factors (HSFs) play critical, conserved roles in the plant transcriptional network that regulates thermo-responsive gene expression. Based on the length of the flexible linker between DBD and HR-A/B regions and the number of amino acid residues in the HR-A/B regions, plant HSFs are classified into three classes: A, B, and C. Among class A HSFs, HSFA1s play critical roles in heat stress response and are regarded as indispensable regulators in the transcriptional network. In tomato and Arabidopsis, knockdown or knockout of HSFA1 genes, downregulate many heat stress-responsive genes and induce heat stress-sensitive phenotypes. HSFA1s directly regulate the expression of genes involved in heat stress response, including DEHYDRATION-RESPONSIVE ELEMENT BINDING PROTEIN 2A (DREB2A), HSFA2, HSFA7a, HSFBs, and MULTIPROTEIN BRIDGING FACTOR 1C (MBF1C). In addition to HSFA1s, other members of the class A family, such as HSFA2 and HSFA3, also play critical roles in plant response to heat stress. HSFA2 is essential for heat stress response in plants. The hsfa2-knockout mutant exhibits high sensitivity to heat stress, together with reduced expression of many heat stress-inducible genes. Knockout or knockdown of HSFA3 also reduced the expression of HSP genes during heat stress. Compared with the known activator function of several HSFAs in model plants, the roles of HSFBs are less well understood. Moreover, compared to the model plants, much less research on HSFs has been carried out for fruit crops. HSFAs or HSFBs are significantly upregulated under heat stress in grape, apple, citrus, and strawberry; however, only a few reports describe the roles of grape HSFs in heat stress with genetic evidence."}, {"passage_id": "Introduction.p0005", "text": "In this study, we presented a high-resolution view of the transcriptional changes in heat tolerant (Vitis davidii ‘Tangwei’) and sensitive (V. vinifera ‘Jingxiu’) grapevines under varying degrees of high temperatures. The grape HSFB1 was identified and functionally characterized because it was differentially expressed only in ‘Tangwei’ and upregulated under heat stress. HSFB1 positively regulates heat tolerance in grapevine as a transcriptional repressor. Moreover, VdHSFB1 from ‘Tangwei’ and VvHSFB1 from ‘Jingxiu’, which differ only one amino acid, exhibit similar repression activity; however, the promoter variations of the two orthologues likely determine the difference of HSFB1 gene expression in the two grape germplasms with contrasting thermotolerance, contributing to the difference in heat tolerance."}], "Discussion": [{"passage_id": "Discuss.p0002", "text": "In the past decades, climate change significantly influenced grape production. Worldwide viticulture will encounter a serious threat in the near future if annual temperatures continue to rise. Most global cultivars derived from mild climates may be unable to withstand the extreme heat stress. Grapevine germplasms from warmer regions may therefore be important genetic resources. Exploring the molecular mechanisms underlying heat tolerance of these germplasms is particularly important for breeding new heat-tolerant cultivars, thereby promoting the sustainability of grape cultivation and the wine industry. Here, we evaluated the heat tolerance of nine representative germplasms, and found that the heat tolerance between V. davidii ‘Tangwei’ or V. quinquangularis ‘Yeniang 2’ and V. vinifera ‘Jingxiu’ was the most different (Fig. 1A). The strong heat tolerance of V. davidii and V. quinquangularis may be closely associated with their distribution in southern China and their long history of growth in hot and humid conditions. Although showing many similarities in heat response as other crops, the perennial grapes possess distinct characteristics. We used V. davidii ‘Tangwei’ (heat tolerant) and V. vinifera ‘Jingxiu’ (heat sensitive) as two contrasting germplasms to investigate the specific factors in the regulatory networks that control grapevine response to high temperature."}, {"passage_id": "Discuss.p0003", "text": "More DEGs are found in heat-tolerant grapevine germplasms in response to heat stress"}, {"passage_id": "Discuss.p0004", "text": "Transcriptomics is useful to understand how plants respond to abiotic stresses and to characterize genes involved in these responses. Together with the physiological data, transcriptional profiling aided us to dissect the molecular programming that distinguishes the heat stress responses between the heat tolerant and sensitive germplasms. The numbers of DEGs in both ‘Tangwei’ and ‘Jingxiu’ increased with increasing treatment temperature; however, the DEG numbers in ‘Tangwei’ (757) were significantly greater than in ‘Jingxiu’ (304) (Fig. S1, see online supplementary material), suggesting that the heat-tolerant germplasm activates more genes under higher temperature and can better respond to heat stress compared with the heat-sensitive germplasm. Moreover, there were far more unique DEGs in ‘Tangwei’ than ‘Jingxiu’ when comparing each germplasm at elevated temperature to normal temperature, i.e. 4337 and 4122 DEGs in TW2 and TW3, respectively, versus 2437 and 748 in JX2 and JX3, respectively (Fig. S1D and E, see online supplementary material), suggesting that more genes are affected in ‘Tangwei’ than in ‘Jingxiu’. The heat-tolerant germplasms seem to evolve more larger regulatory networks to adapt heat stress."}, {"passage_id": "Discuss.p0005", "text": "HSFB1 is a key factor determining the difference between heat tolerant and sensitive grapevines"}, {"passage_id": "Discuss.p0006", "text": "HSFs are considered to be one of the most important TF families for plant heat stress response. Here, 11 grape HSFs were also identified as DEGs in response to heat treatments. Similar to the previous studies, the expression of VIT_204s0008g01110 (HSFA2) showed marked upregulation in the TW1, TW2, JX1, and JX2 comparisons (Additional file 3), indicating that HSFA2 may contribute to enhancing grapevine heat tolerance. Interestingly, HSFB1 from the HSFB family was identified as a DEG in the TW2 and TW3 comparisons but not in any JX comparisons (Additional file 3), which was confirmed by qRT-PCR assays (Fig. 3A). In addition, the upregulation of HSFB1 in ‘Tangwei’ was higher than that in ‘Jingxiu’ under 42°C for a different treatment time (Fig. 2B). The above results suggest that HSFB1 may determine the difference in heat tolerance between heat tolerant and sensitive grapevines."}, {"passage_id": "Discuss.p0007", "text": "HSFB1 positively regulates heat tolerance as a transcriptional repressor in grapevine"}, {"passage_id": "Discuss.p0008", "text": "HSFAs are commonly transcriptional activators due to the acidic AHA domains with activator potential. Some HSFBs possess transcriptional repression activities due to the presence of B3 repression domains. Here, we showed that the HSFB, HSFB1, possesses a B3 repression domain and represses transcription in an Arabidopsis protoplast-based assay (Fig. 3B; Fig. S6A, see online supplementary material). The VdHSFB1 and VvHSFB1 proteins only differ in one amino acid which does not seem to affect transcriptional repression activity (Fig. 3B). Some HSFBs possess transcriptional repression or activation activity in plants. In tomato, HSFB1 not only functions as a repressor to repress the expression of HS-inducible genes but also as a co-activator of HSFA1a and other non-HSF TFs. In Arabidopsis, HSFB2b is a transcriptional repressor of several HSP genes. However, chickpea HSFB2 has weaker transcription activation activity. HSFBs expression are often induced by heat stress; however, their roles in plant heat tolerance can be postive or negative. For example, TaHSF3, a member of HSFBs with transcriptional repression activity, enhances heat tolerance of Arabidopsis. In contrast, the Arabidopsis HSFB1 and HSFB2 is a transcriptional repressor, but the hsfb1hsfb2b mutants exhibit higher basal thermotolerance than the wild type plant. We overexpressed and RNAi VdHSFB1 and VvHSFB1 in grapevines. We found that transient overexpression of VdHSFB1 and VvHSFB1 enhanced heat tolerance in ‘Jingxiu’ (Fig. 4), and RNAi of HSFB1 decreased heat tolerance in a heat tolerant germplasm (Fig. 5). Moreover, overexpression of VdHSFB1 significantly enhanced the heat tolerance of OE-VdHSFB1 compared with EV suspension cells (Fig. 6). Furthermore, HSFB1 overexpression was positively correlated to heat tolerance (Fig. 4). These results suggest that the grape HSFB1 positively regulates heat tolerance in grapevine."}, {"passage_id": "Discuss.p0009", "text": "Promoter variations between VdHSFB1 and VvHSFB1 contribute to heat tolerance difference between ‘Tangwei’ and ‘Jingxiu’"}, {"passage_id": "Discuss.p0010", "text": "The induction of HSFBs in plants under abiotic stress have been reported. The expression of OsHSF2b is highly induced by heat, salt, and polyethylene glycol (PEG) treatments in rice. TaHSF3 is significantly upregulated under heat and cold stress in wheat seedlings. The expression of CarHSFB2 is upregulated under the heat, salt, and drought stress. Here, VdHSFB1 and VvHSFB1 was induced by high temperatures. Moreover, the extent of upregulation of VdHSFB1 was notably higher than that of VvHSFB1 under different high temperatures (Fig. 2A) and under 42°C for different treatment time (Fig. 2B). These results and the genetic evidence (Figs 4–6) indicated the HSFB1 expression level correlates positively with grape heat tolerance. In rice, the promoter sequence variations of CTB4a confer varying degrees of cold tolerance. Similarly, the sequence variations in the SLG1 promoter increase the thiolated tRNA level, thus enhancing heat tolerance of indica rice varieties. Therefore, we speculated that the expression difference between VdHSFB1 and VvHSFB1 is associated with difference in the promoter activity. In this study, the transient expression assays using plantlets and Arabidopsis protoplasts showed that the promoter activity of VdHSFB1 is notably higher than that of VvHSFB1 under both normal and high temperatures (Fig. 7). In addition, we found more TATA-box and AT~TATA-box cis-elements in VdHSFB1 promoter than the VvHSFB1 promoter (Table S2, see online supplementary material). TATA-box has been shown to enhance transcription efficiency. Therefore, promoter variations between VdHSFB1 and VvHSFB1 influence heat difference of grapevines. Further study will be needed to pinpoint the role of each cis-element in enhancement of the promoter strength."}], "Conclusion": [{"passage_id": "Concl.p0002", "text": "This study provides abundant transcriptomic data on the response of heat-tolerant (‘Tangwei’) and heat-sensitive (‘Jingxiu’) grapevines responding to different high temperatures. The significantly enriched DEGs in the heat-tolerant germplasm provide many candidate genes for future studies of the molecular mechanisms governing heat-tolerance in grapevines. In addition, we demonstrated that the grape HSFB1 is a critical factor involved in thermotolerance. VdHSFB1 and VvHSFB1 from the two contrasting germplasms possess similar transcriptional repression activity although the two proteins only differ in one amino acid. In addition, HSFB1 expression levels are markedly different in ‘Tangwei’ and ‘Jingxiu’. We propose that the difference in the expression levels is due to the promoter strengths, which can be explained by promoter sequence variation that results in change of the number of cis-elements. Promoter variations between VdHSFB1 and VvHSFB1 contribute to heat tolerance difference between the two grape germplasms with contrasting thermotolerance."}]}}, {"pmcid": "PMC10018853", "title": "Transcriptome profiling reveals characteristics of hairy root and the role of AhGLK1 in response to drought stress and post-drought recovery in peanut", "source_file": "PMC10018853.json", "source_url": "https://pmc.ncbi.nlm.nih.gov/articles/PMC10018853/", "included_counts": {"Abstract": 7, "Introduction": 5, "Discussion": 6, "Conclusion": 1}, "omitted_results_discussion": false, "sections": {"Abstract": [{"passage_id": "Abstract.p0001", "text": "Background"}, {"passage_id": "Abstract.p0002", "text": "HR (hairy root) has emerged as a valuable tissue for the rapid characterization of plant gene function and enzyme activity in vivo. AhGLK1 (Arachis hypogaea L. golden2-like 1) is known to play a role in post-drought recovery. However, it is unclear (a) whether HR has properties that are distinct from those of PR (primary root); and (b) which gene networks are regulated by AhGLK1 in response to drought stress and recovery in peanut."}, {"passage_id": "Abstract.p0003", "text": "Results"}, {"passage_id": "Abstract.p0004", "text": "We found that cells of the root tip cortex were larger in HR than in PR, while a total of 850 differentially expressed genes (DEGs) were identified in HR compared to PR. Eighty-eight of these DEGs, relating to chlorophyll and photosynthesis, were upregulated in HR. In addition, AhGLK1-OX (AhGLK1-overexpressing) HR showed a green phenotype, and had a higher relative water content than 35 S::eGFP (control) HR during drought stress. RNA-seq analysis showed that 74 DEGs involved both in the drought response and the post-drought recovery process were significantly enriched in the galactose metabolism pathway. GO terms enrichment analysis revealed that 59.19%, 29.79% and 17.02% of the DEGs mapped to the ‘biological process’ (BP), ‘molecular function’ (MF) and ‘cellular component’ (CC) domains, respectively. Furthermore, 20 DEGs involved in post-drought recovery were uniquely expressed in AhGLK1-OX HR and were significantly enriched in the porphyrin metabolism pathway. GO analysis showed that 42.42%, 30.30% and 27.28% of DEGs could be assigned to the BP, MF and CC domains, respectively. Transcription factors including bHLH and MYB family members may play a key role during drought stress and recovery."}, {"passage_id": "Abstract.p0006", "text": "Our data reveal that HR has some of the characteristics of leaves, indicating that HR is suitable for studying genes that are mainly expressed in leaves. The RNA-seq results are consistent with previous studies that show chlorophyll synthesis and photosynthesis to be critical for the role of AhGLK1 in improving post-drought recovery growth in peanut. These findings provide in-depth insights that will be of great utility for the exploration of candidate gene functions in relation to drought tolerance and/or post-drought recovery ability in peanut."}, {"passage_id": "Abstract.p0007", "text": "Supplementary Information"}, {"passage_id": "Abstract.p0008", "text": "The online version contains supplementary material available at 10.1186/s12864-023-09219-2."}], "Introduction": [{"passage_id": "Introduction.p0001", "text": "Background"}, {"passage_id": "Introduction.p0002", "text": "Peanut (Arachis hypogaea L.) is an important economic and oil crop that is widely cultivated in arid and semi-arid regions. Its kernels contain about 80% fat and protein, are rich in resveratrol, vitamins, etc., and have certain health care functions. In Asia and Africa, peanut is an important crop for preventing malnutrition and ensuring a safe food supply. Peanut yield and quality are frequently limited because of seasonal drought or fungal disease. Despite the recent availability of a whole genome sequence and increasing amounts of transcriptome data for wild and cultivated peanut varieties, transgenic systems are still not routinely used in peanut plants due to the complexity of the genetic background (tetraploid) and poor efficiency. Chimeras have been generated using tissue culture-independent transformation, but selection of lines homozygous for the transgene is time-consuming. Consequently, an alternative, rapid transformation system to facilitate peanut gene characterization is essential and the hairy root (HR) transformation system fulfills this requirement. In previous work, a method for efficient induction of HR from peanut-leaf explants was developed, and this has been used to illuminate the molecular function of several genes in peanut, such as AhHDA1 and AhGLK1. HR cultures are particularly easy to grow in hormone-free medium and represent a valuable tool for genetic transformation, production of high levels of secondary metabolites, or the regeneration of whole plants. For example, HR has been used to study nodule formation and nitrogen fixation, drought tolerance, nematode interaction, subterranean insects and resveratrol biosynthesis. However, similarities and differences between HR and primary root (PR) have not yet been determined."}, {"passage_id": "Introduction.p0003", "text": "Drought is a severe environmental stress that negatively affects vegetative growth. Plants have evolved multiple protective mechanisms that are thought to cooperate to ameliorate adverse environmental factors. Whether crops can produce high yields under drought conditions depends not only on their own drought resistance, but also on their ability to grow during the post-drought recovery phase and to achieve yield compensation after experiencing water deficit. Post-drought recovery and growth have a profound impact on crop yield and quality and represent very complex biological processes, whose mechanisms are completely different from those involved in resistance to drought stress. During the recovery period, in addition to readjusting metabolism to pre-stress levels, plants also need to counteract drought-induced senescence of cells and tissues, which is not simply a return to the pre-stress state. Furthermore, chlorophyll content, photosynthetic rate, antioxidant systems and osmoregulatory compounds are all known to change during drought stress and rehydration. Indeed, many studies have shown that photosynthesis, chlorophyll metabolism, signal transduction, energy metabolism, cell wall synthesis and secondary metabolism are significantly altered during the recovery period following exposure to drought. Post-drought recovery is not only highly dependent on the degree of drought stress that plants are subjected to, but also depends on their own innate ability to recover. Studies have shown that peanuts rehydrated after drought before flowering are more productive than those with normal irrigation, and the degree of recovery shows a significant correlation with yield. This may be closely related to the larger root-to-shoot ratio of peanuts during drought. Generally, peanut varieties with strong drought resistance are better able to recover after rehydration. It can be seen that the ability to recover and grow post-drought plays an important role in the yield and quality of peanut, but the molecular mechanisms of recovery are poorly understood."}, {"passage_id": "Introduction.p0004", "text": "Golden2-like (GLK) transcription factors are members of the GARP superfamily, and were first reported in maize (Zea mays L.). A large number of studies have confirmed that GLKs regulate the expression of chlorophyll synthesis and photosynthesis-related genes by directly binding to their promoters, thereby affecting chlorophyll synthesis, photosynthesis and chloroplast development. GLKs improve the effective utilization of carbon, increase the accumulation of organic nitrogen, and promote plant growth and development. Furthermore, GLKs are involved in the responses to biotic stressors such as cucumber mosaic virus and turnip yellow mosaic virus, as well as some abiotic stresses including ozone and drought. Recent studies have shown that GLKs play an important role in the yield and quality of crops. For example, SlGLK2 can significantly improve the nutritional content and flavor of tomato. Constitutive expression of maize GLK genes in rice results in an increase in the number of seeds per panicle and in grain yield by 20–122% and 30–40%, respectively. In our previous study, when AhGLK1 was transformed into the Arabidopsis glk1glk2 mutant, it increased the survival rate of the mutant in post-drought recovery and fully rescued the mutant’s pale-green phenotype. Further studies confirmed that AhGLK1 protein can bind near the transcription start site of the AhPORA (Arachis hypogaea L. protochlorophyll ideoxidoreductases A) and AhCAB (Arachis hypogaea L. chlorophyll A/B binding protein) genes to enhance their expression during the post-drought period, thereby promoting recovery growth in peanut after rehydration. However, which gene networks are regulated by AhGLK1 in response to drought stress and recovery in peanut is unknown."}, {"passage_id": "Introduction.p0005", "text": "This study aimed to provide more details on the differences between PR and HR, and to generate more extensive data than previous analyses on the drought stress and post-drought recovery responses of peanut HR. Moreover, we wanted to identify unique candidate genes involved in AhGLK1-overexpressing HR (AhGLK1-OX HR) that might enhance its drought resistance and ability to recover. To this purpose, we first identified similarities and differences between peanut HR and PR in both root morphology and RNA-seq profile. Secondly, we performed RNA-seq analysis under control, drought and recovery conditions for 30-day-old 35 S::eGFP (blank control group) and AhGLK1-OX HR to screen for AhGLK1-controlled gene networks involved in the response to drought and in post-drought recovery. The results show that there is marked genetic plasticity in the response to drought stress and recovery in 35 S::eGFP and AhGLK1-OX HR, which provides valuable information for the clarification of regulatory mechanisms of drought-response and post-drought recovery processes in peanut."}], "Discussion": [{"passage_id": "Discuss.p0002", "text": "In plants, the root is the first organ to sense drought stress in the soil. HR has been successfully induced from various explants, such as leaves, petiole and epicotyl, with the highest induction rates being from leaf explants. Therefore, we might ask what kind of differences exist in the anatomy of HR and PR. To address this, the morphology and transcriptomes of peanut HR and PR were compared in this study. It was previously reported that the root tips in HR were thicker and more robust than in the seedling roots of Cassia obtusifolia; the smaller epidermal cells and the cortex cells of HR were more closely and irregularly arranged. As for peanut, HR also develops a root cap, meristem and elongation zone like in PR. However, unlike in PR, the cells in the HR root cap, apical meristem and cortex are inhomogeneous in size. They also show a difference in the adsorption of methylene blue, which stains plant tissue through a combination of physical adsorption and chemical affinity. After methylene blue staining, peanut PR appears purple-red, while HR becomes a deep purple-blue color. These results suggest there are crucial differences in the constitution of the cytoplasm or the pH between HR and PR in peanut. Nevertheless, HR originating from leaf explants develops a similar root structure to PR. These findings indicate that HR cultures are suitable for investigating gene functions involved in root development and stress responses."}, {"passage_id": "Discuss.p0003", "text": "A significant difference between the two root tissues emerged when we screened for differentially expressed genes. It was found that 516 DEGs were upregulated in HR compared to PR, and 88 of these were related to photosynthesis and chlorophyll synthesis. We also found that HR gradually turn green over time. In contrast, PR does not become green when cultivated on MS medium in the light. Thus, it seems that HR has the potential to synthesize chlorophyll, like leaves, suggesting that HR can be used to study genes that are mainly expressed in leaf. We also found that the plant hormone signal transduction pathway was enriched in downregulated DEGs, perhaps indicating that HR is less sensitive to the external environment than PR or that HR is better able to tolerate changes in the external environment. Our morphological and transcriptomics study reveals such differences between HR and PR for the first time."}, {"passage_id": "Discuss.p0004", "text": "Climate change is predicted to increase the severity and duration of drought events in many regions. Drought adversely influences plant growth and continues to threaten the world’s food security. Plants acclimatize to drought by regulating their physiological and biochemical characteristics. In particular, post-drought recovery growth is important for enhancing the quality and yield of crops. In peanut, substantial crop losses occur worldwide each year due to a variety of abiotic stresses. Peanut is predominantly grown in arid and semi-arid regions and its quality and yield are frequently impacted by drought stress; thus, post-drought recovery is critical for enhancing yield. However, no data are available on the genetic regulation of drought stress and post-drought recovery in peanut. In-depth research on this phenomenon will contribute to the development of molecular breeding strategies aimed at improving peanut drought tolerance and increasing its yield."}, {"passage_id": "Discuss.p0005", "text": "In this study, we revealed the various gene networks that are involved in the response to drought and post-drought recovery using HR. Our results show that, during drought, the flavonoid biosynthesis and circadian rhythm–plant pathways were the most significantly enriched in DEGs. Flavonoids are beneficial in that they improve the antioxidant capacity of plants and help alleviate damage caused by drought. Accordingly, our data suggest that HR protects itself from drought damage by synthesizing flavonoids. The plant circadian clock is a conserved regulatory mechanism that stimulates and maintains rhythmic elements of plant physiology. The circadian clock helps to improve environmental adaptation and to ensure optimal plant growth and performance. Many key genes of the circadian clock are involved in the regulation of stress responses. A recent study in rice found that the regulatory relationship between the expression of cell dehydration-responsive genes and circadian clock genes optimizes the water stress response at different times of the day, demonstrating that this mechanism plays an important role in increasing the survival rate and production efficiency of rice in an arid environment. Hence, we speculate that HR also improves its ability to survive by altering circadian rhythms during drought stress. However, during post-drought recovery, 1784 DEGs were downregulated in both 35 S::eGFP and AhGLK1-OX HR, while only 673 DEGs were upregulated in both types of HR, implying that a large number of DEGs show decreased expression during recovery. KEGG pathway analysis showed that metabolic pathways were the most significantly enriched in upregulated DEGs, with 108 in total. Thus, HR adapts to recovery growth by changing its metabolism, which is consistent with other research. In contrast, downregulated DEGs were significantly enriched in starch and sucrose metabolism, phenylpropanoid biosynthesis, amino sugar and nucleotide sugar metabolism and plant hormone signal transduction, suggesting that the activity of these pathways was repressed during post-drought recovery."}, {"passage_id": "Discuss.p0006", "text": "Interestingly, when we looked for DEGs that were implicated in both the response to drought and post-drought recovery, we found 74 examples, which included three and six upregulated and downregulated DEGs, respectively, that were common to both types of HR. Of these, 65 DEGs were upregulated during drought, but downregulated during recovery, showing that these genes are regulated in a reciprocal fashion and thus may play contrasting roles during drought and recovery. Metabolic pathways and the biosynthesis of secondary metabolism pathway were enriched in these genes, showing that metabolic adjustment is the most important factor in the adaptation of HR to water deficit. We found that 20 DEGs that were uniquely expressed in AhGLK1-OX HR, but commonly expressed in both types of HR in recovery, were enriched in the photosynthesis-antenna proteins and photosynthesis, and porphyrin metabolism pathways (Fig. 6E). This suggests that photosynthesis and chlorophyll synthesis are important in AhGLK1-OX HR in response to changes in the external environment, consistent with a previous study."}, {"passage_id": "Discuss.p0007", "text": "TFs are essential in plant signal transduction pathways and many TF families, such as MYB, bZIP, bHLH, WRKY, NAC, ERF and DREB, are involved in the response to drought stress as key regulators. In agreement with these studies, we found that members of the MYB, bHLH, NAC, WRKY, ERF and ARF families show differential expression in response to drought and post-drought recovery. Of these, bHLH TFs were the most abundant, implying that bHLH TFs play a critical role in the response to drought stress and recovery both in 35 S::eGFP and AhGLK1-OX HR, consistent with previous reports showing that bHLH TFs are widely involved in the plant response to abiotic stresses, such as drought, cold and salinity."}], "Conclusion": [{"passage_id": "Concl.p0002", "text": "Our study explores the differences between HR and PR in terms of root structure and transcriptome. The results reveal that HR possesses at least some of the characteristics of leaf, indicating that HR is suitable for studying the function of genes mainly expressed in leaf. This should yield reliable experimental evidence for analysis of the differences between HR and PR. Analysis of how the HR transcriptome changes during drought and post-drought recovery provides insight into the regulatory networks operating in peanut during exposure to and recovery from water deficit. In addition, the analysis reveals the gene networks specifically regulated by AhGLK1 in response to drought and recovery, elucidating the molecular mechanisms by which AhGLK1 improves drought resistance and post-drought recovery ability in peanut. However, the candidate genes that play the most important roles during drought and recovery require further study. In conclusion, this study provides a theoretical basis and a new perspective for in-depth exploration of drought resistance genes in peanut, and will be invaluable for molecular breeding of more resistant varieties."}]}}, {"pmcid": "PMC10019340", "title": "Cloning and comparative modeling identifies a highly stress tolerant Cu/Zn cytosolic super oxide dismutase 2 from a drought tolerant maize inbred line", "source_file": "PMC10019340.json", "source_url": "https://pmc.ncbi.nlm.nih.gov/articles/PMC10019340/", "included_counts": {"Abstract": 1, "Introduction": 4, "Discussion": 2, "Conclusion": 1}, "omitted_results_discussion": false, "sections": {"Abstract": [{"passage_id": "Abstract.p0001", "text": "Plants have a complex system of stress response that deals with different types of stresses. Maize (Zea mays L.), one of the most important crops grown throughout the world, across a range of agro-ecological environments, employs complex mechanisms of gene regulation in response to drought stress. HKI 335 is a tropical maize inbred line showing remarkable adaptation to drought stress. Abiotic stresses, like drought, trigger the production of reactive oxygen species (ROS) due to the incomplete reduction or excitation of molecular oxygen, eventually leading to cell damage. Superoxide dismutase (SOD, EC 1.15.1.1) is a metalloenzyme that acts as the first line of defense against ROS. We cloned the Sod2 gene from HKI 335 inbred line and analyzed its protein through detailed in silico characterization. Our comparative modeling revealed that at the level of tertiary structure, the HKI 335 SOD2 protein is highly similar to Potentilla atrosanguinea SOD2, which had been previously identified as highly thermostable SOD that can tolerate autoclaving as well as sub-zero temperatures. We performed phylogenetic analysis, estimated physicochemical properties, post-translational modifications, protein-protein interactions, and domain composition of this SOD2. The phylogenetic analysis showed that orthologous sequences of SOD from different species were clustered into two clusters. Secondary structure prediction indicates that SOD2 is a soluble protein and no transmembrane domains have been found. Most of the beta sheets have RSA value greater than 2. The Ramachandran plot from PDBsum revealed that most of the residues fall in the highly favored region. It was estimated that the value of the instability index was less than 40, the value of the aliphatic index was extremely high and the GRAVY value lies between −2 and +2. We could identify only one phosphorylation site, located at position 20 with a score of 0.692. Overall, the unique stress-tolerant properties of the HKI 335 SOD2, may be one of the reasons contributing to the high drought tolerance trait exhibited by HKI 335 maize inbred line. Further research may reveal more insights into the drought adaptation mechanism in maize and the eventual deployment of the trait in maize hybrids."}], "Introduction": [{"passage_id": "Introduction.p0002", "text": "To meet the increasing demand due to rising population and economic development, the production of crops should maintain a sustainable growth. However, environmental stresses such as drought, have become a major limitation in crop production, under unpredictable weather and changing climate patterns. Maize (Zea mays L.), is the most produced and consumed grain of the world, with diverse uses as food, feed, fuel and industrial products. It is grown worldwide across a range of agro-ecological environments, and is therefore prone to abiotic stresses, like drought. Although, the productivity of maize worldwide is high, yet the crop is highly sensitive to drought. Drought has been an ecological crisis throughout the world and is one of the major stresses that limits crop productivity. It is also considered to be the major serious environmental factor that limits the productivity of maize, especially under rain-fed conditions. The maize crop is susceptible to drought at different growth stages such as grain-filling, pre-flowering and seedling. Therefore, it is essential to understand the mechanism of drought-tolerance and breed drought-tolerant varieties. When plants are exposed to water stress, an integrated and diverse stress response system is activated that consists of various adaptive mechanisms at all scales of organization: morphological, physiological, and molecular. During the early stages of drought, plants absorb underground water efficiently, partially close stomata, check transpirational water loss, and finetune the metabolic rate to match with the available carbon and other resources. Osmolytes such as prolines, soluble sugars, spermines, and glycine betaine are necessary to retain the cell turgor pressure, under stress. Antioxidant enzymes such superoxide dismutase (SOD), ascorbate peroxidase (APX), catalase (CAT), and glutathione reductase (GR) are critical to maintain survival redox state for the cells under stress. Differential gene and protein expression through transcriptional and other regulation is hallmark of drought stress adaptation response. Abiotic stress such as drought, extreme temperatures, high salinity, excessive light, pollutants such as ozone and herbicides, high concentrations of heavy metals, excessive UV radiation, and others trigger the production of reactive oxygen species (ROS) due to incomplete reduction (hydrogen peroxide –H2O2; superoxide radical –O•−2; hydroxyl radical –HO•, etc.) or excitation (singlet oxygen –1O2) of molecular oxygen, eventually leading to cell damage."}, {"passage_id": "Introduction.p0003", "text": "Superoxide dismutase (SOD, EC 1.15.1.1) is a metalloenzyme that acts as the first line of defense against ROS. SODs play a major role in detoxification of ROS. SODs catalyze the dismutation of the superoxide radical (O2−) into oxygen and hydrogen peroxide (H2O2). All aerobic organisms that are prone to oxidative stress require SODs to dismutase O2 to yield H2O2. SODs are categorized in accordance with their metal cofactors and subcellular distribution: mitochondrial manganese SOD (MnSOD), cytosolic copper/zinc SOD (Cu/ZnSOD), and iron SOD (FeSOD). Maize contains nine SOD isozymes viz. four Cu/Zn cytosolic isozymes (SOD2, SOD4, SOD4A and SOD5) four mitochondrial associated MnSODs (SOD3.1, SOD3.2, SOD3.3 and SOD3.4) and one Cu/Zn chloroplast-associated isozyme (SOD-1). There are many reports stating that SOD2 overexpressing transgenic plants show enhanced tolerance to oxidative stresses such as drought."}, {"passage_id": "Introduction.p0004", "text": "A hyper-thermostable version of SOD2 enzyme, has been isolated from Potentilla atrosanguinea which was further engineered by mutating single amino acid to increases its thermal stability by two fold. P. atrosanguinea is reported to be functional at sub-zero temperature to >50 °C and also the protein retain activity after autoclaving (heating at 121 °C, at a pressure of 1.1 kg per square cm for 20 min). Cu, Zn SOD from P. atrosanguinea provides a unique opportunity to understand the role of free Cys-95. This enzyme is a dimer consisting of two asymmetric subunits, namely A and B. Each subunit consists of eight stranded β-sandwich (1a–8h) connected by seven loops (I–VII), one short helix and one 310 helix. As increased thermostability is desirable for Cu, Zn SOD, to act as a potent antioxidant enzyme. The expression of the SOD genes from plants is influenced by plant growth stage and growth regulating substances. Abscisic acid and osmotic stress induce expression of Cu/ZnSOD and MnSOD genes in maize. The overall SOD expression is determined at transcriptional, posttranscriptional, and translation levels."}, {"passage_id": "Introduction.p0005", "text": "In our earlier screens, HKI 335 maize inbred line (derived from Pool 10, All India Coordinated Research Project on Maize, Karnal centre, India) was found to be a highly drought tolerant line. Previously, we reported that enhanced SOD activity in maize could be a key strategy employed by the plant to mitigate abiotic stress, as evident by transcriptional modulation of antioxidant genes during methyl viologen induced oxidative stress. This prompted us to clone and analyze Cu/Zn cytosolic Sod2 from the highly drought tolerant line HKI 335."}], "Discussion": [{"passage_id": "Discuss.p0002", "text": "Plants are very sensitive to number of environmental stresses such as drought, salinity and cold that can cause extreme and rapid ROS accumulation. Plants also have important enzymatic and non-enzymatic mechanism that regulate oxidation process and help cells to protect from oxidative damage by ROS scavenging. The cloning and sequencing of SOD2 from drought tolerant maize inbred line HKI 335 shows that the length of sequence is 151 amino acids with a theoretical isoelectric point of 5.43 and a predicted molecular weight of 15,103.76 kD. The utilization of BLASTp tool of NCBI we have done the homologous search of target protein with the template/reference sequences. From this analysis, best 10 homologous (reference) protein sequences on the basis of numbers of criteria like percent identity (>80%) were selected and utilized for further analysis of the protein. The analysis of amino acid sequence demonstrated that SOD_Cu were high conserved domains in the SOD2 sequence. The phylogenetic analysis of SOD2 of maize showed that orthologous sequences of SOD from different species were clustered into two clusters (i.e., cluster A and cluster B). Previous study showed that there were two Cu/ZnSODs in eukaryotes, including intracellular and extracellular Cu/ZnSODs, encoded by two different genes."}, {"passage_id": "Discuss.p0003", "text": "In secondary structure of SOD2, we found absence of alpha-helices and large number of coils and beta-sheets with fully exposed relative solvent accessibility, showing that the amino acids in the protein secondary structure are completely buried. The high value of the RSA of the target protein suggests that the protein is stable for a number of biological functions within the the cell. The Ramachandran plot from PDBsum has revealed that most of the residues falling in highly favored region and some are in additional allowed region, very less in generously allowed region with no in the disallowed region. Independently, the high percentages of these amino acids in protein regulate the synthesis of protein as well as pathways involved in signalling. Alanine with highest percentage considered as a major component of cell wall biosynthesis. Valine is involved in enhancement of glutelin, globulin, and albumin fractions in maize kernels. The high percentage of glycine shows that triple helical structure of protein is more stable. Like that of glycine residues in protein, the proline also plays a major role in stability of helix of protein’s secondary structure. Here, the sequence contains very less percentage of proline (i.e., less than 10), which indicate that the sequence is less efficient for stability of protein structure. For perfect three-dimensional structure of proteins, hydrophobic as well as hydrophilic group play important roles. Among these groups, valine and leucine (32.56% and 17.44% respectively, hydrophobic amino acids), and serine and threonine (20.51% and 28.21% respectively, hydrophilic amino acids) are majorly involved. The pI value was lesser than 7, indicate that the target protein is acidic in nature. It was estimated that the value of instability index was less than 40, which shows that the protein is stable. The value of aliphatic index was predicted to be extremely high, and therefore the target protein is considered as thermostable protein, indicating that the target protein SOD2 is resistant to decay at high temperature. This is further affirmed by comparative modeling, which led us to highly thermo-tolerant SOD2 from Potentilla atrosanguinea. The value of GRAVY lies between −2 and +2, suggesting that the target is hydrophobic in nature and rated positively. Therefore, during the cellular processes, this protein decreases the region of linking between non-polar and water molecules, and also utilize the hydrogen bonding between water molecules within the cell. There are many reports establishing that tolerance to drought and salt or drought and cold stress can be improved by exotic gene transferring from plants."}], "Conclusion": [{"passage_id": "Concl.p0002", "text": "The Sod2 gene from drought tolerant HKI 335 maize inbred line was cloned and analyzed at protein sequence level. The HKI 335 SOD2 protein is highly similar to Potentilla atrosanguinea SOD2, which had been previously identified as highly thermostable SOD. Overall, the unique stress tolerant properties of HKI 335 SOD2, may be one of the reasons contributing to the highly drought tolerance trait exhibited by HKI 335 maize inbred line. Further work on HKI 335, especially in relation to SOD2, like in vitro characterization of the protein, overexpression, and allele mining, may lead to greater insights on the drought adaptation mechanism in maize and eventual deployment of the trait in maize hybrids."}]}}, {"pmcid": "PMC10020505", "title": "Genetic gains in tropical maize hybrids across moisture regimes with multi-trait-based index selection", "source_file": "PMC10020505.json", "source_url": "https://pmc.ncbi.nlm.nih.gov/articles/PMC10020505/", "included_counts": {"Abstract": 1, "Introduction": 4, "Discussion": 5, "Conclusion": 1}, "omitted_results_discussion": false, "sections": {"Abstract": [{"passage_id": "Abstract.p0001", "text": "Unpredictable weather vagaries in the Asian tropics often increase the risk of a series of abiotic stresses in maize-growing areas, hindering the efforts to reach the projected demands. Breeding climate-resilient maize hybrids with a cross-tolerance to drought and waterlogging is necessary yet challenging because of the presence of genotype-by-environment interaction (GEI) and the lack of an efficient multi-trait-based selection technique. The present study aimed at estimating the variance components, genetic parameters, inter-trait relations, and expected selection gains (SGs) across the soil moisture regimes through genotype selection obtained based on the novel multi-trait genotype–ideotype distance index (MGIDI) for a set of 75 tropical pre-released maize hybrids. Twelve traits including grain yield and other secondary characteristics for experimental maize hybrids were studied at two locations. Positive and negative SGs were estimated across moisture regimes, including drought, waterlogging, and optimal moisture conditions. Hybrid, moisture condition, and hybrid-by-moisture condition interaction effects were significant (p ≤ 0.001) for most of the traits studied. Eleven genotypes were selected in each moisture condition through MGIDI by assuming 15% selection intensity where two hybrids, viz., ZH161289 and ZH161303, were found to be common across all the moisture regimes, indicating their moisture stress resilience, a unique potential for broader adaptation in rainfed stress-vulnerable ecologies. The selected hybrids showed desired genetic gains such as positive gains for grain yield (almost 11% in optimal and drought; 22% in waterlogging) and negative gains in flowering traits. The view on strengths and weaknesses as depicted by the MGIDI assists the breeders to develop maize hybrids with desired traits, such as grain yield and other yield contributors under specific stress conditions. The MGIDI would be a robust and easy-to-handle multi-trait selection process under various test environments with minimal multicollinearity issues. It was found to be a powerful tool in developing better selection strategies and optimizing the breeding scheme, thus contributing to the development of climate-resilient maize hybrids."}], "Introduction": [{"passage_id": "Introduction.p0002", "text": "Maize yields in the Asian tropical rainfed environments are now becoming increasingly vulnerable to various climate-induced stresses, especially drought and waterlogging, which often come in combination to severely impact maize crops. The potential climate changes and abnormalities associated with a number of abiotic stresses severely affect the growth and development of crops. Among many unpredictable changes, moisture stresses including low soil moisture stress (drought) and excess soil moisture stress (waterlogging/flooding) are the major constraints worldwide that result in almost 90% yield loss. A large portion of maize in the Asian tropics is cultivated in low-land tropics (<1,000 masl), representing a major mega-environment, followed by sub-tropical and tropical highlands. Approximately 80% of maize is being grown as a rainfed crop, prone to the vagaries of monsoon rains associated with a series of abiotic and biotic constraints. The erratic/uneven distribution of monsoon pattern leads to untimely rains, often causing intermittent dry spells/drought or excess soil moisture/waterlogging at different crop growth stages within the crop growing period, and is a major factor responsible for the relatively low productivity in maize. The regular occurrence of temporary excessive soil moisture or waterlogging stress resulted in an almost 18% reduction in total maize in Southeast Asia. A few recent reports anticipated that the Asian tropics will experience a sharper increase in surface temperatures due to adverse weather conditions, resulting in shifting seasons and frequent drought and waterlogging at critical crop stages that could severely impact the maize production in the tropical regions."}, {"passage_id": "Introduction.p0003", "text": "In contrast, recent studies reported that the average global demand for maize has increased by 45% in 2020 when compared to 1997, with East Asia (85%) showing the highest increase in demand, followed by Sub-Saharan Africa (79%), Southeast Asia (70%), and South Asia (36%). The development of improved germplasm with combined tolerance against extreme climate vagaries such as excess moisture and drought will be necessary in many areas of Asia, Africa, and Latin America. The international wheat and maize improvement center (CIMMYT)–Asia maize program largely focused on the development of breeding strategies to reach attainable yields across a range of environments by incorporating reasonable levels of cross-tolerance against a combination of major abiotic stresses without compromising grain yields under favorable/optimal growing conditions. It implies the maximum yield potential under optimal conditions along with a guarantee of average yields under stress-prone areas by improving the stress-resilient breeding pipelines through precision phenotyping, index-based selection for secondary traits, and stage-wise gateway screening. Under the various environmental conditions in India, developing climate-resilient and location-specific high-yielding hybrids became a primary goal of maize technologists. To achieve this, researchers must perform multi-environment trials (METs) prior to national trials. MET evaluates a set of genotypes under different test environments, which may be spatially varied (geographic locations), time-separated (seasons/years), different managed stresses (drought, waterlogging, low nitrogen, etc.), or a combination of any of these. METs can efficiently identify genotypes with a constant trait performance among different test environments. Comprehensive assessment of promising genotypes with higher yield potential and desirable agronomic characteristics is the key to breed hybrids with wide adaptability and stability. The undeniable existence of genotype-by-environment interaction (GEI) causes confusion in screening out promising genotypes, and it misleads the ranking pattern of test genotypes across environments. Thus, a deep understating of the degree and pattern of GEI across environments is crucial for successful crop improvement programs. Various analysis models and techniques such as analysis of variance (ANOVA), principal component analysis (PCA), cluster analysis, additive main effects and multiplicative interaction (AMMI), and genotype and genotype plus environment (GGE) biplots were developed to unravel the unpredictable effects of genotype, environment, and their interaction."}, {"passage_id": "Introduction.p0004", "text": "Although grain yield is the most important characteristic of genotypes, other secondary traits are also common, such as days to flowering, plant height, ear height, ear length, and number of kernel rows. The yield gains could be the result of the direct selection of grain yield that is accompanied by the desirable expression of other secondary traits. Previous reports on yield–trait relations provided a breakthrough for plant breeders in terms of defining a set of target traits to bring together new, high-performance hybrids. It could be more efficient if the selection of genotypes is based on grain yield combined with other agronomic traits. However, an effective incorporation of multiple trait data without multicollinearity in the selection method has been a challenge for breeders. A widely used multi-trait selection index, the Smith–Hazel (SH) index, is not being recommended for METs, where the presence of biased index coefficients and multicollinearity issues erodes the real genetic gains. Similarly, the recently proposed genotype × yield × trait (GYT) biplots offer an effective and comprehensive analysis method for the evaluation of genotypes based on the combined grain yield and various evaluated agronomic traits. However, the method determines the influencing factors from yield–trait combinations by a classical linear multivariate model under diversified environments, but it does not involve any subjective weights and cutting points that provide a better picture of the strengths and weaknesses of test genotypes."}, {"passage_id": "Introduction.p0005", "text": "In that perspective, a novel multi-trait genotype–ideotype distance index (MGIDI) was proposed to select genotypes with desirable mean performances of multiple traits that overcome the fragility of classical linear indices. A few previous attempts at multiple traits in the selection of maize hybrids with multi-environment data have been reported. The purpose of this research was mainly to select the promising maize hybrids based on multiple traits suitable for different moisture regimes including drought, waterlogging, and optimal conditions and across all moisture conditions. The study was carried out to reveal genetic parameters such as variance components, accuracy and heritability, inter-trait associations, and the patterns of GEI effects under individual and across moisture conditions."}], "Discussion": [{"passage_id": "Discuss.p0002", "text": "The study focused on the performance evaluation of 75 pre-released medium-duration maize hybrids for 12 agronomic characteristics in two consecutive years (2017–2018) under three soil moisture regimes including optimal, drought, and waterlogging at two locations. In general, the grain yield potential and the performance of other yield-contributing characteristics of the available germplasm are a very crucial step in identifying genotypes with ideal trait combinations suitable across target environments, which can be used in future breeding programs. The maize crop in the farmer’s field is exposed to a combination of stresses in a single life cycle. screened a set of tropical maize hybrids independently under drought and low N environments and identified several physiological traits associated with tolerance under a single stress and conferred tolerance for the other stress. Our results showed that the environment and GEI effects for most of the traits recorded were statistically significant (p ≤ 0.001 or p ≤ 0.01). This shows that hybrid mean performances varied across the soil moisture conditions, which can be attributed more towards the diversification of genotypes and provides ample amount of variation for easy selection. The results from the present investigation suggested that selection of maize hybrids based on multi-factorial analysis is effective and that most of the potential and wide adoptive maize hybrids were influenced by soil moisture status and genetic factors, as well as their interactions (GEI). Understanding the complexity of GEI through suitable statistical techniques is the best way to screen out the wide adoptable stress-resilient maize hybrids in the target environment. Statistically significant variation of G, E, and GEI among evaluated hybrids across the moisture regimes would make it possible to identify genotypes for both stress and non-stress environments. Previous works also reported the existence of significant variations among maize hybrids tested across managed stresses for grain yield."}, {"passage_id": "Discuss.p0003", "text": "Since the physiological and molecular responses of crop plants exposed to a combination of stresses are fairly known, understanding the effects of different individual stresses on crop plants as well as their combinations is vital. Early flowering (D50A and D50S), high ASI values, and lower mean performances for PH, EH, TW, EL, EG, NKE, and NKR under moisture stress conditions compared to optimal environments resulted in poor grain yields ( Supplementary Tables 2A–C ). The impact of moisture level on traits’ expression can be observed by their mean performances under different environments ( Figure 1 ). A few outliers in the box plots of recorded traits were probably due to inconsistent expressions that indicated the severity of stress and interaction of genotype with soil moisture level ( Figure 1 ). Delayed flowering and maturity due to cool temperature at early stages followed by prolonged day length and drought periods at later stages resulted in the drastic decline (up to 30%–90%) in the crop yield in late Rabi/winter maize crop. Our study also witnessed early senescence probably due to the reduction in lamellar content of light harvest chlorophyll proteins under water-limited situations. The observed significant reduction in mean GY under waterlogging conditions with a poor performance of other secondary traits is probably due to the reduced leaf growth, and a worse effect on the cell turgor could be attributed to the decline in the carotenoid content."}, {"passage_id": "Discuss.p0004", "text": "Understanding the magnitude and direction of correlations among studied traits and how they change across the moisture regimes along with variability parameters would assist the breeders in improving a characteristic that brings simultaneous improvement in other characteristics. The results explained the importance of flowering traits, especially ASI, in the development of drought-tolerant maize cultivars. The larger ASI values lead to the failure of a proper seed set due to poor availability of viable pollen for late emerged female flowers owing to the delay in silk extrusion, premature lodging, and reduced rates of net photosynthesis arising from oxidative damage to chloroplasts. The relationship between GY and ASI in our findings was in agreement with previous reports on maize under water deficit and under waterlogging conditions. The stronger associations between grain yield and phenological traits under drought conditions than under optimal moisture were reported by. In contrast, our results suggested that the direct selection of most of the traits would be more effective under optimal conditions due to the resulting strong correlation, while there is only moderate correlation under moisture stress conditions ( Figure 3 ). Several previous correlation studies on maize genotypes under a single environment have been reported, but there is limited literature available with regard to changing a trait’s expression and the association of a trait with other traits across various environments. A few researchers reported genetic correlations among maize lines evaluated across two moisture regimes, namely, moisture-deficit and well-water conditions, across two seasons/years."}, {"passage_id": "Discuss.p0005", "text": "Plant breeding programs aiming at initial selection under a single environment with no stress or only a single stress condition may lead to the loss of desirable alleles or genetic variability for additional stresses other than target stress. Thus, the use of the MGIDI becomes especially important for screening hybrids based on multiple traits such as many secondary traits along with grain yield under various stress environments. Apart from many classical linear multi-trait phenotypic selection techniques available, MGIDI is a unique selection technique that is free from weighing (economic) coefficients and multicollinearity issues, and it uses the distance between genotypes and a defined ideotype based on the breeder’s requirement. The method emerged as a powerful tool to identify the genotypes with better mean performance and desired SGs and also to estimate the strengths and weaknesses of hybrids (selected/unselected). The multi-trait selection index (MTSI) and MGIDI evaluation systems are novel and unique techniques that have many practical applications in plant breeding practices. The multi-trait frameworks and MGIDI and MTSI indices follow a similar rescaling process to retain the unchanged correlation structure of original data and to identify the superior genotypes with respect to multiple traits simultaneously. The rescaling technique requires a selection direction, and it places all the agronomic traits in a range of 0–100 and the ideotype defined by traits’ rescaled value is assumed to be 100. The dimensional reduction was carried out by performing exponential factorial analysis in which 12 traits represented a few (three in optimal and four each in drought and waterlogging) final latent variables (FAs, factors) with maximum trait loadings."}, {"passage_id": "Discuss.p0006", "text": "According to the MGIDI index, the selected genotypes in optimal moisture were ZH161303, ZH161042, ZH161047, ZH161289, ZH161129, ZH161064, ZH161063, ZH161398, ZH161078, ZH161068, and ZH161053; the selected genotypes under drought conditions were ZH161289, ZH161063, ZH161458, ZH161051, P3502, ZH161410, ZH161303, ZH161083, ZH161384, ZH161484, and ZH161071; and the selected genotypes under waterlogging stress were ZH161398, ZH161303, ZH161047, ZH161358, ZH161458, ZH161289, ZH161330, ZH161129, Hytech 5106, ZH161064, and ZH161078. Apart from the genotypes selected above, genotypes 6 (ZH161361), 42 (ZH161054), and 55 (ZH15449) were placed at the cutting points under optimal, drought, and waterlogging conditions, respectively ( Figure 4 ). These hybrids had interesting features that could be exploited in future breeding programs. The MGIDI index is a unique and easy-to-interpret selection procedure that has many practical applications to obtain long-term genetic gain in primary traits (such as grain yield) without jeopardizing gains of secondary traits (such as plant height). The proportion explained by each factor towards the MGIDI index, i.e., “strengths and weaknesses view” ( Figures 6A–C ), is an important graphical tool to identify the strengths and weaknesses of test hybrids in terms of “trait (group of traits) need to be improved” and is an added advantage over existing indices. For example, under optimal moisture, the lower contribution of FA1 in genotype 14 (ZH161303) revealed that the genotype was highly productive in terms of PH, EH, SPAD, EL, KNR, and GY, but the same genotype had a poor performance in terms of flowering traits, which can be inferred due to the higher contribution of FA2 towards MGIDI ( Figure 6A ). Similarly, FA3 was placed almost near the dashed lines of the radar plot, which represented the theoretical value if all the factors had contributed equally. The high contribution of FA1 ( Figure 6B ) and FA3 ( Figure 6C ) towards genotype–ideotype index distance indicated that there is a possibility of improvement in TW, EL, KNR, and GY in selected genotypes (except 19 and 41) under drought and in EG and KRE under waterlogging conditions. A similar study was reported by and, who evaluated a set of 13 strawberry cultivars, wherein the strengths were described by employing MGIDI. proposed a framework for identifying promising guar genotypes with productive traits such as gum and seed yield across three seasons by using MGIDI."}], "Conclusion": [{"passage_id": "Concl.p0002", "text": "Our experimental findings recommended that MGIDI can be used for the effective selection of superior hybrids/genotypes by considering multiple traits and helping plant breeders make better strategic decisions. The results showed that the hybrids ZH161053, ZH161289, ZH161063, ZH161398, and ZH161047 were found to be common across all the three moisture regimes solely on the basis of grai
