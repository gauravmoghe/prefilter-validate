n yield, while two genotypes, ZH161289 and ZH161303, were found to be common in terms of all the studied traits. Also, the study helps improve a certain trait or a group of traits (either yield contributors or stress-responsive ones) in particular moisture stress environments."}]}}, {"pmcid": "PMC10020590", "title": "Short-term transcriptomic analysis at organ scale reveals candidate genes involved in low N responses in NUE-contrasting tomato genotypes", "source_file": "PMC10020590.json", "source_url": "https://pmc.ncbi.nlm.nih.gov/articles/PMC10020590/", "included_counts": {"Abstract": 7, "Introduction": 6, "Discussion": 20, "Conclusion": 1}, "omitted_results_discussion": false, "sections": {"Abstract": [{"passage_id": "Abstract.p0001", "text": "Background"}, {"passage_id": "Abstract.p0002", "text": "Understanding the complex regulatory network underlying plant nitrogen (N) responses associated with high Nitrogen Use Efficiency (NUE) is one of the main challenges for sustainable cropping systems. Nitrate (NO3 -), acting as both an N source and a signal molecule, provokes very fast transcriptome reprogramming, allowing plants to adapt to its availability. These changes are genotype- and tissue-specific; thus, the comparison between contrasting genotypes is crucial to uncovering high NUE mechanisms."}, {"passage_id": "Abstract.p0003", "text": "Methods"}, {"passage_id": "Abstract.p0004", "text": "Here, we compared, for the first time, the spatio-temporal transcriptome changes in both root and shoot of two NUE contrasting tomato genotypes, Regina Ostuni (high-NUE) and UC82 (low-NUE), in response to short-term (within 24 h) low (LN) and high (HN) NO3 - resupply."}, {"passage_id": "Abstract.p0005", "text": "Results"}, {"passage_id": "Abstract.p0006", "text": "Using time-series transcriptome data (0, 8, and 24 h), we identified 395 and 482 N-responsive genes differentially expressed (DEGs) between RO and UC82 in shoot and root, respectively. Protein kinase signaling plant hormone signal transduction, and phenylpropanoid biosynthesis were the main enriched metabolic pathways in shoot and root, respectively, and were upregulated in RO compared to UC82. Interestingly, several N transporters belonging to NRT and NPF families, such as NRT2.3, NRT2.4, NPF1.2, and NPF8.3, were found differentially expressed between RO and UC82 genotypes, which might explain the contrasting NUE performances. Transcription factors (TFs) belonging to several families, such as ERF, LOB, GLK, NFYB, ARF, Zinc-finger, and MYB, were differentially expressed between genotypes in response to LN. A complementary Weighted Gene Co-expression Network Analysis (WGCNA) allowed the identification of LN-responsive co-expression modules in RO shoot and root. The regulatory network analysis revealed candidate genes that might have key functions in short-term LN regulation. In particular, an asparagine synthetase (ASNS), a CBL-interacting serine/threonine-protein kinase 1 (CIPK1), a cytokinin riboside 5’-monophosphate phosphoribohydrolase (LOG8), a glycosyltransferase (UGT73C4), and an ERF2 were identified in the shoot, while an LRR receptor-like serine/threonine-protein kinase (FEI1) and two TFs NF-YB5 and LOB37 were identified in the root."}, {"passage_id": "Abstract.p0008", "text": "Our results revealed potential candidate genes that independently and/or concurrently may regulate short-term low-N response, suggesting a key role played by cytokinin and ROS balancing in early LN regulation mechanisms adopted by the N-use efficient genotype RO."}], "Introduction": [{"passage_id": "Introduction.p0002", "text": "Nitrogen (N) is an essential nutrient whose availability limits plant growth and development, causing crop yield and quality losses. The extensive use of N fertilizers has been a strategy to boost agricultural production and meet global food demand. However, less than 50% of applied N is taken up by crops; the remaining is lost into the environment, causing pollution and, indirectly, damage to human health. Therefore, improving plant N use efficiency (NUE) is an effective and promising approach to reducing fertilizer use, maintaining crop yield, and alleviating detrimental impacts on the environment. Many efforts have been made to elucidate the complex regulatory networks underlying plant N responses as well as to identify N-responsive genes and transcription factors (TFs) associated with NUE. However, it is a very complex trait controlled by many factors, making the development of varieties with low N requirements difficult."}, {"passage_id": "Introduction.p0003", "text": "Although nitrate (NO3 -) and ammonium (NH4 +) are the major inorganic N forms in aerobic agricultural soils, NO3 - is the most used by plants. Besides its role as a nutrient, NO3 - is a local and systemic signal molecule that coordinates many physiological processes essential for plant growth and development as well as its uptake. It also regulates the expression of genes involved in N assimilation and C metabolism, the root and shoot architecture, and delays flowering."}, {"passage_id": "Introduction.p0004", "text": "To orchestrate all these adaptive responses, NO3 - provokes plant transcriptome reprogramming, by which the transcript accumulation changes are cell- and tissue-specific, taking place very fast after NO3 - exposure. Several transcription factors (TFs) belonging to different families, such as B-box containing proteins (BBXs), myeloblastosis (MYBs), ethylene response factors (ERFs), basic leucine zipper (bZIPs), NIN-like proteins (NLPs), lateral boundary domain-containing proteins (LBDs), BTB and TAZ domain proteins (BTs), have been recently identified as key regulator genes in the primary nitrate response (PNR). Moreover, NO3 - induces dynamic changes in intracellular calcium signaling to generate rapid control of nitrate uptake and transcriptional PNR. Finally, it elicits post-translational modifications such as chromatin modification and protein phosphorylation and ubiquitination, which can lead to rapid and reversible modifications that directly regulate the localization, stability, interaction, function, and enzymatic activity of target proteins."}, {"passage_id": "Introduction.p0005", "text": "Recently, transcriptome analyses described different responses to limited N supply in crops such as wheat, rice, potato, and eggplant (; Zhang et al., 2020; Zhang et al., 2021). In tomato, an array analysis of the root revealed N-induced genes that play a role in N nutrition, including transport and assimilation genes related to C and N metabolism as well as water channels, phosphate, and potassium transporters. More recently, an integrative transcriptomic and metabolomic approach was able to identify pathways and key regulatory genes in response to low N, again in tomato. Currently, a comparative transcriptome analysis of NUE contrasting genotypes in response to early LN resupply is not yet available."}, {"passage_id": "Introduction.p0006", "text": "Tomato (Solanum lycopersicum L.), as one of the most N-demanding crops to achieve optimal yields (up to 250–300 kg/ha), represents a reasonable target to develop sustainable tomato cropping systems. In this respect, the selection of high NUE tomatoes and the understanding of their responses to N-limited conditions are relevant. Recently, NUE-contrasting tomato genotypes have been identified among some long-storage ecotypes. Notably, the differences in NUE have been related to the ability to regulate long-distance N transport, assimilation, remobilization, and storage genes."}, {"passage_id": "Introduction.p0007", "text": "The present work aims to highlight the transcriptome modifications as well as the main metabolic pathways involved in the short-term LN-resupply responses in both root and shoot of high (Regina Ostuni, RO) and low (UC82) NUE tomato genotypes. This study allowed us to identify putative candidate genes and transcription factors regulating early LN-response useful for NUE improvement in tomatoes."}], "Discussion": [{"passage_id": "Discuss.p0002", "text": "Improving nitrogen use efficiency (NUE) in crops has become a significant challenge for sustainable agriculture. To achieve this goal, a deep understanding of plant responses to variable soil N availability, at both physiological and molecular levels is crucial. This knowledge is critical to dissecting the regulatory networks of this complex trait. The transcriptomic approach contributed to understanding the changes regulating crop responses to abiotic stress such as low N availability as well as to identifying key genes related to N-stress tolerance comparing NUE-contrasting genotypes. In tomato, transcriptomic analyses led to the identification of genes differentially regulated by N availability, while no comparative transcriptome profiling between NUE-contrasting genotypes in response to N starvation and resupply has been reported so far."}, {"passage_id": "Discuss.p0003", "text": "In this study, the early molecular responses to low NO3 - (LN) at tissue scale in two NUE contrasting tomato genotypes, RO (N-use efficient) and UC82 (N-use inefficient), were evaluated. The tissue-specific transcriptome time-course analysis revealed the highest LN-sensitivity of the root compared to the shoot, in contrast with other findings revealing the shoot as the more responsible tissue for low N. These results were confirmed by the number of N-responsive genes (3,000 vs. 2,000), among which 482 and 395 were differentially expressed between genotypes in root and shoot, respectively ( Table S3 ). Similar responses to LN were already observed in potato and spinach, confirming the central role played by root in NUE. Interestingly, our experimental design, in which two NUE contrasting genotypes were included, allowed us to identify DEGs, hub genes, and a network of co-expressed genes between the N-use efficient genotype, RO, and the N-use inefficient genotype, UC82."}, {"passage_id": "Discuss.p0004", "text": "LN resupply promotes a differential spatio-temporal genes expression in NUE-contrasting genotypes"}, {"passage_id": "Discuss.p0005", "text": "The N-responsive DEGs in the RO vs. UC82 showed significant differences between LN and HN in both tissues and across times of sampling, mainly after 24 h. Our results suggested that these DEGs, in the early response to LN resupply, might govern NUE performances in tomatoes. The GO and KEGG pathways enrichment analyses identified tissue-specific biological processes and pathways related to “plant hormone signal transduction” and “protein kinase signaling” as well as “phenylpropanoid and flavonoid biosynthesis” pathways significantly enriched in the shoot and root in the high NUE genotype (RO), respectively ( Figures S4 , S5 ). Thus, for their key role in NO3 - signaling and stress adaptation, we focused our attention on genes belonging to these last pathways. Among the DEGs included in “plant hormone signal transduction,” two and five auxin-related genes were identified in shoot and root, respectively. In detail, an IAA amido-synthetase GH3.6, which regulates auxin excess in plants, was upregulated in RO in both the shoot and root, suggesting a synergic regulation of shoot and root auxin content in the N-use efficient genotype during early LN response ( Figure 3 ). Auxin transport and signaling play a critical role in plant adaptation to N availability, which in turn significantly alters auxin biosynthesis, transport, and transduction. Moreover, nitrate and auxin signaling might overlap in root system architecture regulation. In addition, two auxin response factor genes (SAUR26 and ARF3) were also downregulated in RO compared to UC82 in the root after 24 h LN resupply. The ARF family was involved in the response to LN supply, as previously reported. For example, ARF18, an auxin response factor, regulates NRT2.4, DUR3, and AMT1.2 expression in Arabidopsis and tomato."}, {"passage_id": "Discuss.p0006", "text": "Furthermore, putative tomato cytokinin riboside 5’-monophosphate phosphoribohydrolase LOG8 transcripts, the main enzyme converting inactive cytokinin nucleotides to the biologically active free-base form, were more abundant in the RO shoot compared to UC82 after 24 h LN resupply. Cytokinins are signaling molecules that indicate plant N status. Besides their role in root–shoot–root communication, they can repress high-affinity NO3 - transporter genes, as well as induce N-metabolism-related genes such as nitrate reductase (NR). Accordingly, our results confirmed a potential crosstalk between NO3 - and cytokinin signaling in tomatoes. Finally, many ethylene responsive transcription factors (ERFs) genes, such as AP2/ERF4 and ERF2 in shoot as well as ERF1b in root, resulted in RO upregulation after 24 h LN resupply. ERFs are involved in ethylene signaling pathways and regulate many stress-related gene expressions controlling plant growth and development. Similar results were already observed in contrasting N-responsive genotypes of rice, barley, and spinach in response to LN."}, {"passage_id": "Discuss.p0007", "text": "The mitogen-activated PKs (MAPKs, MAPKKs, and MAPKKKs) in the “protein kinase signaling” pathway are reported to be involved in plant stress resistance signal transduction, NO3 - sensing, and metabolism in several plants. MPK7 is responsible in Arabidopsis for phosphorylating the nitrate reductase (NR2) and LOB domain binding proteins (LDB37 and LDB39), involved in NO3 - signaling and targeted by many MAPKs. Five MAPKKKs were identified as direct targets of the NIN Like Protein 7 (NLP7) TF, a master regulator of early nitrate signaling in the root. In agreement, we also identified three MAPKKKs and MAPK14 upregulated in the shoot and root, respectively, in the RO vs. UC82."}, {"passage_id": "Discuss.p0008", "text": "Moreover, some leucine-rich repeat receptor-like kinases (LRR-RLKs) were more expressed in the N-use efficient genotype (RO) in both tissues. The LRR-RLKs are involved in many critical biological processes, including growth, development, and abiotic stress responses. Several genes encoding different subfamilies of RLKs are regulated by NO3 -, but these responses appear sometimes contrasting depending on cell types, organs, developmental stages, and growth conditions. In our experiment, the LRR-RLKs appeared involved in tomato response to low N. In addition, two CBL-interacting protein kinases (CIPK1 and CIPK2) were upregulated in the shoot of RO compared to UC82 after 8 and 24 h LN resupply. By contrast, Ca2+-dependent PKs (CDPK) were strongly downregulated after 8 h of LN resupply. These PKs are involved in the regulation of the cross-link between Ca2+ and NO3 - signaling and uptake regulation. More interestingly, recent studies revealed that NO3 - resupply stimulated rapid CIPK2 phosphorylation, underlining the important role of NO3 --activated Ca2+-sensor protein kinases (CPKs) and the NO3 -–CPK–NLP regulatory network."}, {"passage_id": "Discuss.p0009", "text": "Finally, the limited NO3 - availability induces “phenylpropanoids and flavonoid biosynthesis,” which represents a plant adaptive strategy to LN stress. Interestingly, the high-NUE genotype RO displayed in the root higher transcriptional levels of genes related to the phenylpropanoid and flavonoid biosynthesis pathways compared to UC82 after LN resupply. A chalcone synthase 1 (CHS1) and a cinnamyl alcohol dehydrogenase (CAD) gene, key enzymes in flavonoids, anthocyanins, and other phenylpropanoid compound biosynthesis, resulted in RO upregulation after 8 h and 24 h LN resupply, respectively. The upregulation of genes involved in the phenylpropanoid pathway and others encoding flavonoids, described as signal molecules in root-to-shoot signal transduction in plants exposed to N deficiency, was frequently underlined."}, {"passage_id": "Discuss.p0010", "text": "N transporters differentially expressed in shoot and root"}, {"passage_id": "Discuss.p0011", "text": "According to, the different responses between tissues underlined the different roles displayed by transporters to cope with low N conditions ( Tables S4 , S5 ). Transcriptomic analysis identified several N transporter genes in both tissues, which played a key role in root uptake, root to shoot and leaf to sink transport, remobilization, and storage, whose engineering modification improved yield or NUE. In our condition, two members of the high-affinity nitrate transporter NRT2 were differentially expressed between genotypes in the shoot and root. In particular, NRT2.3 was strongly downregulated in the shoot of UC82 compared to RO, mainly after 24h LN resupply. Interestingly, these NO3 - transporters were reported to play a key role in long-distance nitrate transport from root to shoot, mainly at low external nitrate supply in rice and tomato. Furthermore, RO showed significant SlNRT2.4 N transporter downregulation in the root. Recently, a substantial overexpression of the orthologous BnNRT2.4 was also identified in rapeseed root, which is not effective for boosting N absorption but mainly contributes to loading NO3 - in shoot phloem vessels. Taking together, this evidence suggests that the higher N-use efficiency of RO compared to UC82 could be due to its ability to uptake nitrate by a low NRT2.4 expression in the root and to transport NO3 - from the root to the shoot by a higher NRT2.3 expression in the shoot."}, {"passage_id": "Discuss.p0012", "text": "In addition, in our experiment, 30 NPF transporters were alternatively up and downregulated in response to N resupply. NPF3.1 was significantly upregulated in RO after 24 h LN resupply, although its expression decreased at 8 h. Interestingly, NPF3.1 encodes for efflux-type NO3 - transporters, loading it into chloroplast stroma during NO3 - assimilation, an important physiological process in plant N nutrition and efficiency. More recently, NPF3.1 expression was upregulated by low exogenous NO3 - concentrations and involved in GA transport in plants under low NO3 - supply. More interestingly, we detected two N transporters (included in group 5) highly upregulated in RO compared to UC82, orthologues to NPF1.2 and NPF8.3 in Arabidopsis. NPF1.2, classified as a low-affinity nitrate transporter, is involved in xylem-to-phloem transfer for redistributing NO3 - into developing leaves in Arabidopsis, a critical step for optimal plant growth performance. Besides, NPF8.3 was reported to encode a di- and tri-peptide transporter able to recognize a variety of different amino acid combinations, and more recently it was included among the transporters differentially expressed in rapeseed under nitrogen deficiency."}, {"passage_id": "Discuss.p0013", "text": "In the early response to N resupply, 23 N-transporters were also identified as differentially expressed in the root. Among these, group 4 that included two NPF7.3 low affinity bidirectional NO3 - transporters, involved in root nitrate allocation but not essential for root to shoot translocation in Arabidopsis, was significantly upregulated in UC82. These results might confirm a higher N-use efficiency of RO compared to UC82 due to the higher N-utilization efficiency (NUtE), which is similar between genotypes. Overall, we firstly demonstrated a significant genetic distance between RO and UC82 by SNP analysis, then the differences in NUE between the same genotypes were reported, and here, among the most significant DEGs between NUE contrasting genotypes, we identified putative genes and pathways involved in the early response to low N."}, {"passage_id": "Discuss.p0014", "text": "Transcription factors"}, {"passage_id": "Discuss.p0015", "text": "Transcription factors (TFs), which usually represent around 6% of coding sequences within a plant genome, are important regulators of plant signal transduction pathways under plant nutritional stress. Among them, many TF families such as MYB, bHLH, bZIP, DOF, ERF, FAR1, GLK, NF-YA, NF-YB, and LOB were reported to be involved in plant N deficiency responses and in coordination of nitrogen metabolism enzymes regulation. In our analysis, TFs belonging to the basic helix–loop–helix (bHLH) and Golden2-like (GLK) families were upregulated in RO shoots in early response to LN resupply ( Figure 3C ). Interestingly, GLK2 appeared involved in the regulation of chloroplast development as well as the activation of many genes encoding chloroplast-localized or photosynthesis-related proteins, including those for chlorophyll biosynthesis, light harvesting, and electron transport. More recently, GLK2 overexpression was able to increase photosynthetic capacity, leading to higher biomass and grain yield in rice. In agreement, the significant GLK2 upregulation in RO (shoot) could determine an increase in its biomass production at LN, conferring NUE efficiency to this genotype compared to UC82."}, {"passage_id": "Discuss.p0016", "text": "Many other TFs were found differentially expressed in the root of RO compared to UC82 at LN, including LOB/LBD, NF-YA, NF-YB, ARF, FAR1, and HSF. The Lateral Organ Boundaries Domain TFs (LBD/LOB37/38/39) resulted in upregulation by NO3 - and, NO3 - a lesser extent, , but they are also involved in NIA1, NIA2, and other NO3 --inducible gene downregulation. In our experiment, LOB37 transcripts were less abundant in RO root after 24 h LN resupply, suggesting a lower repression of NO3 - assimilation-related genes compared to UC82. Finally, NF-YA6 and B5, belonging to the NF-YA and NF-YB TF families, involved in many plant processes such as N nutrition and primary root growth, were found upregulated in RO root after 24 h LN resupply. Similarly, found two nuclear factors, NF-YA5 and 9, differentially expressed in tomato roots under N deficiency."}, {"passage_id": "Discuss.p0017", "text": "Overall, the results indicated a tissue-specific TF role in tomato (root), suggesting that different networks could contribute, at different tissue-scales, to cope with N limited conditions."}, {"passage_id": "Discuss.p0018", "text": "Co-expression network analysis reveals N responsive modules"}, {"passage_id": "Discuss.p0019", "text": "Nitrate regulates more than one thousand genes in both root and shoot; thus, the complex mechanisms by which NO3 - elicits changes in transcript abundance are still not fully understood. Our co-expression network analysis allowed us to identify NO3 - responsive modules significantly upregulated (gray60 and magenta in root as well as brown and magenta in shoot) in response to N in both genotypes and, together with the results obtained by the STEM analysis, to highlight four main patterns of induction in response to N, interestingly highly similar in both tissues ( Figures 4A, B ). However, several modules also showed significant differences between genotypes. In particular, the N-use efficient genotype RO showed significantly higher upregulation of the gray60 module genes and significantly lower downregulation of those in the magenta module in the root. Interestingly, many hub genes in these modules might play a key role in tomato N responses. The midnight blue module included a cytokinin riboside 5’-monophosphate phosphoribohydrolase (LOG8, Solyc06g075090.3), an activator of cytokinin biosynthesis directly involved in nitrate signaling and N-metabolism regulation. In the same module, the ERF2 TF (Solyc01g090340.2), belonging to the AP2/ERF gene family in tomato and a homolog of the cytokinin response factor 5 encoding gene (CRF5), was also identified ( Figure 5A ). Interestingly, the analysis of tomato knockout mutants revealed that CRF5 regulates leaf and flower development, appearing upregulated in response to cytokinins; these findings indicate that SlCRF3 and SlCRF5 are potential regulators and are involved in the regulation of tomato developmental processes associated with cytokinin or abiotic stresses. These results might suggest an important regulatory role played by cytokinins in the early N differential response between N-contrasting tomato genotypes. N resupply seems to downregulate these genes after 8 h, with their expression increasing again after 24 h, mainly in RO. Moreover, an asparagine synthetase (ASNS, Solyc01g079880.3) upregulated in RO vs. UC82 was identified as a hub gene in the same module. The ASNS is a key enzyme in the N-metabolism involved in the hydrolyzation of glutamine to synthesize asparagine, the amino acid with the highest N/C ratio, used as the main stored and transported N form through the vascular tissues in many plants. The ASNS overexpression in Arabidopsis revealed a higher asparagine level in plant tissues together with an increased tolerance to N-deprivation, suggesting that this may be a good and viable strategy for improving NUE. Accordingly, our results suggested that RO showed a faster induction of these genes after initial downregulation compared to UC82, allowing RO to better withstand N-deficiency."}, {"passage_id": "Discuss.p0020", "text": "In the root, both the gray60 and magenta modules included many hub genes involved in N-related regulatory pathways ( Figure 5B ). In the magenta module, two nitrate transporters were detected as hub genes: SlNRT2.4, a high-affinity nitrate transporter homologue of AtNRT2.4, and SlNPF22 (NRT1/PTR). Although SlNRT2.4 expression in tomato is the least abundant among the NRT2 genes in almost all tissues, it is involved in both root and shoot NO3 - transport under N starvation in Arabidopsis. Interestingly, its homolog in Camellia sinensis was detected as a hub gene among the LN responsive genes and was suggested as one of the main control factors for N uptake modulation in tea plants under low N. Our results indicated that, after initial induction, SlNRT2.4 was downregulated, allowing tomato plants to maintain higher N uptake, especially under N-limited conditions."}, {"passage_id": "Discuss.p0021", "text": "Nitrate is also known to induce the expression of aquaporin genes in tomato, and some PIP genes were found to be correlated to NRT2 gene activity in Arabidopsis. In our experiment, two aquaporins (TIP2 and PIP2) as hub genes in the gray60 module were detected, confirming their central role in the short-term response to NO3 -. The high correlation between NO3 - uptake and the hydraulic response in the root system was previously described in several plants, further suggesting that the differences in NUE performances between RO and UC82 might also be derived from a different regulation of genes involved in water transport. A genotype-specific hydraulic response to NO3 -, putatively derived from different aquaporin protein levels, was recently detected in maize roots."}], "Conclusion": [{"passage_id": "Concl.p0002", "text": "To our knowledge, this is the first comparative transcriptomic study of two NUE-contrasting genotypes providing deep information on the early responses to NO3 - deficiency in tomato. The experimental setup allowed us to uncover some mechanisms underlying low NO3 - regulation in the high-NUE genotype, Regina Ostuni (RO). The comparative analysis revealed that most transcriptomic changes induced by N-stress occurred in the root and shoot, suggesting coordinated regulation of multiple genes and pathways between both tissues. In the root, the upregulation of the “phenylpropanoid and flavonoid biosynthesis” pathways in Regina Ostuni suggested its higher ability to enhance NO3 - deficiency tolerance compared to UC82. In the shoot, plant hormones and protein kinases signaling seemed to be involved in high NUE, providing novel insights in their interactions with NO3 -, until now unexplored in tomatoes. Interestingly, several NO3 - transporters differentially expressed between genotypes were also identified in the N-use efficient genotype RO, confirming its higher ability to transport nitrate from root to shoot (long-distance) by higher NRT2.3 and NPF8.3 expressions. Finally, WGCNA decoded the dynamic regulatory network related to low N resupply, highlighting the key role played by cytokinins and ROS balancing in NO3 - deficiency regulation mechanisms adopted by the high-NUE genotype Regina Ostuni. The results obtained in this study represent new insights into the comprehensive understanding of genotypic differences in NO3 - regulation, utilization, and deficiency in tomatoes."}]}}, {"pmcid": "PMC10022623", "title": "Characterization of mutants deficient in N-terminal phosphorylation of the chloroplast ATP synthase subunit β", "source_file": "PMC10022623.json", "source_url": "https://pmc.ncbi.nlm.nih.gov/articles/PMC10022623/", "included_counts": {"Abstract": 2, "Introduction": 4, "Discussion": 6}, "omitted_results_discussion": false, "sections": {"Abstract": [{"passage_id": "Abstract.p0002", "text": "Understanding the regulation of photosynthetic light harvesting and electron transfer is of great importance to efforts to improve the ability of the electron transport chain to supply downstream metabolism. A central regulator of the electron transport chain is ATP synthase, the molecular motor that harnesses the chemiosmotic potential generated from proton-coupled electron transport to synthesize ATP. ATP synthase is regulated both thermodynamically and post-translationally, with proposed phosphorylation sites on multiple subunits. In this study we focused on two N-terminal serines on the catalytic subunit β in tobacco (Nicotiana tabacum), previously proposed to be important for dark inactivation of the complex to avoid ATP hydrolysis at night. Here we show that there is no clear role for phosphorylation in the dark inactivation of ATP synthase. Instead, mutation of one of the two phosphorylated serine residues to aspartate to mimic constitutive phosphorylation strongly decreased ATP synthase abundance. We propose that the loss of N-terminal phosphorylation of ATPβ may be involved in proper ATP synthase accumulation during complex assembly."}, {"passage_id": "Abstract.p0003", "text": "N-terminal phosphorylation of ATP synthase subunit β interferes with complex accumulation during assembly."}], "Introduction": [{"passage_id": "Introduction.p0002", "text": "Photosynthesis provides the starting material for nearly all life on earth. There is currently a drive to improve photosynthesis to meet food demands of a growing global population and make renewable biofuels to combat climate change. Understanding photosynthesis and how it is regulated is important if we want to modify these reactions to increase plant growth or increase flexibility to respond to stress conditions."}, {"passage_id": "Introduction.p0003", "text": "The so-called “light reactions” of photosynthesis are comprised of the thylakoid embedded electron transport chain that feeds the Calvin-Benson-Bassham cycle with the ATP and NADPH required for CO2 fixation. The central regulator of the thylakoid reactions of photosynthesis is the ATP synthase (discussed in). ATP synthase is a molecular motor comprised of a membrane associate CFo subcomplex and a soluble CF1 subcomplex that work together to convert protonmotive force (pmf), generated by proton-coupled electron transfer, into phosphorylation potential in the form of ATP. The ΔpH component of pmf activates pH-dependent feedback regulation of light harvesting (i.e. exciton quenching, qE), the largest component of non-photochemical quenching (NPQ) and lowers the rate constant for deprotonation of plastoquinol at the cytochrome b6f (bf) complex Qo site (photosynthetic control). In high light, qE and photosynthetic control protect photosystem II and I, respectively, from photodamage. Changing the activation state of the ATP synthase has a rapid direct effect on these photoprotective processes, and the understanding of ATP synthase regulation is important for our understanding of the regulation of photosynthesis as a whole."}, {"passage_id": "Introduction.p0004", "text": "In response to long-term changes in the metabolic demand for ATP and NADPH during leaf ontogenesis or in response to abiotic stresses, the content of ATP synthase is strongly regulated and usually changes in parallel with linear electron transport capacity and the abundance of the bf complex [reviewed in ]. However, because these changes in ATP synthase content occur over many days to weeks, they are unlikely to play a role in short-term adjustments of ATP synthase activity during the day. Here, indications exist that two pools of ATP synthase usually exist, one active, and the other inactive. In tobacco mutants, ATP synthase content could be reduced by more than 50%, without clear effects on ATP synthase activity, likely because an inactive enzyme pool was (re)-activated. However, the underlying regulation mechanisms need further elucidation: ATP synthase is regulated by substrate availability, protein-protein interactions, and multiple post-translational modifications. While it is unlikely that, in the light, thermodynamics would favor ATP hydrolysis, metabolic changes may still contribute to altered kinetics under conditions where substrate is limited. In the dark, the ATPγ subunit of ATP synthase (encoded by the ATPC1 gene in the nuclear genome) is oxidized, and leads to a decrease in the rate constant of proton efflux."}, {"passage_id": "Introduction.p0005", "text": "An additional post-translational modification proposed to modulate ATP synthase activity during light to dark transitions and substrate limitation is phosphorylation. While there have been multiple proposed phosphorylation sites on ATP synthase, two serine residues in the N-terminal domain of the chloroplast-encoded CF1-β subunit (encoded by atpB) have raised particular interest, because they were shown to be phosphorylated at the end of the night. Due to the timing of the phosphorylation, it was proposed that these residues are specifically involved in the inactivation of ATP synthase in the dark to avoid ATP hydrolysis. In this work, we set out to test this hypothesis by mutating these two residues (serine 8 and serine 13) to either an alanine, to eliminate the phosphorylation site, or an aspartic acid, to mimic constitutive phosphorylation. To assess the function of each of these residues in ATP synthase dark inactivation, we used chloroplast transformation to generate a set of mutants with all possible combinations of phosphorylation states."}], "Discussion": [{"passage_id": "Discuss.p0002", "text": "To assess the role of N-terminal phosphorylation of ATPβ in photosynthetic regulation, we used a set of mutants locked in specific phosphorylation states. We saw defects in ATP synthase in the light and altered inactivation kinetics in the dark associated with decreased protein accumulation in all mutants harboring the S13D mutation. When we tested the hypothesis that the phosphorylation state of ATPβ serines 8 and 13 contributed to the dark inactivation of ATP synthase as proposed in, we only saw changes in S13D plants (Figure 8). These plants had faster ATPγ oxidation and appearance of increased pmft, and in the case of the single S13D mutation, lower ATP synthase activity in the dark (gHd+). We demonstrated that this is due to loss of ATP synthase complex, and not dynamic regulation of the complex, by comparing the inactivation kinetics of an ATP synthase knock-down mutant (Figure 9,), which yielded qualitatively similar results. Therefore, we rejected the hypothesis that phosphorylation contributes to inactivation in the dark. Instead, the main light/dark switch in the chloroplast ATP synthase is likely oxidation of ATPγ, as has been demonstrated elsewhere. In fact, it seems that the ATPγ oxidation state is likely the regulator of the pmf threshold of activation (pmft) for ATP synthase, as both of these are altered on the same timescale when ATP synthase content is decreased. In general, the amount of ATP synthase in the chloroplast should not alter the Em of ATPγ. Instead, the faster oxidation of ATPγ could be explained by a decrease in electron transfer that might be expected from the decrease in ϕII (Figure 3) we see in the S13D plants. A decrease in the bulk flow of electrons may lower the electron buffering capacity of the stroma in the dark, leading to quicker oxidation of ATPγ and likely other redox-regulated proteins in the chloroplast."}, {"passage_id": "Discuss.p0003", "text": "Due to the decrease in ATP synthase content in our ATPβ S13D mutants (Figure 4), we hypothesized that phosphorylation was a signal for protein degradation in the dark. However, in the presence of lincomycin, there was no substantial differences in the apparent degradation rate of the CFo subunit ATPb in any of our mutants (Figure 11). In addition, our mutants accumulate wild type-like transcript levels (Figure 1C), suggesting that the defect in protein accumulation is either due to reduced translation or impaired assembly. It seems possible that degradation involves a chloroplast-encoded factor that would be inhibited by lincomycin, such as the P1 subunit of the Clp protease, but ATP synthase is currently not thought to be a target of Clp. Therefore, with the information we have on hand, we must reject our hypothesis that the phosphorylation state of ATPβ-S13 is a signal for degradation."}, {"passage_id": "Discuss.p0004", "text": "As the rate of translation is unlikely to be altered due to a change in a single internal codon, the remaining point for a defect in complex accumulation is assembly. Our BN-PAGE and two-dimensional gels show lower accumulation of the assembly intermediate 4 in the S13D, S8A + S13D and S8D + S13D mutants compared to wild type and control plants, suggesting that the phosphorylation of ATPβ at the N-terminal position S13 may hinder the early assembly of the ATP synthase. In view of the lower accumulation of the assembly intermediate 4 in the atpB mutants, we speculate that the phosphorylation of S13 could interfere with the association of chaperones or assembly factors at an early stage of ATP synthase biogenesis. Therefore, the phosphorylation of S13 could be one of the mechanisms to regulate the content of the ATP synthase in the dark. CFo and CF1 subunits appear to be lost stoichiometrically (Figure 4). There is no evidence suggesting misassembly of ATP synthase in the S13D mutants, in that misassembly would likely lead to a leaky enzyme and result in faster ATPγ oxidation kinetics in Figure 8A (as discussed in). Thus, the defect to accumulation appears to be only in the accumulation kinetics. As of writing, no X-ray crystal or cryo-EM structure has been resolved containing the S8 or S13 residues of CF1-β, suggesting that these amino acids lie within a disordered region of the CF1. Given this lack of structural data, it is difficult to further hypothesize what, if any, defect the phosphomimics are causing in ATP synthase assembly."}, {"passage_id": "Discuss.p0005", "text": "In this manuscript, we ruled out multiple hypotheses for the role of ATPβ N-terminal phosphorylation in ATP synthase regulation, specifically the hypothesis of light-dark regulation and protein turnover. There are other possible roles for this phosphorylation in ATP synthase regulation that have yet to be tested. As ATP synthase is proposed to have multiple regulatory phosphorylation sites, identification of phosphorylation of specific ATP synthase residues under conditions in which activity is known to be altered (e.g. low CO2 or Pi) may be a more productive first approach. It has been proposed that CK-II is a kinase for ATPβ, and phosphorylation still may serve some yet unknown function in the dark. ATPβ forms part of the catalytic domain mediating ATP synthesis and hydrolysis. If we hypothesize that phosphorylation of these residues is functional and not artifactual or promiscuous, then the question becomes “what occurs at night that would require regulation of the catalytic CF1 domain?”. It has been proposed that ATP synthase needs to be inactivated so that dark ATP hydrolysis does not occur. However, since ATP hydrolysis in the dark is linked to pmf formation, and we do not see any pmf linked changes in activity that cannot be attributed to protein content, the activity that is being regulated would likely need to be independent of pmf. One possible function for phosphorylation in the dark could be to shift the KM of substrate to allow for changes in the activation kinetics of ATP synthase in the morning, however there is no clear evidence for this from our DEPI experiments (Supplemental Figures S3–S5)."}, {"passage_id": "Discuss.p0006", "text": "An interesting aspect of ATP synthase is that it is regulated primarily post-translationally, and the rate constant of proton efflux has been shown to be unresponsive to decreases in ATP synthase content as low as 50%, suggesting that there is a pool of inactive ATP synthase in the thylakoid. In that report, the relationship between activity and content remained unknown between 12.5% and 50%. Therefore, the extent of the inactive fraction of the ATP synthase pool was assumed to be 50% due to the linear relationship of activity and protein content between 50% and ∼12.5%. Here we contribute another point to the curve, 25% ATP synthase content, shown for our atpB mutants S8A + S13D and S8D + S13D (Figure 4). We see that a 75% decrease in ATP synthase content leads to a ∼40% decrease in activity, while the 87.5% decrease in content in our S13D mutant leads to a ∼75%–80% decrease in activity (Figure 4), similar to the decrease in activity seen in with similar ATP synthase content. These data suggest no regulatory role of N-terminal ATPβ phosphorylation in steady-state photophosphorylation, and the simplest explanation for decreased gH+ is the decrease in ATP synthase content. Since we show that ATP synthase activity decreases at 25% content, we suggest an inactive fraction of between 50% and 75%. All else being equal, if we assume that the inactive fraction is 50%, there is a roughly linear relationship between rate constant and protein content when the inactive pool is eliminated. However, if the inactive pool is >50%, the relationship appears more exponential like, which would suggest that the remaining ATP synthase in these mutants are less active than their wild type counterparts, an unlikely scenario, therefore, our data are in clear agreement with the findings of."}, {"passage_id": "Discuss.p0007", "text": "In summary, our work reported here suggests a function of amino acid 13 in CF1 assembly rather than in the regulation of ATP synthase activity."}], "Conclusion": []}}, {"pmcid": "PMC10022637", "title": "Effective use of legacy data in a genome-wide association studies improves the credibility of quantitative trait loci detection in rice", "source_file": "PMC10022637.json", "source_url": "https://pmc.ncbi.nlm.nih.gov/articles/PMC10022637/", "included_counts": {"Abstract": 1, "Introduction": 2, "Discussion": 2}, "omitted_results_discussion": false, "sections": {"Abstract": [{"passage_id": "Abstract.p0002", "text": "Genome-wide association studies (GWASs) are used to detect quantitative trait loci (QTL) using genomic and phenotypic data as inputs. While genomic data are obtained with high throughput and low cost, obtaining phenotypic data requires a large amount of effort and time. In past breeding programs, researchers and breeders have conducted a large number of phenotypic surveys and accumulated results as legacy data. In this study, we conducted a GWAS using phenotypic data of temperate japonica rice (Oryza sativa) varieties from a public database. The GWAS using the legacy data detected several known agriculturally important genes, indicating reliability of the legacy data for GWAS. By comparing the GWAS using legacy data (L-GWAS) and a GWAS using phenotypic data that we measured (M-GWAS), we detected reliable QTL for agronomically important traits. These results suggest that an L-GWAS is a strong alternative to replicate tests to confirm the reproducibility of QTL detected by an M-GWAS. In addition, because legacy data have often been accumulated for many traits, it is possible to evaluate the pleiotropic effect of the QTL identified for the specific trait that we focused on with respect to various other traits. This study demonstrates the effectiveness of using legacy data for GWASs and proposes the use of legacy data to accelerate genomic breeding."}], "Introduction": [{"passage_id": "Introduction.p0002", "text": "Crop improvement through genomic breeding is essential to increase crop productivity and to feed the growing global population. Identification and characterization of genes associated with agricultural traits not only offers an insight into the genetic basis of phenotypic variation but also contributes to efficient crop improvement. Genome-wide association studies (GWASs), which analyze the association between genome-wide nucleotide polymorphisms and phenotypic variations, have emerged as a powerful method in genetics. GWASs require genomic data and phenotypic data as inputs. Genomic data can be obtained at high throughput with low cost due to rapid advances in sequencing technology. On the other hand, phenotyping of large populations usually requires a lot of effort, and, in many cases, replicate tests over several years are required to confirm reproducibility. Many landraces and cultivars have been characterized by researchers and breeders, and a large amount of phenotypic data have already been accumulated, referred to as “legacy data.” We hypothesized that if the legacy data could serve as phenotypic data for GWASs to detect useful quantitative trait loci (QTL) for agricultural production, it would greatly reduce the effort of phenotyping and accelerate genomic breeding."}, {"passage_id": "Introduction.p0003", "text": "To evaluate the validity of legacy data, we performed a GWAS on various rice phenotypic data retrieved from a public database provided by the NARO Genebank in Japan (https://www.gene.affrc.go.jp/distribution-plant_en.php). We performed the GWAS with 198 temperate japonica rice (Oryza sativa L.) varieties and found several known agriculturally important genes. We also conducted a GWAS using phenotypic data that we measured, referred to as a measured-GWAS (M-GWAS), and compared this with the results of the GWAS using legacy data, referred to as a legacy-GWAS (L-GWAS). Several genomic regions were detected in both the M-GWAS and L-GWAS, where previously unknown QTL are probably located. This demonstrated that the combination of an L-GWAS and M-GWAS is effective in detecting reliable QTL. In addition, we evaluated the pleiotropic effects of QTL by comparing GWASs for multiple traits using legacy data. Here, we show the availability of legacy data for accelerating basic research and practical genomic breeding."}], "Discussion": [{"passage_id": "Discuss.p0002", "text": "Using rice phenotypic data from the NARO Genebank as an example, this study shows that legacy data are very useful for GWASs. The advantages of using legacy data revealed by this study are as follows. First, the process of acquiring trait data, which requires a lot of time and effort, can be greatly reduced by allowing legacy data to be used in place of newly acquired data, as like a kind of blinded experiment. Also, by comparing the legacy data and our own acquired data, simple mistakes (e.g. color observation error in legacy data; Supplemental Figure 10) can be eliminated. In addition, because in many cases the populations that researchers have analyzed and populations in legacy data are different in terms of contents (varieties), the possibility of statistical errors will be greatly reduced compared to that in GWASs using a single population. In this context, GWASs using two independent populations with independently acquired trait data would be useful for reliable QTL detection. In this study, we succeeded in detecting previously unknown QTL for three agronomic traits by this method: Heading Date (Figure 3), Seed Width (Figure 4), and WC (Figure 5). In particular, a reproducible QTL was detected even for WC (Figure 5), which is greatly affected by environmental factors, suggesting that the use of legacy data is very effective for reliable QTL detection. Furthermore, legacy data, like the NARO Genebank used in this study, often contain a comprehensive range of phenotypic data. Thus, it is possible to evaluate the pleiotropic effect of the QTL identified for the specific traits with respect to other traits, as shown in the case of color traits in various organs (Figure 6). Legacy data also often contain evaluation of the overall traits judged as the totality of multiple individual specific traits (e.g. PT discussed in this paper, and also panicle structure and plant vigor), all of which are often evaluated by the breeders’ intuition and are important criteria for breeding selection. By identifying individual QTL that are involved in complex traits and examining their effects, we can evaluate the contribution of individual QTL to the complex traits. Therefore, combining our own acquired phenotypic data with legacy data will enable us to accelerate the progress of genetic research."}, {"passage_id": "Discuss.p0003", "text": "In the NARO Genebank, phenotypic data are provided not only for rice, but also for a variety of plant species, including wheat (Triticum aestivum), potato (Solanum tuberosum), grasses, fruit trees, and vegetables. In addition to the NARO Genebank data, there are reports investigating yield traits such as fertility, germination characteristics, and eating quality characteristics of Japanese rice landraces. While these reports are on Japanese varieties, the IRRI SNP-SEEK phenotypic database has collected phenotypic data from many countries for about two-thirds of the approximately 3,000 rice lines for which genomic data are available, and other trait data have been accumulated in various locations throughout the world. In the near future, databases linking genomic information with phenotypic data are expected to be released worldwide, and the research approach proposed here will be more effective. To accelerate genomic breeding, we propose the utilization of legacy data accumulated by our predecessors."}], "Conclusion": []}}, {"pmcid": "PMC10025401", "title": "PlantLTRdb: An interactive database for 195 plant species LTR-retrotransposons", "source_file": "PMC10025401.json", "source_url": "https://pmc.ncbi.nlm.nih.gov/articles/PMC10025401/", "included_counts": {"Abstract": 1, "Introduction": 4, "Conclusion": 2}, "omitted_results_discussion": false, "sections": {"Abstract": [{"passage_id": "Abstract.p0001", "text": "LTR-retrotransposons (LTR-RTs) are a large group of transposable elements that replicate through an RNA intermediate and alter genome structure. The activities of LTR-RTs in plant genomes provide helpful information about genome evolution and gene function. LTR-RTs near or within genes can directly alter gene function. This work introduces PlantLTRdb, an intact LTR-RT database for 195 plant species. Using homology- and de novo structure-based methods, a total of 150.18 Gbp representing 3,079,469 pseudomolecules/scaffolds were analyzed to identify, characterize, annotate LTR-RTs, estimate insertion ages, detect LTR-RT-gene chimeras, and determine nearby genes. Accordingly, 520,194 intact LTR-RTs were discovered, including 29,462 autonomous and 490,732 nonautonomous LTR-RTs. The autonomous LTR-RTs included 10,286 Gypsy and 19,176 Copia, while the nonautonomous were divided into 224,906 Gypsy, 218,414 Copia, 1,768 BARE-2, 3,147 TR-GAG and 4,2497 unknown. Analysis of the identified LTR-RTs located within genes showed that a total of 36,236 LTR-RTs were LTR-RT-gene chimeras and 11,619 LTR-RTs were within pseudo-genes. In addition, 50,026 genes are within 1 kbp of LTR-RTs, and 250,587 had a distance of 1 to 10 kbp from LTR-RTs. PlantLTRdb allows researchers to search, visualize, BLAST and analyze plant LTR-RTs. PlantLTRdb can contribute to the understanding of structural variations, genome organization, functional genomics, and the development of LTR-RT target markers for molecular plant breeding. PlantLTRdb is available at https://bioinformatics.um6p.ma/PlantLTRdb."}], "Introduction": [{"passage_id": "Introduction.p0002", "text": "Long terminal repeats (LTR) have attracted considerable interest in recent years because of their potential impact on the genome structure of most eukaryotic organisms. LTR-retrotransposons (LTR-RTs) are a large and diverse group of transposable elements (TE) that replicate via an RNA intermediate. LTR-RTs are divided into autonomous and nonautonomous groups. defined LTR-RT as autonomous if it encodes all domains essential for its mobilization without the element being either functional or active. This is in contrast to nonautonomous LTR-RT, which are defined as elements that lack some (or all) of the domains necessary for mobilization. Features of an autonomous LTR-RT include two identical LTRs, a primer binding site (PBS), a polypurine tract (PPT), GAG and Pol genes. The Pol gene is located at the 3’ end of GAG and encodes reverse transcriptase (RT), protease (PROT), RNase H (RH), and integrase (INT), all of which are involved in retrotransposon DNA replication and the transposition system. Copia, Gypsy, and BEL–Pao superfamilies represent LTR-RT classes according to the arrangement of internal domains. There is further evidence that nonautonomous elements can retrotranspose actively or inactively. Examples of nonautonomous groups include LArge Retrotransposon Derivatives (LARD), Terminal Repeat Retrotransposons with GAG domain (TR-GAG), Terminal Repeats In Miniature (TRIM), and Barley RetroElement-2 (BARE-2)."}, {"passage_id": "Introduction.p0003", "text": "During the replication cycle of LTR-RT, the newly inserted copy has two identical LTRs at the two ends of the element. The accumulation of mutations between the two LTRs of an LTR-RT was used to estimate the elapsed time after insertion. They also show divergence caused by mutations acquired over time proportional to the age of insertion. Unequal crossovers between LTRs result in loss of internal sequence and formation of solo-LTRs. In species that allow LTR-RTs accumulation, the activity of LTR-RTs is a critical factor in genome evolution, causing extremely large genome sizes. Genomic studies have established that LTR-RTs account for a considerable proportion of many plant genomes, including 19% of peach genome, 62% of tomato genome, 53% of potato genome, and more than 70% of maize genome. Tracking LTR-RT activities in plant genomes provides useful information on genome evolution and consequently gene function. The activity of LTR-RT near or within genes not only provides the raw material for structures such as centromeres and introns, but also directly alters gene function. LTR-RTs can influence gene regulation processes such as alternative splicing, alternative promoter control, and gene silencing. Their influence on gene activity may affect the agronomic traits of various crops. According to TE-genome-wide association studies, the activity of LTR-RT is associated with several important agronomic traits, including fruit weight of tomato and width of rice grains. In addition, the activation of TE can also be triggered by environmental stress, for example, the biotic stress-responsive Tnt1 and Tto1 families in tobacco, the heat-responsive retrotransposons Go-on in rice, the cold-responsive Tcs family in citrus, and ONSEN in Arabidopsis."}, {"passage_id": "Introduction.p0004", "text": "Advances in genome sequencing technologies have opened new avenues for the study of LTR-RTs and for understanding their role in plant evolution. Several efforts have been made to provide a stable and well-documented LTR data resource that can be used to support current and future plant functional genomic research. Several databases for TEs in plants have been developed with general and specific research tools. These databases include Repbase, TREP, RetrOryza, MASiVEdb, MnTEdb, DPTEdb, GrTEdb, PlaNC-TE, ConTEdb, SPTEdb, REXdb, RepetDB, and CicerSpTEdb. Although these databases provide unique and useful information about LTR-RTs in different plant genomes, they lack important details and features. Therefore, there is a need for robust, publicly available LTR-RT databases to address the growing interest in the impact of LTR-RTs on genome evolution and functionality. Such databases would be beneficial in current and future efforts to incorporate LTR-RTs annotation as a potential component for understanding the hidden dynamics of the gene regulatory system. Several studies have used such data to guide annotation in gene expression experiments or to identify retrotransposon structures such as extrachromosomal circular DNA."}, {"passage_id": "Introduction.p0005", "text": "Here, we introduce PlantLTRdb, a comprehensively designed database to expand the understanding of plant genome organization and its structural variations. PlantLTRdb provides online and searchable data resources for LTR-RT genomic information and a reliable and powerful computational service. PlantLTRdb contains detailed information on LTR-RTs in 195 plant species, both model and non-model organisms. These results are easily accessible and can be displayed using various statistical and genome-wide visualization tools. Users can download annotation files for use in advanced genomic procedures. In addition, the website provides online identification analysis for LTR-RTs via LTR_FINDER, which supports the standard input sequence format (FASTA)."}], "Discussion": [], "Conclusion": [{"passage_id": "Concl.p0001", "text": "Conclusions and future directions"}, {"passage_id": "Concl.p0002", "text": "PlantLTRdb is a hub portal of LTR-RTs in plant species. For all plant species studied, various analyzes were performed to identify, characterize, and annotate LTR-RTs, as well as to estimate insertion ages, detect LTR-RT-gene chimeras, and determine nearby genes. The PlantLTRdb contains 520,194 intact LTR-RTs, including 29,462 autonomous and 490,732 nonautonomous LTR-RTs. In addition, the website portal allows users to search, visualize, BLAST, and analyze plant LTR-RT elements. PlantLTRdb will be continuously updated with newly annotated genomes. PlantLTRdb is an important database that can contribute to the understanding of structural variations, genome organization, and the development of LTR-RT target markers for molecular plant breeding."}]}}, {"pmcid": "PMC10027660", "title": "The distribution of submerged macrophytes in response to intense solar radiation and salinity reveals hydrogen peroxide as an abiotic stress indicator", "source_file": "PMC10027660.json", "source_url": "https://pmc.ncbi.nlm.nih.gov/articles/PMC10027660/", "included_counts": {"Abstract": 1, "Introduction": 6, "Discussion": 13, "Conclusion": 1}, "omitted_results_discussion": false, "sections": {"Abstract": [{"passage_id": "Abstract.p0001", "text": "The feasible condition for submerged macrophyte growth is hard to understand as many environmental factors contribute to establishing macrophyte distribution with different intensities generating excess reactive oxygen species (ROS). Among various kinds of ROS, hydrogen peroxide (H2O2) is relatively stable and can be measured accurately. Thus, for the quantification of submerged macrophyte species, H2O2 can be used to evaluate their distribution in a lake. Submerged macrophytes, such as Potamogeton anguillanus, were abundant in Lake Shinji. The largest biomass distribution was around 1.35 m deep, under low solar radiation intensity, and nearly no biomass was found less than 0.3 m deep, where solar radiation was high. Tissue H2O2 concentrations varied in response to the diurnal photosynthetically active radiation (PAR) intensity, which was followed by antioxidant activities, though slightly delayed. Laboratory experiments were conducted with different PAR intensities or salinity concentrations. A stable level of H2O2 was maintained up to about 200 μmol m−2 s−1 of PAR for 30 days, followed by a gradual increase as PAR increased. The H2O2 concentration increased with higher salinity. A change in Chlorophyll a (Chl-a) concentration is associated with an altering H2O2 concentration, following a unique negative relationship with H2O2 concentration. If H2O2 exceeded 45 μmol/gFW, the homeostasis collapsed, and H2O2 and Chl-a significantly declined afterward. The above findings indicate that H2O2 has a negative effect on the physiological condition of the plant. The increase in H2O2 concentration was prevented by antioxidant activities, which elevated with increasing H2O2 concentration."}], "Introduction": [{"passage_id": "Introduction.p0002", "text": "Macrophytes play important ecological roles, and they can colonize a variety of aquatic environments. Their colonization in different environments is governed by an array of external factors and the abilities of a particular macrophyte to cope with that environment. It has always been a key challenge for aquatic ecologists to discover the environmental factors that drive the richness and distribution of these plants. Among these external factors, underwater light intensity is very important. It affects macrophyte growth and biomass production, reproduction, distribution, and phenotypic variation. Underwater light intensity at a water stratum is governed by depth, canopy openness, or water turbidity."}, {"passage_id": "Introduction.p0003", "text": "In freshwater ecosystems, roughly 10% of the global radiation is reflected at the air–water interface, and a significant portion is attenuated with depth, resulting in low light conditions in most deep aquatic habitats. Thus, water depth and low light intensity inhibits the colonization of the plants. High solar radiation damages the photosynthetic apparatus at the same time and degrades the photosynthesis rate, called photoinhibition. Thus, the too-shallow water seems to be unsuitable for the colonization of submerged plants, though it is not much discussed."}, {"passage_id": "Introduction.p0004", "text": "Many studies have already investigated submerged plants to characterize their photoinhibition by fluorescence yield. This technique indicates the energy flow rate utilized in the photosynthesis process as a result of the radiation’s effect on the thylakoid’s photosynthesis apparatus. However, it is difficult to quantify the process compared with other abiotic stresses. Solar radiation’s excessive energy stresses the plant cell organelle and generates the ROS in the chloroplast. Various physiological and environmental factors directly affect the photoproduction of ROS. The photoproduction rate increases and is directly proportionate to photon intensity, which is required for CO2 assimilation. Singlet oxygen, generated at PSII, damages the PSI and PSII apparatuses. In the electron transport chain, the superoxide radical (O2.−) is generated due to the partial reduction of O2 or as a result of a high energy supply. The excessive number of electrons generates the ROS super oxide anion (.O2−) from oxygen. They are dismutated to H2O2 by the activity of super oxide dismutase (SOD). Singlet oxygen and H2O2 inhibit the production of the D1-protein, which otherwise reactivates the damaged PSII. Other stress types, such as unsuitable temperatures and anoxic conditions, also generate ROS on other organelles, which then disrupt the photosynthesis, affecting colonization or growth."}, {"passage_id": "Introduction.p0005", "text": "Salinity is an important abiotic factor limiting the development and primary production of plants, since it may cause ionic disequilibrium and oxidative stress. It also determines the distribution and colonization of aquatic macrophytes. Oxidative stress is an important indicator of salt stress, since the plant under the effect of salt may increase the production of ROS and suffer cell damage. H2O2 is one of the main cellular metabolites that, at low concentrations, acts as an important signaling factor in the cell defense metabolism. On the other hand, H2O2 at high concentrations and in the presence of transition metals may generate the hydroxyl radical (OH⋅) that can transpose and disintegrate cell membranes. Therefore, the concentration of H2O2 is highly likely to become a useful indicator of oxidative stress to evaluate colonization ability."}, {"passage_id": "Introduction.p0006", "text": "Under stress conditions, plants deal with the effects of ROS through an enzymatic complex, triggering a non-enzymatic antioxidant mechanism. Antioxidant activities depend on the ROS concentration, while in the recovery process, the antioxidant, particularly catalase activities, is delayed compared to the ROS concentration."}, {"passage_id": "Introduction.p0007", "text": "Both laboratory and field experiments were conducted to elucidate the relationships between photoinhibition and light intensity. Unlike the regulated condition of the laboratory experiments, the solar radiation intensity in the field condition varies from time to time. Usually, it is higher than that of laboratory experiments. Plants should be more susceptible to the combined effect of intensive solar radiation and salinity. Thus, field observation is crucial to understand the daily effect of solar radiation on the photosynthesis and growth rate of submerged plants. We hypothesize that under intense solar radiation and salinity conditions, the homeostasis between tissue H2O2 generation and antioxidative mechanisms is disrupted, limiting the growth and biomass of submerged macrophytes. In this study, H2O2 concentration and the intensity of antioxidant activities were measured under high solar radiation on a summer day, particularly focusing on photoinhibition to introduce the biomass distribution pattern along the shoreline of a lake. Also, the biomass distribution of a submerged macrophyte species, P. anguillanus, was observed in a brackish lake. Its trend was analyzed from the viewpoint of the tissue H2O2 concentration and antioxidant activities with the aid of laboratory experiments."}], "Discussion": [{"passage_id": "Discuss.p0002", "text": "Biomass distribution in Lake Shinji"}, {"passage_id": "Discuss.p0003", "text": "In the previous report, P. anguillanus was observed from June to December and was found up to 2.5–3.0 m depth, with the highest biomass at 1.5 m depth. In the present study, there was no biomass up to 0.3 m depth, and the biomass was highest, 300 gDW/m2, at 1.35 m depth, then decreased in the deeper zones. Biomass distribution follows a perfect agreement. The salinity level of the lake water fluctuated depending on the inflow volume and was higher with low inflow and lower with high inflow. The salinity at 0.5 m above the bottom of the lake center (6 m depth) was about 3.6‰ (1.0–7.4‰) at the bottom in average for the last 20 years, and the fluctuation was relatively small at 0.6–0.7‰. It may affect the distribution of P. anguillanus in Lake Shinji. However, compared with the present results on the tolerance of this species against the salinity concentration at P. anguillanus colonized depth, this salinity level does not contribute much to reducing biomass, even in the deep zone (Fig. 4). Most of turbidity flows in during flood periods, from the Hii River, located at the western end of the lake and does not affect the central part of the lake. Any specific sightings such as herbivores, etc., are recognized in these days."}, {"passage_id": "Discuss.p0004", "text": "The major stress seems to be high solar radiation combined with salinity stress. High mechanical disturbance inhibits the colonization of submerged plants near the shoreline. However, a large number of emergent plants were naturally colonized along the shoreline decades ago, and Phragmites australis colonies have now been widely recovered in some areas. Mechanical disturbance is not a major reason to inhibit P. anguillanus in the shallow zones."}, {"passage_id": "Discuss.p0005", "text": "The generation rate of superoxide radicals (.O2−) depends on the uptake rate of inorganic carbon. Exposure to 2 μmol of dissolved inorganic carbon is sufficient for photosynthesis under even 1200 μmol m−2 s−1 of radiation. The relatively high inorganic carbon was dissolved in the lake water due to the wave activities by the strong winds and with around pH 7, where a sufficient amount of CO2 existed (pCO2 ≡ 150–1000, DIC ≡ 600–700). Thus, the excessive H2O2 was considered due to the high solar radiation effect rather than the lack of carbon dioxide."}, {"passage_id": "Discuss.p0006", "text": "At 0.3 m depth, the light intensity was 600 μmol m−2 s−1, and at 1.35 m depth, 30 μmol m−2 s−1. As a result of excessive solar radiation, P. anguillanus cannot extend to near water surface in deep sites, and grow after germination in shallow sites, which may explain the low biomass at less than 0.3 m depth. However, the germination of P. anguillanus is capable at very low light or even dark conditions, then can extend to 30–50 cm long even in dark conditions. Thus, 2.5–3.0 m is the maximum depth in which the plant canopy can reach until sufficient photosynthesis is expected after germination and continue to grow, although PAR at the bottom is too low. However, the highest biomass was achieved at 1.35 m depth where the preferable light intensity could be received at the bottom just after germination."}, {"passage_id": "Discuss.p0007", "text": "The response of hydrogen peroxide to solar radiation"}, {"passage_id": "Discuss.p0008", "text": "Under environmental stresses, the ROS generated in the various organelles, chloroplast, mitochondria, and peroxisome damages proteins, genes, and lipids, although antioxidant activities scavenge them. H2O2 is a major ROS, either directly generated or generated in many organelles from superoxide radicals by SOD activity. Experimental studies by many laboratories have been conducted to determine the relationship between the H2O2 concentration and the various types of stress intensities."}, {"passage_id": "Discuss.p0009", "text": "Unlike laboratory experiments, which are controlled intentionally, there are various environmental stressors in the real field, and their intensities vary randomly or regularly with different time scales. This study shows that the H2O2 concentration increases with elevating stress intensity, then affects Chl-a concentration, following a nearly unique relationship irrespective of stress types and their processes. However, there is a slight difference between the increasing and decreasing stress intensity processes. The response is sufficiently rapid compared with the change in the environment. At the same time, if the H2O2 concentration exceeded 45 μmol/gFW, it significantly declined afterward, even against the higher stresses. The high H2O2 concentration deteriorates the physiological condition without generating further H2O2."}, {"passage_id": "Discuss.p0010", "text": "Low H2O2 concentration is generated with sufficiently low PAR, and the Chl-a concentration fluctuates positively with the PAR (data are not shown). It may be due to an adaptation to increase productivity. In contrast, high Chl-a concentration increases the photosynthesis rate, generating more H2O2 and deteriorating the photosynthesis apparatus. Thus, increased H2O2 concentration negatively alters the Chl-a concentration in highly stressed conditions. The H2O2 concentration is likely to indicate the environmental stress intensity on plants and productivity. This study showed the significant negative effect of H2O2 on P. anguillanus. Other submerged macrophytes, such as Egeria densa, Elodea nuttallii, Potamogeton crispus, Ceratophyllum demersum, and Vallisneria asiatica, had similar findings."}, {"passage_id": "Discuss.p0011", "text": "The effect of antioxidant activities"}, {"passage_id": "Discuss.p0012", "text": "The tissue H2O2 concentration at a particular time is determined as the balance between the generation rate and the scavenging by antioxidant activities. This concentration works as a signal to activate antioxidant behavior. After receiving H2O2 signals, antioxidants are formed and activated to scavenge the effect of H2O2. Varying light intensity delays the behaviors of the antioxidant activities and results in H2O2 variations. The present study indicated that the delay period was 2–3 h compared to the variational pattern of the H2O2 concentration, although this period depended on the analysis frequency. Then, the H2O2 concentration becomes higher in the early afternoon, not exactly when the solar radiation is highest (Fig. 2)."}, {"passage_id": "Discuss.p0013", "text": "Comparison with Chl-a fluorescence behavior"}, {"passage_id": "Discuss.p0014", "text": "PSII photochemical efficiency is given by Chl-a fluorescence (Fv/Fm). Therefore, the photoinhibition effect was studied using an indicator of photosynthetic quantum yield. The relationship between the H2O2 concentration and the Fv/Fm ratio is unclear. The linear relation of the photosynthetic rate with the Fv/Fm ratio is given, and no reduction of Fv/Fm was recorded to 70 μmol m−2 s−1 of PAR for Egeria densa, E. nuttallii, and Myriophyllum heterophyllum. A quick reduction was observed in 3 h after exposure to 100 μmol m−2 s−1 light. The fraction of PAR is approximately 0.45 of the total solar radiation. Thus, 70 μmol m−2 s−1 PAR corresponds to about 160 μmol m−2 s−1 total solar radiation, corresponding to the solar radiation of the lowest H2O2 concentration. The quick reduction of fluorescence has been reported, such that the fluorescence reduced quickly (about 20 min) after exposure to the high light, 500–1000 μmol m−2 s−1. There was a relatively slow (about 6 h) yield recovery in the shade after 30 min solar radiation exposure. Though the period is slightly different, the response time trend agrees with the variation tendency of the H2O2 concentration."}], "Conclusion": [{"passage_id": "Concl.p0002", "text": "Tissue H2O2 concentration becomes higher in unsuitable conditions where oxidative stress is high. Excessive light intensity and elevated salinity increase H2O2 concentration. Chl-a concentration has a unique negative correlation with H2O2 concentration. If H2O2 exceeds a threshold value, physiological homeostasis collapses, and H2O2 and Chl-a concentrations significantly decline. Therefore, the largest biomass in a lake is distributed in a slightly deep zone, where sufficient solar radiation is received after an extended period, rather than in a shallow zone, where solar radiation is high at the bottom."}]}}, {"pmcid": "PMC10029309", "title": "Genome-wide analysis of the GLP gene family and overexpression of GLP1-5–1 to promote lignin accumulation during early somatic embryo development in Dimocarpus longan", "source_file": "PMC10029309.json", "source_url": "https://pmc.ncbi.nlm.nih.gov/articles/PMC10029309/", "included_counts": {"Abstract": 3, "Introduction": 5, "Discussion": 12, "Conclusion": 1}, "omitted_results_discussion": false, "sections": {"Abstract": [{"passage_id": "Abstract.p0001", "text": "Longan (Dimocarpus longan Lour.) is an economically important subtropical fruit tree. Its fruit quality and yield are affected by embryo development. As a plant seed germination marker gene, the germin-like protein (GLP) gene plays an important role in embryo development. However, the mechanism underlying the role of the GLP gene in somatic embryos is still unclear. Therefore, we conducted genome-wide identification of the longan GLP (DlGLP) gene and preliminarily verified the function of DlGLP1-5–1. Thirty-five genes were identified as longan GLP genes and divided into 8 subfamilies. Based on transcriptome data and qRT‒PCR results, DlGLP genes exhibited the highest expression levels in the root, and the expression of most DlGLPs was upregulated during the early somatic embryogenesis (SE) in longan and responded to high temperature stress and 2,4-D treatment; eight DlGLP genes were upregulated under MeJA treatment, and four of them were downregulated under ABA treatment. Subcellular localization showed that DlGLP5-8–2 and DlGLP1-5–1 were located in the cytoplasm and extracellular stroma/chloroplast, respectively. Overexpression of DIGLP1-5–1 in the globular embryos (GEs) of longan promoted the accumulation of lignin and decreased the H2O2 content by regulating the activities of ROS-related enzymes. The results provide a reference for the functional analysis of DlGLPs and related research on improving lignin accumulation in the agricultural industry through genetic engineering."}, {"passage_id": "Abstract.p0002", "text": "Supplementary Information"}, {"passage_id": "Abstract.p0003", "text": "The online version contains supplementary material available at 10.1186/s12864-023-09201-y."}], "Introduction": [{"passage_id": "Introduction.p0002", "text": "Germin-like proteins (GLPs) and germin (GER) have long been recognized as marker proteins of the plant germination process. GLPs contain three typical conserved motifs: Box A [QDFCVAD], Box B [G(x)5Hx H(x)3,4E(x)6G] and Box C [G(x)5Px G(x) 2H(x)3N]. The three histidine residues and one glutamic acid residue in Box B and Box C may be involved in metal ion binding. Based on the evolutionary relationships of the sequences, GLPs can be divided into six subfamilies: germinin-like subfamilies I, II and III, the true germinin subfamily, the gymnosperm-like germin subfamily and the moss-like germin subfamily. To date, GLP genes have been widely studied in plants. A total of 32, 44, 20, 21, 7, 38 and 14 GLP family members were found in Arabidopsis (Arabidopsis thaliana), banana (Musa nana), grain (Setaria italica), soybean (Glycine max (Linn.), grape (Vitis vinifera), cucumber (Cucumis sativus) and rape (Brassica napus), respectively."}, {"passage_id": "Introduction.p0003", "text": "GLPs are widely expressed in different organs, such as roots, stems, leaves, flowers and seeds; they also have diverse functions in different plant developmental stages and are mainly involved in a variety of physiological processes in the form of receptors, enzymes and structural proteins. Previous studies have shown that PsGLP1 and PsGLP2 are involved in the whole process of flower and fruit development in different varieties of plum (Prunus). OsGLP2-1 affects seed germination in rice (Oryza sativa L.) by participating in the abscisic acid (ABA) and gibberellin (GA) signaling pathways. GLPs, arabinogalactan protein (AGP), chitinase (CHI), lipid transfer protein (LTP) and glycoprotein are key factors involved in plant somatic embryogenesis (SE) and are marker proteins during plant early SE. Silencing of the LmGLP gene inhibited callus maturation in larch (Larix x marschlinsii Coaz). Overexpression and knockout of OsGLP1 in rice calli did not affect the germination of young plants, but in the 6th month of the T0 generation, the mature old leaves showed anaphylactic necrosis. This result suggests that GLP genes play different roles during embryo developmental processes in different plants."}, {"passage_id": "Introduction.p0004", "text": "GLPs play roles in the response to biotic and abiotic stresses. For example, in the process of plant infection by pathogenic fungi, barley (Hordeum vulgare L.) HvGLP4, wheat (Triticum aestivum L.) TaGLP4, and rice (Oryza sativa L.) OsRGLP2 and OsGLP1 play similar roles as superoxide dismutase (SOD) and polyphenol oxidase in the apoplast. Hydrogen peroxide (H2O2) accumulates during reactive oxygen species (ROS)-induced pathogenic bacterial invasion, thus activating specific genes of the H2O2-mediated defense response. Land cotton (Gossypium hirsutum) GhGLP2 and growth hormone binding protein 19 (G. hirsutum auxin binding protein19,
