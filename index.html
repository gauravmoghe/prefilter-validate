GhABP19) also possess SOD activity and are involved in vascular bundle browning and oxygen stress tolerance in response to pathogenic bacterial infestation. GLPs also exhibit oxalate oxidase (OXO) activity in both litchi and longan. The GLP expression level in the carpopodium of 'Shi Xia' longan was negatively correlated with OXO activity. Therefore, studying the role of GLP genes can provide further insights into their functions during early SE in longan."}, {"passage_id": "Introduction.p0005", "text": "As one of the most abundant biological materials on earth, lignin has been widely used in many fields as a reinforcing agent, binder and corrosion inhibitor. Lignin is mainly derived from plants in nature. Lignin also plays an important role in plants, affecting the formation of cell walls. Previous studies have shown that GLP genes are involved in cell wall formation and are enriched in the metabolic pathway of phenylpropane biosynthesis. It is speculated that the DlGLP gene is involved in lignin biosynthesis. Therefore, studying the role of GLPs in plants is of great importance for obtaining plants with high wood quality in the agricultural industry."}, {"passage_id": "Introduction.p0006", "text": "Longan belongs to the Sapindaceae family and is an economically important fruit tree in the subtropical zone. Its fruit has high medicinal value, with the ability to delay aging and inhibit cancer cell growth. Embryo development has an important effect on fruit quality. Longan embryogenesis plays an extremely important role in fruit development, but it is a complex process that is influenced by various factors. The metabolic synthesis of lignin is an important link during the SE of longan, which will affect the structural changes in the cell wall and the process of cell wall thickening during embryonic development. The synthesis of lignin is affected by the activities of SOD, peroxidase (POD), catalase (CAT) and other enzymes. POD can produce phenoxy radicals by decomposing H2O2, which is the raw material for lignin synthesis. Previous studies have shown that DNA replication, cell cycle-related genes, and the extracellular protein-encoding genes LTP, CHI, GLP, and AGP were significantly differentially expressed during early SE in longan, and they may be involved in regulating SE in longan. The GLP gene acts as an SOD or OXO to regulate the H2O2 content in the process of plant growth and development, thus affecting the cross-linking of the cell wall. Therefore, we speculate that the GLP gene affects lignin synthesis by regulating the ROS content in plants, thus participating in the growth and development of longan at the somatic embryo stage. In this study, we performed genome-wide identification of longan GLP (DlGLP) family members based on a longan genome and transcriptome dataset. The basic physicochemical properties, chromosomal distribution, conserved motifs, gene structure, evolutionary relationships, cis-acting elements, and transcriptome data of DlGLPs were investigated to determine the possible roles of DlGLPs in longan. We also investigated the expression patterns of GLPs during the early stage of SE in longan and under ABA and methyl jasmonate (MeJA) hormone treatments. The subcellular localization of the differentially expressed genes DlGLP5-8–2 and DlGLP1-5–1 was further verified. Overexpression of DlGLP1-5–1 might increase the lignin content of longan globular embryos by dynamically regulating the ROS level in plants through SOD, POD and CAT activities. This study provides useful information for further research on the functional mechanisms of GLP genes in longan and provides a reference for improving lignin accumulation through genetic engineering in the agricultural industry."}], "Discussion": [{"passage_id": "Discuss.p0002", "text": "Structural and evolutionary analysis of the DlGLP genes and their role in the growth and development of longan"}, {"passage_id": "Discuss.p0003", "text": "Germin-like proteins are involved in plant growth and developmental processes and respond to abiotic and biotic stresses. In total, 32, 44, 20 and 14 GLP family members have been identified in Arabidopsis, banana, cereals, and oilseed rape, respectively. In this study, genome-wide identification of the DlGLP gene family was performed, and 35 DlGLP family members were identified. Both DlGLP5-8–2 and DlGLP1-5–1 contain signal peptides, suggesting that DlGLP5-8–2 may be involved in the synthesis and transport of glycans and lipids inside and outside the cell. Transcriptomic analysis of different tissues of longan showed that DlGLPs were expressed in all tissues, and most DlGLPs were highly expressed in roots and seeds. The expression of lemon ClGLP1 is increased during the fruit ripening process. DlGLP3-9–1 was highly expressed in young longan fruit and may play an important role in the longan fruit ripening process. The results suggest that DlGLPs may be involved in growth and development in longan, providing a theoretical basis for functional research on GLP genes in longan. It was recognized that tandem duplication events have mainly extended the GLP family members in D. longan. It seems that modifications in gene structure have affected the expression level and function of duplicated members."}, {"passage_id": "Discuss.p0004", "text": "According to their evolutionary relationships, the GLP family members of longan, rice, Arabidopsis, lychee, banana and grape are divided into eight families. GLP genes may evolve into specific GLP genes in different species; some GLP genes may exist only in monocotyledons. Combined analysis of the gene structures revealed a high degree of similarity among the aggregated GLP genes, which may play roughly the same role in plants. Overexpression of OsRGLP1 in tobacco significantly increased the H2O2 content in the leaves of tobacco transgenic plants. The accumulation of H2O2 enhancements intercellular cross-linking, thus improving disease resistance in rice. AtGLP13 affects the cotyledon greening rate and main root growth in Arabidopsis. The expression level of GLP genes in the fruit stalk tissue of 'SJM' longan was significantly and negatively correlated with the enzymatic activity of OXO. OsGLP2-1 is involved in the regulation of seed dormancy in rice. GLP genes play an important role in plant growth and developmental processes, and studies on the growth and developmental stages of somatic embryos are still relatively scarce."}, {"passage_id": "Discuss.p0005", "text": "DlGLPs may play an important role during the early stage of SE in longan"}, {"passage_id": "Discuss.p0006", "text": "Germin-like proteins have been known to play roles during SE in plants. Repression of the LmGER1 gene in hybrid larch led to a significant decrease in the efficiency of callus maturation and failure to form young plants. However, knockdown of the OsGLP1 gene in rice calli did not show the same effect as in hybrid larch. In this experiment, we analyzed the expression of the DlGLP family during early SE in longan and found that some DlGLP genes were highly expressed in the ICpEC and GE stages. GLPs are involved in plant growth and development as SOD and OXO enzymes and generate H2O2, which can be involved in Ca2+ regulation and thus act on structural proteins of the cell wall. These results demonstrate that DlGLPs may influence the differentiation of GEs in longan. However, the specific mechanism underlying the role of DlGLP genes during early SE in longan still needs further study."}, {"passage_id": "Discuss.p0007", "text": "DlGLPs respond to the hormones MeJA, ABA and SL during early SE in longan"}, {"passage_id": "Discuss.p0008", "text": "Analysis of promoter cis-acting elements showed that the GLP gene family members contain MeJA and ABA hormone-responsive elements, suggesting that the function of DlGLP genes may be related to hormone transduction in plants. Previous studies have found that OsGLP2-1 is involved in the regulation of the ABA signaling pathway during rice seed primary dormancy, is directly regulated by ABI5 transcription factors and has been shown to be involved in the regulation of seed dormancy. In Bowl Cress round (Craterostigma), CpGLP1 localized to the cell wall and accumulated transiently under 100 μM ABA treatment. ABA can promote somatic embryonic development in ginseng and spruce. Our results showed that the expression of DlGLPs was mostly inhibited under ABA hormone treatment. In particular, when the concentration was 100 μM, the expression of 7 DlGLPs decreased significantly. DlGLP gene expression was significantly upregulated under MeJA treatment. This indicates that DlGLP may participate in the growth and development process of longan at the SE stage by participating in the MeJA and ABA signaling pathways."}, {"passage_id": "Discuss.p0009", "text": "Our results also showed that some DlGLP genes responded to SL hormone regulation. Previous studies have shown that SL can reduce growth hormone transport by decreasing the accumulation of PIN proteins on the cytoplasmic membrane of thin-walled xylem tissues. It has been proven that the function of DlGLP genes is related to plant growth and development and cell wall formation, indicating that DlGLPs may participate in the signaling pathway of SL by regulating the changes in substances on the cytoplasmic membrane."}, {"passage_id": "Discuss.p0010", "text": "These results suggest that the signaling pathways of GLP genes involved in the response to hormones in plants are complex. This study provides a theoretical basis for further research on whether DlGLPs affect early SE in longan through their involvement in MeJA, ABA, and SL hormone transduction."}, {"passage_id": "Discuss.p0011", "text": "DlGLP1-5–1 promoted lignin accumulation"}, {"passage_id": "Discuss.p0012", "text": "GLP genes can as act as SOD, OXO and serine protease inhibitors to participate in plant growth and development. SOD activity was significantly increased after overexpression of DlGLP1-5–1, which was consistent with the result showing that GLP can act as SOD to participate in plant growth and development. These results indicate that DlGLP1-5–1 plays an important role in ROS scavenging in the early stage of SE in longan. Previous studies have shown that POD can decompose H2O2 and produce phenoxy radicals to promote the synthesis of lignin. After overexpression of DlGLP1-5–1 in longan GEs, the POD activity and lignin content in longan globular embryos increased significantly. Therefore, it is speculated that overexpression of DlGLP1-5–1 may promote lignin synthesis through phenoxy radicals produced by POD. The decrease in H2O2 content and CAT enzyme activity indicated that the lignin synthesis pathway involving DlGLP1-5–1 is very complex. Previous studies have shown that the GLP gene has polyphenol oxidase activity, which can catalyze the synthesis of lignin. Polyphenol oxidase is a plastid enzyme that may only be present in plastids. The localization of DlGLP1-5–1 in chloroplasts suggests that DlGLP1-5–1 may have polyphenol oxidase activity. Whether DlGLP1-5–1 acts as a catalyst for lignin synthesis by polyphenol oxidase remains to be further studied."}, {"passage_id": "Discuss.p0013", "text": "Overexpression of DlGLP1-5–1 can significantly increase lignin accumulation in longan somatic embryos, which indicates that DlGLP1-5–1 plays an important role in lignin synthesis in longan. Therefore, it is speculated that DlGLP1-5–1 plays a similar role in other species, which provides a reference for further research on the biosynthetic pathway of lignin. At the same time, it also provides a reference for improving lignin accumulation through genetic engineering in the agricultural industry."}], "Conclusion": [{"passage_id": "Concl.p0002", "text": "In this study, 35 DlGLP genes were obtained and divided into eight different subfamilies in longan. Gene sequence analysis showed that the DlGLP gene was highly conserved during evolution. The exon–intron and motif compositions of different subfamilies were similar. By transcriptome analysis, we found that DlGLP genes may widely participate in various plant growth and developmental processes and play important roles during early SE and root formation in longan. Gene expression analysis showed that DlGLPs were regulated by ABA, MeJA and SL and may play roles during early SE in longan by responding to hormone signal pathways. In addition, DlGLP5-8–2 and DlGLP1-5–1 were located in the cytoplasm and extracellular matrix/chloroplast, respectively, indicating that they may participate in the regulation of material transport and cell growth. Overexpression of DlGLP1-5–1 in the GE stage increases the lignin content and SOD and POD activities. However, the decrease in CAT activity and H2O2 content indicates that DlGLP1-5–1 has a complex regulatory mechanism in lignin synthesis. This study provides a reference for future research related to the functional analysis of DlGLPs and for improving lignin accumulation through genetic engineering in the agricultural industry."}]}}, {"pmcid": "PMC10029358", "title": "AgMYB5, an MYB transcription factor from celery, enhanced β-carotene synthesis and promoted drought tolerance in transgenic Arabidopsis", "source_file": "PMC10029358.json", "source_url": "https://pmc.ncbi.nlm.nih.gov/articles/PMC10029358/", "included_counts": {"Abstract": 7, "Introduction": 5, "Discussion": 4}, "omitted_results_discussion": false, "sections": {"Abstract": [{"passage_id": "Abstract.p0001", "text": "Background"}, {"passage_id": "Abstract.p0002", "text": "Water shortage caused by global warming seriously affects the yield and quality of vegetable crops. β-carotene, the lipid-soluble natural product with important pharmacological value, is abundant in celery. Transcription factor MYB family extensively disperses in plants and plays regulatory roles in carotenoid metabolism and water scarcity response."}, {"passage_id": "Abstract.p0003", "text": "Results"}, {"passage_id": "Abstract.p0004", "text": "Here, the AgMYB5 gene encoding 196 amino acids was amplified from celery cv. ‘Jinnanshiqin’. In celery, the expression of AgMYB5 exhibited transactivation activity, tissue specificity, and drought-condition responsiveness. Further analysis proved that ectopic expression of AgMYB5 increased β-carotene content and promoted drought tolerance in transgenic Arabidopsis thaliana. Moreover, AgMYB5 expression promoted β-carotene biosynthesis by triggering the expression of AtCRTISO and AtLCYB, which in turn increased antioxidant enzyme activities, and led to the decreased contents of H2O2 and MDA, and the inhibition of O2− generation. Meanwhile, β-carotene accumulation promoted endogenous ABA biosynthesis of transgenic Arabidopsis, which resulted in ABA-induced stomatal closing and delayed water loss. In addition, ectopic expression of AgMYB5 increased expression levels of AtERD1, AtP5CS1, AtRD22, and AtRD29."}, {"passage_id": "Abstract.p0006", "text": "The findings indicated that AgMYB5 up-regulated β-carotene biosynthesis and drought tolerance of Arabidopsis."}, {"passage_id": "Abstract.p0007", "text": "Supplementary Information"}, {"passage_id": "Abstract.p0008", "text": "The online version contains supplementary material available at 10.1186/s12870-023-04157-3."}], "Introduction": [{"passage_id": "Introduction.p0002", "text": "Celery (Apium graveolens L.) is one of the world's most important vegetable crops in the Apiaceae family. Traditionally, celery leaf blades and petioles have long been appreciated for their nutritional and pharmacological properties. In contrast to other vegetables, celery is rich in a range of nutrients, including carotenoids, ascorbic acid, apigenin, and flavonoids. At the same time, celery contains a vast array of secondary metabolites with properties of anti-oxidative damage, anti-inflammation, and anti-diabetes. Due to global warming and irregular rainfall, both celery production and quality are negatively affected by drought stress."}, {"passage_id": "Introduction.p0003", "text": "Transcription factors (TFs) have attracted attention because of their vital role as upstream regulators of structural genes. MYBs, NACs, bHLHs, and WRKYs have been proven the potential capacity of regulating plant drought tolerance. Moreover, by interacting directly with abscisic acid (ABA), TFs played positive regulatory roles in the development and drought stress of plants. In addition, TFs from Vitis vinifera, Oryza sativa, and Zea mays, were found to be the negative regulators of plant drought tolerance."}, {"passage_id": "Introduction.p0004", "text": "In plants, MYBs are composed of one of the most important families of TFs. As well as regulating organ development, MYBs widely participate in tissue formation and is important for response mechanisms to multiple environmental stresses. In recent years, MYBs from Triticum aestivum, Sesamum indicum, and Lycopersicon esculentum, have been proven the function of regulating drought tolerance. There is evidence that MYBs respond to drought stress by coordinating the stomatal opening and closing, influencing flower development, regulating phytohormone signal transduction, and affecting cuticular wax accumulation."}, {"passage_id": "Introduction.p0005", "text": "In addition, MYBs act as key regulators of promoting and repressing carotenoid metabolism in plants. As the major source of retinol in humans, carotenoids have the efficacies of anti-oxidative, anti-cancer, immunomodulatory, and delaying senescence. However, the human body is unable to synthesize carotenoids, therefore, we must obtain them through plant-based foods. β-carotene, belonging to the branch of carotenoids, contributes to the treatment of eye diseases, cardiovascular disorders, and neoplasms. In plants, β-carotene is biosynthesized in plastids through the metabolism of terpenoids and polyketides, and mediated by various enzymes, including phytoene desaturase (PDS), ζ-carotene desaturase (ZDS), carotenoid isomerase (CRTISO), and lycopene β-cyclase (LCYB). Recent studies suggested that in Vitis vinifera, Capsicum annuum, and Ulva prolifera, overexpression of MYBs promoted or repressed β-carotene accumulation. However, the regulatory role of MYBs in abiotic resistance and carotenoid accumulation in celery still lacks a thorough understanding."}, {"passage_id": "Introduction.p0006", "text": "To obtain new insights into the biological function of the MYB family in celery, based on our published celery genome information and the transcriptomic data of celery under drought stress, the gene encoding the transcription factor AgMYB5 was amplified from celery cultivar ‘Jinnanshiqin’ and heterologously expressed in A. thaliana. Physiological traits of wild type (WT) and transgenic Arabidopsis, including the contents of total carotenoid, β-carotene, malondialdehyde (MDA), hydrogen peroxide (H2O2), and superoxide anion-radicals (O2−), as well as the activities of superoxide dismutase (SOD), peroxide (POD), catalase (CAT), were detected and analyzed. Moreover, water loss rate, ABA content, stomatal aperture, and relative expression profiles of drought-stress-responsive genes were also measured and analyzed. Our work demonstrated that AgMYB5 played potentially vital roles in β-carotene accumulation and drought tolerance of plants."}], "Discussion": [{"passage_id": "Discuss.p0002", "text": "In plants, TFs usually exhibit differential expression patterns in different tissues and under various abiotic stresses. Kundan et al. identified 99 R2R3-MYBs from Cannabis sativa, and these TFs were found to have tissue-specific expression. Here, we found that under various abiotic stress conditions, AgMYB5 showed different expression patterns in celery, as well as tissue specificity. Moreover, under drought stress, AgMYB5 expression was significantly higher in the root, which might be because when soils become dry, roots sense water scarcity earlier than the other tissues and continuously release root-source signals. MYBs, MADSs, NACs, and WRKYs are responsible for carotenoid biosynthesis and degradation. Among them, MYBs played a key role in regulating β-carotene production. In Liriodendron chinense, based on genome-wide association, HPLC, and qRT-PCR, four MYBs were identified to have the function of regulating β-carotene accumulation in petals. In the green mutant of Citrus reticulata, CrMYB68 suppressed α- and β-carotene accumulation by down-regulating BCH2 and NCED5. RNA-Seq analysis revealed that SlMYB72 affected β-carotene synthesis by regulating the expression of SlPDS, SlZDS, and SlLCYB, while RNA interference with SlMYB72 inhibited lycopene and β-carotene accumulation. In the present study, it was found the changes in AgMYB5 expression and β-carotene content were closely related in celery, and ectopic expression of AgMYB5 in A. thaliana promoted β-carotene accumulation and up-regulated β-carotene synthesis-related genes in a water-deprived environment, which confirmed the involvement of AgMYB5 in β-carotene biosynthesis under drought stress. At the same time, β-carotene, an excellent natural antioxidant, confers stress resistance to plants by scavenging excess ROS. In Dioscorea esculenta, the over-production of β-carotene led to a stronger DPPH radical-scavenging capacity and a higher photosynthetic efficiency. Our results showed that drought stress induced the activities of SOD, POD, and CAT, and increased the contents of MDA, H2O2, and O2− at various levels. Moreover, compared with that in WT, increased antioxidant enzymatic activities and decreased ROS contents were found in transgenic lines, which indicated that AgMYB5 expression protected ROS scavenging system by enhancing β-carotene production."}, {"passage_id": "Discuss.p0003", "text": "It has been reported that in the ABA biosynthesis of plants, NCED is the key enzyme, and β-carotene acts as the precursor. In transgenic Oryza sativa, OsZDS overexpression enhanced β-carotene biosynthesis, which also promoted OsNCED1 expression and induced ABA accumulation. In A. thaliana, ABA treatment induced AtD27 (a gene encoding β-carotene isomerase) expression, and the AtD27 mutant exhibited lower ABA content. In the present study, compared to WT, ABA content and expression profiles of ABA biosynthesis-related genes were higher in transgenic lines, revealing that under drought stress, AgMYB5 promoted endogenous ABA biosynthesis by enhancing β-carotene accumulation. In drought-stressed plants, ABA is a major phytohormone involved in regulating stomatal aperture. According to the reports from Populus euphratica, Oryza sativa and Solanum lycopersicum, plants increased drought tolerance by modulating stomatal closing. Our results demonstrated that compared to WT, AgMYB5 inhibited water loss by regulating stomatal closure, thereby enhancing drought tolerance of transgenic Arabidopsis."}, {"passage_id": "Discuss.p0004", "text": "Recently studies have shown that TFs respond to biotic and abiotic stress by cooperating with stress-response genes. In Gossypium hirsutum, GhWRKY17 overexpression significantly reduced drought and salt tolerance by down-regulating the transcript levels of GhERD and GhLEA. Compared to WT, VvNAC17 transgenic Arabidopsis showed stronger drought tolerance and enhanced expression of AtCOR47, AtP5CS, AtRD22, and AtRD29A. Our study found that under drought stress, the expression of AtERD1, AtP5CS1, AtRD22, and AtRD29 were significantly enhanced in AgMYB5 transgenic lines as compared to that in WT, indicating that through activating the expression of drought stress-response genes, AgMYB5 enhanced drought tolerance of transgenic Arabidopsis. Previous reports showed that AcMYB3R, obtained from Actinidia chinensis, activated the expression of AtRD22, AtCOR15A, and AtRD29, which led to enhanced drought tolerance of transgenic Arabidopsis. A similar study also reported that overexpression of TaSIM, an R2R3-MYB gene of Triticum aestivum, boosted the expression of AtRD22 and AtRD29, which revealed the function of TaSIM in the drought response mechanism."}, {"passage_id": "Discuss.p0005", "text": "In conclusion, we isolated a transcription factor AgMYB5 from the celery cultivar ‘Jinnanshiqin’. AgMYB5 presented the properties of transcriptional auto-activation and tissue specificity under drought stress, as well as a correlation with carotenoid accumulation. In transgenic Arabidopsis, AgMYB5 ectopic expression enhanced β-carotene biosynthesis and increased β-carotene content under drought stress, which in turn protected transgenic Arabidopsis against ROS-mediated peroxidation. Meanwhile, β-carotene accumulation induced ABA biosynthesis, which triggered stomatal closure and reduced water loss of transgenic Arabidopsis under drought stress. In addition, drought-response genes were significantly up-regulated by AgMYB5 ectopic expression (Fig. 10). Interestingly, unlike that under normal conditions, β-carotene and ABA accumulation, antioxidant enzyme activity, and stomatal aperture in transgenic Arabidopsis showed significant differences under drought stress, implying that AgMYB5 was barely expressed under normal conditions but induced by drought stress. Altogether, our findings suggest that AgMYB5 promotes β-carotene accumulation and plays a pivotal role in the drought tolerance of Arabidopsis. However, the anti-drought ability validation of AtMYB5 from A. thaliana is still required, which will give a more powerful reference for MYB5 function investigation. Meanwhile, AtMYB5 function validation will be an excellent subject for us to study the molecular regulation mechanism of MYBs in plant drought resistance."}], "Conclusion": []}}, {"pmcid": "PMC10030316", "title": "Nitrate-responsive OsMADS27 promotes salt tolerance in rice", "source_file": "PMC10030316.json", "source_url": "https://pmc.ncbi.nlm.nih.gov/articles/PMC10030316/", "included_counts": {"Abstract": 2, "Introduction": 5, "Discussion": 12}, "omitted_results_discussion": false, "sections": {"Abstract": [{"passage_id": "Abstract.p0001", "text": "Salt stress is a major constraint on plant growth and yield. Nitrogen (N) fertilizers are known to alleviate salt stress. However, the underlying molecular mechanisms remain unclear. Here, we show that nitrate-dependent salt tolerance is mediated by OsMADS27 in rice. The expression of OsMADS27 is specifically induced by nitrate. The salt-inducible expression of OsMADS27 is also nitrate dependent. OsMADS27 knockout mutants are more sensitive to salt stress than the wild type, whereas OsMADS27 overexpression lines are more tolerant. Transcriptomic analyses revealed that OsMADS27 upregulates the expression of a number of known stress-responsive genes as well as those involved in ion homeostasis and antioxidation. We demonstrate that OsMADS27 directly binds to the promoters of OsHKT1.1 and OsSPL7 to regulate their expression. Notably, OsMADS27-mediated salt tolerance is nitrate dependent and positively correlated with nitrate concentration. Our results reveal the role of nitrate-responsive OsMADS27 and its downstream target genes in salt tolerance, providing a molecular mechanism for the enhancement of salt tolerance by nitrogen fertilizers in rice. OsMADS27 overexpression increased grain yield under salt stress in the presence of sufficient nitrate, suggesting that OsMADS27 is a promising candidate for the improvement of salt tolerance in rice."}, {"passage_id": "Abstract.p0002", "text": "This study reports that nitrate-responsive OsMADS27 promotes salt tolerance, revealing a molecular mechanism for the enhancement of salt tolerance by nitrogen fertilizers in rice."}], "Introduction": [{"passage_id": "Introduction.p0002", "text": "Salinity is among the critical agricultural crises around the globe, and the majority of food crops are sensitive to salinity. Elevated soil salinity not only causes ion toxicity and osmotic stress but also results in severe nutrient deficiency in plants. Plants have evolved various strategies to cope with salinity-triggered damage, depending on their habitat and the severity of the stress. Among these numerous strategies, appropriate acquisition of mineral nutrients is undoubtedly an effective way to improve salinity tolerance, growth, and yield under salt stress. Therefore, it is important to understand the mechanisms by which nutrients alleviate plant salt stress in order to breed robust salt-tolerant crop varieties."}, {"passage_id": "Introduction.p0003", "text": "Potassium, a vital nutrient for plant growth and development, is well known for its role in balancing sodium concentrations in plants. Under salt stress, accumulation of sodium ions (Na+) in the cytoplasm leads to membrane depolarization and promotes leakage of potassium ions (K+) out of the cell. Therefore, to survive in saline soil, it is crucial for plants to maintain an appropriate K+/Na+ ratio in the cytoplasm, which depends on the operation of Na+/K+ transporters. The rice potassium transporter OsHAK1 promotes K+ uptake and the K+/Na+ ratio under both low and high potassium conditions, which is essential for maintaining potassium-mediated growth and salt tolerance. The rice shaker K+ channel OsAKT2 mediates K+ recirculation from shoots to roots to maintain Na+/K+ homeostasis and improve salt tolerance. Moreover, high-affinity K+ transporters such as HKTs also grant salinity tolerance to rice. Calcium (Ca2+) can regulate the perception, uptake, and transport of various ions through the SOS (salt overly sensitive) pathway, thereby coordinating Na+/K+ homeostasis in plants. The Na+/H+ antiporter SOS1 in the cell membrane is associated with Na+ extrusion via roots in a saline environment and confers salinity tolerance to rice. SOS2 and SOS3, encoding a protein kinase and Ca2+-binding protein, respectively, are required for salinity tolerance in rice because they perceive the change in Ca2+ in the cytosol under salinity and activate the signaling cascade."}, {"passage_id": "Introduction.p0004", "text": "Apart from potassium, few mineral nutrients have been studied for their roles in salt tolerance. Sulfur nutrients have been found to improve plant photosynthesis and growth under salt stress by increasing glutathione production and abscisic acid (ABA) accumulation. Nitrogen (N), an essential plant macronutrient, has been shown to improve salt tolerance through stimulation of antioxidation, osmotic adjustment, maintenance of ion balance, mitigation of ionic toxicity, and activation of numerous enzymes. However, the underlying molecular mechanisms of N-improved salt tolerance in plants are currently unclear."}, {"passage_id": "Introduction.p0005", "text": "Transcription factors (TFs) play essential roles in the transcriptional control of stress-associated genes and are thus of utmost importance for breeding stress-tolerant crops. MADS (MCM1, AG, DEFA, and SRF) family TFs control important growth and developmental processes such as seed germination and flowering time. MADS-box TFs are also involved in the response to various abiotic stresses. For example, OsMADS26 is a negative regulator of drought stress tolerance in rice. OsMADS57, in concert with OsTB1, mediates the transcription of OsWRKY94 to confer cold tolerance in rice. OsMADS25, OsMADS27, and OsMADS57 are involved in the response to nutrient deficiency in rice, and OsMADS25 improves rice salinity tolerance when overexpressed."}, {"passage_id": "Introduction.p0006", "text": "We previously reported the Arabidopsis MADS-box TF AtAGL16 as a negative regulator of salt and drought tolerance. To extend our work to rice, we have identified OsMADS27, which has the highest sequence similarity to AtAGL16. OsMADS27 is induced by nitrate (NO3–) and ABA and acts as a target gene of miR444 to control root development in a NO3–-dependent manner (; ). When overexpressed, OsMADS27 confers enhanced salt tolerance in transgenic seedlings. However, the molecular mechanism underlying OsMADS27-mediated salt tolerance remains unclear. Likewise, the relationship of OsMADS27-mediated salt tolerance to N nutrients has not been investigated in rice. In this study, we reveal the molecular mechanism of OsMADS27-mediated salt tolerance and the NO3– dependence of OsMADS27-mediated salt tolerance in rice, which can be exploited for the improvement of crop salinity tolerance."}], "Discussion": [{"passage_id": "Discuss.p0002", "text": "In addition to being an essential nutrient, NO3– acts as a signaling molecule involved in controlling multiple metabolic processes in plants. Importantly, nitrate is also a major factor affecting the salt tolerance of crops. NO3– application can promote the growth and yield of rice, wheat, canola, citrus, strawberry, pepper, allium, and other plants under salt stress. However, the intrinsic molecular mechanism of NO3–-mediated alleviation of salt stress has not been reported to date. In this study, we revealed that OsMADS27-mediated salt tolerance is nitrate dependent in rice. We demonstrated that the expression of OsMADS27 was specifically induced by NO3– but not by KCl, NH4Cl, NaCl, or ABA alone (Figure 1A and 1F). The responsiveness of OsMADS27 to nitrate is consistent with previous reports. Furthermore, we showed that NaCl- and ABA-induced expression of OsMADS27 was also dependent on nitrate, and nitrate plus NaCl or ABA synergistically enhanced OsMADS27 expression (Figure 1C and 1F). OsMADS27 protein level appeared to be positively correlated with OsMADS27 transcript level (Figure 1F and 1G). Likewise, the nuclear accumulation of OsMADS27 appeared to be correlated with its transcript level as well (Figure 2A, 2B, 2D, and 2G). OsMADS27 activates an array of stress tolerance-related genes, as revealed by RNA-seq analyses (Figure 4), by directly binding to their promoters, as demonstrated for OsHKT1.1 and OsSPL7 (Figure 5), thereby enhancing growth and grain yield under salt stress in rice (Figure 3 and Supplemental Figure 6). However, in the absence of NO3–, the expression of OsMADS27 was low, which was insufficient to confer salt tolerance in rice. A working model is proposed for nitrate-responsive OsMADS27-promoted salt tolerance (Figure 7). Our study revealed a novel mechanism of NO3–-dependent salt tolerance mediated by OsMADS27 that may be exploited for the improvement of rice salt tolerance and grain yield."}, {"passage_id": "Discuss.p0003", "text": "Mechanisms of OsMADS27-conferred salt tolerance"}, {"passage_id": "Discuss.p0004", "text": "TFs regulate the expression of various stress-related genes by binding with regulatory motifs in their promoters in response to stresses. Probably benefiting from the simultaneous coordination of the expression of salt-responsive genes (Figure 4), overexpression of the MADS-box TF OsMADS27 increased the transcript levels of regulators such as ethylene response factor OsWR2, salt stress response MYB transcription factor OsMPS, A-type response regulator OsRR2, and rice cyclin gene OsCycB1;3, resulting in significantly improved salt tolerance during the germination, seedling, and reproductive phases of rice (Figure 3, Supplemental Figures 3 and 6)."}, {"passage_id": "Discuss.p0005", "text": "Salt tolerance is highly dependent on intracellular ion homeostasis to maintain cell turgor and membrane potential. In our transcriptomic data, the expression of K+ transporters such as OsHKT1.1 and OsHKT2.3, the K+ channel OsKAT3, and the Ca2+ sensor OsCAM1.1, which positively regulates salt tolerance in rice, was significantly enhanced in OE plants compared with WT plants under salt stress (Figure 4C), a finding supported by reduced Na+ and increased K+ levels in the OE plants (Figure 3E and 3F). We found that OsMADS27 directly binds and transcriptionally activates OsHKT1.1, which encodes a membrane-localized high-affinity K+ transporter (Figure 5). Rice oshkt1.1 knockout mutants are salt sensitive, highlighting the function of OsHKT1.1 in Na+ retrieval from leaf blades. These results demonstrate that OsMADS27 positively regulates salt tolerance in rice by maintaining ion homeostasis."}, {"passage_id": "Discuss.p0006", "text": "Salinity leads to the accumulation of ROS in plants, and increased ROS production leads to oxidative burden, damaging cellular membranes as well as macromolecules. As a target of OsMADS27 (Figure 5), the heat shock transcription factor gene OsSPL7 plays an important role in maintaining ROS homeostasis in rice. The spl7 mutant lost regulation of nicotinamide adenine dinucleotide oxidase, resulting in greater accumulation of H2O2 in cells. Our RNA-seq results indicate that OsMADS27-overexpressing plants are likely to have improved resistance against oxidative stress (Figure 4C). The upregulation of a number of peroxidases (OsPRX29, OsPRX27, OsPRX74, OsGPX, and OsPRX132) in OE plants demonstrated that overexpression of OsMADS27 could ameliorate salt-generated oxidative stress."}, {"passage_id": "Discuss.p0007", "text": "The stress hormone ABA plays an important role in the response of plants to salt. The enrichment of genes involved in ABA synthesis, such as OsAAO2 and OsNCED1, and ABA-responsive genes, such as OsABI5 and OsRAB16, in the OE vs. WT comparison under salt stress (Figure 4C) implied that OsMADS27 might also be involved in ABA signaling. OsMADS27 controls NO3–-dependent root growth via the ABA pathway. The possible crosstalk between OsMADS27, ABA signaling, and salt stress tolerance requires further attention. Taken together, our results suggest that OsMADS27 mediates salt tolerance in rice mainly by balancing ion homeostasis, enhancing ROS scavenging ability, and regulating stress-responsive regulators and the ABA signaling pathway."}, {"passage_id": "Discuss.p0008", "text": "Surprisingly, OsMADS27, which had the highest sequence homology to Arabidopsis AtAGL16, has functionally diverged in a manner opposite to AtAGL16. AtAGL16 is a negative regulator of the stress response in Arabidopsis, whereas OsMADS27 is a positive regulator of salt tolerance in rice. It is currently unknown how these two genes functionally evolved and diverged in dicots versus monocots, but the study of this interesting phenomenon would be quite appealing to evolutionary biologists."}, {"passage_id": "Discuss.p0009", "text": "What controls the nitrate dependence of OsMADS27-mediated salt tolerance?"}, {"passage_id": "Discuss.p0010", "text": "Multiple members of the MADS-box TF family are involved in the regulation of NO3– responses. Arabidopsis nitrate regulated1 (AtANR1) is the first NO3– regulator found to be involved in the regulation of lateral root developmental plasticity in response to NO3–. The ANR1-like gene OsMADS25 is a positive regulator that controls the development of primary and lateral roots of rice by affecting NO3– accumulation. OsMADS27 is preferentially expressed in roots, and NO3– could significantly induce its expression. We also found that OsMADS27 specifically responded to NO3– rather than NH4+ (Figure 1A). The specific NO3– responsiveness of OsMADS27 suggests that a NO3–-responsive upstream regulator is likely to modulate OsMADS27. Recently, NO3– restriction was reported to increase the abundance of miR444, thereby inhibiting the expression of OsMADS27 and thus regulating rice root development. These results indicate that there are multiple ways for NO3– signaling to regulate OsMADS27 expression."}, {"passage_id": "Discuss.p0011", "text": "OsMADS27 is a positive regulator of grain yield"}, {"passage_id": "Discuss.p0012", "text": "N uptake and assimilation are closely related to crop yield. In addition to controlling salt tolerance in rice, OsMADS27 may also positively regulate grain yield by modulating N metabolism and utilization. In our transcriptomic data, a number of NO3– transporters were upregulated in OE compared with WT under salt stress conditions; these included the dual-affinity NO3– transporter OsNRT2.4, OsNAR2.1, which is required by some members of the NRT2 family for NO3– transport, OsNP5.16, a positive regulator of grain yield and tiller number, and the low-affinity NO3– transporter OsPTR2 (Figure 4C). The significant upregulation of genes encoding these N transporters and the helper protein OsNAR2.1 correlates with improved yield in transgenic plants under variable N conditions (Figure 6), suggesting that OsMADS27 is a positive regulator of rice grain yield."}, {"passage_id": "Discuss.p0013", "text": "In conclusion, OsMADS27 positively regulates salt tolerance in rice in a NO3–-dependent manner by controlling salt-responsive genes, balancing ion homeostasis, and enhancing ROS scavenging. OsMADS27 also acts as an important determinant of rice yield by modulating the expression of genes related to N uptake and assimilation. Hence, our study fills the gap in the molecular mechanism of NO3–-dependent salt tolerance and provides a promising candidate for the development of salt-tolerant crops."}], "Conclusion": []}}, {"pmcid": "PMC10030321", "title": "Genome assembly of the Brassicaceae diploid Orychophragmus violaceus reveals complex whole-genome duplication and evolution of dihydroxy fatty acid metabolism", "source_file": "PMC10030321.json", "source_url": "https://pmc.ncbi.nlm.nih.gov/articles/PMC10030321/", "included_counts": {"Abstract": 2, "Introduction": 4, "Discussion": 7}, "omitted_results_discussion": false, "sections": {"Abstract": [{"passage_id": "Abstract.p0001", "text": "Orychophragmus violaceus is a Brassicaceae species widely cultivated in China, particularly as a winter cover crop in northern China because of its low-temperature tolerance and low water demand. Recently, O. violaceus has also been cultivated as a potential industrial oilseed crop because of its abundant 24-carbon dihydroxy fatty acids (diOH-FAs), which contribute to superior high-temperature lubricant properties. In this study, we performed de novo assembly of the O. violaceus genome. Whole-genome synteny analysis of the genomes of its relatives demonstrated that O. violaceus is a diploid that has undergone an extra whole-genome duplication (WGD) after the Brassicaceae-specific α-WGD event, with a basic chromosome number of x = 12. Formation of diOH-FAs is hypothesized to have occurred after the WGD event. Based on the genome and the transcriptome data from multiple stages of seed development, we predicted that OvDGAT1-1 and OvDGAT1-2 are candidate genes for the regulation of diOH-FA storage in O. violaceus seeds. These results may greatly facilitate the development of heat-tolerant and eco-friendly plant-based lubricants using O. violaceus seed oil and improve our understanding of the genomic evolution of Brassicaceae."}, {"passage_id": "Abstract.p0002", "text": "This study reports De novo sequencing and assembly of the Orychophragmus violaceus genome. The high-quality chromosome-level genome reveals chromosomal rearrangement after a WGD event. Together with the construction of a seed-development transcriptome, candidate genes for dihydroxy fatty acid biosynthesis in O. violaceus seeds have been identified. This study also proposes a model for how these genes evolved during and after a WGD unique to the Orychophragmus branch of the crucifer family."}], "Introduction": [{"passage_id": "Introduction.p0002", "text": "Orychophragmus violaceus is an ornamental Brassicaceae species with small purple flowers that bloom in the early spring. It has the common name of Chinese violet cress. This plant typically grows in the wild in East Asia, particularly Korea and northern China, where it is known as “er-yue-lan”. It is also cultivated as a leafy vegetable (“zhuge”) in China and as a cover crop in northern China because of its low-temperature tolerance and high water use efficiency. O. violaceus has emerged as a potential industrial oilseed crop because its seed oil contains abundant dihydroxy fatty acids (diOH-FAs) (nebraskanic acid, 7,18-OH-24:1Δ15; wuhanic acid, 7,18-OH-24:2Δ15,21) in the form of polyestolides, which can contribute to superior lubrication properties. These fatty acids and their special storage form (triacylglycerol [TAG] polyestolides) are unique in the plant kingdom and give O. violaceus oil even better high-temperature lubricant properties than castor oil, a valuable plant-based lubricant. However, the specific metabolism of C24 diOH-FAs (fatty acid chains with 24 carbons) and TAG polyestolides in O. violaceus is largely unknown."}, {"passage_id": "Introduction.p0003", "text": "Our previous study demonstrated that fatty acid desaturase 2 (FAD2) and fatty acid elongase 1 (FAE1) in O. violaceus have developed specific enzymatic activities critical for diOH-FA biosynthesis. Rather than catalyzing fatty acid desaturation, the enzyme encoded by OvFAD2-2 functions as a fatty acid hydroxylase to generate the terminal hydroxyl group of nebraskanic and wuhanic acids. The functional variants encoded by OvFAE1-1 produce the carboxyl-terminal hydroxyl group of diOH-FA through a “discontinuous elongation” process. The enzymatic origin of TAG polyestolides, which account for nearly all fatty acid storage in O. violaceus seeds, remains unclear. These molecules consist of high-molecular-weight TAG species containing a diOH-FA at the sn-3 or sn-1 position and an additional diOH-FA linked to the 18-OH of esterified nebraskanic and wuhanic acids. It is presumed that polyestolides are formed by an acyltransferase, such as diacylglycerol acyltransferase (DGAT), that is assumed to have novel activity. Genomics and seed transcriptomics data for O. violaceus are expected to enhance our understanding of the evolution and the “missing” steps in the pathways of diOH-FA-containing polyestolide biosynthesis in Brassicaceae."}, {"passage_id": "Introduction.p0004", "text": "Previous studies have reported the unusual chromosome pairing behavior during meiosis in O. violaceus. Cytological observation has clearly revealed that O. violaceus has a total of 24 chromosomes. However, it remains controversial whether the 24 chromosomes are derived from a tetraploid with a basic chromosome number of six or an octoploid with a basic chromosome number of three (; ). The phylogenetic position of O. violaceus remains disputable, and the main concern involves the relationship of the Orychophragmus genus to other branches such as the Conringia genus and the rest of the genera in different Cruciferae lineages. A previous study using mitochondrial NAD7 revealed that the Orychophragmus genus is a branch in Brassicaceae that is paralleled by Isatideae, Sisymbrieae, Iberideae, Arabideae, Calepineae, Thalspideae, Alysseae, and Eutrema to form lineage II of Cruciferae. A comprehensive plastome-based genus-level phylogenetic study of a collection of Brassicaceae species updated the disparity among evolutionary lineages and suggested defined terms for genera and tribes that were improperly assigned previously. Apparently, dissection of genome information can greatly help to resolve these controversies."}, {"passage_id": "Introduction.p0005", "text": "In this study, we performed de novo assembly of the O. violaceus genome at the chromosome level. Based on the high-quality genome, we confirmed that the basic chromosome number of O. violaceus is x = 12. An analysis of its genome structural characteristics indicated that O. violaceus did not undergo the Brassicaceae whole-genome triplication (WGT) but experienced a unique whole-genome duplication (WGD) event, consistent with the results of previous studies. The present O. violaceus genome can be considered a diploid with an evolutionary track of polyploidy. Some ancient chromosomes have been well retained, whereas other chromosomes have experienced fragmentation and rearrangement, thus explaining the formation of the multivalent configuration in regenerated haploids from pollen mother cells of O. violaceus. This genomic information, together with a transcriptome of the developing seed, also provides important information about the evolution of genes associated with diOH-FA biosynthesis, including OvFAE1-1. Our study also reveals that variation in the transcript structure of diacylgylcerol acyltransferase 1 (DGAT1) may be associated with TAG polyestolide biosynthesis. The findings of the present study may improve our understanding of Brassicaceae evolution and variant fatty acid and TAG biosynthesis and contribute to the genetic improvement of O. violaceus as a new and high-value industrial oilseed crop."}], "Discussion": [{"passage_id": "Discuss.p0002", "text": "In this study, we performed de novo assembly of the O. violaceus genome and characterized its evolutionary position and the key candidate genes responsible for diOH-FA biosynthesis in seeds. The results lay a solid foundation for genetic improvement of O. violaceus for use as a high-value industrial oil crop in the future."}, {"passage_id": "Discuss.p0003", "text": "O. violaceus is a new oilseed crop whose genome has undergone an Orychophragmus-specific WGD event"}, {"passage_id": "Discuss.p0004", "text": "Previous studies have demonstrated that O. violaceus is a close relative of the Brassica species. Based on the CCP technique, proposed that O. violaceus has experienced a duplication event rather than a triplication event because one copy of the ancestral GBs from A. thaliana corresponds to two GBs in O. violaceus. In the present study, we provided direct evidence for this WGD event in O. violaceus, which is independent of the Brassica-specific WGT proposed previously. The genome information revealed that O. violaceus is a diploid (2n = 24) evolving from an ancient tetraploid. The haploid genome of this ancestor contained 14 pseudochromosomes; the karyotype of five was retained, and the remaining nine underwent fragmentation and rearrangement, eventually leading to 12 chromosomes in the O. violaceus haploid genome (Supplemental Figure 5). The genome block homology also explains the previous observation of multivalent synapsis conformation during meiosis. Our genome structure comparison suggested that O. violaceus may have evolved from one or two very similar parental diploid species close to I. indigotica. The present diploid genome is apparently stable because the pollen fertility is normal (data not shown). Considering the wide distribution of O. violaceus in mainland China, this species can adapt well to different environmental niches, again demonstrating the stability and plasticity of its genome."}, {"passage_id": "Discuss.p0005", "text": "O. violaceus gene neo-functionalization is associated with diOH-FA synthesis"}, {"passage_id": "Discuss.p0006", "text": "Polyploidization in higher plants is frequently associated with adaptation and diversification. The seed oil of O. violaceus has unique diOH-FAs, and to date, only several related genes have been identified, some of which are dual-function proteins. Based on genome assembly and comparison, we proposed a hypothesis regarding the evolution of the OvFAE1 gene family (Figure 5D). By sequence alignment, we found that OvFAE1-2 was closer to IiFAE1, although OvFAE1-1 has been identified previously to be functional for fatty acid discontinuous elongation. The third gene, OvFAE1-3, was far not only from IiFAE1 but also from the other two OvFAE1 genes. We therefore hypothesized that it may have come from local fragmental insertion (Figure 5D). These results indicated that a duplicated ancestral pair of FAE1 genes was generated by WGD, followed by mutation accumulation and diversification. Because only one copy of FAE1 is present in I. indigotica, and no diOH-FA was found in its seed oil, the new function of OvFAE1-1 for diOH-FA biosynthesis was presumably acquired after the WGD event."}, {"passage_id": "Discuss.p0007", "text": "Based on the seed transcriptome and weighted gene co-expression network analysis (WGCNA), we identified two modules highly relevant to diOH-FA synthesis (Supplemental Figure 9). Several genes were identified as candidates, including the previously known FAD2 and FAE1 genes and the DGAT1 gene (Figure 2E). Based on the phylogeny and protein sequence comparison with B. napus genes and our previous studies, we can speculate that the biosynthetic genes of diOH-FAs and polyestolides may not be new genes but may instead be derived from structural changes in the domains of proteins normally involved in fatty acid metabolism. Previously, we found that the variant forms of FAE1 (OvFAE1-1) and FAD2 (OvFAD2-2) are required for the biosynthesis of hydroxyl groups in the diOH-FAs. Given the sequence variation and perhaps also alternative splicing variants, OvDGAT1 is a promising candidate for the production of polyestolides, but direct experimental evidence is still lacking. Based on these results, we simulated the pathways of diOH-FA biosynthesis and storage in O. violaceus seeds (Figure 6 and Supplemental Figure 15): OvFAD2-2 catalyzes the hydroxylation of oleoyl-phosphatidylcholine (PC) into ricinoleyl-PC; OvLCAT-PLA hydrolyses ricinoleyl-PC and generates ricinoleyl-CoA; and OvFAE1-1/1-2 catalyzes the formation of 7,18-OH-24:1Δ15-CoA through discontinuous chain elongation (Figure 6). After OvGPAT1- and OvLPAT2-catalyzed acylation, the resulting DAG is acylated at the sn-3 position by OvDGAT1-1 to form a TAG species with the diOH-FA (Supplemental Figure 15, first compound). The acyl-transferring activity of OvDGAT1 adds one or more diOH-FAs to the hydroxyl group of the TAG-esterified fatty acids to form polyestolides (Supplemental Figure 15)."}, {"passage_id": "Discuss.p0008", "text": "The reference genome presented here provides not only an important resource for future use of O. violaceus as a new industrial oil crop but also a better understanding of the cytological behaviors of chromosomes during meiosis at the genome level. The unique phylogenetic position of O. violaceus relative to other Brassicaceae species provides a new perspective for understanding the appearance of diOH-FAs during evolution. Because these special fatty acids are not present in seed oils from A. thaliana, Brassica spp., or I. indigotica (Supplemental Figure 16), it remains unclear where and when the genes responsible for diOH-FAs arose during evolution. The genomic data reveal that only one copy of the FAD2 gene is present in I. indigotica, but multiple copies are present in the O. violaceus genome, indicating the possibility of neo-functionalization by mutation. Finally, we propose a most promising candidate gene, OvDGAT1-1, which can contribute to the accumulation of up to 40% of diOH-FAs in O. violaceus seed oil to enable the utilization of O. violaceus in the plant-based lubricant industry."}], "Conclusion": []}}, {"pmcid": "PMC10030324", "title": "An activated form of NB-ARC protein RLS1 functions with cysteine-rich receptor-like protein RMC to trigger cell death in rice", "source_file": "PMC10030324.json", "source_url": "https://pmc.ncbi.nlm.nih.gov/articles/PMC10030324/", "included_counts": {"Abstract": 2, "Introduction": 6, "Discussion": 6}, "omitted_results_discussion": false, "sections": {"Abstract": [{"passage_id": "Abstract.p0001", "text": "A key event that follows pathogen recognition by a resistance (R) protein containing an NB-ARC (nucleotide-binding adaptor shared by Apaf-1, R proteins, and Ced-4) domain is hypersensitive response (HR)-type cell death accompanied by accumulation of reactive oxygen species and nitric oxide. However, the integral mechanisms that underlie this process remain relatively opaque. Here, we show that a gain-of-function mutation in the NB-ARC protein RLS1 (Rapid Leaf Senescence 1) triggers high-light-dependent HR-like cell death in rice. The RLS1-mediated defense response is largely independent of salicylic acid accumulation, NPR1 (Nonexpressor of Pathogenesis-Related Gene 1) activity, and RAR1 (Required for Mla12 Resistance 1) function. A screen for suppressors of RLS1 activation identified RMC (Root Meander Curling) as essential for the RLS1-activated defense response. RMC encodes a cysteine-rich receptor-like secreted protein (CRRSP) and functions as an RLS1-binding partner. Intriguingly, their co-expression resulted in a change in the pattern of subcellular localization and was sufficient to trigger cell death accompanied by a decrease in the activity of the antioxidant enzyme APX1. Collectively, our findings reveal an NB-ARC–CRRSP signaling module that modulates oxidative state, the cell death process, and associated immunity responses in rice."}, {"passage_id": "Abstract.p0002", "text": "A gain-of-function mutation in the NB-ARC protein RLS1 of the rice mutant noe2 leads to spontaneous oxidative burst and cell death. The activated defense response in noe2 is largely independent of salicylic acid, NPR1, or RAR1, but it is suppressed by loss of function of the cysteine-rich receptor-like secreted protein RMC. RMC interacts with activated RLS1 and facilitates their aggregation in the plasma membrane, then forms a positive feedback loop with ROS/RNS levels to amplify immune responses."}], "Introduction": [{"passage_id": "Introduction.p0002", "text": "Plant immunity is largely underpinned by a molecular surveillance system that detects the presence of potential pathogens. In this context, perception of diverse pathogen-associated molecular patterns (PAMPs) by plasma membrane (PM)-resident pattern recognition receptors results in PAMP-triggered immunity (PTI). To suppress PTI and colonize the host, phytopathogens have evolved a plethora of effector proteins that are typically delivered to the inside of plant cells, disabling defense responses and reprograming plant physiology to aid pathogenesis. In response, plants have evolved a repertoire of resistance (R) proteins to detect either directly or, routinely, indirectly the presence of pathogen effector proteins, resulting in the deployment of a phalanx of plant defense responses. This effector-triggered immunity (ETI) provides effective protection against attempted microbial ingress."}, {"passage_id": "Introduction.p0003", "text": "A common feature of major R proteins is the presence of both a nucleotide-binding site (NBS) and leucine-rich repeat (LRR) domains. The NB domain is also a conserved region shared by Apaf-1 and Ced-4 proteins, which play critical roles in the regulation of programmed cell death in animal cells. In this context, this motif is known as the NB-ARC (nucleotide-binding, Apaf-1, R proteins, and Ced-4) or NOD (nucleotide oligomerization domain). The universal prevalence of such a domain implies an evolutionary conservation of cell death effectors between animals and plants. In general, the function of R proteins is tightly controlled by a series of regulators that maintain an auto-inhibited state in the absence of pathogens. Nevertheless, some reports have shown that mutations in NB-ARC proteins are sufficient to result in pathogen-independent defense activation. For example, gain-of-function mutations in SSI4 (Suppressor of npr1-5-Based SA Insensitivity 4), SNC1 (Suppressor of npr1-1, Constitutive 1), SLH1 (Sensitive to Low Humidity 1), UNI (U-NI, like sea urchin), and NLS1 (Necrotic Leaf Sheath 1) all lead to constitutive defense responses in plants."}, {"passage_id": "Introduction.p0004", "text": "R protein-triggered defense responses are closely associated with the development of the hypersensitive response (HR), a localized programmed execution of plant cells at the site of attempted microbial infection, which is thought to help restrict pathogen growth. This pathogen-triggered cell death process in plants has common regulatory and mechanistic features with apoptosis in animals. One of the earliest events in the pathogen–host interaction is the rapid production of reactive oxygen species (ROS), including singlet oxygen (1O2), superoxide radical (O2−), hydrogen peroxide (H2O2), and so on, termed the oxidative burst, which is also important for cell death development. In parallel to ROS production is the pathogen-triggered nitrosative burst, resulting in the generation of nitric oxide (NO) and associated reactive nitrogen species (RNS). NO bioactivity is principally mediated by S-nitrosylation, the addition of a NO moiety to a rare, highly reactive cysteine thiol to form an S-nitrosothiol (SNO). Significantly, NO function is thought to be closely interconnected with that of ROS during cell death development; the reaction of NO with superoxide anion (O2−) results in the formation of peroxynitrite (ONOO−) in plants, which may play a role in protein or lipid nitration and DNA damage. Many abiotic conditions, including high light (HL) and salt stress, have also been linked with the initiation of cell death. HL levels can create an overflow of electrons from the photosynthetic electron transport system in chloroplasts, which results in the generation of ROS. Thus, HL levels have been associated with cell death formation, especially in the absence of key antioxidant mechanisms. Collectively, the accumulating data suggest significant crosstalk between HL, RNS, and ROS during cell death generation, although the molecular basis of these interactions is still not well understood."}, {"passage_id": "Introduction.p0005", "text": "Receptor-like protein kinases, which contain extracellular receptor and cytoplasmic catalytic kinase domains, and receptor-like proteins are associated with both PTI and ETI. These proteins are classified into subfamilies according to the composition of their extracellular domains. Cysteine-rich receptor-like kinases (CRKs), also termed Domain of Unknown Function 26 (DUF26; Gnk2 or stress-antifungal domain; PF01657) proteins, possess an extracellular domain harboring a conserved cysteine motif (C-8X-C-2X-C) and form a subfamily of receptor-like protein kinases with more than 40 members in Arabidopsis and rice. CRK expression is induced by ozone (O3), salicylic acid (SA), or PAMPs. Overexpression of the CRK members CRK5, CRK13, CRK28, or CRK36 in Arabidopsis led to enhanced resistance to Pseudomonas syringae pv. tomato (Pst) DC3000 and HR-like cell death. Recently, CRK2 has been shown to associate with and activate RESPIRATORY BURST OXIDASE HOMOLOG D to trigger MAMP-induced ROS production, revealing a mechanism by which a CRK regulates the oxidative burst."}, {"passage_id": "Introduction.p0006", "text": "With homology to the extracellular domain of CRKs, cysteine-rich receptor-like secreted proteins (CRRSPs), which lack the kinase domain, contain one or two DUF26 motifs. One of the best characterized CRRSPs is Gnk2 from Gingko biloba with a single DUF26 (sdCRRSP), which acts as a mannose binding lectin in vitro with antifungal activity. The other two are AFP1 and AFP2, which show antifungal activity in maize that can be blocked by the repetitive effector Rsp3 of the biotrophic fungus Ustilago maydis. Bioinformatics analysis has established that rice, as well as the Brassicaceae, displays lineage-specific evolution with a large number of CRRSPs with two DUF26 motifs (ddCRRSPs) and the absence of sdCRRSPs. Although insights into the function of CRKs are emerging, a potential role for CRRSPs in plant immunity and associated HR cell death remains to be established."}, {"passage_id": "Introduction.p0007", "text": "Here, we identified and characterized the (S)NO over-accumulation mutant noe2 (nitric oxide excess2). NOE2 encodes the NB-ARC protein Rapid Leaf Senescence 1 (RLS1), which in its activated form works with a ddCRRSP, resulting in rapid activation of HR-like cell death in rice, accompanied by suppression of the antioxidant system."}], "Discussion": [{"passage_id": "Discuss.p0002", "text": "The majority of plant R proteins belong to the NLR family, which shares a common architecture with animal NLRs, containing NBS and LRR domains. The LRR domain is implicated in auto-inhibition and/or effector detection, and truncated NLRs without LRRs, such as TIR-NBS protein CHS1 and TIR-NBS2, were also found to be required for activated defense responses in Arabidopsis. Structural analysis of RLS1 indicated that it had conserved NB-ARC and CC domains but with an ARM domain instead of an LRR domain at its C terminus. Therefore, RLS1 belongs to a special subfamily of plant NB-ARC proteins that differ from typical NLRs. Our data indicated that RLS1 participates in HR-like cell death and also disease resistance, revealing an immune function for this CC-NBS protein that lacks an LRR."}, {"passage_id": "Discuss.p0003", "text": "ARM-motif containing proteins form a large family with diverse and fundamental functions in many eukaryotes. Functional analyses of plant ARM-motif-containing proteins in immunity have mainly focused on reports of plant unique U-box (PUB) E3 ubiquitin ligases in Arabidopsis, rice, and N. benthamiana. Besides PUB proteins, the rice blast resistance gene Ptr, which contains four ARM repeats, is reported to be required for broad-spectrum disease resistance. Here, RLS1 represents another new example of ARM-containing proteins that are associated with both cell death and disease resistance. Furthermore, the HR-like cell death activated by RLS1-D is independent of NPR1 and RAR1, as the absence of NPR1 and RAR1 function in the noe2 npr1 and noe2 rar1 double mutants did not compromise noe2-mediated HR-like cell death and disease resistance (Figure 3F–3J). Thus, it appears that RLS1-D may function through a previously uncharacterized disease resistance signaling pathway."}, {"passage_id": "Discuss.p0004", "text": "NLR activation of ETI signaling results in massive cellular reprogramming to execute a plethora of defense responses, which are also under tight regulatory control. A number of proteins have been proposed to interact with NLRs, including Heat Shock Protein 90 kDa (HSP90), RAR1, Suppressor of the G2 allele of skp1 (SGT1), Suppressor of rps4-RLD1 (SRFR1), and Compromised recognition of TCV1 (CRT1), which are thought to be components of a complex required for NLR folding, accumulation, and regulation. Recently, it has been suggested that interactions between NLRs and their specific guardee or decoy proteins are required for inhibition of HR. In this context, disruption of the NLR guardee protein RIN4 can induce inappropriate HR activation. Two key enzymes integral to lignin biosynthesis have also been shown to suppress HR formation by forming a complex with the NLR Rp1. In contrast to these findings, our data establish that an NB-ARC–CRRSP couple is involved in the development of HR-like cell death and associated disease resistance. In this context, the CRRSP (RMC) may function as a helper of the NLR (RLS1)."}, {"passage_id": "Discuss.p0005", "text": "It is well established that light has a significant impact on plant immunity; however, the detailed molecular mechanisms remain elusive. Our findings showed that activated RLS1 triggered HR-like cell death in an HL-dependent manner, as no lesions were found in shielded leaf areas and in seedlings grown under LL (Figure 1D–1F). RMC is rapidly induced at the transcriptional level within minutes by HL treatment. Moreover, it has significantly higher expression in leaf areas with lesions (Figure 5B). Recent findings have revealed the important role of JA in the acclimation of plants to a combination of HL and heat stress. Notably, we revealed that the JA content of noe2 plants (26.07 ± 1.37 ng/g fresh weight) was about 2.3 times that of the wild-type control (11.35 ± 0.26 ng/g fresh weight). As RMC was reported to be induced by JA and subsequently integral to JA signaling, JA may have a potential role in noe2-triggered cell death. Although further studies are required to clarify whether HL regulates the expression of RMC through JA signaling in leaves, our findings imply that RMC may function as a link between HL and plant immunity associated with NB-ARC protein-related activity."}, {"passage_id": "Discuss.p0006", "text": "In addition to induction by HL, RMC is also rapidly induced by H2O2 (Figure 5C and 5D), which may indicate the existence of a positive feedback loop (Figure 7D). That is, the accumulation of ROS and RNS resulting from HL and the associated downregulation of antioxidant systems may further induce RMC expression, resulting in amplification of cell death and associated immune responses (Supplemental Figure 7). Although our data support the point that the RLS1-D–RMC couple suppresses APX1 enzyme activity (Figure 7B and 7C), the mechanism(s) associated with the downregulation of expression of other antioxidant enzymes remains to be established."}, {"passage_id": "Discuss.p0007", "text": "Collectively, our findings identify an NB-ARC signaling partner and reveal an NB-ARC–CRRSP signaling module that modulates the development of HR-like cell death and associated disease resistance by suppression of some antioxidant defense systems (Figure 7D). It will now be important to establish whether RLS1 function is specific for RMC or whether this CRRSP is required by other NB-ARC containing proteins, i.e., NLRs for HR development and the establishment of disease resistance. Furthermore, are there other NB-ARC/NLR–CRRSP modules associated with immunity and cell death development or perhaps other areas of plant biology? Determining whether NB-ARC–CRRSP signaling modules are restricted to rice or whether they function across plant species will also be informative. Finally, insights into the molecular mechanisms underpinning the activity of NB-ARC/NLR–CRRSP function may provide new strategies for plant breeding or rational crop design."}], "Conclusion": []}}, {"pmcid": "PMC10030365", "title": "ABA signaling prevents phosphodegradation of the SR45 splicing factor to alleviate inhibition of early seedling development in Arabidopsis", "source_file": "PMC10030365.json", "source_url": "https://pmc.ncbi.nlm.nih.gov/articles/PMC10030365/", "included_counts": {"Abstract": 2, "Introduction": 7, "Discussion": 6}, "omitted_results_discussion": false, "sections": {"Abstract": [{"passage_id": "Abstract.p0001", "text": "Serine/arginine-rich (SR) proteins are conserved splicing regulators that play important roles in plant stress responses, namely those mediated by the abscisic acid (ABA) hormone. The Arabidopsis thaliana SR-like protein SR45 is a described negative regulator of the ABA pathway during early seedling development. How the inhibition of growth by ABA signaling is counteracted to maintain plant development under stress conditions remains largely unknown. Here, we show that SR45 overexpression reduces Arabidopsis sensitivity to ABA during early seedling development. Biochemical and confocal microscopy analyses of transgenic plants expressing fluorescently tagged SR45 revealed that exposure to ABA dephosphorylates the protein at multiple amino acid residues and leads to its accumulation, due to SR45 stabilization via reduced ubiquitination and proteasomal degradation. Using phosphomutant and phosphomimetic transgenic Arabidopsis lines, we demonstrate the functional relevance of ABA-mediated dephosphorylation of a single SR45 residue, T264, in antagonizing SR45 ubiquitination and degradation to promote its function as a repressor of seedling ABA sensitivity. Our results reveal a mechanism that negatively autoregulates ABA signaling and allows early plant growth under stress via posttranslational control of the SR45 splicing factor."}, {"passage_id": "Abstract.p0002", "text": "Overexpression of the SR45 splicing factor, a negative regulator of the ABA stress signaling pathway, reduces plant sensitivity to the phytohormone. Exposure to ABA dephosphorylates SR45, leading to stabilization of the protein through reduced ubiquitination and proteasomal degradation. Our study reveals an autoregulatory mechanism for the alleviation of ABA-mediated inhibition of early plant growth under stress conditions."}], "Introduction": [{"passage_id": "Introduction.p0002", "text": "Serine/arginine-rich (SR) proteins are members of a highly conserved family of RNA-binding factors that play important roles in mRNA splicing. These accessory spliceosomal proteins bind to cis-regulatory sequences in the precursor-mRNA, promoting early spliceosome assembly and influencing splice site selection. SR proteins are thus crucial for alternative splicing, a posttranscriptional mechanism that generates multiple transcripts from the same gene and has key biological relevance in eukaryotes, namely in developmental programs and stress response. Structurally, SR proteins present one or two N-terminal RNA recognition motifs, responsible for binding transcripts, and an arginine/serine-rich (RS) protein–protein interaction domain at the C terminus that recruits core spliceosome components to splice sites. The RS domain is subjected to extensive reversible phosphorylation (reviewed in), which, in animal systems, is known to be required for spliceosome assembly and has also been linked to mRNA export from the nucleus or to switching functions from splicing activator to repressor. In plant systems, SR proteins are increasingly implicated in abiotic stress responses mediated by the abscisic acid (ABA) hormone."}, {"passage_id": "Introduction.p0003", "text": "The phytohormone ABA coordinates several developmental processes, such as seed dormancy, embryo maturation, seedling growth, and greening, but it is also pivotal in the response to environmental challenges. Sensing of osmotic or oxidative stress by plant cells leads to a massive increase in the levels of ABA, which is recognized by the PYR/PYL/RCAR (PYRABACTIN RESISTANCE/PYRABACTIN RESISTANCE-LIKE/REGULATORY COMPONENT OF ABA RECEPTORS) intracellular soluble receptors. Hormone–receptor binding facilitates the formation of a protein complex with PP2C (PROTEIN PHOSPHATASE 2C) phosphatases, preventing the latter from inhibiting core ABA signaling protein kinases named SnRK2s (SUCROSE NON-FERMENTING 1-RELATED PROTEIN KINASE 2). In the absence of PP2Cs, SnRK2s are activated by phosphorylation via the B-Raf-like protein MAPKKKs and can then phosphorylate specific transcription factors, such as bZIPs (BASIC LEUCINE ZIPPER), to induce the expression of stress-responsive genes (reviewed in)."}, {"passage_id": "Introduction.p0004", "text": "Phosphorylation-triggered protein degradation is an important strategy common to animal and plant systems (reviewed in). In plants, it is crucial for the regulation not only of light signaling but also of several important players in the ABA pathway. The ubiquitin–proteasome system is a highly regulated mechanism for the control of protein levels in eukaryotic cells that targets for degradation proteins covalently linked to the polypeptide ubiquitin. For a protein to be recognized by the 26S proteasome, a chain of at least four ubiquitin monomers is needed, which is delivered to the substrate by an ATP-dependent enzymatic E1–E2–E3 conjugation cascade (reviewed in). E3 ubiquitin ligases are the most numerous and diverse of the three groups of enzymes, being responsible for substrate recognition and specificity. Substrate phosphorylation is one of the signals recognized by some types of E3 ubiquitin ligase complexes (reviewed in)."}, {"passage_id": "Introduction.p0005", "text": "The most studied Arabidopsis thaliana SR-related protein is SR45, a bona fide splicing factor that plays an established role in ABA responses. Having been classified as a canonical SR protein for many years, SR45 is currently considered an SR-like protein owing to its two RS domains that flank a single RNA recognition motif. The only SR45 loss-of-function mutant described to date, sr45-1, exhibits a variety of developmental phenotypes, including reduced plant size, late and bushy inflorescences, and delayed root growth, as well as abnormal leaf and flower morphology. Moreover, sr45-1 mutant seedlings are hypersensitive to ABA and glucose as well as high salinity. Seven different splice variants of the A. thaliana SR45 gene have been annotated, but only two have been characterized, SR45.1 and SR45.2, which, despite exhibiting very similar expression patterns, fulfill different functions. Although both variants are able to rescue the mutant’s glucose hypersensitivity, SR45.2 rescues the root growth defect, whereas SR45.1 rescues the flower, salt, and (partially) ABA phenotypes."}, {"passage_id": "Introduction.p0006", "text": "Interestingly, the 4262 RNAs reported by to bind SR45 include transcripts encoding 30% of all ABA signaling genes. Furthermore, in addition to interacting with other splicing factors, including U1-70K, U2AF, three different U5 snRNP components, and several SR proteins, SR45 has been found to interact with two proteins involved in ABA responses: SKIP (SNW/SKI-INTERACTING PROTEIN), a putative transcription factor conferring plant salt tolerance, and SUA (SUPPRESSOR OF ABI3-5) , which controls alternative splicing of ABA-INSENSITIVE 3 (ABI3)."}, {"passage_id": "Introduction.p0007", "text": "Several reports of phosphorylation at specific SR45 residues in different plant tissues and stress conditions have been published, with an early study showing that a LAMMER-type protein kinase, AFC2, can interact with and phosphorylate SR45 in vitro. Moreover, reported the relevance of phosphorylation of a single SR45 amino acid residue, T218, for both the regulation of flower development and the alternative splicing of a direct mRNA target. On the other hand, a phosphoproteomics study found evidence for ABA-induced dephosphorylation of SR45 at a different residue, T264. Given that SR45 transcript and splicing levels are reportedly unchanged by ABA treatment, these data strongly suggest that SR45 is regulated by ABA at the posttranslational level."}, {"passage_id": "Introduction.p0008", "text": "How SR45 is posttranslationally regulated by ABA and related stresses remains largely unknown. Here we report that the A. thaliana SR45 protein accumulates and is dephosphorylated at several residues in response to ABA. We find that ABA-mediated dephosphorylation of the protein reduces its ubiquitination and targeting for proteasomal degradation, thus leading to SR45 stabilization under ABA conditions. Our results also demonstrate that the T264 residue of SR45 is sufficient to influence phosphorylation-dependent proteasomal degradation of the protein and thereby its function as a negative regulator of the ABA pathway, allowing some degree of plant growth and development under stress."}], "Discussion": [{"passage_id": "Discuss.p0002", "text": "One important function of the ABA phytohormone is to arrest early seedling growth in challenging environments in order to mount a stress response and ensure survival. How plants negatively regulate the ABA pathway to maintain some degree of growth and development under stress is largely unclear. Here we show that overexpression of the Arabidopsis SR45 gene causes reduced plant sensitivity to ABA during early development. Whereas observed complete rescue of the partially ABA-dependent sr45-1 glucose phenotype upon overexpression of either the SR45.1 or the SR45.2 splice variant, found that overexpression of the SR45.1 splice variant partially reverts sr45-1 ABA hypersensitivity during early seedling development. Neither study identified an ABA-hyposensitive phenotype upon SR45 overexpression, perhaps because individual SR45 splice variants were tested independently instead of the genomic fragment. Seven SR45 transcripts are currently annotated, and at least SR45.1 and SR45.2 are known to fulfill different biological roles, rendering it likely that a combination of SR45 splice forms is required for the protein’s role as a negative regulator of the ABA pathway. Alternatively, the ability to reduce ABA sensitivity could arise from the use of different promoters to drive the SR45 transgene. The genomic construct is dr
