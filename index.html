mcid": "PMC10035421", "title": "RNA sequencing-based exploration of the effects of far-red light on microRNAs involved in the shade-avoidance response of D. officinale", "source_file": "PMC10035421.json", "source_url": "https://pmc.ncbi.nlm.nih.gov/articles/PMC10035421/", "included_counts": {"Abstract": 1, "Introduction": 5, "Discussion": 17, "Conclusion": 1}, "omitted_results_discussion": false, "sections": {"Abstract": [{"passage_id": "Abstract.p0001", "text": "Dendrobium officinale (D. officinale) has remarkable medicinal functions and high economic value. The shade-avoidance response to far-red light importantly affects the D. officinale productivity. However, the regulatory mechanism of miRNAs involved in the far-red light-avoidance response is unknown. Previous studies have found that, in D. officinale, 730 nm (far-red) light can promote the accumulation of plant metabolites, increase leaf area, and accelerate stem elongation. Here, the effects of far-red light on D. officinale were analysed via RNA-seq. KEGG analysis of miRNA target genes revealed various far-red light response pathways, among which the following played central roles: the one-carbon pool by folate; ascorbate and aldarate; cutin, suberine and wax biosynthesis; and sulfur metabolism. Cytoscape analysis of DE miRNA targets showed that novel_miR_484 and novel_miR_36 were most likely involved in the effects of far-red light on the D. officinale shade avoidance. Content verification revealed that far-red light promotes the accumulation of one-carbon compounds and ascorbic acid. Combined with qPCR validation results, the results showed that miR395b, novel_miR_36, novel_miR_159, novel_miR_178, novel_miR_405, and novel_miR_435 may participate in the far-red light signalling network through target genes, regulating the D. officinale shade avoidance. These findings provide new ideas for the efficient production of D. officinale."}], "Introduction": [{"passage_id": "Introduction.p0002", "text": "Dendrobium officinale Kimura et Migo (D. officinale) is an herbal medicinal plant species of the Orchidaceae family. Modern pharmacological studies have shown that the main functional metabolites of this species include polysaccharides, flavonoids, bibenzyl and alkaloids. D. officinale has substantial medicinal functions and high economic value, and global demand is increasing annually. As such, researchers have used different methods to increase the yield and content of the medicinal components of D. officinale, and light regulation is one of the important methods."}, {"passage_id": "Introduction.p0003", "text": "Seven hundred-thirty–nanometre far-red light has a shade-avoidance effect on plants. The shade-avoidance response of most plants is manifested through a series of unique morphological changes and characteristics. For example, leaf area increases, plant height increases, photosynthetic physiological characteristics change, and dry matter accumulation in the stems increases. The plant shade-avoidance response can also regulate the growth of plants, resulting in earlier flowering, shorter vegetative growth time, and faster reproductive growth. In chrysanthemum (Dendranthema morifolium (Ramat.) Tzvel.), leaf chlorophyll fluorescence parameters (i.e., Fv/Fm and qP) showed a trend of first increasing and then decreasing with increasing red:far-red (R:FR)."}, {"passage_id": "Introduction.p0004", "text": "Important progress has been made in understanding the molecular mechanism of the far-red light response of plant shade avoidance. The plant shade-avoidance response is mainly mediated by the phytochrome PHYB, which acts by regulating the expression of downstream genes through the phytochrome-acting factor (PIFs). For example, under high R:FR conditions, PHYB is activated to bind and phosphorylate PIF4 and PIF5 for degradation by the 26S proteasome, and under low R:FR conditions, the phytochrome PHYB is photoconverted to an inactive Pr configuration and exported from the nucleus, thereby enhancing the stability of PIF4 and PIF5 proteins, which in turn promotes the expression of genes that regulate stem elongation. The molecular mechanism of the plant shade-avoidance response may also be comediated by phytochromes and PIF/DELLA interactions. For example, under low R:FR conditions, PHYB is converted into an inactive Pr configuration, releasing PIF4 and PIF5 and allowing them to return to the nucleus. The stability of DELLA proteins decreases, and the binding ability to PIF4 and PIF5 is also reduced. However, the activity of PIF5 increases, which promotes the expression of downstream shade-avoidance response genes in plants and promotes plant elongation. Plants may also avoid shade through cryptochrome signalling. Relevant studies have shown that cryptochrome mainly mediates the shade-avoidance response through the CRY-SPA1/COP1 pathway and inhibits the shade-avoidance response of plants by preventing the degradation of the positive regulators of photomorphogenesis, such as HY5 and HFR1."}, {"passage_id": "Introduction.p0005", "text": "Some progress has been made in understanding the molecular mechanism of plant light-responsive miRNAs, but there have been no reports on the involvement of miRNAs in the shade-avoidance effect of far-red light on D. officinale. By regulating the expression of target genes, noncoding RNAs play an important role in plant growth and development, light signal transduction, stress resistance, epigenetic phenomena and other processes. According to the length of their nucleotides, noncoding RNAs can be divided into two categories: small RNAs (sRNAs) and long noncoding RNAs (lncRNAs). sRNAs are a class of noncoding RNAs with a length of approximately 22 nt; these RNAs mainly include microRNAs (miRNAs) and short interfering RNAs (siRNAs). In recent years, increasing amounts of evidence suggest that miRNAs play an important role in plant photomorphogenesis. found that when dark-grown Chinese cabbage seedlings were exposed to blue light or UV-A, the abundance of miR156 and miR157 decreased, thereby reducing the inhibition of the target genes SPL 9 and SPL 15, which in turn affected the photomorphogenesis of seedlings, resulting in short hypocotyls and expanded cotyledons. In the integrated analysis of potato miRNAs and transcriptomes by, it was found that under light conditions, miRNAs could regulate the synthesis of potato alkaloids, lipid metabolism, and glycoalkaloid synthesis. In an miRNA omics study on the accumulation of functional metabolites in longan embryogenic calli in response to blue light, it was found that miR171 targets DlDELLA, that miR390 targets DlBRI 1, and that miR396 targets DlEBF 1/2 and DlEIN 3 and participates in the blue light signalling network, which in turn regulates the accumulation of functional metabolites in longan."}, {"passage_id": "Introduction.p0006", "text": "The preliminary results of this project revealed that, in D. officinale, an appropriate proportion of 730 nm far-red light can promote an increased accumulation of secondary metabolites in plants, increase the area of leaves, and accelerate the elongation of stem segments, and plant productivity also improved. In this study, we used high-throughput sequencing technology to identify putative miRNAs and investigated their expression profiles in D. officinale under far-red light conditions. By analysing the data of the control (CK) group and the light group, we identified the specific miRNAs involved in the far-red light on the shade avoidance of D. officinale, and the signal transduction pathway of these miRNAs involved in the shade-avoidance response of D. officinale was revealed. These results provide new ideas for the high-yield production of medicinal components in D. officinale."}], "Discussion": [{"passage_id": "Discuss.p0002", "text": "miRNAs participate in the folic acid metabolic pathway and play a role in the shade-avoidance effect of far-red light on D. officinale"}, {"passage_id": "Discuss.p0003", "text": "Among the top 20 KEGG pahways, one-carbon pool by folate was enriched in the FR2-CK, FR8-CK and FR8-FR2 combinations (Fig. 4). Physiological and biochemical experiments also verified that the far-red light treatment resulted in a higher wax content than did the white-light treatment (Fig. 1). Moreover, among the top 20, KEGG pathways, plant hormone signal transduction was enriched in the FR8-CK combination (Fig. 4)."}, {"passage_id": "Discuss.p0004", "text": "The environment can affect the folic acid content of plants. Folic acid metabolism plays a key role in the plant stress response. Under salt stress, osmotic stress, drought stress, and oxidative stress of Arabidopsis thaliana, genes related to folic acid in, such as AtDFD, participate in C1 metabolism and participate in folic acid degradation. The expression levels of AtGGH 1, AtGGH 2, and AtGGH 3 in the apoplastic pathway increase, indicating that the environment can impact folic acid content. Different light quality, light intensity and air temperature will affect the folic acid content of vegetables during growth or storage after harvest. When irradiated with red light at 25 °C with a light intensity of 200 µmol m2/s, lettuce presented the highest folate content. For lettuce, the highest folate content was found in the tested plants treated with 70% red light and 30% blue light in autumn and a combination of red and blue light in winter. In addition, folic acid metabolism is closely related to auxin (IAA) signal transduction, and IAA is involved in the plant response to shade avoidance. Relevant studies have shown that folic acid in the plant cytoplasm can inhibit the synthesis of starch in nonphotosynthetic cells, and the interaction between folic acid and sucrose can affect the sensitivity of plant seedlings to IAA and the distribution of IAA in plants. Therefore, through various target genes, miRNAs may participate in the folic acid metabolism pathway, thereby affecting the shade-avoidance effect of far-red light on D. officinale."}, {"passage_id": "Discuss.p0005", "text": "The D.officinale responds to far-red light via increased cutin, suberin and wax biosynthesis"}, {"passage_id": "Discuss.p0006", "text": "Among the top 20 in KEGG pathways, cutin, suberine and wax biosynthesis were all enriched in FR2-CK, FR8-CK and FR8-FR2 combinations (Fig. 3). GO analysis of DE genes found that response to stimulus and response to stress were significantly enriched in the FR2-CK combination (Table 2). QPCR experiments also verified that the expression level of gene-MA16_Dca002672 (CYP86B1) in FR8 was higher than that of other treatments (Fig. 6D)."}, {"passage_id": "Discuss.p0007", "text": "The cuticle of the plant covers the outermost layer of the plant, which is the direct contact surface between the plant and the environment and is also the first defence barrier of the plant. The stratum corneum is composed of cutin and wax, and the wax is composed of intrinsic wax and epidermal wax embedded in the keratin skeleton. Waxes play an important role in plant resistance to biotic and abiotic stresses; waxes inhibit nonstomatal water loss, reduce the retention of water on plant surfaces, protect plants from UV radiation, etc.. Studies have shown that stratum corneum wax deposition is sensitive to changes in the environment, such as drought, light, temperature, and humidity. Yellow light significantly increased the lamellar waxy crystal structure of the epidermis of faba bean leaves, and yellow light played a significant role in promoting the deposition of total wax and the deposition of dominant components such as primary alcohols and alkanes. Changes in the environment can not only affect the composition, content and crystal structure of stratum corneum wax but also affect the expression of wax-related genes. Transcriptome sequencing of A. thaliana revealed that genes related to wax biosynthesis and deposition, including CER 1, LTP 7, LACS 3, LTP 6, LTP 2 and ABCG 19, are regulated by the photoperiod. Therefore, the cultivation of D. officinale with an appropriate amount of far-red light may promote the Cutin, suberine and wax biosynthesis of the plant and ensure normal growth and development."}, {"passage_id": "Discuss.p0008", "text": "Important role of sulfur metabolism in the effects of far-red light on the shade-avoidance response of D. officinale"}, {"passage_id": "Discuss.p0009", "text": "Among the top 20 KEGG pathways, sulfur metabolism and peroxisome were enriched in the FR2-CK, FR8-CK and FR8-FR2 combinations (Fig. 3). Moreover, among the top 20 KEGG terms, both ascorbate and aldarate metabolism were enriched in the FR8-CK and FR8-FR2 combinations (Fig. 3), and in the top 20 pathways, glutathione metabolism, plant hormone signal transduction, and tryptophan metabolism were enriched in the FR8-CK comparison (Fig. 3). Physiological and biochemical tests also verified that the content of ascorbic acid in the far-red light treatment was higher than that in the white-light treatment (Fig. 1). Both the target gene MA16_Dca003285 (ASA 1, ATP sulfurylase 1) of miR395b and the target gene MA16_Dca022511 (GGP 1, GDP-L-galactose phosphorylase 1) of miR399c_5p were expressed in the far-red light treatment compared with the white-light treatment (Fig. 6)."}, {"passage_id": "Discuss.p0010", "text": "Sulfur metabolism plays a crucial role in the response of plants to light. When plants respond to the environment, the sulfur transporters SULTR1;1 and SULTR2;1 are upregulated, and the activities of sulfur primary metabolism ATPS and OASTL are increased, which promotes the absorption and assimilation of sulfur. After the activity of assimilation pathway, inorganic sulfate is converted into cysteine, which together with glutamic acid and glycine forms glutathione. Glutathione is a part of the ascorbic acid-glutathione cycle. Glutathione reduces oxidized ascorbic acid, thereby scavenging the reactive oxygen species generated in plants due to the environment and thereby improving the adaptability of plants. When plants respond to the environment, the content of reactive oxygen species in throughout the plant body increases, and the reduced glutathione (GSH) and total glutathione also increase. There are also studies showing that the content of cysteine in the synthesis of glutathione is much lower than that of glutathione, the synthesis of cysteine becomes a limiting element of glutathione, and cysteine is mainly composed of ATP sulfate. Cysteine biosynthesis is catalysed by enzymes such as O-acetyl serine lyase and O-acetyl serine lyase, which shows that the relationship between the environment and the primary metabolism of sulfur is very close. In addition, related studies have also found that sulfur metabolism is closely related to hormone signal transduction, and endogenous hormones (IAA, gibberellin (GA), ethylene (ETH), etc.) are all involved in the plant response to shade avoidance. found that plant hormones are involved in the regulatory effects of H2S on seed germination. Low concentrations of NaHS are antagonistic to abscisic acid (ABA) and IAA, while high concentrations of NaHS are associated with GA, ETH, brassinosteroids (BRs), cytokinin (CTK) and salicylic acid (SA) antagonistically regulating seed germination. Further research showed that exogenous H2S may affect the germination of seeds by regulating the expression of related genes, altering the synthesis, metabolism and signal transduction of endogenous hormones in seeds. Therefore, during the process of D. officinale responding to far-red light, the significant enrichment of sulfur metabolism may affect the accumulation of endogenous hormones (IAA, GA, etc.), which in turn affects the shade-avoidance effect of D. officinale."}, {"passage_id": "Discuss.p0011", "text": "The D.officinale responds to far-red light through potassium ion transmembrane transport"}, {"passage_id": "Discuss.p0012", "text": "GO analysis of DE tagert genes revealed that potassium ion transmembrane transport was significantly enriched in the FR8-CK combination (Table 2), in which these target genes was K+ transporter (Trk/HKT) family, including gene-MA16_ Dca007090 (K+ transporter 7, HKT 7), gene-MA16_ Dca001413 (K+ transporter 11, HKT 11), gene-MA16_ Dca001782(K+ transporter 26, HKT 26). The target gene of novel_miR_483, gene-MA16_Dca001413 (HKT 11, K+ transporter 11), exhibited higher expression under far-red light than under white light (Fig. 6). GO analysis of DE genes revealed that ATPase activity was significantly enriched in the FR2-CK and FR8-CK combination (Table 2). The above pathways illustrate the key role of K+ in the D. officinale response to far-red light."}, {"passage_id": "Discuss.p0013", "text": "As the most abundant monovalent cation in plants, K+ is one of the main osmotic regulators in the process of plant stomatal movement. Stomata are the main portals for the exchange of water and gas between plants and the environment. The opening of stomata is beneficial to the plant body to provide power for the transport of substances from the roots to the shoots through transpiration. At the same time, stomata also constitute the main ways for the photosynthesis substrate CO2 to enter the plant body. The closure of stomata can prevent plants from wilting due to excessive water loss and can also prevent pathogenic microorganisms from invading plants through stomata. Plant guard cells can autonomously sense different environmental signals through multiple mechanisms and regulate ion channels/transporters in the plasma membrane and endomembrane systems through independent or intersecting signal transduction pathways, regulate the opening and closing of stomata, and balance water loss, and CO2 absorption in response to the environment. The photoreceptors on the plant guard cell membrane starts the photosynthetic light reaction after receiving the light stimulus. A large amount of ATP is produced through photosynthetic phosphorylation, which provides energy for H+-ATPase continuously. At the same time, light activates the plasma membrane H+- ATPase, and the H+-ATPase uses the energy generated by the hydrolysis of ATP to continuously pump H+ to the outside of the cell, resulting in an electrochemical potential gradient across the plasma membrane so that the mass potential-dependent influx K+ channels and anion channels on the membrane open, allowing a large amount of K+ to enter guard cells, and the K+ concentration in guard cells increases. Therefore, far-red light participates in stomatal movement through the transmembrane transport of potassium ions, which in turn affects the growth and development of D. officinale."}, {"passage_id": "Discuss.p0014", "text": "MiRNAs participate in the signal transduction pathway of far-red light in the shade avoidance of D. officinale"}, {"passage_id": "Discuss.p0015", "text": "On the basis of previous studies, by mining miRNA data, we established a regulatory network of far-red light on the shade-avoidance response of D. officinale (Fig. 7)."}, {"passage_id": "Discuss.p0016", "text": "miR395b may be involved in the signal transduction pathway of far-red light on D. officinale through the target gene PIF3 (gene-MA16_Dca015429), and novel_miR_159 may be involved in the signal transduction pathway of far-red light on D. officinale through the target gene PIF4 (gene-MA16_Dca005372). PIFs belong to a subfamily of the basic helix-loop-helix (bHLH) superfamily of transcription factors, of which there are seven members: PIF1/PIF3-LIKE 5 (PIL5), PIF3, PIF4, PIF5/PIL6, PIF6/PIL2, PIF7 and PIF8. PIFs interact directly with phyB through their conserved N-terminus, termed the active phyB-binding motif. In low R:FR conditions or shade environments, PIF3, PIF4, PIF5, and PIF7 are involved in shade-avoidance responses. When plants sense low R:FR conditions, the active form of phyB is reduced, releasing the transcriptional activity of PIFs and inducing plant growth responses to shade. PIFs control the expression of these genes by directly binding to the promoter regions of cell wall-associated genes, such as xyloglucan endotransferglycosidases and xyloglucan endotransferosidases/hydrolases, which are essential for plant growth in response to shade, and no enzymes are needed. There are also many growth-related genes that are indirectly regulated by PIFs. PhyB is activated and translocated into the nucleus under conditions of a high R:FR ratio, thereby inactivating PIF4, PIF5, and PIF7 and inhibiting PIF-dependent transcription. Under low R:FR ratio conditions, phyB is inactivated, which allows PIF to accumulate and regulate the transcription of its downstream targets. There are many IAA-related genes, and this process changes the expression of the AUXIN (AUX)/INDOLE-3-ACETIC ACID-INDUCIBLE (IAA) IAA signalling gene in cells through the transcription of the YUCCA (YUC) gene and then promotes IAA transport through PIN-FORMED (PIN) proteins, resulting in an increase in the concentration of IAA in cells, a process that ultimately leads to cell elongation."}, {"passage_id": "Discuss.p0017", "text": "A novel_miR_36 may participate in the signal transduction pathway of far-red light on the shade avoidance of D. officinale through the target gene PHYA (gene-MA16_Dca006821) (Fig. 6). Phytochromes play an important role in the shade-avoidance response and can be divided into two categories according to their stability: photostable PHYA and photostable PHYB-PHYE. PHYB is the main phytochrome involved in the regulation of the shade-avoidance response. PHYD and PHYE are positive cofactors of PHYB in the regulation of the shade-avoidance response. Under the dominant role of PHYBs, they redundantly regulate the shade-avoidance response of plants. The role of PHYC in the shade-avoidance response has not been determined. PHYA plays a decisive role in the inhibition of seed germination, de-etiolation, and hypocotyl elongation under far-red light conditions. Related studies have shown that the phyA mutant does not exhibit an obvious shade-avoidance response phenotype like that of the phyB mutant under white-light conditions, but its hypocotyls are longer than those of the wild type under simulated shade conditions. In addition, the mutations of phyA enhance the shade-avoidance response syndrome of the phyB single mutant and phyB phyD phyE triple mutant under white-light conditions, and phenotypes such as hypocotyl and petiole elongation, reduced leaf area, and decreased chlorophyll content are more obvious."}, {"passage_id": "Discuss.p0018", "text": "Through the target gene SPA1, novel_miR_178, novel_miR_405, and novel_miR_435 may participate in the signal transduction pathway governing the effects of far-red light on the shade avoidance of D. officinale (gene-MA16_Dca020963) (Fig. 7). SPA1 is a negative regulator of phyA-dependent far-red light signalling pathway-specific photomorphogenesis. SPA1 is also involved in the red light signalling pathway and is resistant to the inhibitory effect of phyB on hypocotyl elongation. SPA1 is structurally similar to another negative regulator, COP1, and is required for its full function. SPA1 and COP1 interact to form a ligase complex, which together mediate the positive regulators of the light signal transduction pathway, such as HY5, LAF1, and HFR1, which are subsequently degraded through the 26S proteosome pathway and affect the plant shade-avoidance response."}], "Conclusion": [{"passage_id": "Concl.p0002", "text": "This study provides the first demonstration of far-red light on microRNAs involved in the shade-avoidance response of D. officinale through an RNA-seq analysis. Previous studies have found that in D. officinale 730 nm (far-red) light can promote the accumulation of plant metabolites, increase leaf area, and accelerate stem elongation. Based on the transcriptomic, physiological and biochemical analyses, we revealed that folic acid metabolic pathway, cutin, suberin and wax biosynthesis, sulfur metabolism, and potassium ion transmembrane transport play an important role in the response of D. officinale to blue lasers. Some miRNAs participate in the signal transduction pathway of far-red light in the shade avoidance of D. officinale. These findings will be helpful for generating new insights for the high-yield production of functional metabolites of D. officinale."}]}}, {"pmcid": "PMC10037144", "title": "Development of an eco‐friendly pink cotton germplasm by engineering betalain biosynthesis pathway", "source_file": "PMC10037144.json", "source_url": "https://pmc.ncbi.nlm.nih.gov/articles/PMC10037144/", "included_counts": {"Introduction": 4}, "omitted_results_discussion": false, "sections": {"Abstract": [], "Introduction": [{"passage_id": "Introduction.p0001", "text": "The vast majority of the world's cotton varieties produce white fibre, which is then coloured with synthetic dyes during textile processing to fulfil the diverse needs of consumers. This results in potential environmental pollution and is detrimental to human and animal health. Although there exists naturally coloured cottons, mostly in brown and green, their poor agronomic performance and suboptimal fibre quality have severely hampered their widespread applications in cotton breeding program. Therefore, there is an impetus to create multicoloured fibre through synthetic biology biotechnology by leveraging the biochemical processes of colour formation and associated regulatory genes in cotton."}, {"passage_id": "Introduction.p0002", "text": "Pigment accumulation typically results in colourful phenotypes in various plant tissues. Proanthocyanidins or lignin are the pigments responsible for the brown and green cotton fibre. Betalain and anthocyanin are two primary groups of red pigments that are found in the vacuoles of plant cells. The former, present in dragon fruit (Hylocereus undulatus Britt) and sugar beet (Beta vulgaris), is derived from the tyrosine synthesis pathway through three sequential catalytic steps (Polturak and Aharoni, ), whereas the latter requires the engineering of additional 13 or 14 genes (Zhu et al., ). In Arabidopsis, rice, and tobacco, co‐expression of a P450 oxygenase (CYP76AD1), L‐DOPA 4,5‐dioxygenase (DODA), and Glucosyl Transferase (GT) resulted in considerable betalain accumulation, which results in vibrant red colour in various tissues of transgenic plants, respectively (He et al., ). However, it remains unknown if the betalain pathway can be engineered into cotton plants to alter the colour of cotton fibre without compromising fibre quality."}, {"passage_id": "Introduction.p0003", "text": "To generate cotton plants with colourful fibre, three genes, including CYP76AD1, DODA, and GT from B. vulgaris were cotton codon optimized. Three transgene expression cassettes (Figure 1a) termed “Ruby” by He et al. , each driven by either a 2x35S CaMv constitutive promoter (hereafter referred to as 35 S‐RUBY) or a fibre‐specific E6 promoter (hereafter referred to as E6‐RUBY), are separated by two 2A self‐cleavage peptide‐encoding genes (Sharma et al., ; Figure 1b). Multiple independent transgenic upland cotton (Gossypium hirsutum L.) plants overexpressing Ruby were generated using a high‐yielding and high‐fibre‐quality modern elite variety, Zhongmian49, as a donor plant (Ge et al., ; Figure 1c). PCR analysis detected that gene expression level varies among different T0 plants, and two 35 S‐RUBY lines and one E6‐RUBY line with higher expression level of GT in immature fibres were selected to perform DNA blotting analysis, showing the stable integration of transgene (Figures 1d,e). Segregation analysis indicated that the transgenes could be inherited into the following generation (Figure 1f). Single copy T2 homozygous transgenic plants with high gene expression levels, together with wild‐type Zhongmian49 (WT), were grown under field conditions in a confined environment to evaluate the agronomic performance of transgenic lines (Figure 1g). All of the transgenic plants accumulated betalain, but the accumulation patterns were different depending on whether the plants were co‐overexpressing 35 S CaMv‐driven betalain genes or E6‐driven betalain genes. Whereas the WT control showed a normal phenotype, the leaf, stem, boll, bract, flower, anther, and seed were all purple or pink in the 35 S‐RUBY plants (Figure 1h). Notably, light pink colour was discernible in immature fibres at 12, 27, and 42 days post‐anthesis (DPA), but it faded away when fibre completely matured (Figures 1h,i). The colour phenotype of the E6‐RUBY plants remained unchanged from that of the WT, apart from the immature fibres, which showed pink in colour at 12, 27 and 42 DPA. (Figures 1g,h). Although the pink colour did not persist in mature fibres in both E6‐RUBY and 35 S‐RUBY transgenic lines due to the lower level of betalain in mature fibre compared to leaves and seeds (Figure 1j), colour fibres were observed in near‐maturity transgenic cotton plants at 45 DPA after freeze (−40 to −50 °C) or high temperature treatment (~ 40 °C), and the pink colour was stably inherited from T0 to T2 generation (Figures 1k,l). As illustrated in Figures 1m,n,p,t, the fibre length and strength of the transgenic fibres at 45 DPA and mature stage were comparable to those of the WT fibre. Moreover, there was no difference in the weight of cotton bolls between transgenic plants and control (Figure 1o). It is hence apparent that there are no quality trade‐offs in the transgenic lines overexpressing the betalain genes in either a constitutive or fibre‐specific manner. Considering the superior fibre yield and quality of Zhongmian49, these transgenic plants with an intrinsically vibrant pink colour maintained at near‐maturity may have the potential to be used for commercial exploration."}, {"passage_id": "Introduction.p0004", "text": "As betalains are most stable in the pH range of 4.0–6.0, they can be used in textile processing without additional treatment to improve colour stability and uniformity. Future research could be directed to elucidate the regulatory processes that underpin the degradation of betalain in fully mature fibres and develop alternative strategies, e.g., increasing the deposition of betalain in fibre secondary cell walls (Huang et al., ). Moreover, the development of a robust synthetic biology biotechnology for cotton is envisaged to expedite the generation of pure inbred lines with multiple desirable features, bypassing the lengthy procedure of repeated crossing and backcrossing in conventional breeding. Crossing HS2 with naturally coloured fibres led to enrichment and diversification in fibre colours (Ke et al., ). It is plausible to assume that more vibrant or versatile colours may be attainable by crossing E6‐RUBY with the naturally coloured fibres. Overall, our findings demonstrate for the first time that it is possible to produce natural pink colour fibre by engineering key genes involved in betalain synthesis without compromising fibre yield and quality in cotton, providing an environmentally and health‐friendly alternative to synthetic dye for producing coloured cotton fibre."}], "Discussion": [], "Conclusion": []}}, {"pmcid": "PMC10037154", "title": "Diverse flowering responses subjecting to ambient high temperature in soybean under short‐day conditions", "source_file": "PMC10037154.json", "source_url": "https://pmc.ncbi.nlm.nih.gov/articles/PMC10037154/", "included_counts": {"Abstract": 2, "Introduction": 3, "Discussion": 6}, "omitted_results_discussion": false, "sections": {"Abstract": [{"passage_id": "Abstract.p0001", "text": "Summary"}, {"passage_id": "Abstract.p0002", "text": "Flowering time is one of important agronomic traits determining the crop yield and affected by high temperature. When facing high ambient temperature, plants often initiate early flowering as an adaptive strategy to escape the stress and ensure successful reproduction. However, here we find opposing ways in the short‐day crop soybean to respond to different levels of high temperatures, in which flowering accelerates when temperature changes from 25 to 30 °C, but delays when temperature reaches 35 °C under short day. phyA‐E1, possibly photoperiodic pathway, is crucial for 35 °C‐mediated late flowering, however, does not contribute to promoting flowering at 30 °C. 30 °C‐induced up‐regulation of FT2a and FT5a leads to early flowering, independent of E1. Therefore, distinct responsive mechanisms are adopted by soybean when facing different levels of high temperatures for successful flowering and reproduction."}], "Introduction": [{"passage_id": "Introduction.p0002", "text": "Global warming is an environmental threat that all animals and plants on the earth are now facing. The effect of ambient warm temperature on plant morphogenesis is called thermomorphogenesis, in which plants alter morphology and development, such as elongated stem, increased growth rate and earlier flowering (Kumar et al., ). Higher temperature, which leads to heat stress, however, has a profound impact on soybean phenology, including flowering time, lengths of the vegetative and reproductive growth (Vu et al., ). Heat stress alters the fluidity of the plasma membrane, leading to misfolded proteins and excess reactive oxygen species (ROS) production (Ding et al., ). Through the study of model plants Arabidopsis and rice, it was revealed that plants may have multiple temperature‐sensing proteins, such as phytochrome B (phyB), EARLY FLOWERING 3 (ELF3), CHILLING TOLERANCE DIVERGENCE 1 (COLD1), etc. (Chen et al., ; Jung et al., ; Legris et al., ; Ma et al., ), which also indicates the complexity of temperature perception."}, {"passage_id": "Introduction.p0003", "text": "Flowering time is an important agronomic trait as it is crucial for the soybean yield and quality, determines the proper formation of seeds (Zhao et al., ). Soybean is a typical short‐day (SD) plant highly sensitive to changes in day length and ambient temperature, which determines timing of flowering. The regulatory pathways for photoperiodic flowering have been extensively studied in soybean. Different from the main photoperiodic pathway CONSTANS (CO)‐FLOWERING LOCUS T (FT) in Arabidopsis and rice, PHYA (E3 or E4)‐E1‐FT specifically regulates soybean flowering (Lin et al., ; Valverde, ). E3 (PHYA3) and E4 (PHYA2) are phytochrome A homologues of soybean that sense light signals as photoreceptors (Liu et al., ; Watanabe et al., ). E1, a legume‐specific suppressor of photoperiodic flowering, function as a central integrator in soybean photoperiodic flowering by negatively regulating of florigen genes FT2a and FT5a (Li‐feng et al., ). The transcription of FT2a and FT5a can be suppressed by high E1 expression, which could lead to obvious late flowering (Xia et al., ). There are two additional homologues of E1 gene in soybean, E1‐like a (E1La) and E1‐like b (E1Lb). E1La and E1Lb also inhibit the expression of FT2a and FT5a and delay soybean flowering independent of E1, which means E1, E1La and E1Lb function similarly in flowering (Xu et al., ; Zhu et al., ). Elevated temperature also manipulates the timing of soybean reproduction by regulating flowering genes in the photoperiod pathway. It was reported that 30 °C high temperature, compared with 20 °C, changes expression of photoperiodic flowering genes including FT2a, FT5a and E1 in soybean (No et al., )."}, {"passage_id": "Introduction.p0004", "text": "When facing high‐temperature ambient environment, to successfully leave offspring, plants will adopt a strategy of changing the timing of reproductive growth. Some plant species choose to accelerated flowering to obtain offspring as soon as possible, while other species choose to delay flowering to avoid the effects of hot temperature on reproductive growth (Del Olmo et al., ; Lohani et al., ; Upadhyay et al., ). But in soybean the flowering responses under high temperature are confused and controversial, some studies show that increasing temperature promotes flowering of soybean (Câmara et al., ; Mao et al., ; No et al., ), but there were also results demonstrating that high temperature delayed flowering in soybean (Tacarindua et al., ; Thomas et al., ). Considering that crops are often subjected to high temperature in summer at low latitudes, in this study, we subjected soybean to continuous elevated temperature of 30 and 35 °C, compared with the normal temperature of 25 °C under SD, to simulate the high‐temperature conditions in low latitudes. Surprisingly, it revealed that soybean has two opposing strategies facing high temperature: temperature of 35 °C represses soybean flowering through integrating photoperiodic flowering phyA‐E1 pathway, while 30 °C temperature accelerates flowering through transcription regulation of FT genes. Our data thus uncover how soybean responds to rising temperature by employing two opposite strategies in flowering time that better acclimate to adverse environments."}], "Discussion": [{"passage_id": "Discuss.p0002", "text": "As sessile organisms, plants evolve complicated mechanisms that help them cope with even the slightest increase in temperature (Vu et al., ). Our findings reveal an opposite and complicated responses of elevated temperature on soybean flowering, and the underlying different mechanisms, which was never reported in other species before. Compared with 25 °C, OHT accelerates flowering and HHT suppresses flowering. We speculate that 30 °C is a tolerable mild high temperature for the soybean and therefore triggering early flowering is a strategy to rapidly transfer genetic information to offspring. On the other hand, it is also reported that high temperature induces the elongation of shoots, including hypocotyls and petioles in addition to early flowering in Arabidopsis (Gray et al., ; Koini et al., ; Kumar and Wigge, ; Vu et al., ), much like high temperature affects plant growth such as the node number and plant height of soybean, as previous documents that high temperature promotes cell elongation to accelerate growth (Ikeda et al., ), it is also reasonable to hypothesize that the 30 °C‐triggered early flowering may only result from an accelerated growth induced by higher temperature, rather than a specific induction of floral transition. This could be further supported by that this process is not dependent of phyA‐E1. However, soybean also can delay flowering when subjecting to higher temperature stress to avoid fatal injury and to safely get through this hot period. In addition, our findings reveal that phyA‐E1 pathway, possibly photoperiod flowering pathway (Cao et al., ; Hou et al., ; Lin et al., ), is very crucial for HHT‐mediated late flowering (Figure S6). Further studies are needed to address how the signal of OHT and HHT responses and the signal of photoperiod flowering (Bu et al., ; Dong et al., ; Lu et al., ) are integrated, and the detailed molecular mechanism of flowering acceleration and suppression under rising temperatures."}, {"passage_id": "Discuss.p0003", "text": "In soybeans, most of the previous studies on how high temperature affects flowering is under ambient environment or in open‐top chamber (No et al., ; Tacarindua et al., ), but in this study, it was the effects of long‐term, uninterrupted, continuous steady high temperature on plants. This is the first time that the effects of high temperature on plants have been extensively studied and the molecular mechanism underlying has been systematically explored. It was clearer now that the controversial and confusing in this filed that high temperature changes the flowering time of soybean was caused by the different levels of high temperature. But from another aspect it also shows that plants have a very complex and sophisticated mechanism for high‐temperature response. A difference in the setting of the experimental condition may make the final result completely different. How does high temperature affect soybean flowering under LD condition should be further investigated. It is also possible that the mechanisms of OHT and HHT regulated early and delayed flowering are SD dependent."}, {"passage_id": "Discuss.p0004", "text": "In Arabidopsis, phyB functions as the thermosensor, which mediates the thermomorphogensis (Jung et al., ; Legris et al., ; Quiroz et al., ), but phyB seems to have no effect in both 35 and 30 °C under SD for soybean flowering, indicating the weak function of phyB in soybean high temperature‐regulated alteration of flowering time. According to our results and previously reported results, the function of phyB in flowering under both long day and SD is limited (Zhao et al., ), which also proves the weak role of phyB in photoperiod flowering. On the other hand, phyA has significant roles in HHT‐mediated late flowering under SD, highlighting the importance of phyA in both photoperiodic flowering and high temperature. We also found that PHYA2 and PHYA3 are also under selective pressure in low‐latitude SD tropical regions (Figure S7), and we know that in normal temperature 25 °C under SD conditions, the functions of phyA2 and phyA3 in delaying flowering are very weak (Lu et al., ). It is reasonable to speculate that they were selected in low‐latitude regions because of their important function in mediating high‐temperature late flowering. Future studies should focus on whether phyA senses the HHT and mediates late flowering in a similar way to Arabidopsis phyB, and if phyB or phyA is involved in other thermomorphogensis process, such as elongated stem, increased growth rate in soybean."}, {"passage_id": "Discuss.p0005", "text": "In soybean photoperiod flowering, E1 integrates photoperiod flowering signals as a core transcription factor, which is the counterpart of CO in Arabidopsis photoperiodic pathway (Lin et al., ), indicating that E1 integrates different environmental signals, such as photoperiod signals and temperature signals, to regulate soybean flowering. We also found that E1 was also selected at low latitudes (Figure S7), but since E1 itself plays an important role in mediating late flowering in SDs, we do not know whether E1 is also selected by high temperature at low latitudes at the same time."}, {"passage_id": "Discuss.p0006", "text": "ELF3 was also reported to be a temperature receptor in Arabidopsis, and its mutant plants lost the response to early flowering at high temperature. The underlying mechanism was a temperature‐dependent phase separation: at low temperature, ELF3 diffused in nucleus; when temperature elevated, ELF3, which directly responds to temperature changes, aggregates into a nuclear speckle, and this property is dependent on the prion‐like domain (PrD) of ELF3. Complementing ELF3 without the PrD domain from other species to the Arabidopsis elf3 mutant cannot complement the temperature‐related phenotype of Arabidopsis elf3, and also does not activate ELF3 temperature‐dependent phase separation (Jung et al., ). We analysed the protein sequence of soybean J, which is the homologous of Arabidopsis ELF3, and found that it has no PrD sequence (Figure S8), therefore, we speculate that the soybean J could not respond to temperature through phase separation, but whether it responds to temperature must finally be determined by the phenotype of corresponding mutants. PIF4 has also been reported to play an important role in temperature regulation in Arabidopsis thaliana. After knocking out of PIF4, the thermomorphogenesis phenotypes such as long hypocotyls and long petioles, which wild‐type plants exhibited in high temperature, disappeared (Koini et al., ). PIF4 also work in high temperature‐mediated early flowering in Arabidopsis (Kumar et al., ). In soybean, studies have shown that transcription level of GmPIF4 increases under high temperature of 35 °C, and GmPIF4b protein becomes larger in high temperature, suggesting that high temperature may lead to the modification of GmPIF4 protein (Arya et al., ). This also implies that GmPIF4 can also respond to high temperature in soybean."}, {"passage_id": "Discuss.p0007", "text": "Sustained high temperatures above 35 °C are common in the low latitudes in summer, and late flowering is crucial for improving soybean yield in low‐latitude regions in SDs. So, revealing the crucial role of photoperiodic pathway in HHT‐mediated late flowering and using the excellent natural allelic variation of the genes in the photoperiod signalling pathway to screen out varieties suitable for local soybean production has great application value. In the future, it will be critical to substantially study how crops response to rising temperatures when facing climate change and global warming to ensure stable grain production and food security."}], "Conclusion": []}}, {"pmcid": "PMC10037157", "title": "SEMI‐ROLLED LEAF 10 stabilizes catalase isozyme B to regulate leaf morphology and thermotolerance in rice (Oryza sativa L.)", "source_file": "PMC10037157.json", "source_url": "https://pmc.ncbi.nlm.nih.gov/articles/PMC10037157/", "included_counts": {"Abstract": 2, "Introduction": 5, "Discussion": 13}, "omitted_results_discussion": false, "sections": {"Abstract": [{"passage_id": "Abstract.p0001", "text": "Summary"}, {"passage_id": "Abstract.p0002", "text": "Plant architecture and stress tolerance play important roles in rice breeding. Specific leaf morphologies and ideal plant architecture can effectively improve both abiotic stress resistance and rice grain yield. However, the mechanism by which plants simultaneously regulate leaf morphogenesis and stress resistance remains elusive. Here, we report that SRL10, which encodes a double‐stranded RNA‐binding protein, regulates leaf morphology and thermotolerance in rice through alteration of microRNA biogenesis. The srl10 mutant had a semi‐rolled leaf phenotype and elevated sensitivity to high temperature. SRL10 directly interacted with catalase isozyme B (CATB), and the two proteins mutually increased one other's stability to enhance hydrogen peroxide (H2O2) scavenging, thereby contributing to thermotolerance. The natural Hap3 (AGC) type of SRL10 allele was found to be present in the majority of aus rice accessions, and was identified as a thermotolerant allele under high temperature stress in both the field and the growth chamber. Moreover, the seed‐setting rate was 3.19 times higher and grain yield per plant was 1.68 times higher in near‐isogenic line (NIL) carrying Hap3 allele compared to plants carrying Hap1 allele under heat stress. Collectively, these results reveal a new locus of interest and define a novel SRL10–CATB based regulatory mechanism for developing cultivars with high temperature tolerance and stable yield. Furthermore, our findings provide a theoretical basis for simultaneous breeding for plant architecture and stress resistance."}], "Introduction": [{"passage_id": "Introduction.p0002", "text": "Rice yield is closely linked to both plant architecture and stress resistance. The two ‘Green Revolutions’ and super‐rice breeding programs are based on continuous improvement of these two characteristics (Guo et al., ). To capitalize on available resources and maximize seed setting, plants make constantly adjustments in response to changes in environmental factors (Xu et al., ). Certain architectures, can predispose plants for success under specific conditions. For example, upright plant architecture facilitates high‐density planting (Tian et al., ), whereas a semi‐dwarf architecture can enhance lodging resistance and crop yield (Guo et al., ; Liu et al., ; Wang and Li, ). Appropriate leaf rolling not only contributes to enhanced light penetration into the canopy (Chen et al., ; Sun et al., ; Xu et al., ) but also helps to improve root system activity and strengthen lodging resistance (Sun et al., ; Zhang et al., ; Zou et al., ). Extreme climate events have huge negative impact on global food production (Ray et al., ); for crops that are vulnerable to temperature fluctuations, precise control over heat resistance will be necessary in the future to minimize plants damage (Mittler et al., ). It is therefore of great practical significance for rice production to cultivate new germplasm resources with beneficial leaf morphologies and enhanced heat tolerance."}, {"passage_id": "Introduction.p0003", "text": "Stages of leaf development include leaf initiation, polarity establishment and maintenance, leaf flattening and intercalary growth (Du et al., ). Leaf morphology is determined by polarity along three axes: adaxial–abaxial, medial–lateral and apical–basal (Hasson et al., ; Moon and Hake, ). Establishment of leaf polarity is the result of complex interaction between regulatory networks involving phytohormone signalling pathways, transcription factors and microRNAs (miRNAs) (Wang et al., ; Xu et al., ). Significant progress has been made in recent years towards the mechanisms that regulate leaf morphology; many relevant genes have been identified in rice, such as SHALLOT‐LIKE1 (SLL1) (Zhang et al., ) and SLL2 (Zhang et al., ), ABAXIALLY CURLED LEAF 1 (ACL1) (Li et al., ), SEMI‐ROLLED LEAF 1 (SRL1) (Li et al., ; Xiang et al., ;) and SRL2 (Liu et al., ), Class III HD‐Zip gene HOMEODOMAIN CONTAINING PROTEIN 4 (OSHB4) (Li et al., ), ARGONAUTE‐1 (AGO1) ISOFORMS B (AGO1b) (Li et al., ), and members of the RICE OUTERMOST CELL‐SPECIFIC GENE (Roc) family Roc8 and Roc5 (Fang et al., ; Sun et al., ). Many genes have pleiotropic effects in regulating stress resistance, plant architecture and nutrient utilization; examples include PHOTO‐SENSITIVE LEAF ROLLING 1 (PSL1) (Zhang et al., ), SLL1 (Zhang et al., ), DENSE PANICLE 1 (DEP1)/qLL9 (Fu et al., ; Huang et al., ), IDEAL PLANT ARCHITECTUTRE1 (IPA1) (Lu et al., ; Springer, ; Wang et al., ) and DWARF 1 (D1)/LW5 (Fujisawa et al., ; Zhu et al., ). PSL1 is known to modify cell wall structure and drought tolerance in rice (Zhang et al., ), whereas D1 is involved in a complex network regulating plant height, leaf size and abiotic stress responses (Fujisawa et al., ; Jangam et al., ; Zhu et al., )."}, {"passage_id": "Introduction.p0004", "text": "Heat stress causes different degrees of damage to protein, membrane, RNA and cytoskeleton, and changes the efficiency of intracellular reactions, leading to metabolic imbalances (Vu et al., ). Many genes regulated thermotolerance through complex regulatory networks involving the rapid plasma membrane (PM) sensing mechanism, Ca2+ signal transduction, reactive oxygen species (ROS) metabolism, post‐transcriptional RNA modifications, ubiquitinated protein degradation and the unfolded protein response (UPR) in the endoplasmic reticulum (ER) and cytosol (Mittler et al., ). Genes involved in these processes include SLENDER GUY 1 (SLG1) (Xu et al., ), ADAPTATION TO ENVIRONMENTAL TEMPERATURE 1 (AET1) (Chen et al., ), the NOP/Sun family members NSUN2 (Tang et al., ), THERMO‐TOLERANCE 1 (TT1) (Li et al., ), TT2 (Kan et al., ) and HIGH TEMPERATURE SENSITIVE 1 (HTS1) (Chen et al., ). Although many regulatory genes that influence leaf morphology or thermotolerance have been identified, there are few reports detailing combined analyses of leaf morphology and thermotolerance. Identifying genes that simultaneously regulate both leaf morphology and stress resistance should clarify the mechanisms by which these regulatory pathways are integrated and provide new avenues for breeding high‐yield, high‐quality rice varieties in the future."}, {"passage_id": "Introduction.p0005", "text": "In plants, proteins that contain double‐stranded RNA‐binding motifs (dsRBMs) play integral roles in small RNA biosynthesis (Raghuram et al., ). Moreover, dsRBMs are also known to be important in plant development and defence (Bartel and Bartel, ; Hiraguri et al., ; Waterhouse et al., ). Twelve dsRBM‐containing proteins have been identified in rice, including eight double‐stranded RNA‐binding (DRB) proteins and four Dicer‐like (DCL) proteins. Functional analysis of DCLs (such as OsDCL1, OsDCL3b and OsDCL4) has suggested that dsRBM‐containing proteins have critical roles in leaf morphology (Liu et al., ), small RNA biogenesis (Song et al., ) and basal resistance against rice blast disease (Zhang et al., ). However, few members of DRBs family have been functionally characterized in rice. Moreover, there have been no reports of DRBs simultaneously regulating of plant architecture and stress resistance."}, {"passage_id": "Introduction.p0006", "text": "In the present study, we identified a rice mutant that displayed increased temperature sensitivity and a semi‐rolled leaf phenotype. The causal gene, named SRL10, encoded a dsRBM‐containing protein and regulated miRNA biogenesis. SRL10 not only affected leaf morphology, but also increased thermotolerance by interacting with catalase isozyme B (CATB) and enhancing the H2O2 scavenging ability of CATB. Natural variations in SRL10 confer differential degrees of thermotolerance to japonica, indica and aus cultivars; the Hap3 (AGC) allele of SRL10, which was prevalent in the majority of aus rice, was identified as a thermotolerant haplotype. We therefore propose that manipulation of SRL10 has potential applications in super‐high‐yield rice breeding by simultaneously improving plant architecture and stress resistance."}], "Discussion": [{"passage_id": "Discuss.p0002", "text": "SRL10 determines leaf morphology by regulating the development of bulliform cells"}, {"passage_id": "Discuss.p0003", "text": "In this study, we identified SRL10 as a key regulator of leaf rolling through knockout and overexpression analysis. Compared to wild type, the knockout line of SRL10 had higher numbers and size of BCs, leading to adaxial leaf rolling. In contrast, overexpression of SRL10 led to decreased BC number and area, which resulted in abaxial leaf rolling. Our data therefore strongly support a negative role of SRL10 in the formation and development of BCs on adaxially leaf surface. Besides, SRL10 might also regulate sclerenchyma cell development; the disappearance of sclerenchyma cells on the adaxial surface caused BCs on both sides of the small vascular bundle to connect in srl10 and SRL10‐KO plants. BCs are highly linked to rolled leaf phenotype in rice (Xu et al., ; Zhang et al., ) and defective development of BC in particular is responsible for the rolled leaf phenotype of many mutants (Zhou et al., ). We therefore hypothesized that adaxially rolled leaves in srl10 were primarily a result of changes in the number and area of BCs. Many genes that contribute to BC development have been identified, such as LATERAL ORGAN BOUNDARIES DOMAIN (LBD) gene OsLBD3‐7 ((Li et al., ), ROP‐INTERACTING RECEPTOR‐LIKE KINASE 1 (OsRRK1) (Ma et al., ) and LEAF ROLLING RECEPTOR‐LIKE CYTOPLASMIC KINASE 1 (LRRK1) (Zhou et al., ). Thus, the identification and cloning of SRL10 conducted in the present study expands the known molecular regulatory network of leaf morphological development in rice."}, {"passage_id": "Discuss.p0004", "text": "SRL10 regulates both leaf morphology and thermotolerance in rice"}, {"passage_id": "Discuss.p0005", "text": "Transcriptomic analysis and qRT‐PCR showed that DEGs related to leaf development between WYJ7 and srl10 were primarily enriched in phytohormone signal transduction pathways, including OsCOW1 and RL14 (Figure S1a–c). OsCOW1 encodes a member of the YUCCA protein family and affects water homoeostasis in rice (Woo et al., ). RL14 modulates leaf rolling by affecting water transport in leaves (Fang et al., ). Moreover, miR165/miR166 have prominent roles in abaxial leaf fate by targeting the HD‐ZIP III genes PHB, REV and PHV (Fouracre & Poethig, ; Nogueira et al., ; Sakaguchi & Watanabe, ; Zhang et al., ). The HD‐ZIP genes OSHB1/LF1 and OSHB4 regulate leaf development in an auxin‐dependent manner in rice (Li et al.,; Zhang et al., ). Therefore, the differentially expression of miR166m and its target genes (OSHB1, OSHB2, OSHB4, YABBY5) in WYJ7 and srl10 indicated that SRL10 affects leaf polarity by participating in complex regulatory network involving auxin, miRNA and transcription factors."}, {"passage_id": "Discuss.p0006", "text": "Numerous studies have demonstrated that CATB functions as a key H2O2 scavenging enzyme (Ye et al., ; Zhang et al., ), but its role in leaf morphology has rarely been reported. In the present study, loss of CATB function was found to result in abaxially rolled flag leaves and up‐regulation of miR399 acumination (Figure S6b). In contrast, the srl10/catb double mutant exhibited adaxially rolled leaves, suggesting that CATB did control leaf morphology. Arabidopsis CATALASE2 have been reported to influence leaf morphology by changes of auxin levels (Gao et al., ). Notably, auxin can induce the production of ROS, in turn, ROS downstream product reactive carbonyl species (RCS) regulates auxin signal transduction in a feed‐forward manner (Biswas et al., ). Therefore, the complex crosstalk between auxin and H2O2 could be a reasonable explanation for the regulatory function of CATB on leaf morphology (Biswas et al., ; Li et al., ). However, the regulatory relationship between H2O2 and auxin in catb plants requires further investigation. We speculated that the loss of CATB function might result in changes of auxin level in vivo, thereby leading to changes in histocytes and rolled leaf in rice. In this study, the regulatory role of SRL10 on rolled leaf might be related to the development of bulliform cells regulated by miRNA‐auxin. Moreover, the interaction between SRL10 and CATB may further affect the crosstalk between H2O2 and auxin. Collectively, we speculated that the crosstalk of SRL10‐miRNA‐auxin and H2O2‐auxin jointly regulates the balance of auxin metabolism in vivo, endowing SRL10 with synergistic effect on leaf morphology and stress resistance."}, {"passage_id": "Discuss.p0007", "text": "ABA regulates stress resistance through modulation of stomatal aperture and leaf transpiration capacity (Li et al., ). We here found that SRL10 participates in heat stress response and ABA response. Furthermore, H2O2 is a critical signalling molecule in plants, and the balance between H2O2 generation and scavenging rates contributes to normal plant development and stress resistance (Zhang et al., ). Although CAT is the primary enzyme responsible for scavenging H2O2, its affinity for H2O2 is extremely low (Foyer et al., ; Mhamdi et al., ; Zhang et al., ). The substrate channelling mechanism used in processes such as ROS scavenging suggested that binding of enzymes to other substances can greatly accelerate the reaction rate (Singleton et al., ; Zhang, ; Zhang et al., ). Thus, interaction between SRL10 and CATB may affect the affinity of CAT for H2O2, altering its H2O2 scavenging capacity. We observed significantly higher CAT activity and CATB expression levels in the leaves of SRL10‐OE plants, which led to lower H2O2 levels. This suggested that overexpression of SRL10 enhanced CAT activity under heat stress. Moreover, SRL10–CATB interactions contributed to the stability of both proteins. We therefore speculate that SRL10 participates in H2O2 metabolism, positively regulating thermotolerance by interacting with and stabilizing CATB."}, {"passage_id": "Discuss.p0008", "text": "The role of SRL10 in regulating thermotolerance may also be related to complex miRNA‐mediated regulatory networks. In Arabidopsis, AtDRB2 is required for appropriate regulation of the miRNA399/PHOSPHATE2 expression module (Pegler et al., ), which alters the salt stress response (Pegler et al., ). This suggests that differential expression of miR399 in WYJ7 and srl10 may also be related to thermotolerance. Furthermore, high temperature‐triggered increase in transpiration rate was considered as a strategy of enabling ‘heat avoidance’ by lowing leaf temperature (Aparecido et al., ; Haddad et al., ; Lin et al., ; Crawford et al.,). The complex relationships between cell wall structure, stomatal morphology, leaf water balance and the transpiration rate could underlie srl10 sensitivity to high temperature. The role of SRL10 in controlling thermotolerance appears to be complex and regulated by miRNA, ROS metabolism and other unknown factors. The details of these regulatory mechanisms are not yet clear, demonstrating a need for further in‐depth research in the future. Identifying new regulatory genes downstream of SRL10 should be focus of subsequent studies; this would further clarify the role of SRL10 in leaf morphology and thermotolerance. Our results serve as a reference for gene discovery and simultaneous molecular breeding of rice thermotolerance and leaf morphology."}, {"passage_id": "Discuss.p0009", "text": "SRL10 has pleiotropic effects on rice growth and development"}, {"passage_id": "Discuss.p0010", "text": "Most dsRBM‐containing proteins have a second functional or catalytic domain, suggesting that such proteins participate in multiple biological processes such as miRNA biosynthesis (Burd and Dreyfuss, ), abiotic stress responses (Raghuram et al., ) and hormone signalling (Lu and Fedoroff, ). SRL10 contains two dsRBMs and a putative PHA03247 superfamily UL36 domain. We here found that a C to T substitution in the first exon of SRL10 led to an amino acid change in the first dsRBMs of SRL10 and was associated with the adaxial leaf rolling phenotype in srl10. A complementation assay showed that expression of LOC_Os10g33970 in srl10 rescued the semi‐rolled leaf and temperature‐sensitive phenotypes."}, {"passage_id": "Discuss.p0011", "text": "Interaction between SRL10 and CATB were verified both in vitro and in vivo with Y2H, Co‐IP, SLC, GST pull‐down and BiFC assays. We also confirmed that CATB‐GFP was localized to the peroxisome (Figure S7). In addition, we repeated the BiFC assay confirming the interaction between CATB and SRL10 with multiple organelle‐specific fluorescent markers (such as peroxisomes, ER, mitochondria and Golgi apparatus) and strong yellow fluorescent protein (YFP) signal was consistently observed, indicating interactions between SRL10 and CATB. However, there was no overlap observed between the YFP signal and any of the organellar markers. This might have been due to the complexity of protein expression (Tanz et al.,) or an unknown interaction mechanism. For example, some active proteins exist in multiple organelles and are shuttled between five or six subcellular structures (Carrie and Small,; Small et al., ). Gao et al. found that co‐expression of ROD1 and CATB changed the localization of CATB. The details of interactions between CATB and SRL10 therefore require further investigation."}, {"passage_id": "Discuss.p0012", "text": "Most of the known proteins identified as SRL10 interactors here participate in multiple biological processes. For example, rice snf1‐related protein kinase 1 (SnRK1) family members SnRK1A mediates glucose metabolism (Lu et al., ); VASCULAR PLANT ONE‐ZINC FINGER 1 (VOZ1) mediates immune response (Wang et al., ); and AUTHENTIC HIS PHOSPHOTRANSFER PROTEIN 2 (AHP2) mediates drought and salt resistance (Figure S5) (Sun et al., ). Moreover, the loss of SRL10 function resulted in open glumes, imperfect grain filling and reduced 1000‐grain weight. We therefore hypothesize that SRL10 has pleiotropic functions, including regulation of plant growth and resistance to environmental stresses."}, {"passage_id": "Discuss.p0013", "text": "Prospects for applying SRL10 in rice molecular breeding for stress resistance and high yield"}, {"passage_id": "Discuss.p0014", "text": "Ideal plant architecture and strong stress tolerance are the two major targets of high‐yield breeding. Although many high temperature‐tolerant germplasm resources have been identified, few varieties have strong thermotolerance without associated yield decreases. We here confirmed that natural variation of SRL10 associated with field thermotolerance by analysing yield‐trait performance and SRL10 thermal stability in accessions with different SRL10 haplotypes (NIL‐SRL10 Hap1 and NIL‐SRL10 Hap3) under heat stress (42 °C). These results suggested that advantages in heat resistance were conferred by Hap3 (AGC) type of SRL10 allele, which resulted from higher SRL10 expression levels and protein stability; this minimized heat‐induced plant damage without decreasing yield. Because elite rice varieties containing Hap3 (AGC) exhibit stronger thermotolerance without an obvious decline in productivity, this natural variation of SRL10 constitutes an elite allelic variation for high‐yield breeding through ideal plant architecture and high thermotolerance. Collectively, our combined analysis of leaf morphology and thermotolerance revealed that integration of favourable SRL10 alleles could accelerate inter‐regional exchange of high‐performance rice germplasm resources, thus promoting sustainable development in global agriculture."}], "Conclusion": []}}, {"pmcid": "PMC10037894", "title": "Genome-wide identification and comparative expression profiling of the WRKY transcription factor family in two Citrus species with different Candidatus Liberibacter asiaticus susceptibility", "source_file": "PMC10037894.json", "source_url": "https://pmc.ncbi.nlm.nih.gov/articles/PMC10037894/", "included_counts": {"Abstract": 7, "Introduction": 6, "Discussion": 11, "Conclusion": 1}, "omitted_results_discussion": false, "sections": {"Abstract": [{"passage_id": "Abstract.p0001", "text": "Background"}, {"passage_id": "Abstract.p0002", "text": "Salicylic Acid (SA) is a pivotal phytohormone in plant innate immunity enhancement of triggered by various pathogens, such as Candidatus Liberibacter asiaticus (CLas), the causal agent of Huanglongbing (HLB). WRKY is a plant specific transcription factor (TF) family, which plays crucial roles in plant response to biotic stresses. So far, the evolutionary history, functions, and expression patterns under SA treatment and CLas infection of WRKY family are poorly understood in Citrus, despite the release of the genome of several Citrus species. A comprehensive genomic and expressional analysis is worth to conduct for this family."}, {"passage_id": "Abstract.p0003", "text": "Results"}, {"passage_id": "Abstract.p0004", "text": "Here, a genome-wide identification of WRKY TFs was performed in two Citrus species: Citrus sinensis (HLB-sensitive) and Poncirus trifoliata (HLB-tolerant). In total, 52 CsWRKYs and 51 PtrWRKYs were identified, whose physical and chemical properties, chromosome locations, phylogenetic relationships and structural characteristics were comparatively analyzed. Especially, expression patterns of these WRKY genes before and after SA treatment and CLas infection were compared. Based on this result, seven pairs of orthologous WRKY genes showing opposite expression patterns in two Citrus species were screened out. Moreover, two pairs of orthologous WRKY genes with significant differences in the number or type of stress-responsive cis-elements in the promoter regions were discovered. Subcellular localization and transcriptional activation activity assays revealed that these two pairs of orthologous genes are classic WRKY TFs localize in the nucleus and could function as transcriptional activators."}, {"passage_id": "Abstract.p0006", "text": "In this study, we systematically analyzed the genomic characterization of WRKY family in two Citrus species, together with the analyses of expression patterns under SA signaling and CLas infection. Our study laid a foundation for further study on the function of WRKY TFs in HLB response and SA signaling of Citrus."}, {"passage_id": "Abstract.p0007", "text": "Supplementary Information"}, {"passage_id": "Abstract.p0008", "text": "The online version contains supplementary material available at 10.1186/s12870-023-04156-4."}], "Introduction": [{"passage_id": "Introduction.p0001", "text": "Background"}, {"passage_id": "Introduction.p0002", "text": "Huanglongbing, generally referred to as citrus greening, is the most catastrophic and unprecedented disease that impedes citrus growth and threatens global citrus industry. Three ‘Candidatus Liberibacter’ species, ‘Candidatus Liberibacter asiaticus’, ‘Candidatus Liberibacter americanus’, and ‘Candidatus Liberibacter africanus’, have been identified as the causal agents of HLB, among which CLas is the most widespread and harmful species. Two phloem-feeding citrus psyllids, Diaphorina citri (Asian citrus psyllid, ACP) and Trioza erytreae, are natural vectors responsible for the transmission of HLB-associated bacteria. Once infected with CLas, citrus trees will exhibit a series of typical symptoms including yellow or green mottled spots in leaves, stunted twigs, lopsided fruits and abortive seeds. Eventually, the trees will die as the disease progresses."}, {"passage_id": "Introduction.p0003", "text": "To date, there is no radical cure to eliminate HLB disease. Almost all citrus cultivars can be affected by the HLB-associated bacteria and there is no confirmed resistance. However, the preliminary analysis of different citrus cultivars and varieties has indicated that there are differences in host response to CLas. Evidences showed that many trifoliate orange varieties and its hybrids exhibited lighter symptoms of HLB than the rootstock shoots emerging from the trees’ bases did. Several accessions of P. trifoliata have also been found to be resistant to ACP by influencing oviposition and lifespan of adults. Therefore, trifoliate orange may have a certain tolerance to CLas infection or psyllid colonization."}, {"passage_id": "Introduction.p0004", "text": "SA is a ubiquitous phenolic compound distributed extensively in plants and a vital phytohormone that regulates various stress responses and physiological processes, such as immune response, seed germination, growth and development, stomatal closure, senescence, etc.. Among them, the function of SA in plant immune response to pathogens has been extensively studied. SA signaling constitutes a tightly linked regulatory cascade that plays a pivotal role in establishing Systemic Acquired Resistance (SAR), a long-term and broad-spectrum resistance which exists throughout the whole plant after local pathogen infection. SA content in plants elevates rapidly after pathogen infection, which could be transported to various tissues and organs, and finally induce a series of SAR resistance reactions, such as the expression of disease resistance genes, the interaction between SA and disease resistance proteins, and between other related genes through signal transduction. Recent studies have demonstrated that SA resistance signaling pathway is a complex network, in which multiple TFs are involved to regulate gene expression after pathogen infestation."}, {"passage_id": "Introduction.p0005", "text": "WRKY TFs comprised plenty members in plant genomes and form indispensable parts of regulator networks that modulate numerous plant processes. The name of the WRKY TFs is derived from the most conspicuous characteristic of these proteins, namely the WRKY domain, a highly conserved region containing approximately 60 amino acids with a core sequence WRKYGQK at its N-terminal end, together with a novel zinc-finger-like domain at its C-terminal. The WRKY proteins are generally categorized into three groups and eight subgroups on the basis of the number of WRKY domain and the feature of zinc finger motif. The proteins possessing two WRKY domains at N-terminal (Group Ia) or C-terminal (Group Ib) were classified into Group I, while those with only one WRKY domain belonged to Group II or Group III. WRKY TFs bind to the cis-element W-box [(T/C)TGAC(T/C)] in the promoter region of its target genes and regulate the expression of related genes. Massive studies have shown that WRKY TFs participate in various biological and physiological processes, including disease resistance. A subgroup IIb WRKY family member CaWRKY6 from Capsicum annuum positively function in Ralstonia solanacearum resistance by activating another WRKY gene, CaWRKY40. In rice, OsWRKY62 functions as a negative regulator of innate immunity by affecting both basal and Xa21-mediated rice-specific defense responses to the bacterial pathogen Xanthomonas oryzae pv. oryzae. In summary, WRKY family has numerous members with diverse quantitative distributions in different plants and variable mechanisms under pathogen attack."}, {"passage_id": "Introduction.p0006", "text": "Although several WRKYs functioning in plant disease defense have been characterized, the molecular mechanisms and the regulatory roles of most WRKYs, especially those from the non-model plants, still remain poorly understood. In the current study, a genome-wide analysis of WRKY TFs was performed in two Citrus species, C. sinensis and P. trifoliata, by implementing bioinformatics approach on the publicly available database of sequenced genome. Multiple sequence alignments, phylogenetic relationships, chromosome distributions, gene duplications, syntenic relationships of WRKY genes were performed. Furthermore, the expression profiles of WRKY orthologous pairs from two Citrus species under SA treatment and CLas-infection were analyzed. Promoter analysis was carried out to investigate stress-responsive cis-elements in seven pairs of orthologous WRKY genes which exhibited strong opposite expression patterns. Additionally, subcellular localization and transcriptional activation activity of two pairs of orthologous WRKY genes with different promoter elements were also investigated. This study provides prospective knowledge for the properties and biological significance of the WRKY family in Citrus and functional research involved in HLB response."}], "Discussion": [{"passage_id": "Discuss.p0002", "text": "In this study, gene architectures, protein motifs, gene duplications and syntenic relationships of the WRKY family were globally analyzed in two Citrus species. Furthermore, the expression pattern and functional analysis of the WRKY genes were further investigated."}, {"passage_id": "Discuss.p0003", "text": "Genome-wide exploration and evolutionary analysis of WRKY genes among two Citrus species"}, {"passage_id": "Discuss.p0004", "text": "A BLASTp search and HMMER analysis revealed a total of 52 WRKY proteins in C. sinensis genome and 51 WRKY proteins in P. trifoliata genome. Previous research excavated 50 non-redundant WRKY genes in sweet orange by using “WRKY & Citrus” as keywords to search within ten databases. Detailed comparison exhibited that all of the 50 CsWRKYs were included in the WRKY genes identified in our study, and two more CsWRKYs (orange1.1t01175.1 and orange1.1t02759.1) were discovered in our results compared with the previous article, suggesting that our approach of BLASTp search after constructing the Hidden Markov Model could identify potential WRKY genes more comprehensively and completely. In both C. sinensis and P. trifoliata, most genes were discovered to be closely related to each other due to similarities in their intron-exon structures, indicating their close phylogenetic relationship. This remarkable resemblance in intron-exon structure also supports the concept of a common ancestry. It was also observed in both species that the intron number of the overwhelming majority of WRKY genes was higher in Group IIb than in other Groups. Similar findings in Arabidopsis, sesame, sorghum, and sugar beet were reported. A recent study demonstrated a higher frequency of intron loss than the frequency of intron gain after segmental duplication in rice. These results suggesting that Group Ia subfamily might have the original genes, from which other clusters were derived. Furthermore, the lowest number of introns were present in Group IIc, indicating that WRKY genes from Group IIc in Citrus might be in a posterior position in evolution. Other species i.e. Chenopodium quinoa and Isatis indigotica also exhibited the same feature."}, {"passage_id": "Discuss.p0005", "text": "The conserved motif analysis revealed interesting facts regarding the gene evolution. The motif 4 of Group I proteins, occurring just before the motif 1 containing WRKY domain, were also found in Group IIb proteins (Fig. 3), indicating that the Group IIb genes have been originated from the loss of the N-terminal WRKY domain of Group I genes. Additionally, the phylogenetic closeness and the conserved motifs of Group Ib, Group IId and Group IIIa indicate their evolution from a common origin. Notably, collinearity analysis exhibited that seven WRKY genes from C. sinensis and P. trifoliata had no orthologous genes between each other, among which six WRKY genes belonged to Group Ib (Fig. 4). Furthermore, five WRKY proteins containing a mutated WRKY domain of WRKYGKK with Q amino acid mutation to K amino acid all belonged to Group Ib (Supplementary Figure S1). Combined with the analysis of collinearity, we speculated that WRKY genes from Group Ib in Citrus might be in a relatively anterior position in evolution. Whereas, most members of other subgroups may have not evolved from the subgroup. Thus, our data support the theory of evolution of WRKY genes that the Group I is the oldest group, and Group II along with Group III have been evolved from Group I. In addition, our study further investigated that WRKY members of Group II and Group III may have been evolved from Group Ia in Citrus."}, {"passage_id": "Discuss.p0006", "text": "According to the research on the evolution of WRKY family between Arabidopsis and rice, some of the rice WRKY genes in Group III are evolutionarily more active than those in Arabidopsis, suggesting that evolution is more active in the Group III and these members of the group may have more functions in the monocotyledonous plants. This variation in the distribution of WRKY genes among monocotyledons and dicotyledons suggests that members of the Group III have been evolved independently after the dissection of the monocotyledons and dicotyledons. It’s worth mentioning that neither C. sinensis nor P. trifoliata has any members classified into Group IIIb. On the basis of the number of amino acid residues between the inner amino acids of the C2H zinc finger motifs, Group III was divided into two subgroups as Groups IIIa (n ≤ 23) and IIIb (n ≥ 24) respectively. Therefore, the deletion of Group IIIb WRKY genes in the genomes of two Citrus species might be due to the shortening of amino acids of these genes during evolution, which showed diversity in the length of WRKY domains."}, {"passage_id": "Discuss.p0007", "text": "Distribution of genes suggests unlike gene structure diversity of WRKYs in different species. Thus, the uneven distribution of genes is evidence of genetic variations resulting as an evolutionary process of these two species after divergence from each other. The recent gene duplication events including segmental duplication and tandem duplication were thought to be key driving forces in the expansion and evolution of gene families, as well as the raw materials for new biological functions. Because of their considerable contribution to various physiological processes, the WRKY family in angiosperms is likely to expand rapidly during evolution. Recent gene duplication events have been reported to be more extensive in the expansion of WRKY genes in many crops, such as rice and Arabidopsis. Nonetheless, in some cases, recent duplications seemed to play no substantial role in WRKY gene expansion. In our case also, we detected few tandem and segmental gene duplications in two Citrus species, C. sinensis and P. trifoliata, but not that conspicuous as compared to rice and Arabidopsis. Notably, we observed that all pairs of tandem-duplicated genes in both C. sinensis and P. trifoliata genome belonged to Group IIIa, which is consistent with a previous study on Arabidopsis. Our study revealed that
