<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PMC Full-text Prefilter Validation</title>
  <style>
    :root {
      --bg: #f6f8fb;
      --card: #ffffff;
      --ink: #17202a;
      --muted: #5d6d7e;
      --border: #d9e2ec;
      --blue: #2166ac;
      --green: #16833a;
      --red: #b03a2e;
      --gold: #9a6a00;
      --shadow: 0 10px 30px rgba(23,32,42,0.08);
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--bg); color: var(--ink); }
    header { position: sticky; top: 0; z-index: 5; background: rgba(246,248,251,0.96); border-bottom: 1px solid var(--border); padding: 10px 22px; backdrop-filter: blur(8px); }
    .top { display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
    h1 { font-size: 22px; margin: 0; }
    .stats { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .pill { background: var(--card); border: 1px solid var(--border); border-radius: 7px; padding: 8px 12px; font-weight: 700; }
    .pill .keep { color: var(--green); } .pill .drop { color: var(--red); } .pill .unsure { color: var(--gold); }
    main { max-width: 1150px; margin: 0 auto; padding: 18px; }
    .navrow { display: flex; gap: 10px; align-items: center; justify-content: flex-end; margin: 6px 0 12px; }
    input[type="number"] { width: 82px; padding: 10px; border: 1px solid var(--border); border-radius: 7px; font-weight: 700; }
    .progress { height: 10px; background: #e9eef5; border: 1px solid var(--border); border-radius: 999px; overflow: hidden; margin-bottom: 16px; }
    .bar { height: 100%; width: 0%; background: var(--blue); transition: width 0.2s ease; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 22px 24px; box-shadow: var(--shadow); }
    .pmcid { color: var(--blue); font-weight: 800; letter-spacing: 0.02em; }
    .title { font-size: 22px; line-height: 1.25; margin: 8px 0 8px; }
    .meta { color: var(--muted); font-size: 14px; margin-bottom: 14px; }
    .notice { background: #fff8e1; border-left: 4px solid #d6a400; padding: 10px 12px; margin: 12px 0; color: #5f4600; }
    .section { border-top: 1px solid var(--border); padding-top: 16px; margin-top: 18px; }
    .section h2 { font-size: 18px; margin: 0 0 10px; display: flex; align-items: center; gap: 8px; }
    .count { font-size: 12px; color: var(--muted); font-weight: 600; }
    .passage { margin: 12px 0; padding: 12px 14px; border-left: 4px solid #c8d6e5; background: #fbfdff; border-radius: 5px; }
    .pid { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; color: var(--muted); margin-bottom: 6px; }
    .text { line-height: 1.55; white-space: pre-wrap; }
    .empty { color: var(--muted); font-style: italic; }
    .buttons { display: grid; grid-template-columns: repeat(3, minmax(120px, 1fr)); gap: 12px; margin: 18px 0 12px; }
    button { border: 1px solid var(--border); background: #fff; color: #0b1520; border-radius: 7px; padding: 12px 14px; font-weight: 800; cursor: pointer; font-size: 15px; }
    button:hover { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(33,102,172,0.12); }
    button.selected.keep { background: #e8f6ed; border-color: var(--green); color: var(--green); }
    button.selected.drop { background: #fdecea; border-color: var(--red); color: var(--red); }
    button.selected.unsure { background: #fff6df; border-color: var(--gold); color: var(--gold); }
    .actions { display: flex; justify-content: space-between; align-items: center; gap: 12px; border-top: 1px solid var(--border); padding-top: 16px; flex-wrap: wrap; }
    .left, .right { display: flex; gap: 10px; flex-wrap: wrap; }
    .danger { color: #9c2f24; }
    .primary { background: #8eb2d4; color: white; border-color: #8eb2d4; }
    .primary.ready { background: var(--blue); border-color: var(--blue); }
    .hint { color: var(--muted); margin-top: 14px; font-size: 13px; }
    a { color: var(--blue); }
  </style>
</head>
<body>
  <header>
    <div class="top">
      <h1>PMC Full-text Prefilter Validation</h1>
      <div class="stats">
        <div class="pill">Done <span id="done">0</span>/50</div>
        <div class="pill">KEEP <span class="keep" id="keepCount">0</span></div>
        <div class="pill">DROP <span class="drop" id="dropCount">0</span></div>
        <div class="pill">UNSURE <span class="unsure" id="unsureCount">0</span></div>
      </div>
    </div>
  </header>
  <main>
    <div class="navrow">
      <label for="goto"><strong>Go to</strong></label>
      <input id="goto" type="number" min="1" max="50" value="1">
    </div>
    <div class="progress"><div class="bar" id="bar"></div></div>
    <div class="card">
      <div class="pmcid" id="pmcid"></div>
      <div class="title" id="title"></div>
      <div class="meta" id="meta"></div>
      <div id="notice"></div>
      <div id="sections"></div>
      <div class="buttons">
        <button id="btnKeep" onclick="setLabel('KEEP')">KEEP</button>
        <button id="btnDrop" onclick="setLabel('DROP')">DROP</button>
        <button id="btnUnsure" onclick="setLabel('UNSURE')">UNSURE</button>
      </div>
      <div class="actions">
        <div class="left">
          <button onclick="prevArticle()">Previous</button>
          <button onclick="nextArticle()">Next</button>
        </div>
        <div class="right">
          <button class="danger" onclick="clearCurrent()">Clear Current</button>
          <button class="danger" onclick="resetAll()">Reset All</button>
          <button id="download" class="primary" onclick="downloadTSV()">Submit and Download TSV</button>
        </div>
      </div>
    </div>
    <div class="hint">Labels are saved in this browser as you click. The download contains PMCID and your KEEP/DROP/UNSURE judgment.</div>
  </main>
<script>
const ARTICLES = [{"pmcid": "PMC10004717", "title": "MdWRKY120 Enhance Apple Susceptibility to Alternaria alternata", "source_file": "PMC10004717.json", "source_url": "https://pmc.ncbi.nlm.nih.gov/articles/PMC10004717/", "included_counts": {"Abstract": 1, "Introduction": 4, "Discussion": 3, "Conclusion": 2}, "omitted_results_discussion": false, "sections": {"Abstract": [{"passage_id": "Abstract.p0001", "text": "Alternaria alternata (A. alternata) is a common pathogen that greatly influences apples’ quantity and quality. However, chemical treatments produce increased health risks along with decreased food and environmental safety. Advancements in plant molecular biology, such as transgenic technology, have increased apple trees’ resistance to pathogens and have therefore attracted widespread attention. WRKY transcription factors are involved in abiotic and biotic stress regulation; however, their biological role in non-model plants such as apple, is still unknown. In this investigation, MdWRKY120 was isolated from the ‘GL-3′ apple to determine its function during Alternaria alternate infection. The MdWRKY120-GFP fusion protein was located in the nucleus. MdWRKY120 in yeast cells exhibited activating transcriptional activity, meaning it is a transcription activator. MdWRKY120 overexpression transgenic plants were more sensitive to A. alternata, while RNAi transgenic plants showed increased resistance to A. alternata. This investigation demonstrates that MdWRKY120 enhances the susceptibility of apples to A. alternata."}], "Introduction": [{"passage_id": "Introduction.p0002", "text": "Apple (Malus × domestica) is among the most important fruit crops, belongs to the family Rosaceae, and is widely cultivated globally due to its elevated nutritional and economic values. However, various fungal diseases seriously threaten the yield and quality of apples all around the world. Apple Alternaria leaf spot is a fungal disease caused by the Alternaria alternata (A. alternata) and is one of the most serious diseases that affect apple. Circular black or brownish leaf spots cause defoliation and reduce photosynthesis, fruit quality, and apple production. Currently, chemical treatments are the main methods to control the disease; however, these treatments produce food safety concerns and environmental pollution. Sustainable crop production and minimal chemical use against plant-pathogen interactions have attracted great attention. Although extensive breeding studies have been conducted, the knowledge of genetic understanding of pathogen defense is still limited. Further, since apples have a long breeding cycle, little progress has been made in this field. Therefore, it is important to find disease-resistant genes and explore the potential molecular mechanisms associated with their anti-infection activity."}, {"passage_id": "Introduction.p0003", "text": "The WRKY family is an important transcription factor family in higher plants, regulating growth and development. The WRKY transcription factor contains at least 1~60 amino acids-long conserved domain of WRKY, a highly conserved N-terminal heptapeptide called WRKYGQK, and a C-terminal-, C2H2-, or C2HC-type zinc finger structure. Based on the number of WRKY conserved domains and the type of zinc finger structure, the WRKY transcription factors are classified into three groups. Genome sequencing has helped identify many WRKY gene families in various crops. Arabidopsis thaliana consists of 75 genes, the apple of 127 genes, maize of 119 genes, and rice of 103 genes. The WRKY family is crucial for regulating biotic and abiotic stress, such as drought, salt stress, disease resistance, seed germination, and flower development."}, {"passage_id": "Introduction.p0004", "text": "As has been recently reported, WRKY40s are essential for plant immune response. WRKY protein’s function against biotic stresses in horticultural plant species has also been studied. In pepper immunity, WRKY40 directly regulates ChiIV3 expression level, thereby significantly increasing its resistance to Ralstonia solanacearum. It was also found that, in the resistant (WR315) plants, there was WRKY40 up-regulation under Fusarium stress, whereas, in susceptible (JG62) plants, it lacked expression. Furthermore, in Arabidopsis, heterologous chickpea WRKY40 over-expression stimulated an immune response against Pseudomonas syringae. In Arabidopsis, simultaneous WRKY18 and WRKY40 mutations render otherwise susceptible wild-type species resistant to the Golovinomyces orontii, a biotrophic powdery mildew fungus. In some species, WRKY40 is reported to have opposite regulations; for instance, the GhWRKY40 transcription levels in cotton increased after bacterial pathogen R. solanacearum infection, and it improved most of the defense-associated genes, increased the wounding tolerance, and the resisitance to R. solanacearum. Overall, WRKY40 significantly regulates a variety of plant stress responses; however, little is known about its function in apples against A. alternata."}, {"passage_id": "Introduction.p0005", "text": "In our previous study, we found that AtWRKY40 and MdWRKY120 are homologous genes and, thus, it was hypothesized that they have similar functions. Therefore, this study is focused on MdWRKY120, which was expressed in all the studied tissues and was relatively high in the fruit and root. The green fluorescent protein (GFP) labeled MdWRKY120 protein was localized in the nucleus and displayed transcriptional activity in yeast cells. When non-transformed plants were compared with overly expressed MdWRKY120 plants, the latter were more susceptible to A. alternata. Overall, MdWRKY120 is crucial for regulating A. alternata resistance in apples. This study on MdWRKY120 against A. alternata resistance will pave the foundation for the molecular genetic breeding of apple disease resistance."}], "Discussion": [{"passage_id": "Discuss.p0002", "text": "A. alternata is a fungus that leads to crop diseases, especially in Asian countries such as China. Alternaria infection produces circular black or brownish spots that develop on apple leaves during late spring to early summer and which cause defoliation. The infection leads to reduced photosynthesis, fruit quality, and apple production. Currently, effective treatment methods mainly include chemical use, which can cause cross-resistance. The disease can also arouse the inherent immune response of plants, although little is known about this."}, {"passage_id": "Discuss.p0003", "text": "The literature suggests the involvement of WRKY proteins in microbe-associated molecular pattern-triggered immunity and other important mechanisms. The immune system of plants has two models, including (1) PAMP-triggered immunity, and (2) effector-triggered immunity. Pathogen resistance is a complicated process involving transcriptional regulation, and transcription factors are essential for plant defense responses. With the recent rapid advancements in molecular biology and transgenic technology, plants’ immunity can be improved by genetic modification. WRKY transcription factors directly or indirectly regulate the expression of downstream stress resistance genes (such as disease resistance-related genes, PR) and improve pathogenic resistance by regulating the immune response in many species. In a preliminary study, Hawthorns infected by apple chlorotic leaf spot virus (ACLSV) were investigated by high-throughput sequencing, and it was found that plant-pathogen interaction-related genes (WRKY transcription factors) were significantly up-regulated in the infected group."}, {"passage_id": "Discuss.p0004", "text": "WRKY40 (WRKY family member) is associated with resistance against biotic stress. Many complex and overlapping networks, including WRKYs, regulate multiple biological processes in plants. The heterologous expression of GhWRKY40 enhanced the susceptibility of tobacco to R. solanacearum and its reduction in the expression of PR1 and PR2 genes in the SA signal transduction pathway, ACS6 genes in the ET signal transduction pathway, and JAZ1 and JAZ3 genes in the JA signal transduction pathway has been reported. In poplar plants, PtrWRKY40 overexpression enhances its sensitivity to ulcerative pathogens and decreases the expression of genes related to SA signaling pathways PR1.1, PR2.1, PR5.9, and CPR5. These results suggest that WRKY40 proteins are the transcription factors that are functionally conserved and regulate plants’ abiotic stress response. According to phylogenetic alignment, MdWRKY120 and AtWRKY40 are homologous genes. MdWRKY120 protein had activating transcriptional activity and its overexpression reduced the resistance to A. alternata. Unlike other species, WRKY40 family genes play a negative regulatory role in the immune resistance mechanism against spotted fall disease in apples. An in-depth investigation to evaluate the exact mechanism is needed. This research puts forth crucial information regarding the apple plants’ resistance to Alternaria."}], "Conclusion": [{"passage_id": "Concl.p0002", "text": "In summary, our study finds that MdWRKY120 overexpression transgenic plants were more sensitive to A. alternata, while RNAi transgenic plants showed increased resistance to A. alternata. This research puts forth crucial information regarding the apple plants’ resistance to Alternaria."}, {"passage_id": "Concl.p0003", "text": "Publisher’s Note: MDPI stays neutral with regard to jurisdictional claims in published maps and institutional affiliations."}]}}, {"pmcid": "PMC10004776", "title": "Genome-Wide Analysis of MYB Transcription Factor Gene Superfamily Reveals BjPHL2a Involved in Modulating the Expression of BjCHI1 in Brassica juncea", "source_file": "PMC10004776.json", "source_url": "https://pmc.ncbi.nlm.nih.gov/articles/PMC10004776/", "included_counts": {"Abstract": 1, "Introduction": 4, "Discussion": 5, "Conclusion": 2}, "omitted_results_discussion": false, "sections": {"Abstract": [{"passage_id": "Abstract.p0001", "text": "Brassica juncea is an economically important vegetable and oilseed crop. The MYB transcription factor superfamily is one of the largest transcription factor families in plants, and plays crucial roles in regulating the expression of key genes involved in a variety of physiological processes. However, a systematic analysis of the MYB transcription factor genes in Brassica juncea (BjMYB) has not been performed. In this study, a total of 502 BjMYB superfamily transcription factor genes were identified, including 23 1R-MYBs, 388 R2R3-MYBs, 16 3R-MYBs, 4 4R-MYBs, 7 atypical MYBs, and 64 MYB-CCs, which is approximately 2.4-fold larger than that of AtMYBs. Phylogenetic relationship analysis revealed that the MYB-CC subfamily consists of 64 BjMYB-CC genes. The expression pattern of members of PHL2 subclade homologous genes in Brassica juncea (BjPHL2) after Botrytis cinerea infection were determined, and BjPHL2a was isolated from a yeast one-hybrid screen with the promoter of BjCHI1 as bait. BjPHL2a was found to localize mainly in the nucleus of plant cells. An EMSA assay confirmed that BjPHL2a binds to the Wbl-4 element of BjCHI1. Transiently expressed BjPHL2a activates expression of the GUS reporter system driven by a BjCHI1 mini-promoter in tobacco (Nicotiana benthamiana) leaves. Taken together, our data provide a comprehensive evaluation of BjMYBs and show that BjPHL2a, one of the members of BjMYB-CCs, functions as a transcription activator by interacting with the Wbl-4 element in the promoter of BjCHI1 for targeted gene-inducible expression."}], "Introduction": [{"passage_id": "Introduction.p0002", "text": "Brassica juncea is an economically important vegetable and oilseed crop widely cultivated in Asia and Europe. In terms of the well-known “triangle of U” model, Brassica juncea is an allotetraploid (AABB, 2n = 4x = 36) improved through interspecific hybridization between the diploid progenitors Brassica rapa (AA, 2n = 20) and Brassica nigra (BB, 2n = 16), followed by spontaneous chromosome doubling. The fungal pathogen Botrytis cinerea is a persistent threat to plants throughout the world, including Brassica juncea, causing massive yield loss in agriculture. Chitin has been recognized as a general elicitor of plant immune responses, and is also a major structural component of the carbohydrate skeleton of the cell wall of Botrytis cinerea. Plants have developed a sophisticated system to fight against Botrytis cinerea via catalyzing chitin cleavage in the cell wall. Plant chitinases, a class of pathogenesis-related enzymes (PRs), play an essential role in this process via randomly cleaving internal β-1, 4 glycosidic linkages in chitin."}, {"passage_id": "Introduction.p0003", "text": "BjCHI1 is the first isolated chitinase gene whose expression is associated with defense against Botrytis cinerea attack in Brassica juncea. BjCHI1 contains two chitin binding domains (CBDs), and extensive investigation has shown that inducible expression of BjCHI1 is required for defense against Botrytis cinerea. Several cis-acting elements have been predicted in the promoter of BjCHI1 (BiC-P), and a W box-like 4 element (Wbl-4 box) was recently verified as a fungus-responsive cis-acting element. A yeast one-hybrid (Y1H) screen with the core fungus-inducible element as bait was used to identify a number of transcription factors from a cDNA library in Brassica juncea, which were isolated and verified. BjMYB1, an MYB-CC transcription factor, displayed binding activity to this element and activated the expression of BjCHI1. Moreover, Bj26, a C2H2-type zinc finger protein also displayed binding and activating activity toward the Wbl-4 box. However, the protein factors involved in the hierarchical and dynamic induction of BjCHI1 remain unclear."}, {"passage_id": "Introduction.p0004", "text": "The fungus-responsive Wbl-4 box in the promoter of BjCHI1 is recognized by BjMYB1, providing novel insight into the transcriptional regulation of BjCHI1. MYB-like transcription factors are one of the largest transcription factor families in plants, they play important roles in regulating plant growth and protecting plants from various sources of stress, and they are distinguished by the presence of conserved DNA-binding domains named R repeats. MYB transcription factors are thus classified into four subfamilies based on the number of R repeats: R2R3-MYB, 1R-MYB, 3R-MYB, and 4R-MYB. The MYB–CC type transcription factors are a subtype within the MYB transcription factor superfamily that harbor a combination of MYB and coiled-coil (CC) motifs. PHR1 and other MYB-CC genes modulate the phosphate starvation response in plants via binding to the PHR1-binding DNA sequence (P1BS) cis-regulatory element within either the 5’ untranslated regions (UTRs) or the promoter regions of phosphate starvation-induced (PSI) genes. MYB and MYB-CC transcription factor genes have been well characterized in a number of plant species, such as Arabidopsis thaliana, Zea mays, rice (Oryza sativa), Brassica rapa, Brassica napus, Hedychium coronarium, Cymbidium ensifolium, Apocynum venetum, carrot (Daucus carota), mango (Mangifera indica), chili pepper, and sweet cherry (Prunus avium L.). Nevertheless, relatively few members of the MYB transcription factors in Brassica juncea (BjMYBs) have been well explored, and there is still no comprehensive study of BjMYBs to date."}, {"passage_id": "Introduction.p0005", "text": "Our previous investigation revealed that BjMYB1 plays an important role in mediating the inducible expression of BjCHI1 by Botrytis cinerea and its derived elicitor chitin. In the current study, we conducted a genome-wide exploration of the MYB transcription factor superfamily in Brassica juncea, including 23 1R-MYBs, 388 R2R3-MYBs, 16 3R-MYBs, 4 4R-MYBs, 7 atypical MYBs, and 64 MYB-CCs; phylogenetic analysis and the chromosomal location of BjMYBs were determined. In addition, the gene structure and expression profiles of BjMYB-CCs were analyzed. Finally, BjPHL2a was isolated and verified to be required for inducible expression of BjCHI1 via interaction with the fungus-responsive Wbl-4 box in the mini-promoter region of BjCHI1."}], "Discussion": [{"passage_id": "Discuss.p0002", "text": "The MYB-like superfamily transcription factors are one of the largest transcription factor families in plants and play important roles in a wide range of physiological processes, such as light signaling, the anthocyanin biosynthetic pathway, hypocotyl elongation, phosphate starvation, and resistance to biotic and abiotic stresses. Although MYB and MYB-CC transcription factor genes have been identified in a number of plant species at the genome-wide level, there is little information available on this superfamily in the Brassica juncea genome. Recently, bioinformatics and publicly released data sets describing the genome and transcriptome of Brassica juncea have paved the way for systemically exploring this important crop species. In the present study, a total of 502 BjMYB genes were identified in Brassica juncea, which were divided into six subfamilies (1R-, R2R3-, 3R-, 4R-, atypical MYBs, and MYB-CCs) and clustered into 15 groups (Figure 1 and Table S1). The number of BjMYB genes was greater than those of Arabidopsis thaliana (212), Oryza sativa (213), Zea mays (169), Brassica rapa (354), and Brassica oleracea (330), but fewer than that in Brassica napus (556). BjMYB proteins were not equally distributed into 15 different groups in the phylogenetic tree (Figure 1). Among them, the top largest groups (C1, C9, C13, C14, and C15) represented around 70% of the total BjMYB members (Figure 1 and Table S1), suggesting that these groups may be highly differentiated in the Brassica juncea genome. Moreover, the large range of Mw and pI of BjMYBs suggests their functional diversity in distinct biological processes, which may be attributed to their difference in full-length amino acid sequences and rest domains, in addition to similarity in MYB domains."}, {"passage_id": "Discuss.p0003", "text": "As displayed in Figure 2, the 471 (93.82%) identified members of BjMYB genes were unevenly distributed across all 18 chromosomes at different densities. Among them, 241 BjMYB genes were mapped to the A subgenome and 230 BjMYB genes to the B subgenome of Brassica juncea. The chromosomes A01 to A10 and B01 to B08 represent the two parental diploid ancestors of Brassica juncea. The number of BjMYB genes (502) was found to be less than the sum of its two parental lines, Brassica rapa (301) and Brassica nigra (>300), indicating loss of MYB genes also happened after allopolyplodization. In general, every AtMYB-CC was expected to have four to six homologs in Brassica juncea. Consistently, 15 AtMYB-CCs had 64 homologous genes in Brassica juncea (Figure 4A and Table S1). For example, AtPHL2 had four homologs (BjPHL2a, BjPHL2b, BjPHL2a1, and BjPHL2b1) and AtPHR1 had five homologs (BjPHR1a, BjPHR1b, BjPHR1a1, BjPHR1b1, and BjPHR1b2). In terms of the overall gene structure, significant differences were found in the number of introns among BjMYB-CC subfamily members (Figure 3). However, the overall intron/exon distribution within members of the same subclade was highly similar, such as PHL2-, PHL3-, and PHR1-subclade (Figure 3), indicating that the biological significance of these homologous genes may be redundantly conserved to a certain extent."}, {"passage_id": "Discuss.p0004", "text": "It is tempting to speculate that gene expression patterns can provide important clues for gene function. The expression patterns of 64 BjMYB-CC genes from three type of abiotic stresses were determined (Figure 5). Only a few BjMYB-CC genes displayed inducible expression by at least one analyzed treatment (Figure 5 and Table S4). Furthermore, qRT-PCR analysis revealed similar expression patterns after Botrytis cinerea infection of the three AtPHL2 homologs in Brassica juncea (BjPHL2a, BjPHL2b, and BjPHL2a1, Figure 6)."}, {"passage_id": "Discuss.p0005", "text": "Previous work has shown that the MYB-CC transcription factor BjMYB1 can bind to W-box or W-box-like elements, but not to AC elements. As mentioned above, MYB–CC type transcription factors are a distinct subfamily of the plant MYB superfamily, which were originally identified as phosphate starvation response (PHR) protein family transcription factors, such as AtPHR1 and OsPHR2. It is well known that PHR protein family members can transactivate the expression of a broad range of PSI genes by binding to P1BS cis-elements in a phosphate (Pi)-dependent manner. The P1BS cis-regulatory element is characterized by the nucleotide motif GNATATNC or CATATATG. We also observed a putative P1BS-like cis-element (CATATATCG) near the fungus-responsive Wbl-4 box in the promoter of BjCHI1. Besides serving as master transcriptional regulators of the phosphate sensing pathway, PHR1-like MYB-CC proteins (such as AtPHR1 and OsPHR1/2/3) have been recently reported to play central roles in the balance between nutrient stress response and immune regulation or mycorrhizal symbiosis with respect to root microbiota. One possibility is that the observed binding activity of MYB-CC-like proteins (BjMYB1 and BjPHL2a) to the Wbl-4 box containing mini-promoter may also be partially attributed to the putative P1BS-like cis-element near the Wbl-4 box. In other words, PHR1-like MYB-CC proteins may also have roles in fighting against Botrytis cinerea infection via modulating the expression of BjCHI1. We found four AtPHL2 homologs in Brassica juncea and similar expression patterns after Botrytis cinerea infection was observed among three paralogs (Figure 6). The previously isolated BjMYB1 showed sequence differences compared with other BjPHL2 s (Figures S1–S3). Therefore, it is possible that BjPHL2a, together with the closed paralogs, may be redundantly involved in fighting against fungal attack by interacting with the Wbl-4 element in the promoter of BjCHI1."}, {"passage_id": "Discuss.p0006", "text": "Recently, hierarchical and dynamic regulation of defense-responsive genes by AtMYB51 and AtWRKY33 has been reported. The cognate nucleotide motif of the Wbl-4 box (GTGACT), also shows a minor difference to the core nucleotide sequence of classical W-boxes (C/TTGACC/T). This may be the major reason that we have not isolated any WRKY-like transcription factors to date. However, another possibility is that BjPHL2a or BjMYB1 and BjWRKY transcription factors may function coordinately to control the inducible expression of BjCHI1."}], "Conclusion": [{"passage_id": "Concl.p0002", "text": "In the present study, the identification, classification, and expression analysis of the MYB gene superfamily was comprehensively evaluated at the whole genome level in Brassica juncea. Functional and molecular studies showed that BjPHL2a functions as a transcription activator by interacting with the Wbl-4 element in the promoter of BjCHI1 for targeted gene inducible expression after Botrytis cinerea infection."}, {"passage_id": "Concl.p0003", "text": "Disclaimer/Publisher’s Note: The statements, opinions and data contained in all publications are solely those of the individual author(s) and contributor(s) and not of MDPI and/or the editor(s). MDPI and/or the editor(s) disclaim responsibility for any injury to people or property resulting from any ideas, methods, instructions or products referred to in the content."}]}}, {"pmcid": "PMC10009949", "title": "Overexpression of the elongation factor MtEF1A1 promotes salt stress tolerance in Arabidopsis thaliana and Medicago truncatula", "source_file": "PMC10009949.json", "source_url": "https://pmc.ncbi.nlm.nih.gov/articles/PMC10009949/", "included_counts": {"Abstract": 7, "Introduction": 5, "Discussion": 5, "Conclusion": 1}, "omitted_results_discussion": false, "sections": {"Abstract": [{"passage_id": "Abstract.p0001", "text": "Background"}, {"passage_id": "Abstract.p0002", "text": "Elongation factor 1 A (EF1A), an essential regulator for protein synthesis, has been reported to participate in abiotic stress responses and environmental adaption in plants. However, the role of EF1A in abiotic stress response was barely studied in Medicago truncatula. Here, we identified elongation factor (EF) genes of M. truncatula and studied the salt stress response function of MtEF1A1 (MTR_6g021805)."}, {"passage_id": "Abstract.p0003", "text": "Results"}, {"passage_id": "Abstract.p0004", "text": "A total of 34 EF genes were identified in the M. truncatula genome. Protein domains and motifs of EFs were highly conserved in plants. MtEF1A1 has the highest expression levels in root nodules and roots, followed by the leaves and stems. Transgenic Arabidopsis thaliana overexpressing MtEF1A1 was more resistant to salt stress treatment, with higher germination rate, longer roots, and more lateral roots than wild type plant. In addition, lower levels of H2O2 and malondialdehyde (MDA) were also detected in transgenic Arabidopsis. Similarly, MtEF1A1 overexpressing M. truncatula was more resistant to salt stress and had lower levels of reactive oxygen species (ROS) in leaves. Furthermore, the expression levels of abiotic stress-responsive genes (MtRD22A and MtCOR15A) and calcium-binding genes (MtCaM and MtCBL4) were upregulated in MtEF1A1 overexpressing lines of M. truncatula."}, {"passage_id": "Abstract.p0006", "text": "These results suggested that MtEF1A1 play a positive role in salt stress regulation. MtEF1A1 may realize its function by binding to calmodulin (CaM) or by participating in Ca2+-dependent signaling pathway. This study revealed that MtEF1A1 is an important regulator for salt stress response in M. truncatula, and provided potential strategy for salt-tolerant plant breeding."}, {"passage_id": "Abstract.p0007", "text": "Supplementary Information"}, {"passage_id": "Abstract.p0008", "text": "The online version contains supplementary material available at 10.1186/s12870-023-04139-5."}], "Introduction": [{"passage_id": "Introduction.p0001", "text": "Background"}, {"passage_id": "Introduction.p0002", "text": "Elongation factors (EFs) are common cellular proteins that are responsible for the extension of peptide chains during protein synthesis. There are three prokaryotic extension factors: EF thermo unstable (EF-Tu), EF thermo stable (EF-Ts), and elongation factor G (EF-G). Eukaryotic EFs can be divided into the eEF1, eEF2, and eEF3 families. The eEF1 complex causes conformational changes in ribosomes and catalyzed aa-tRNA, resulting in the hydrolysis of GTP and the release of eEF1A·GDP. eEF1 contains four subunits: eEF1A, eEF1Bα, eEF1Bβ, and eEF1Bγ. eEF1A is equivalent to prokaryotic EF-Tu, accounting for 1–2% of total cellular protein content. The guanine nucleotide exchange factor (GEF) eEF1B promotes the exchange of GDP and GTP, allowing eEF1A to participate in another round of peptide chain extension. eEF1Bα is also involved in plant phosphorylation and is related to serine. In Arabidopsis, the silencing of eEF1Bβ leads plant dwarfing and reduced total lignin and crystalline cellulose, respectively. eEF1Bγ has been demonstrated to participate in oxidative stress response and may be related to its glutathione transferase (GST) properties. eEF2 is a monomer that catalyzes the movement of ribosomes bound to mRNA. Through the phosphorylation and inactivation of eukaryotic extension factor-2 kinase (eEF2K), extension of peptide chains is hindered and protein synthesis was inhibited. In eukaryotes, eEF3 can assist eEF1A delivering aa-tRNA and removing deacyl-tRNA from the E-site, ensuring peptide chain extension. Together with two paralogous genes, YEF3 (YLR249W) and HEF3 (YNL014W), eEF3 also plays an important role in detoxification of reactive oxygen species (ROS)."}, {"passage_id": "Introduction.p0003", "text": "Arabidopsis thaliana contains a family of four EF1A genes (AtEF1A1–4) that are divided into two subfamilies based on sequence similarity and physical location within the genome. The four EF1A genes in soybean (Glycine max) can also be divided into two subfamilies, type A and type B; Al and A2 are highly expressed in green organs (leaves and stems), whereas there is little difference in expression levels of the four genes in the roots. Eukaryotic cells contain two isoforms of EF1A, EF1A1 and EF1A2, that have structural differences. Some studies have shown that the structure and sequences of plant EF1A genes are relatively conserved across species. It has been previously reported that AtEF1A2 (AT1G07930) and AtEF1A4 (AT5G60390) have stable structures and high expression levels in Arabidopsis. Analysis with NormFinder, which compares potential internal reference genes, showed that EF1A was expressed stably under pyrene and heavy metal treatments in mangrove (Aegiceras corniculatum). Furthermore, EF1A was stably expressed under salt, osmotic, and metal stress conditions in cucumber (Cucumis sativus) and under drought stress in Chinese cabbage (Brassica rapa)."}, {"passage_id": "Introduction.p0004", "text": "EF1A genes are induced by environmental stress in many plants. EF1A expression was found to be induced by heat and cold stress in barley (Hordeum vulgare) and maize (Zea mays). In wheat (Triticum aestivum), EF1A expression increases in response to heat; this may be due to the involvement of EF1A in protein folding as a molecular chaperone, protecting heat-resistant proteins from heat damage or enhancing heat resistance by promoting protein synthesis or transcriptional activation. Subsequent studies have found that two or three basic peptides or subtypes of EF1A can increase EF1A abundance under heat stress. Yeast hybrid and northern blot assays showed that AcEF1A of Bruguiera sexangula enhances tolerance to salt and osmotic stress in Escherichia coli. A cDNA clone of AtEF1A2 was isolated from a salt-sensitive calcineurin (CaN) yeast deletion mutant library. This gene has companion protein activity promoting refolding of unfolded proteins in cell or in vitro which enhances salt tolerance in yeast, and overexpression in plants confers salt tolerance. In recent years, researchers have studied the regulatory network of miRNAs responsive to salt stress in barley; they found that EF1A plays a role in salt tolerance as a molecular companion and is the target gene of miR169i and the novel miRNA PC-mir124."}, {"passage_id": "Introduction.p0005", "text": "Plants respond and adapt to salt stresses by osmotic stress and ion stress, which can reduce the cell volume and the cell division rate, slow the growth of leaves and roots at different stages, and cause inhibition of plant photosynthesis. Salt stress accumulation can also promote the accumulation of reactive oxygen species (ROS) and damage the cell membrane structure. Compared with the control group, the overexpression of soybean GmEF4 significantly delayed leaf wilting, prolonged root system, increased biomass and decreased ROS accumulation under drought and salt treatment. Meanwhile, EF1A has rarely been reported to be involved in Medicago truncatula salt stress signaling. In our previous study, we conducted an iTRAQ proteomic analysis in M. truncatula ecotype R108 and M. sativa cv. Zhongmu3. From those data, an elongation factor protein (MTR_6g021805) was found to be induced by salt stress (1.51-fold and 1.20-fold change in M. truncatula and M. sativa, respectively). Here, we cloned MtEF1A1 from M. truncatula and explored the molecular mechanisms through which it participates in salt stress responses. We found that MtEF1A1 overexpression enhanced salt tolerance in Arabidopsis and M. truncatula, and a model of MtEF1A1 regulation under salt stress was proposed, likely through calcium signaling pathways. These results position MtEF1A1 as a promising candidate gene for breeding salt tolerance in forage plants."}], "Discussion": [{"passage_id": "Discuss.p0002", "text": "Elongation is the most important step in translation and is completed by highly conserved eukaryotic EF genes. EF1A protein has chaperone activity and can function in protein renaturation and structural changes. The EF1A plastid protein is encoded by the nuclear genome, synthesized in the cytoplasm, then targeted to the plastid. EF1A is also found in mitochondria, which can play a role in protein synthesis and translation by catalyzing the extension of amino acid chains on the ribosome. The sequence of MtEF1A1 (MTR_6g021805) was obtained from Ensembl (http://plants.ensembl.org/index.html), and homology comparison on the TAIR website (https://www.arabidopsis.org/cgi-bin/Blast/) yielded the four Arabidopsis genes with the highest similarity (96% amino acid sequence identity): AtEF1A1 (AT1G07920), AtEF1A2 (AT1G07930), AtEF1A3 (AT1G07940), and AtEF1A4 (AT5G60390). EF1A plays a role in protein synthesis, and it is often considered a housekeeping gene due to its conserved structure between different species. However, plant EF1A proteins are always encoded by multiple genes, and EF1A expression is not consistent between organs and developmental stages. In tomato and apple, EF1A is expressed at higher levels in young leaves than in mature leaves. EF1A is more highly expressed in the stems and roots of Chinese jujube (Ziziphus jujube) and cotton (Gossypium spp.) compared to the flowers, but the opposite is true in banana (Musa paradisiaca). EF1A is expressed at higher levels in tomato roots than stems, consistent with the expression of MtEF1A1 in M. truncatula (Fig. 1C)."}, {"passage_id": "Discuss.p0003", "text": "The growth status of plants is shown by related characteristics indicators such as plant height, plant weight, root length and lateral root number, which can be inhibited under stress conditions. At the same time, stress can affect indicators of plant growth at different stages, such as germination rate and survival rate. Studies have shown involvement of EF1A in abiotic and biotic stress responses in plants, potentially allowing for crop improvement via manipulation of EF1A. In the present study, Arabidopsis plants overexpressing MtEF1A1 showed that there was no significant difference in terms of germination rate compared with WT plants when they were grown on 1/2 MS medium; MtEF1A1-OE lines did have a significantly higher germination rate than WT when the seedlings were exposed to salt stress (Fig. 2). This indicated that overexpression of MtEF1A1 could improve germination rate to some extent. WT Arabidopsis plants were more sensitive to salt stress than OE lines; the germination rates of OE5, OE6, and OE15 plants were higher than the WT (Fig. 2A and D). In Arabidopsis plants grown in soil, those overexpressing MtEF1A1 had higher weight than WT plants, with or without salt treatment (Fig. 4A); there was also a significant difference in the stem weight of MtEF1A1-OE plants (Fig. 4G). Based on these results, MtEF1A1 may be involved in pathways related to plant salt stress responses, but may also improve growth and development of Arabidopsis. It has previously been shown that there is crosstalk pathways related to salt stress responses and plant development. The content of MDA, H2O2, proline and chlorophyll in plant leaf cells is an important physiological index to evaluate plant stress resistance, which can essentially explore the physiological mechanism of plants. In soybean, the contents of H2O2, O2− and MDA decreased, while the content of proline increased in GmEF4 overexpressing plants after stress treatment. H2O2 is an important reactive oxygen molecule. In this study, the OE lines maintained lower levels of H2O2 and the result showed that OE lines could decrease the membrane lipid peroxidation damage caused by stress (Fig. 4B). The MDA content is known as a physiological marker of lipid peroxidation rate in plant, and is correlated with oxidative stress. MDA was lower in OE lines indicating that the plasma membrane of OE lines was less influenced and lipid peroxidation was reduced (Fig. 4C). Proline, a stress response factor, did not always accumulate significantly in plants under stress, and the proline content of OE lines was lower than WT, which may be that the proline accumulation at this point appears to be a response to injury rather than an alleviator, and MtEF1A-overexpression Arabidopsis lines were less stimulated by the stress than WT."}, {"passage_id": "Discuss.p0004", "text": "Similar results were observed in M. truncatula; MtEF1A1 overexpression improved salt tolerance. To verify the salt tolerance of three-week-old M. truncatula plants, we examined the responses of WT and MtEF1A1-OE plants to salt stress during seedling growth (Fig. 6). Under salt stress conditions, MtEF1A1-OE lines had longer roots and higher fresh weight compared with the WT plants significantly (Fig. 6A-C). However, the difference of root length was not significant between the two OE lines, but there was difference in plant weight (Fig. 6B and C). This may have been a result of the low contribution of root weight to the total fresh weight. The influence of MtEF1A1 overexpression on aboveground tissue weight compared to underground biomass requires further study in M. truncatula. In M. truncatula grown in soil for 60 d, those overexpressing MtEF1A1 isolated leaves had increased tolerance of H2O2 treatment, and the chlorophyll content was significantly higher in the leaves of one MtEF1A1-OE line than in WT plants. However, when isolated leaves were treated with 200 mM NaCl solution, there was no difference in chlorophyll content between MtEF1A1-OE and WT leaves (Fig. 5). This may be due to the faster process of ROS accumulation after H2O2 treatment. Meanwhile, salt treatment of the whole Arabidopsis also affected the H2O2 content of the plant, which EF1A overexpression can alleviate (Fig. 4B). DAB staining in seedlings showed that the MtEF1A1-OE lines had lower ROS accumulation in response to salt stress compared to the WT, and that the WT showed generally higher ROS accumulation in the roots. This may be due to the high expression level of EF1A in the roots of M. truncatula, so the root damage degree of EF1A-overexpression lines was lower than that of WT under salt stress (Fig. 7). All above experiments of stress treatment in isolated leaves and DAB staining test speculated that overexpression of MtEF1A1 may enhance plant salt tolerance by inhibiting the accumulation of ROS."}, {"passage_id": "Discuss.p0005", "text": "Regulation of salt stress involves the salt sensitive (SOS) pathway, which regulates a range of proteins, including kinases, ion transporters, members of the calcium-dependent protein kinase (CDPK) pathway, and those in the mitogen-activated protein kinase (MAPK) pathway. Ca2+ signaling usually functions as a secondary messenger in response to external stimuli. CaM, CAM-like protein (CML), and CDPKs regulate plant resistance by binding to downstream effector proteins. For example, AtCaM7 acts as a transcription factor in direct response to light stress. AtTGA3 transcription factor can directly bind to the AtCaM3 promoter region and promote downstream stress response. Ca2+ signal-dependent CaM binding usually causes structural changes in the target proteins or promotes their expression. MtCDPK26 and AtCPK6 are both CDPKs. AtCPK6 and other CDPKs are activated by Ca2+ signals. AtCPK6 overexpression promotes salt stress tolerance in Arabidopsis. Calcineurin B-like proteins (CBLs) act as Ca2+ sensors; their targets, CBL-interacting protein kinases (CIPKs), function in plant signal regulation. Salt signaling promotes Ca2+ accumulation, which activates CBL4/SOS3 and CBL10 Ca2+ sensors to interact with CIPK24/SOS2 and participate in ion transport with SOS1. AtRD22 and AtCOR15A can participate in abscisic acid (ABA)-dependent pathways, and are upregulated by a variety of abiotic stressors. AtCOR15A has DRE and other abiotic stress-associated motifs in the promoter and participates in the Arabidopsis CBF-related cold resistance pathway. AtRD22 is believed to be primarily regulated by activation of AtMYB2/AtMYC2 expression. In the present study, we found that CaM expression was significantly increased in response to salt treatment of EF1A overexpression in M. truncatula. However, there were no significant differences in expression of MtCDPK26, suggesting that MtEF1A1 may interact with MtCaM but that it does not directly participate in regulation of CDPK pathway."}, {"passage_id": "Discuss.p0006", "text": "Previous studies showed that EF1A genes may be involved in transcription or post-transcriptional regulation in response to salt stress. As a multifunctional protein, EF1A is also highly sensitive to changes in Ca2+ and pH, and may be an important downstream target of Ca2+ and lipid-related signal transduction pathways, causing changes in cytoskeleton structure and protein synthesis. EF1A may not only participate in the common salt response pathway, but may also function at the protein level. EF1A has been shown to interact directly with tubulin, calmodulin, and filamentous actin (F-actin) in vitro. EF1A has two forms, a monomer and a dimer. Under normal circumstances, the EF1A dimer bundles into F-actin to form a binding protein. In the presence of salt or high levels of Ca2+, the EF1A/Ca2+/CaM complex binds to F-actin, and EF1A in the dimer form reverts to the monomeric state. The eEF1A/Ca2+/CaM complex is speculated to regulate the downstream salt response pathway either directly or indirectly (Fig. 9). Protein hydrolysis can rapidly reduce the functional activity of EF1A. Treatment with phospholipase C and D leads to the reduction of amount of [14 C] ethanolamine-labeled eEF1A in the carrot microsomal fraction, and EF1A content can be quantified by PGE modification. Studying the dynamic changes of MtEF1A1 levels in response to stress treatment is expected to provide novel insights into the salt-response pathway of EF1A."}], "Conclusion": [{"passage_id": "Concl.p0002", "text": "Elongation factors are indispensable in protein synthesis. Overexpression of the elongation factor MtEF1A1 in Arabidopsis enhanced salt resistance, increasing the seed germination rate and decreasing levels of H2O2, MDA, and proline in the leaves of MtEF1A1-OE plants compared to the WT. In M. truncatula overexpressing MtEF1A1, leaf chlorophyll level was higher than in WT leaves after treatment with H2O2. Root damage was more severe in WT seedlings and DAB staining was darker, indicating higher ROS levels. The MtEF1A1 of M. truncatula plants were resistant to salt stress and showed higher expression of the Ca2+-signaling-related genes MtCaM and MtCBL4, and the salt-induced genes MtRD22A and MtCOR15A. This study shows that overexpression of MtEF1A1 increased salt stress tolerance in Arabidopsis and M. truncatula, indicating that MtEF1A1 plays a positive regulatory role in the salt stress response."}]}}, {"pmcid": "PMC10010177", "title": "Drought stress resistance indicators of chickpea varieties grown under deficit irrigation conditions", "source_file": "PMC10010177.json", "source_url": "https://pmc.ncbi.nlm.nih.gov/articles/PMC10010177/", "included_counts": {"Abstract": 1, "Introduction": 4, "Discussion": 5, "Conclusion": 1}, "omitted_results_discussion": false, "sections": {"Abstract": [{"passage_id": "Abstract.p0001", "text": "The aim of this study was to determine the drought stress resistance of three chickpea cultivars (Inci, Hasanbey and Seçkin) grown under water deficit conditions and to discuss the use of yield, crop water stress index and chlorophyll index values as drought stress tolerance indicators in breeding studies. Three drought stress levels, (full irrigation = no stress - I100, deficit irrigation = moderate stress - I50, and no irrigation = severe stress - I0) were used as irrigation treatments. The highest seed yield (1,984 kg ha−1) in severe stress conditions was recorded for the Inci cultivar with a low crop water stress index (CWSI) (0.50) and high chlorophyll index (33.60 SPAD). The lowest seed yield (1,783.66 kg ha−1) in I0treatment was noted for the Seçkin cultivar which had a high CWSI (0.58) and low chlorophyll index (32.88 SPAD). The highest seed yield (2,566.33 kg ha−1) in full irrigation was recorded for the Inci cultivar which had a low CWSI (0.19) and high chlorophyll index (44.39 SPAD), while the lowest seed yield (2,328.00 kg ha−1) in I100 treatment was recorded for the Seçkin cultivar which had a high CWSI (0.26) and low chlorophyll index (42.12 SPAD). The seed yield of the Hasanbey cultivar in both severe stress (1,893 kg ha−1) and full irrigation (2,424.00 kg ha−1) conditions was between Inci and Seçkin varieties. The chlorophyll index and yield had a significant positive (r = 0.877) correlation, while a significant negative (r = −0.90) relationship was determined between CWSI and yield. Seed yield of the Inci cultivar in I0and I100treatments and water use efficiency revealed that the Inci cultivar is resistant to drought stress. Therefore, the Inci cultivar can be used in drought stress tolerance studies. In addition, the CWSI and chlorophyll index values can be employed as resistance indicators in chickpea breeding studies to determine the drought resistant chickpea cultivars."}], "Introduction": [{"passage_id": "Introduction.p0002", "text": "Water use in agriculture is in a constant competition with industrial uses. Increasing demand for water use decreases groundwater resources, pollutes water ecosystems and deteriorates the quality. Therefore, improvement of new water resources becomes highly expensive. Limited water and soil resources under current conditions necessitates higher water use efficiency. Drought stress is a meteorological phenomenon, caused by extended period without precipitation. The severity of drought stress depends on water retention capacity of soils and evapotranspiration rate of plants. The decrease in quantity and quality of water resources caused severe drought stress. Therefore, cultivation of drought resistant crop species or cultivars is needed to alleviate water shortage or severe drought events. Studies on identifying the tolerance mechanisms of plant species to stress conditions, and protection and transfer of plant gene resources are highly important. Considering the global climate change and associated negative effects on agriculture, determination and development of new chickpea genotypes that can be grown under drought stress conditions is important to sustain production. Determining new chickpea genotypes resistant to drought stresses or development of new varieties using the identified resistant/tolerant materials will provide valuable foundation for future breeding studies."}, {"passage_id": "Introduction.p0003", "text": "Drought stress suppresses plant growth due to limited moisture availability. The first symptoms of drought stress appear at stomata level, where stomatal closure prevents water losses by transpiration. Stomatal closure also reduces CO2 availability at chloroplast level; thus, adversely impacts net photosynthesis. Internal water status of plants can be determined accurately using crop water stress index (CWSI) compared to water content of soils and atmospheric demand. The changes in leaf temperature depend on the transpiration of plants’ air temperature (Ta). The increase in the transpiration rate significantly decreases leaf temperature, which could be lower than the Ta. The difference in leaf temperature and Ta and psychrometric measurements are used to determine CWSI. The CWSI values change with atmospheric temperature and soil water content. Low canopy temperature (−5 to −1 °C) would be sufficient for plant growth. However, the Ta equal to or higher than the canopy temperature (Tc) induces water stress. Leaf air temperature (Tc-Ta) difference is an important indicator of plant drought stress., and reported that air and dew temperatures are effective on canopy temperature under high soil water content."}, {"passage_id": "Introduction.p0004", "text": "Studies on drought tolerance are extremely important for plant breeders. Thus, leaf temperature and duration of the green period for the shoots are the most important characteristics to measure drought tolerance under low soil water availability. Canopy temperature is the most reliable method to measure drought stress and can be employed as criteria in plant breeding studies. Generally, decrease in soil moisture before irrigation increases plant leaf temperature which increases CWSI values. Previous studies reported that lines or varieties with low CWSI and high chlorophyll index are high-yielding, while those with low CWSI and high chlorophyll index are low-yielding. found a significant correlation between leaf temperature (canopy temperature) values and yield of bread and durum wheat varieties grown in Cukurova region, Turkey, and concluded that these parameter could be used as a selection criterion in wheat breeding. The parameters used to determine the drought or water stress should be reproducible and obtained easily, fast and incur less cost. Chlorophyll index is one of the most important characteristics in determining drought tolerance. reported that leaf water and chlorophyll content can be used for the instant drought stress determination. The findings of who investigated drought tolerance in sweet corn lines revealed that soil moisture and chlorophyll index had a significant positive correlation."}, {"passage_id": "Introduction.p0005", "text": "Drought-resistant varieties have been determined in wheat, rice, cotton, and sunflower, whereas the response of chickpea plants to drought stress has been rarely studied. In addition, the lack of effective selection criteria in agronomic studies to differentiate the potential status of chickpea varieties under drought stress is one of the most important limiting factors in agronomic or breeding studies. The aim of this research was to measure the leaf crown temperature values of chickpea genotypes at different irrigation levels (in open field conditions, not greenhouse) and to determine the CWSI values by using these measured leaf crown temperature values and to determine their drought stress tolerance according to the determined CWSI values and to examine the use of CWSI values as a stress tolerance indicator in drought studies. The CWSI value can vary between 0 and 1. The CWSI values approaching 0 are considered drought-resistant, while those approaching 1 will be considered drought-sensitive."}], "Discussion": [{"passage_id": "Discuss.p0002", "text": "The results revealed an important interaction between drought stress and tested chickpea varieties. The results are in accordance with the findings of who reported a significant interaction between watering regimes and type of cultivars. Crops are highly susceptible to water deficiency during flowering phases and substantial yield losses have been reported due to the water stress experienced during flowering period. Water stress, even for a short period may cause substantial losses in crop yields. Drought stress during heading and pollination can adversely affect grain formation in chickpea. Similarly, reported that the relative water content of leaves, number of seeds per head, plant height and leaf area index of chickpea significantly decreased under water deficiency. Lack of sufficient moisture from budding to the end of the flowering period adversely affected the productivity of chickpea varieties. The results obtained in this study are in accordance with and. emphasized that the most important selection index in determining drought tolerance of chickpea varieties is similar performance of varieties under drought stressed and stress-free. Therefore, the Inci variety exhibited similar performance under I 100 andI0 treatments. Thus, the Inci variety could be considered as a drought resistant variety and used in the future breeding studies."}, {"passage_id": "Discuss.p0003", "text": "The variety had a significant impact on CI in the current study. The highest (38.12) and the lowest (33.11) CI was noted for the Inci and Seçkin varieties, respectively. The decrease in CI of drought-resistant varieties was lower under water deficit conditions compared to sensitive varieties. The resistance level of plants to stress may significantly differ, and even different varieties of the same crop may have varying resistance level. Chlorophyll and carotenoid content of plants have a significant relationship with intensity of light, nitrogen content, particle size distribution of soil, and crop varieties."}, {"passage_id": "Discuss.p0004", "text": "The chlorophyll and proline contents of plants are commonly used criteria in determining the resistant level to abiotic stresses. The decrease in leaf chlorophyll contents under drought stress was reported by several researchers. The results obtained for chlorophyll index values of chickpea varieties are in agreement with the earlier reports. The CWSI was low at beginning of vegetative period and the highest values were recorded during flowering period in no-stress treatment. The CWSI values showed a tendency to decrease after irrigation events. The differences in CWSI values can be attributed to the differences in irrigation methods and irrigation programs. In addition, as narrow or broad, hairy or hairless leaves of the plants, climate and soil characteristics, and cultivation techniques are other important factors affecting CWSI values. Furthermore, the differences in CWSI can be owed to photosynthesis metabolism. The optimum water level in the cell is needed for optimum photosynthesis and functioning of photosystem reactions involving chlorophyll. Since there was no enough water in the soil profile (0–90 cm) of the excessive stress treatment, the amount of water transferred to the leaves through the transmission tissues was also low. Low water content in leaves causes an increase in leaf temperature. Consequently, the decrease in CWSI in I100 may be associated with the excess water content of plant leaves. Similarly, reported that the decrease in soil moisture content before irrigation increases leaf temperature. The findings are in accordance with the results reported by other researchers."}, {"passage_id": "Discuss.p0005", "text": "The findings of and who conducted studies in Siirt and Sakarya provinces on drought resistance of sweet corn lines are in agreement with our data. The lines with low CWSI and high CI values had higher sweet corn yield; thus, CWSI and CI were recommended for drought resistance selection criteria. Higher CWSI values and decreased CI values in drought stress treatments have been reported by who indicated that PSII photosynthetic electron transfer system is restrained under drought stress. Likewise, reported decreased CI values in drought stress and reduction in maize yield. Chickpea yield and CI values had a positive correlation, while yield and CWSI had a negative correlation. Briefly, crop yield increased as CI increased and yield decreased as CWSI increased. However, the increase or decrease in CI and CWSI was not constant and changed depending water stress conditions and varieties. Therefore, the CWSI and CI values can be evaluated as stress screening parameters in the selection of drought resistant varieties. In previous studies, a linear relationship was reported between CI and yield and concluded that high yields can be obtained from varieties with high CI."}, {"passage_id": "Discuss.p0006", "text": "The WUE values showed a decreasing trend as the amount of irrigation water applied increased. The results reported by were in accordance with our findings. indicated that the WUE increased with decreased amount of irrigation water and WUE and yield of drought-resistant varieties were significantly higher compared to drought sensitive varieties. Similar results have been reported by who found that yields of C3 plants significantly decreased under water stress. The results obtained in this study are in accordance with those reported in earlier studies."}], "Conclusion": [{"passage_id": "Concl.p0002", "text": "The results revealed that drought stress-resistant varieties have low crop water stress index (CWSI) and high chlorophyll index (CI) values. Briefly, the yield and chlorophyll index (CI) of the Inci variety under stress-free and stress treatments were higher than those recorded for Hasanbey and Seçkin varieties. Therefore, the Inci variety can be considered resistant to drought conditions and can be used in resistance studies as the plant material. Consequently, the CWSI and CI values can be used as stress screening parameters (resistance indicator) in the selection of drought stress-resistant cultivars. Abiotic factors such as water stress resulting from global climate changes cause a significant decrease in the yields of cash crops. Therefore, the improvement or breeding of drought-stress resistant varieties is a permanent measure in the long run to prevent yield decreases under water stress. Selecting varieties or lines that are resistant to drought stress is a reliable means of success in breeding studies."}]}}, {"pmcid": "PMC10010605", "title": "Preparing for an uncertain future: molecular responses of plants facing climate change", "source_file": "PMC10010605.json", "source_url": "https://pmc.ncbi.nlm.nih.gov/articles/PMC10010605/", "included_counts": {"Introduction": 18, "Conclusion": 2}, "omitted_results_discussion": false, "sections": {"Abstract": [], "Introduction": [{"passage_id": "Introduction.p0001", "text": "Climate change is mostly driven by the increase of atmospheric CO2 concentration. It leads to an increase in ambient temperature and temperature extremes, as well as to a reduction in water availability (Box 1). Despite the apparent benefit that an increase of CO2 and ambient temperature might have on the production of plant biomass, climate change severely challenges the plant life cycle, and thus increasingly leads to food insecurity. Investigating the molecular mechanisms of plant adaptation to climate change is thus a pressing issue. This was the theme of the EMBO Workshop ‘Molecular responses of plants facing climate change’ in June 2022 in Montpellier, France. Here, we summarize some key insights presented during the conference on the investigation of molecular mechanisms of plant adaptation to environmental constraints in a changing climate."}, {"passage_id": "Introduction.p0002", "text": "Box 1. The main factors of climate change influencing plant growth, development, and physiology"}, {"passage_id": "Introduction.p0003", "text": "CO2 concentration, temperature, and water availability are climate change-associated factors that are critical for plant growth and development. Climate change threatens both biodiversity and agriculture, with far-reaching implications for food security. Climate change is expected to reduce yield and to impact the quality of production, imposing major constraints on the higher demand of plant-based resources imposed by the growing population. Thus, considerable research in the field focuses on understanding the physiological processes and underlying molecular mechanisms through which plants can adapt to these changes."}, {"passage_id": "Introduction.p0004", "text": "How to deal with increasing temperatures?"}, {"passage_id": "Introduction.p0005", "text": "Ambient temperatures affect all aspects of growth and development. Morphological responses to mildly elevated temperatures include the regulation of elongation growth in the shoot and the root. In the shoot, several thermosensors including phytochrome B perceive temperature and coordinate with PHYTOCHROME-INTERACTING FACTOR 4 (PIF4). PIF4 then integrates with the auxin and brassinosteroid signalling pathways for a coherent growth response. Carolin Delker (University of Halle) discussed how shoot and root responses involve distinct sensing and signalling mechanisms. In nature, however, not only temperatures vary, but also light quality (shading) and water availability. Jorge Casal (University of Buenos Aires) highlighted the integration of different environmental cues at the level of photoreceptors and downstream signalling pathways to appropriately gauge complex environments."}, {"passage_id": "Introduction.p0006", "text": "The heat stress response allows plants to acclimate to extreme temperatures through the activation of HEAT SHOCK TRANSCRIPTION FACTORs (HSFs), which are transcription factors that induce the expression of chaperones (Heat Shock Proteins, HSPs) and enzymes that produce thermoprotective and reactive oxygen species-scavenging metabolites. The current view is that HEAT SHOCK TRANSCRIPTION FACTOR A1 (HSFA1) isoforms are maintained in an inactive state in the cytoplasm through complexing with chaperones and rapidly move into the nucleus after heat stress to activate transcription, when the HSPs are recruited away from misfolded proteins. Phil Wigge (IGZ Großbeeren) presented data that suggest an alternative mode of regulation of at least one HSFA1 isoform by liquid–liquid phase separation. Intrinsically disordered domains within HSFA1 trigger phase separation at elevated temperatures, similar to what has been described for EARLY FLOWERING 3 (ELF3). Thus, HSFA1 may directly sense temperature. Temperature-dependent alternative splicing may constitute a parallel mechanism. Sotirios Fragkostefanakis (University of Frankfurt) reported on general splicing regulators with a specific role in heat stress-dependent alternative splicing, thus illustrating a feedback loop to fine-tune the heat stress response."}, {"passage_id": "Introduction.p0007", "text": "A moderate heat stress event can prime a plant and lead to a more efficient response upon recurrent stress after a stress-free interval lasting several days. This so-called heat stress memory shows complex regulation, including epigenetic modifications, protein stability and stable metabolites. Isabel Bäurle (University of Potsdam) discussed epigenetic changes involving hyper-methylation of histone H3 lysine 4 (H3K4) and showed how locus-specific epigenetic editing of H3K4me3 impairs the memory. Specialized HSF complexes govern these epigenetic modifications. In contrast, the autophagy cellular degradation machinery negatively impacts heat stress memory by degrading HSPs and other thermoprotective proteins, as Salma Balazadeh (University of Leiden) discussed. In a parallel pathway the metalloprotease FtsH6 degrades HSP21, thus modulating heat stress memory. Improving heat stress memory provides an interesting avenue to increase tolerance to heat stress without affecting growth in stress-free conditions. Improvement of heat stress tolerance may also stem from clever manipulation of the soil microbiome. Heribert Hirt (King Abdullah University of Science and Technology) presented data showing that desert root endophytes induce thermotolerance by boosting heat stress memory."}, {"passage_id": "Introduction.p0008", "text": "How to deal with water stress?"}, {"passage_id": "Introduction.p0009", "text": "Root traits can be targeted to improve water capture in crops and tolerance to water stress based on a good characterization of the stress pattern and soil characteristics of the target area. Several mechanisms that optimize root development in response to changing soil water content (in time and space) are prime candidates. Xerobranching, the local inhibition of root branching when the root tip loses contact with wet soil (as in air gaps or dry soil regions), is an abscisic acid (ABA)-dependent adaptive process described in cereals and Arabidopsis. Malcolm Bennett (University of Nottingham) described how a xerobranching water stress stimulus on a root tip leads to release of ABA from the phloem that induces closure of plasmodesmata in root outer tissues, which prevents the movement of auxin from the epidermis to the pericycle required for lateral root formation. This model explains how hydraulics controls root architecture via co-transport of phytohormones. Hydropatterning is another mechanism that regulates the radial positioning of lateral roots, root hairs, or aerenchyma depending on differences in water availability across the circumferential axis of the root to optimize root architecture to local water content. This adaptive response is ABA-independent but dependent on sumoylation of AUXIN RESPONSE FACTOR 7 (ARF7), a key regulator of auxin response during lateral root formation. José Dinneny (Stanford University) reported that maize varieties are highly diverse for hydropatterning and that hydropatterning was a good predictor of root system depth, a trait associated with better water stress tolerance."}, {"passage_id": "Introduction.p0010", "text": "Integrating root architecture and anatomical and physiological properties of tissues is important to understand water dynamics in the root system. Christophe Maurel (Institute for Plant Sciences of Montpellier) showed by exploiting HydroRoot, a model for root hydraulics, and split root experiments that different maize root types have different hydraulic properties and responses to water stress. He further reported genetic diversity in maize for root hydraulics. How root hydraulics relates to plant response to water stress still needs to be evaluated. Optimizing water acquisition by roots will increase water depletion in the soil and will ultimately have limited impact when available soil water is limited. Another complementary strategy is to improve water use efficiency, i.e. the amount of carbon fixed per unit water consumed. Transpiration is regulated by stomatal opening, a process that appeared in the earliest land plants. Optimizing stomatal movement in response to environmental signals could improve plant water use efficiency and drought tolerance. Regulation of stomatal closure by ABA and CO2 is mediated by a complex signalling pathway involving several kinases (MPKs, OST1, HT1) and the GHR1 receptor-like pseudokinase, which was described by Hannes Kollist (University of Tartu). Stomata integrate environmental signals to optimize gas exchange and water loss. These signalling pathways ultimately lead to the coordinated regulation of different ion transporters localized at the plasma or vacuolar membrane of guard cells as well as aquaporins of the PLASMA MEMBRANE INTRINSIC PROTEIN (PIP) subfamily. The ability of the plant to restrict its transpiration when the evaporative demand is very high, and therefore when the water cost of carbon fixation is elevated, is a key trait for water use efficiency. Pablo Affortit (IRD) presented data showing a link between transpiration efficiency and transpiration restriction under high vapour pressure deficit on the one hand and plant hydraulics and root traits (in particular the root/shoot ratio) on the other in African rice, thus linking transpiration regulation to root water uptake. Interestingly, during drought stress, the photosynthetic apparatus is protected by a feedback control by photorespiration and Anja Krieger-Liszkay (Institute for Integrative Biology of the Cell) presented evidence that signals deriving from the plastoquinone pool could regulate root growth. Altogether, this suggests mechanisms that integrate water stress perception in the photosynthetic tissues with root development and water uptake. Further work is needed to decipher the regulation of transpiration by plant hydraulics and photosynthesis."}, {"passage_id": "Introduction.p0011", "text": "The increase of CO2 in the atmosphere: benefits, costs, and opportunities"}, {"passage_id": "Introduction.p0012", "text": "Elevated CO2 concentration (eCO2) promotes the production of biomass, as the current CO2 concentration is a limiting factor for photosynthesis of C3 plants. As mentioned by Christine Foyer (University of Birmingham), this is a favourable circumstance in a world with a growing population. However, this CO2 fertilization effect is less than expected due to the acclimation of photosynthesis to eCO2. Boosting photosynthesis of C3 plants and understanding the mechanisms behind eCO2 acclimation in a CO2-enriched world are therefore main objectives for plant scientists. Different routes to improve photosynthesis were discussed during this workshop. One example was presented by Alejandro Perdomo (Lancaster University), who showed that the transcriptional regulation of Rubisco activase can be a way to improve Rubisco efficiency, and thus to increase carbon fixation and yield. Florian Busch (University of Birmingham) discussed the different limitations of CO2 assimilation, and highlighted that the most relevant targets for improving photosynthesis vary depending on the environment. Together with Arnold Bloom (UC Davis), Busch stressed the importance of photorespiration, and challenged the view that this metabolic pathway would be a cost for plants compared with the improvement of photosynthesis."}, {"passage_id": "Introduction.p0013", "text": "However, the increase in carbon uptake and biomass production will not occur independently of other major metabolic pathways. This seems especially true considering that photosynthesis might not be the main limiting parameter for growth and yield, in opposition to nutrient and especially nitrogen limitation. This is reminiscent of an unexpected negative effect of eCO2 on plants. Indeed, growth under eCO2 leads to a decline in the mineral composition of C3 plants, which might create a serious threat for food and nutritional security at the end of this century. Different approaches to identify the genetic and molecular mechanisms behind the negative effect of eCO2 on plant nutrient content have been presented. Antoine Martin (Institute for Plant Sciences of Montpellier) showed that the use of natural genetic variation or the inference of gene networks under simulated future climate notably led to the identification of genes involved in the response of plants to eCO2. Arnold Bloom presented data showing yield and protein content of several wheat lines over 35 years of cultivation in California. During this period CO2 increased in the atmosphere, while yield decreased but not protein content, suggesting that plants sacrificed yield to maintain organic N. This also suggests that fast adaptive mechanisms to the changing atmosphere might occur, but remain to be identified."}, {"passage_id": "Introduction.p0014", "text": "Plants are also an extraordinary sink of carbon. The increase of CO2 in the atmosphere may lead to an augmentation in plant biomass, making plants a natural trap for atmospheric CO2 (Box 2). This was the subject of the keynote given by Joanne Chory (The Salk Institute), who presented data showing how root systems can be improved to capture and store carbon stably in the ground, contributing to the mitigation of climate change."}, {"passage_id": "Introduction.p0015", "text": "Box 2. Some future challenges for plant science in the context of climate change"}, {"passage_id": "Introduction.p0016", "text": "Despite the progress already made, many challenges lie ahead: in many cases it is still an open question whether the mechanisms identified in one developmental stage are transferable to other developmental stages within one species. Moreover, whether the mechanisms outlined above and unraveled mostly in model plants are conserved in crop species remains an important question to investigate. Devising better adapted crops will require a good understanding of the stress pattern faced by crops in the target environments, a process that will benefit from the recent advances in crop modelling."}, {"passage_id": "Introduction.p0017", "text": "The emission of greenhouse gases (notably nitrous oxide coming indirectly from N fertilizers and methane from livestock), the use of fossil fuels (including for the
